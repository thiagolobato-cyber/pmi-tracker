  document.body.appendChild(modal);
}

function renderExecutiva(){
  // Collect all areas — Tech uses only actual project tasks (no template)
  const allAreas = Array.from(new Set([
    ...(isPMI ? state.template.map(t=>t.area) : []),
    ...Object.values(state.deals).flatMap(d=>d.tasks.map(t=>t.area))
  ].filter(Boolean)));
  if(!allAreas.length && isPMI) allAreas.push(...DEFAULT_AREAS.map(a=>a.name));
  if(view.executiveArea !== 'todas' && !allAreas.includes(view.executiveArea)) view.executiveArea = 'todas';
  if(!view.executivaDealSearch) view.executivaDealSearch = '';

  // P3 — Filter deals by company name search
  const dealQ = (view.executivaDealSearch||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  let data = aggregate();
  if(dealQ) data = data.filter(d => d.company.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(dealQ));

  // P2 — Areas to render
  const areasToShow = view.executiveArea === 'todas' ? allAreas : [view.executiveArea];

  function getTasksForArea(area){
    return Array.from(new Set([
      ...(isPMI ? state.template.filter(t=>t.area===area).map(t=>t.task) : []),
      ...Object.values(state.deals).flatMap(d=>d.tasks.filter(t=>t.area===area).map(t=>t.task))
    ]));
  }

  function cellFor(deal, taskName){
    const t = deal.tasks.find(x=>x.task===taskName);
    if(!t) return null;
    return t._f.status;
  }

  // Build table body rows per area
  let taskCounter = 0;
  const tbodyRows = areasToShow.map(area=>{
    const taskList = getTasksForArea(area);
    if(!taskList.length) return '';
    const areaHeader = view.executiveArea === 'todas'
      ? `<tr class="exec-area-header"><td colspan="${data.length + 2}">${area}</td></tr>` : '';
    const rows = taskList.map(tn=>{
      taskCounter++;
      const n = taskCounter;
      return `<tr>
        <td class="text-center text-gray-500 sticky-col" style="width:2.25rem;min-width:2.25rem">${n}</td>
        <td class="sticky-col-2" style="min-width:16rem;max-width:20rem;word-break:break-word;padding-right:.75rem">${escapeHtml(tn)}</td>
        ${data.map(d=>{
          const st = cellFor(d, tn);
          if(!st) return `<td class="hm-empty text-center">—</td>`;
          return `<td class="hm-${st==='ontrack'?'ontrack':st} text-center">${statusLabel(st)}</td>`;
        }).join('')}
      </tr>`;
    }).join('');
    return areaHeader + rows;
  }).join('');

  const node = el(`
    <div class="space-y-4">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 class="text-xl font-bold">Visão Executiva — Tarefa × ${isTech ? 'Projeto' : 'Deal'}</h1>
          <p class="text-sm text-gray-500">Status por área · ${data.length} ${isTech ? 'projeto' : 'deal'}${data.length!==1?'s':''} · ${taskCounter} tarefas</p>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
          <label class="text-xs text-gray-600">Área:</label>
          <select id="areaSel" style="min-width:14rem">
            <option value="todas" ${view.executiveArea==='todas'?'selected':''}>— Todas as áreas —</option>
            ${allAreas.map(a=>`<option value="${escapeHtml(a)}" ${a===view.executiveArea?'selected':''}>${escapeHtml(a)}</option>`).join('')}
          </select>
          <div class="relative">
            <svg style="position:absolute;left:.55rem;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--bhub-muted);pointer-events:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="dealSearchExec" type="text" placeholder="${isTech ? 'Filtrar projetos…' : 'Filtrar deals…'}" value="${escapeHtml(view.executivaDealSearch||'')}" style="padding:.45rem .7rem .45rem 1.9rem;width:160px;font-size:.82rem"/>
          </div>
          <button id="execPdfSelect" class="btn btn-secondary" style="gap:.35rem;display:flex;align-items:center;font-size:.8rem" title="Escolher deals para o PDF">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 12l2 2 4-4"/></svg>
            ${isTech ? 'Projetos' : 'Deals'}${view.execPdfDeals?` (${view.execPdfDeals.length})`:''}
          </button>
          <button id="execPdf" class="btn btn-primary" style="gap:.4rem;display:flex;align-items:center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
            PDF
          </button>
        </div>
      </div>

      <div id="execTable" class="bhub-card" style="max-height:75vh;overflow:auto">
        <table class="text-xs" style="border-collapse:separate;border-spacing:0">
          <thead style="position:sticky;top:0;z-index:10">
            <tr>
              <th class="sticky-col" style="width:2.25rem;min-width:2.25rem">#</th>
              <th class="sticky-col-2" style="min-width:16rem">TAREFA</th>
              ${data.map(d=>`<th class="whitespace-nowrap"><span class="deal-link" data-summary="${d.company.id}" title="Ver resumo">${escapeHtml(d.company.name)}</span></th>`).join('')}
            </tr>
          </thead>
          <tbody>${tbodyRows || `<tr><td colspan="${data.length+2}" class="py-8 text-center text-gray-400 text-sm">Nenhuma tarefa encontrada para os filtros selecionados.</td></tr>`}</tbody>
        </table>
      </div>
    </div>
  `);

  // Area select
  node.querySelector('#areaSel').addEventListener('change', e=>{ view.executiveArea = e.target.value; render(); });

  // Deal search filter (debounced)
  const dsi = node.querySelector('#dealSearchExec');
  let debT;
  dsi.addEventListener('input', ()=>{ clearTimeout(debT); debT = setTimeout(()=>{ view.executivaDealSearch = dsi.value; render(); }, 220); });

  // Deal selector button
  node.querySelector('#execPdfSelect').addEventListener('click', ()=>{
    openExecPdfDealModal(data, ()=>render());
  });

  // P4 — PDF export: capture actual rendered table (remove overflow temporarily)
  node.querySelector('#execPdf').addEventListener('click', ()=>{
    const btn = node.querySelector('#execPdf');
    btn.disabled = true; btn.textContent = 'Gerando…';

    const pdfDeals = view.execPdfDeals
      ? data.filter(d => view.execPdfDeals.includes(d.company.id))
      : data;

    if(!pdfDeals.length){
      alert('Nenhum deal selecionado. Clique em "Deals" para selecionar.');
      btn.disabled = false; btn.textContent = 'PDF';
      return;
    }

    if(pdfDeals.length > 15){
      alert(`O PDF suporta até 15 deals por vez (${pdfDeals.length} selecionados).\n\nClique em "Deals" para escolher quais incluir.`);
      btn.disabled = false; btn.textContent = 'PDF';
      return;
    }

    const execTableEl = node.querySelector('#execTable');
    const areaLabel = view.executiveArea === 'todas' ? 'Todas as Áreas' : view.executiveArea;

    // Hide columns belonging to excluded deals via nth-child CSS
    // Col 1 = #, Col 2 = TAREFA, Col 3..N = deals in data order
    let styleEl = null;
    if(pdfDeals.length < data.length){
      const hiddenIdx = data.map((d,i)=> pdfDeals.includes(d) ? null : i+3).filter(n=>n!==null);
      styleEl = document.createElement('style');
      styleEl.id = '__pdfColHide';
      styleEl.textContent = hiddenIdx.map(i=>
        `#execTable th:nth-child(${i}),#execTable td:nth-child(${i}){display:none!important}`
      ).join('');
      document.head.appendChild(styleEl);
    }

    // Temporarily remove scroll constraints so html2canvas captures full table
    const origMaxH  = execTableEl.style.maxHeight;
    const origOverf = execTableEl.style.overflow;
    execTableEl.style.maxHeight = 'none';
    execTableEl.style.overflow  = 'visible';

    const pdfIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>';
    html2pdf().set({
      margin: [8,6],
      filename: `visao-executiva-${areaLabel.replace(/\s+/g,'-').toLowerCase()}.pdf`,
      image: { type:'jpeg', quality:.97 },
      html2canvas: { scale:1.8, useCORS:true, scrollX:0, scrollY:-window.scrollY, logging:false },
      jsPDF: { unit:'mm', format:'a3', orientation:'landscape' }
    }).from(execTableEl).save().then(()=>{
      execTableEl.style.maxHeight = origMaxH;
      execTableEl.style.overflow  = origOverf;
      styleEl && styleEl.remove();
      btn.disabled = false;
      btn.innerHTML = pdfIcon + ' PDF';
    });
  });

  // Fix sticky-col-2 left offset: measure actual rendered width of the # column
  setTimeout(() => {
    const numCell = node.querySelector('#execTable .sticky-col');
    if(numCell){
      const w = numCell.getBoundingClientRect().width;
      node.querySelectorAll('#execTable .sticky-col-2').forEach(c => { c.style.left = w + 'px'; });
    }
  }, 0);

  return node;
}

/* ---------- Empresas ---------- */
function renderEmpresas(){
  let raw = aggregate();

  // ---- Status filter (from KPI card navigation) ----
  const statusFilter = view.empresasStatusFilter || null;
  const STATUS_META = {
    done:    { label: 'Tasks Concluídas',   color: '#16a34a', bg: '#dcfce7', field: 'done' },
    ontrack: { label: 'On Track',           color: '#2563eb', bg: '#dbeafe', field: 'ontrack' },
    late:    { label: 'Tarefas Atrasadas',  color: '#dc2626', bg: '#fee2e2', field: 'late' },
    blocked: { label: 'Bloqueios',          color: '#d97706', bg: '#fef3c7', field: 'blocked' },
  };
  if(statusFilter && STATUS_META[statusFilter]){
    raw = raw.filter(d => (d[STATUS_META[statusFilter].field]||0) > 0);
  }

  // ---- Search ----
  const searchQ = (view.empresasSearch||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(searchQ){
    raw = raw.filter(d => d.company.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(searchQ));
  }

  // ---- Sort ----
  const sortCol = view.empresasSortCol || 'date';
  const sortDir = view.empresasSortDir || 'desc';
  const sorters = {
    name:  (a,b) => a.company.name.localeCompare(b.company.name),
    date:  (a,b) => (a.company.signDate||'').localeCompare(b.company.signDate||''),
    total: (a,b) => a.total - b.total,
    pct:   (a,b) => a.pct - b.pct,
    done:  (a,b) => a.done - b.done,
    late:  (a,b) => a.late - b.late,
    blocked:(a,b)=> a.blocked - b.blocked,
  };
  const data = [...raw].sort((a,b) => (sorters[sortCol]||sorters.name)(a,b) * (sortDir==='desc'?-1:1));

  function thSort(col, label){
    const active = sortCol===col;
    const arrow = active ? (sortDir==='asc'?'↑':'↓') : '<span style="opacity:.3">↕</span>';
    return `<th style="cursor:pointer;user-select:none;white-space:nowrap" data-sort="${col}">${label} ${arrow}</th>`;
  }

  function pctBar(pct){
    const cls = pct>=75?'good':pct>=40?'mid':'low';
    return `<div class="pct-bar-wrap">
      <div class="pct-bar"><div class="pct-bar-fill ${cls}" style="width:${pct}%"></div></div>
      <span style="font-size:.75rem;font-weight:600;min-width:2.5rem">${pct}%</span>
    </div>`;
  }

  const statusBanner = (() => {
    if(!statusFilter || !STATUS_META[statusFilter]) return '';
    const m = STATUS_META[statusFilter];
    return `<div id="statusFilterBanner" style="display:flex;align-items:center;gap:.6rem;padding:.5rem .85rem;border-radius:.5rem;background:${m.bg};border:1px solid ${m.color}33;margin-bottom:.25rem">
      <span style="font-size:.8rem;font-weight:600;color:${m.color}">Filtro ativo: ${m.label}</span>
      <span style="font-size:.75rem;color:#6b7280">${raw.length} ${isTech ? 'projeto' : 'deal'}${raw.length!==1?'s':''} encontrado${raw.length!==1?'s':''}</span>
      <button id="clearStatusFilter" style="margin-left:auto;font-size:.72rem;color:${m.color};background:none;border:1px solid ${m.color}66;border-radius:.35rem;padding:.15rem .5rem;cursor:pointer">✕ Limpar filtro</button>
    </div>`;
  })();

  const node = el(`
    <div class="space-y-4">
      ${statusBanner}
      <div class="flex items-center justify-between flex-wrap gap-2">
        <div>
          <h1 class="text-xl font-bold">${isTech ? 'Projetos' : 'Deals'}</h1>
          <p class="text-sm text-gray-500">Clique na linha para abrir o detalhe do ${isTech ? 'projeto' : 'deal'}</p>
        </div>
        <div class="flex items-center gap-2">
          <div class="relative">
            <svg style="position:absolute;left:.6rem;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--bhub-muted);pointer-events:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="empSearch" type="text" placeholder="${isTech ? 'Buscar projeto…' : 'Buscar empresa…'}" value="${escapeHtml(view.empresasSearch||'')}" style="padding:.45rem .7rem .45rem 2rem;width:200px;font-size:.85rem" />
          </div>
          ${canEdit() ? `<button id="addCo" class="btn btn-primary">+ ${isTech ? 'Novo projeto' : 'Nova empresa'}</button>` : ''}
        </div>
      </div>

      <div class="bhub-card overflow-hidden">
        <table class="w-full">
          <thead><tr>
            <th style="width:2rem">#</th>
            ${thSort('name', isTech ? 'PROJETO' : 'EMPRESA')}
            ${thSort('date', isTech ? 'INÍCIO' : 'ASSINATURA')}
            ${thSort('total','TASKS')}
            ${thSort('pct','%')}
            ${thSort('done','DONE')}
            ${thSort('late','ATRASADAS')}
            ${thSort('blocked','BLOQUEIOS')}
            <th style="width:2.5rem"></th>
          </tr></thead>
          <tbody>
            ${data.map((d,i)=>`<tr class="row-clickable" data-row-open="${d.company.id}" title="Clique para abrir o detalhe">
              <td class="text-center text-gray-400" style="font-size:.75rem">${i+1}</td>
              <td class="font-medium" style="max-width:220px">
                <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(d.company.name)}</div>
              </td>
              <td style="white-space:nowrap">${d.company.signDate?fmtDate(d.company.signDate):'—'}</td>
              <td class="text-center">${d.total}</td>
              <td>${pctBar(d.pct)}</td>
              <td class="text-center" style="color:var(--bhub-green);font-weight:600">${d.done}</td>
              <td class="text-center" style="color:var(--bhub-red);font-weight:600">${d.late||'—'}</td>
              <td class="text-center" style="color:#92400e;font-weight:600">${d.blocked||'—'}</td>
              <td class="text-center">
                <button class="btn btn-secondary" data-open="${d.company.id}" style="padding:.3rem .6rem;font-size:.75rem" title="${isTech ? 'Abrir projeto' : 'Abrir deal'}">→</button>
              </td>
            </tr>`).join('') || `<tr><td colspan="9" class="py-10">
              <div class="flex flex-col items-center gap-3 text-gray-500 text-center">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:#d1d5db">
                  <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M3 9h18"/>
                </svg>
                <div class="font-medium" style="color:var(--bhub-navy)">${searchQ ? (isTech?'Nenhum projeto encontrado para "':'Nenhuma empresa encontrada para "')+escapeHtml(searchQ)+'"' : (isTech?'Nenhum projeto cadastrado ainda':'Nenhuma empresa cadastrada ainda')}</div>
                ${!searchQ ? `<div class="text-sm">${isTech ? 'Cadastre projetos manualmente para começar.' : 'Importe a planilha do Modelo Ouro ou cadastre manualmente para começar.'}</div>` : ''}
                ${canEdit() && !searchQ ? `<button id="emptyAddCo" class="btn btn-primary mt-2">+ ${isTech ? 'Novo projeto' : 'Nova empresa'}</button>` : ''}
              </div>
            </td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `);

  const addCo = node.querySelector('#addCo');
  if(addCo) addCo.addEventListener('click', ()=>openCompanyModal());
  const emptyAddCo = node.querySelector('#emptyAddCo');
  if(emptyAddCo) emptyAddCo.addEventListener('click', ()=>openCompanyModal());

  // Clear status filter banner
  const clearSF = node.querySelector('#clearStatusFilter');
  if(clearSF) clearSF.addEventListener('click', ()=>{ view.empresasStatusFilter = null; view.empresasSortCol = 'date'; view.empresasSortDir = 'desc'; render(); });

  // Search input (debounced re-render)
  const empSearch = node.querySelector('#empSearch');
  if(empSearch){
    let debTimer;
    empSearch.addEventListener('input', ()=>{
      clearTimeout(debTimer);
      debTimer = setTimeout(()=>{ view.empresasSearch = empSearch.value; render(); }, 200);
    });
  }

  // Sort headers
  node.querySelectorAll('th[data-sort]').forEach(th=>{
    th.addEventListener('click',()=>{
      const col = th.dataset.sort;
      if(view.empresasSortCol===col){
        view.empresasSortDir = view.empresasSortDir==='asc'?'desc':'asc';
      } else {
        view.empresasSortCol = col;
        view.empresasSortDir = ['pct','done','late','blocked','total'].includes(col)?'desc':'asc';
      }
      render();
    });
  });

  // "→" botão abre detalhe sem disparar row click
  node.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',(e)=>{
    e.stopPropagation();
    view.tab='deal'; view.dealId=b.dataset.open; render();
  }));

  // Linha inteira clicável
  node.querySelectorAll('[data-row-open]').forEach(tr=>tr.addEventListener('click',(e)=>{
    if(e.target.closest('[data-open]') || e.target.closest('button')) return;
    view.tab='deal'; view.dealId=tr.dataset.rowOpen; render();
  }));

  return node;
}

function openCompanyModal(existing){
  const m = el(`
  <div class="fixed inset-0 bg-black/40 z-20 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl w-full max-w-md p-6 shadow-xl">
      <div class="text-lg font-semibold mb-4">${existing ? (isTech ? 'Editar projeto' : 'Editar empresa') : (isTech ? 'Novo projeto' : 'Nova empresa')}</div>
      <form id="coForm" class="space-y-3">
        <div><label class="text-xs font-medium">Nome *</label><input name="name" required value="${existing?.name||''}"/></div>
        <div><label class="text-xs font-medium">${isTech ? 'Data de início' : 'Data de assinatura'}</label><input name="signDate" type="date" value="${existing?.signDate||''}"/></div>
        ${!existing && isPMI ? `<label class="text-xs flex items-center gap-2 mt-2"><input type="checkbox" name="useTpl" checked> Criar tarefas a partir do Template</label>`:''}
        <div class="flex justify-end gap-2 pt-4">
          ${existing?`<button type="button" id="delCo" class="btn btn-danger mr-auto">Excluir</button>`:''}
          <button type="button" class="btn btn-secondary" id="cancel">Cancelar</button>
          <button class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>`);
  document.body.appendChild(m);
  m.querySelector('#cancel').onclick = ()=>m.remove();
  m.querySelector('#coForm').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const name = fd.get('name').trim();
    const signDate = fd.get('signDate');
    try{
      if(existing){
        const { error } = await supa.from('companies').update({ name, sign_date: emptyDate(signDate) }).eq('id', existing.id);
        if(error) throw error;
        existing.name = name; existing.signDate = signDate;
      }else{
        const { data, error } = await supa.from('companies').insert({ name, sign_date: emptyDate(signDate), workspace: WS }).select().single();
        if(error) throw error;
        const c = companyFromDb(data);
        state.companies.push(c);
        state.deals[c.id] = { tasks:[], raid:[], synergies:[], health:[] };
        if(fd.get('useTpl')) await instantiateFromTemplate(c.id);
      }
      m.remove(); render();
    }catch(err){ alert('Erro ao salvar: '+(err.message||err)); }
  };
  const del = m.querySelector('#delCo');
  if(del) del.onclick = ()=>{
    // Double-confirmation modal
    const conf = el(`
      <div class="fixed inset-0 bg-black/60 z-30 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center">
          <div style="font-size:2rem;margin-bottom:.5rem">⚠️</div>
          <div style="font-size:1rem;font-weight:700;color:#111827;margin-bottom:.4rem">Excluir "${escapeHtml(existing.name)}"?</div>
          <p style="font-size:.82rem;color:#6b7280;margin-bottom:1.2rem">Esta ação é <b>irreversível</b>. Todas as tarefas, histórico e ações de mitigação vinculadas serão excluídos permanentemente.</p>
          <p style="font-size:.78rem;font-weight:600;color:#991b1b;margin-bottom:1rem">Digite o nome do deal para confirmar:</p>
          <input id="confName" placeholder="${escapeHtml(existing.name)}" style="width:100%;margin-bottom:.75rem;border-color:#fca5a5">
          <div id="confErr" style="font-size:.75rem;color:#dc2626;margin-bottom:.5rem;display:none">Nome incorreto.</div>
          <div class="flex gap-2">
            <button id="confCancel" class="btn btn-secondary" style="flex:1">Cancelar</button>
            <button id="confOk" class="btn btn-danger" style="flex:1">Excluir definitivamente</button>
          </div>
        </div>
      </div>`);
    document.body.appendChild(conf);
    conf.querySelector('#confCancel').onclick = ()=>conf.remove();
    conf.querySelector('#confOk').onclick = async ()=>{
      const typed = conf.querySelector('#confName').value.trim();
      if(typed.toLowerCase() !== existing.name.trim().toLowerCase()){
        conf.querySelector('#confErr').style.display='block'; return;
      }
      conf.querySelector('#confOk').disabled = true;
      conf.querySelector('#confOk').textContent = 'Excluindo…';
      try{
        // Delete all child records with FK constraints before deleting company
        await supa.from('audit_log').delete().eq('company_id', existing.id);
        await supa.from('raid_deal_links').delete().eq('company_id', existing.id);
        await supa.from('tasks').delete().eq('company_id', existing.id);
        await supa.from('synergies').delete().eq('company_id', existing.id);
        await supa.from('health_entries').delete().eq('company_id', existing.id);
        await supa.from('deletion_requests').delete().eq('company_id', existing.id);
        const { error } = await supa.from('companies').delete().eq('id', existing.id);
        if(error) throw error;
        state.companies = state.companies.filter(c=>c.id!==existing.id);
        delete state.deals[existing.id];
        conf.remove(); m.remove(); view.tab='empresas'; view.dealId=null; render();
      }catch(err){ alert('Erro: '+(err.message||err)); conf.remove(); }
    };
  };
}

/* ---------- Area Summary (Snapshot por área cross-deal) ---------- */
function openAreaSummary(areaName){
  if(!areaName) return;
  // Coleta tarefas, raid, sinergias, health desta área em todas as empresas
  const rows = [];
  state.companies.forEach(c=>{
    const deal = dealOf(c.id);
    const tasks = (deal.tasks||[]).filter(t=>t.area===areaName).map(t=>({...t, _f: computeTaskFields(t,c), companyName:c.name, companyId:c.id}));
    rows.push({company:c, tasks});
  });
  const allTasks = rows.flatMap(r=>r.tasks);
  const total = allTasks.length;
  const done = allTasks.filter(t=>t._f.status==='done').length;
  const ontrack = allTasks.filter(t=>t._f.status==='ontrack').length;
  const late = allTasks.filter(t=>t._f.status==='late').length;
  const blocked = allTasks.filter(t=>t.bloqueio==='Sim').length;
  const noowner = allTasks.filter(t=>!t.owner).length;
  const pct = total?Math.round(done/total*100):0;
  const companiesInvolved = rows.filter(r=>r.tasks.length>0).length;

  const allRaid = state.companies.flatMap(c => (state.deals[c.id]?.raid||[]).filter(r=>r.area===areaName).map(r=>({...r, companyName:c.name, companyId:c.id})));
  const openRaid = allRaid.filter(r=>r.status!=='closed');
  const topRisks = openRaid.filter(r=>r.riscoDesc).sort((a,b)=>sevRank(b.severity)-sevRank(a.severity)).slice(0,5);

  const allSyns = state.companies.flatMap(c => (state.deals[c.id]?.synergies||[]).filter(s=>s.area===areaName).map(s=>({...s, companyName:c.name, companyId:c.id})));
  const synPlan = allSyns.reduce((s,x)=>s+(Number(x.plannedValue)||0),0);
  const synReal = allSyns.reduce((s,x)=>s+(Number(x.realizedValue)||0),0);
  const synPct = synPlan>0 ? Math.round(synReal/synPlan*100) : 0;

  const allHealth = state.companies.flatMap(c => (state.deals[c.id]?.health||[]).filter(h=>h.area===areaName).map(h=>({...h, companyName:c.name, companyId:c.id})));

  // Top atrasadas
  const topLate = allTasks.filter(t=>t._f.status==='late' && t._f.diasAtraso).sort((a,b)=>b._f.diasAtraso-a._f.diasAtraso).slice(0,8);

              </tr>`;

        </section>

/* ---------- Owner Summary (Snapshot por responsável) ---------- */
function openOwnerSummary(ownerName){
  if(!ownerName) return;
  // Coleta de tudo que pertence ao owner
  const tasks = [];
  const raid = [];
  const syns = [];
  const health = [];
  state.companies.forEach(c=>{
    const deal = dealOf(c.id);
    (deal.tasks||[]).filter(t=>t.owner===ownerName).forEach(t=>tasks.push({...t, _f: computeTaskFields(t,c), companyName:c.name, companyId:c.id}));
    (deal.raid||[]).filter(r=>r.owner===ownerName).forEach(r=>raid.push({...r, companyName:c.name, companyId:c.id}));
    (deal.synergies||[]).filter(s=>s.owner===ownerName).forEach(s=>syns.push({...s, companyName:c.name, companyId:c.id}));
    (deal.health||[]).filter(h=>h.owner===ownerName).forEach(h=>health.push({...h, companyName:c.name, companyId:c.id}));
  });

  const total = tasks.length;
  const done = tasks.filter(t=>t._f.status==='done').length;
  const ontrack = tasks.filter(t=>t._f.status==='ontrack').length;
  const late = tasks.filter(t=>t._f.status==='late').length;
  const blocked = tasks.filter(t=>t.bloqueio==='Sim').length;
  const pct = total?Math.round(done/total*100):0;
  const openRaid = raid.filter(r=>r.status!=='closed');

  // Distribuição por empresa
  const byCompany = {};
  tasks.forEach(t=>{
    if(!byCompany[t.companyId]) byCompany[t.companyId] = {name:t.companyName, id:t.companyId, total:0, done:0, late:0, blocked:0};
    byCompany[t.companyId].total++;
    if(t._f.status==='done') byCompany[t.companyId].done++;
    if(t._f.status==='late') byCompany[t.companyId].late++;
    if(t.bloqueio==='Sim') byCompany[t.companyId].blocked++;
  });
  const companyRows = Object.values(byCompany).sort((a,b)=>b.late-a.late || b.total-a.total);

  // Distribuição por área
  const byArea = {};
  tasks.forEach(t=>{
    const a = t.area || '(sem área)';
    if(!byArea[a]) byArea[a] = {name:a, total:0, done:0, late:0};
    byArea[a].total++;
    if(t._f.status==='done') byArea[a].done++;
    if(t._f.status==='late') byArea[a].late++;
  });
  const areaRows = Object.values(byArea).sort((a,b)=>b.late-a.late || b.total-a.total);

  // Top atrasadas
  const topLate = tasks.filter(t=>t._f.status==='late' && t._f.diasAtraso).sort((a,b)=>b._f.diasAtraso-a._f.diasAtraso).slice(0,8);

  // Próximos vencimentos (≤14 d.u.)
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = [];
  tasks.forEach(t=>{
    if(t._f.status==='ontrack' && t._f.dataPrevista){
      const diff = businessDaysBetween(today, t._f.dataPrevista);
      if(diff!==null && diff>=0 && diff<=14){
        upcoming.push({task:t.task, area:t.area, companyName:t.companyName, companyId:t.companyId, due:t._f.dataPrevista, diff});
      }
    }
  });
  upcoming.sort((a,b)=>a.diff-b.diff);

  // Status overall
  let overall='g', overallLabel='Em dia';
  if(late>0 || blocked>0) { overall='r'; overallLabel='Atenção'; }
  else if(pct<25 && total>0) { overall='a'; overallLabel='Início'; }

  const m = el(`

          </div>
          <div class="text-xs mt-1" style="color:var(--bhub-muted)">Snapshot por responsável • ${total} tarefa(s) • ${openRaid.length} RAID aberto(s) • ${syns.length} sinergia(s)</div>
        </div>

          <div class="kpi"><div class="kpi-label">Done / Total</div><div class="kpi-value">${done} / ${total}</div></div>
          <div class="kpi"><div class="kpi-label">On Track</div><div class="kpi-value" style="color:var(--bhub-blue)">${ontrack}</div></div>
          <div class="kpi"><div class="kpi-label">Atrasadas</div><div class="kpi-value" style="color:var(--bhub-red)">${late}</div></div>

        <div class="grid lg:grid-cols-2 gap-5">
          <section class="bhub-card p-4">

            ${companyRows.length ? `<table class="w-full text-xs"><thead><tr><th class="text-left">EMPRESA</th><th>TOTAL</th><th>DONE</th><th>ATRASADAS</th></tr></thead><tbody>${companyRows.map(r=>`<tr><td><span class="deal-link" data-summary="${r.id}">${escapeHtml(r.name)}</span></td><td class="text-center">${r.total}</td><td class="text-center text-green-700">${r.done}</td><td class="text-center ${r.late>0?'text-red-700 font-semibold':''}">${r.late}</td></tr>`).join('')}</tbody></table>` : `<div class="text-xs text-gray-500">Sem tarefas.</div>`}

          <section class="bhub-card p-4">
            <div class="text-sm font-semibold mb-2" style="color:var(--bhub-navy)">🏷️ Por área</div>

          <ul class="space-y-1.5 text-xs">${openRaid.slice(0,8).map(r=>`<li class="flex items-start gap-2">${raidAspectBadges(r)}<span><strong>${escapeHtml(r.title||'')}</strong> <span class="text-gray-500">— <span class="deal-link" data-summary="${r.companyId}">${escapeHtml(r.companyName)}</span>${r.area?` • <span class="deal-link" data-area="${escapeHtml(r.area)}">${escapeHtml(r.area)}</span>`:''}</span></span></li>`).join('')}</ul>

        <h2 class="text-lg font-bold">🆚 Comparar ${_cmpLabel}</h2>
        <button id="cmpClose" class="btn btn-secondary" style="padding:.3rem .6rem">✕</button>
      </div>
      <p class="text-xs text-gray-500 mb-3">Selecione de 2 a 4 ${_cmpLabel} para comparar lado a lado.</p>
      <div class="max-h-72 overflow-y-auto border rounded-lg p-2" style="border-color:var(--bhub-border)">
        ${companies.map(c=>`<label class="flex items-center gap-2 py-1.5 px-2 hover:bg-gray-50 cursor-pointer rounded">
          <input type="checkbox" class="cmp-pick" value="${c.id}">
          <span class="text-sm">${escapeHtml(c.name)}</span>
        </label>`).join('')}
      </div>
      <div class="flex justify-end gap-2 mt-4">
        <button id="cmpCancel" class="btn btn-secondary">Cancelar</button>
        <button id="cmpGo" class="btn btn-primary" disabled>Comparar →</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(m);
  const close = ()=>m.remove();
  m.querySelector('#cmpClose').onclick = close;
  m.querySelector('#cmpCancel').onclick = close;
  m.addEventListener('click', e=>{ if(e.target===m) close(); });
  const updateBtn = ()=>{
    const n = m.querySelectorAll('.cmp-pick:checked').length;
    const btn = m.querySelector('#cmpGo');
    btn.disabled = n < 2 || n > 4;
    btn.textContent = n>=2 ? `Comparar ${n} → ` : 'Comparar →';
  };
  m.querySelectorAll('.cmp-pick').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const checked = m.querySelectorAll('.cmp-pick:checked');
      if(checked.length > 4){ cb.checked = false; }
      updateBtn();
    });
  });
  m.querySelector('#cmpGo').onclick = ()=>{
    const ids = Array.from(m.querySelectorAll('.cmp-pick:checked')).map(cb=>cb.value);
    if(ids.length < 2) return;
    close();
    openCompareDealsView(ids);
  };
}

function openCompareDealsView(ids){
  const aggMap = new Map(aggregate().map(d=>[d.company.id, d]));
  const deals = ids.map(id=>aggMap.get(id)).filter(Boolean);
  if(!deals.length) return;

  // Áreas que aparecem em qualquer um dos deals
  const allAreas = Array.from(new Set(deals.flatMap(d=>d.tasks.map(t=>t.area)).filter(Boolean))).sort();

  const today = new Date(); today.setHours(0,0,0,0);
  function dealMetrics(d){
    const upcoming10 = d.tasks.filter(t=>{
      if(t._f.status!=='ontrack' || !t._f.dataPrevista) return false;
      const diff = businessDaysBetween(today, t._f.dataPrevista);
      return diff!==null && diff>=0 && diff<=10;
    }).length;
    const raid = (state.deals[d.company.id]?.raid||[]);
    const openRaid = raid.filter(r=>r.status!=='closed').length;
    const syns = (state.deals[d.company.id]?.synergies||[]);
    const synPlan = syns.reduce((s,x)=>s+(Number(x.plannedValue)||0),0);
    const synReal = syns.reduce((s,x)=>s+(Number(x.realizedValue)||0),0);
    const synPct = synPlan>0 ? Math.round(synReal/synPlan*100) : 0;
    return {upcoming10, openRaid, synPlan, synReal, synPct};
  }
  const metrics = deals.map(dealMetrics);

  function statusRowFor(deal, area){
    const ts = deal.tasks.filter(t=>t.area===area);
    if(!ts.length) return {label:'—', cls:'hm-empty'};
    if(ts.every(t=>t._f.status==='done')) return {label:'OK', cls:'hm-done'};
    if(ts.some(t=>t._f.status==='late')) return {label:'Atraso', cls:'hm-late'};
    if(ts.some(t=>t._f.status==='ontrack')) return {label:'On track', cls:'hm-ontrack'};
    return {label:'—', cls:'hm-empty'};
  }

  function bestIdx(values, higherIsBetter=true){
    let bi = 0;
    for(let i=1;i<values.length;i++){
      if(higherIsBetter ? values[i]>values[bi] : values[i]<values[bi]) bi=i;
    }
    return bi;
  }
  function worstIdx(values, higherIsBetter=true){
    let wi = 0;
    for(let i=1;i<values.length;i++){
      if(higherIsBetter ? values[i]<values[wi] : values[i]>values[wi]) wi=i;
    }
    return wi;
  }

  function metricCell(values, idx, higherIsBetter, suffix=''){
    const v = values[idx];
    const b = bestIdx(values, higherIsBetter);
    const w = worstIdx(values, higherIsBetter);
    const allSame = values.every(x=>x===values[0]);
    let style = '';
    if(!allSame){
      if(idx===b) style = 'color:#15803d;font-weight:700';
      else if(idx===w) style = 'color:#b91c1c;font-weight:700';
    }
    return `<td class="text-center" style="${style}">${v}${suffix}</td>`;
  }

  const m = el(`
  <div class="fixed inset-0 bg-black/40 z-30 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-6xl w-full max-h-[90vh] overflow-y-auto p-5">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-lg font-bold">🆚 Comparação de ${deals.length} ${isTech?'projetos':'deals'}</h2>
          <p class="text-xs text-gray-500">Verde = melhor • Vermelho = pior • Cinza = empate ou neutro</p>
        </div>
        <button id="cmpVClose" class="btn btn-secondary" style="padding:.3rem .6rem">✕ Fechar</button>
      </div>

      <div class="bhub-card p-4 mb-4">
        <div class="text-sm font-semibold mb-3">KPIs lado a lado</div>
        <table class="w-full text-xs">
          <thead><tr><th class="text-left">Métrica</th>${deals.map(d=>`<th class="text-center"><span class="deal-link" data-summary="${d.company.id}">${escapeHtml(d.company.name)}</span></th>`).join('')}</tr></thead>
          <tbody>
            <tr><td class="font-medium">${isTech?'Data início':'Data assinatura'}</td>${deals.map(d=>`<td class="text-center">${d.company.signDate?fmtDate(d.company.signDate):'—'}</td>`).join('')}</tr>
            <tr><td class="font-medium">Total de tarefas</td>${deals.map((d,i)=>metricCell(deals.map(x=>x.total),i,false)).join('')}</tr>
            <tr><td class="font-medium">% concluído</td>${deals.map((d,i)=>metricCell(deals.map(x=>x.pct),i,true,'%')).join('')}</tr>
            <tr><td class="font-medium">Done</td>${deals.map((d,i)=>metricCell(deals.map(x=>x.done),i,true)).join('')}</tr>
            <tr><td class="font-medium">On track</td>${deals.map((d,i)=>metricCell(deals.map(x=>x.ontrack),i,true)).join('')}</tr>
            <tr><td class="font-medium">Atrasadas</td>${deals.map((d,i)=>metricCell(deals.map(x=>x.late),i,false)).join('')}</tr>
            <tr><td class="font-medium">Bloqueios</td>${deals.map((d,i)=>metricCell(deals.map(x=>x.blocked),i,false)).join('')}</tr>
            <tr><td class="font-medium">Sem owner</td>${deals.map((d,i)=>metricCell(deals.map(x=>x.noowner),i,false)).join('')}</tr>
            <tr><td class="font-medium">Próximas (≤10 d.u.)</td>${metrics.map((m_,i)=>metricCell(metrics.map(x=>x.upcoming10),i,false)).join('')}</tr>
            ${!isTech?`
            <tr><td class="font-medium">Ações de Mitigação abertas</td>${metrics.map((m_,i)=>metricCell(metrics.map(x=>x.openRaid),i,false)).join('')}</tr>
            <tr><td class="font-medium">Sinergia plano</td>${metrics.map((m_,i)=>`<td class="text-center">${fmtBRL(metrics[i].synPlan)}</td>`).join('')}</tr>
            <tr><td class="font-medium">Sinergia realizada</td>${metrics.map((m_,i)=>`<td class="text-center">${fmtBRL(metrics[i].synReal)}</td>`).join('')}</tr>
            <tr><td class="font-medium">% sinergia</td>${metrics.map((m_,i)=>metricCell(metrics.map(x=>x.synPct),i,true,'%')).join('')}</tr>
            `:''}
          </tbody>
        </table>
      </div>

      <div class="bhub-card p-4">
        <div class="text-sm font-semibold mb-3">Status por área</div>
        <div class="overflow-x-auto">
          <table class="text-xs">
            <thead><tr><th>ÁREA</th>${deals.map(d=>`<th class="whitespace-nowrap"><span class="deal-link" data-summary="${d.company.id}">${escapeHtml(d.company.name)}</span></th>`).join('')}</tr></thead>
            <tbody>
              ${allAreas.map(a=>`<tr>
                <td class="font-medium whitespace-nowrap"><span class="deal-link" data-area="${escapeHtml(a)}">${escapeHtml(a)}</span></td>
                ${deals.map(d=>{ const s=statusRowFor(d,a); return `<td class="${s.cls} text-center">${s.label}</td>`; }).join('')}
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>`);
  document.body.appendChild(m);
  m.querySelector('#cmpVClose').onclick = ()=>m.remove();
  m.addEventListener('click', e=>{ if(e.target===m) m.remove(); });
  m.querySelectorAll('[data-summary]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); m.remove(); openCompanySummary(el.dataset.summary); }));
  m.querySelectorAll('[data-area]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); if(el.dataset.area){ m.remove(); openAreaSummary(el.dataset.area); } }));
}

/* ---------- Todos os deals – visão cross-deal de tarefas ---------- */
function renderDealAll(){
  const SF = view.dealTaskStatusFilter || 'all';
  const FA = view.dealTaskAreaFilter   || '';
  const FO = view.dealTaskOwnerFilter  || '';

  // Agrega tarefas de todos os deals
  let allTasks = [];
  state.companies.forEach(c => {
    const d = dealOf(c.id);
    d.tasks.forEach(t => {
      allTasks.push({...t, _f: computeTaskFields(t, c), _company: c});
    });
  });

  const total = allTasks.length;
  const counts = {
    done:    allTasks.filter(t=>t._f.status==='done').length,
    ontrack: allTasks.filter(t=>t._f.status==='ontrack').length,
    late:    allTasks.filter(t=>t._f.status==='late').length,
    blocked: allTasks.filter(t=>t.bloqueio==='Sim').length,
  };

  // Aplica filtros
  let filtered = allTasks;
  if(SF !== 'all') filtered = filtered.filter(t =>
    SF==='done'    ? t._f.status==='done'    :
    SF==='ontrack' ? t._f.status==='ontrack' :
    SF==='late'    ? t._f.status==='late'    :
    SF==='blocked' ? t.bloqueio==='Sim'      : true
  );
  if(FA) filtered = filtered.filter(t=>(t.area||'(sem área)')===FA);
  if(FO) filtered = filtered.filter(t=>t.owner===FO);

  const allAreas  = sortAreaNames(Array.from(new Set(allTasks.map(t=>t.area||'(sem área)'))));
  const allOwners = Array.from(new Set(allTasks.map(t=>t.owner||'').filter(Boolean))).sort();

  const sfPills = [
    {key:'all',     label:'Todas',    count:total},
    {key:'done',    label:'Done',     count:counts.done,    color:'#16a34a'},
    {key:'ontrack', label:'On Track', count:counts.ontrack, color:'#2563eb'},
    {key:'late',    label:'Atrasadas',count:counts.late,    color:'#dc2626'},
    {key:'blocked', label:'Bloqueio', count:counts.blocked, color:'#d97706'},
  ].map(p=>{
    const active = SF===p.key;
    const base = active
      ? `background:${p.color||'#0171E4'};color:#fff;border-color:${p.color||'#0171E4'};box-shadow:0 1px 5px ${(p.color||'#0171E4')}55`
      : `background:#fff;color:var(--bhub-navy);border-color:var(--bhub-border)`;
    return `<button class="sf-pill" data-sf="${p.key}" style="font-size:.73rem;padding:.22rem .65rem;border-radius:9999px;border:1px solid;cursor:pointer;white-space:nowrap;transition:all .12s;${base}">${p.label} <span style="opacity:.75">${p.count}</span></button>`;
  }).join('');

  const selStyle = `font-size:.75rem;padding:.25rem .55rem;border:1px solid var(--bhub-border);border-radius:.4rem;background:#fff;color:var(--bhub-navy);cursor:pointer;max-width:170px`;

  // agrupa por deal para renderizar
  const byDeal = {};
  filtered.forEach(t=>{
    const id = t._company.id;
    if(!byDeal[id]) byDeal[id] = {company: t._company, tasks:[]};
    byDeal[id].tasks.push(t);
  });
  Object.values(byDeal).forEach(g=>g.tasks.sort(sortByRef));
  const dealGroups = Object.values(byDeal).sort((a,b)=>a.company.name.localeCompare(b.company.name));

  const rows = dealGroups.map(g=>`
    <section class="bhub-card overflow-hidden">
      <div class="bhub-card-header">
        <span class="deal-link font-semibold" data-open="${g.company.id}" style="cursor:pointer">${escapeHtml(g.company.name)}</span>
        <span class="text-xs text-gray-500 font-normal ml-2">(${g.tasks.length} tarefa${g.tasks.length!==1?'s':''})</span>
      </div>
      <div class="scroll-x">
        <table class="w-full">
          <thead><tr>
            <th>REF</th><th class="min-w-[18rem]">TAREFA</th><th>STATUS</th><th>OWNER</th><th>PRAZO</th><th>PREVISTA</th><th>REAL</th><th>%</th><th>ATRASO</th><th>BLOQ.</th>
          </tr></thead>
          <tbody>
            ${g.tasks.map(t=>`<tr class="dt-row" style="cursor:pointer" data-cid="${escapeHtml(g.company.id)}" data-tid="${escapeHtml(t.id)}">
              <td class="text-xs">${t.ref||''}</td>
              <td>${escapeHtml(t.task||'')}</td>
              <td><span class="pill ${statusClass(t._f.status)}">${statusLabel(t._f.status)}</span></td>
              <td>${escapeHtml(t.owner||'')}</td>
              <td class="text-center">${t.prazo||0}</td>
              <td>${t._f.dataPrevista?fmtDate(t._f.dataPrevista):''}</td>
              <td>${t._f.dataReal?fmtDate(t._f.dataReal):''}</td>
              <td class="text-right">${t.completado||0}%</td>
              <td class="text-right ${t._f.status==='late'?'text-red-700':t._f.atraso!=null?'text-green-700':'text-gray-400'}">${t._f.status==='late'?(t._f.atraso??''):(t._f.atraso!=null?'+'+t._f.atraso:'')}</td>
              <td>${t.bloqueio==='Sim'?'<span class="pill status-late">Sim</span>':'<span class="pill status-empty">Não</span>'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </section>`).join('') || `<div class="bhub-card" style="padding:2.5rem 1rem;text-align:center"><div style="width:38px;height:38px;border-radius:99px;background:#f5f3ff;display:flex;align-items:center;justify-content:center;margin:0 auto .75rem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b21b6" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><div style="font-size:.88rem;font-weight:600;color:#0f172a;margin-bottom:.25rem">Nenhuma tarefa encontrada</div><div style="font-size:.75rem;color:#9ca3af">Tente ajustar os filtros de status, área ou responsável</div></div>`;

  const node = el(`
    <div class="space-y-4">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <div class="text-xs text-gray-500"><button class="hover:underline" id="back">← Empresas</button></div>
          <h1 class="text-xl font-bold">Todos os deals</h1>
          <div class="text-sm text-gray-500">${filtered.length} tarefa${filtered.length!==1?'s':''} • ${state.companies.length} deals</div>
        </div>
        <select id="dealSel" class="w-56">
          <option value="__all__" selected>Todos os deals</option>
          ${state.companies.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:.35rem;align-items:center">
        ${sfPills}
        <span style="color:var(--bhub-border);margin:0 .1rem">|</span>
        <select id="dtAreaFilter" style="${selStyle}">
          <option value="">Todas as áreas</option>
          ${allAreas.map(a=>`<option value="${escapeHtml(a)}" ${FA===a?'selected':''}>${escapeHtml(a)}</option>`).join('')}
        </select>
        <select id="dtOwnerFilter" style="${selStyle}">
          <option value="">Todos os owners</option>
          ${allOwners.map(o=>`<option value="${escapeHtml(o)}" ${FO===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}
        </select>
      </div>
      <div class="space-y-3">${rows}</div>
    </div>
  `);

  node.querySelector('#back').onclick = ()=>{ view.tab='empresas'; view.dealId=null; render(); };
  node.querySelector('#dealSel').onchange = e=>{
    view.dealId = e.target.value;
    view.dealTaskAreaFilter=''; view.dealTaskOwnerFilter='';
    render();
  };
  node.querySelectorAll('.sf-pill').forEach(b=>b.addEventListener('click',()=>{ view.dealTaskStatusFilter=b.dataset.sf; render(); }));
  const dtArea = node.querySelector('#dtAreaFilter');
  if(dtArea) dtArea.addEventListener('change',()=>{ view.dealTaskAreaFilter=dtArea.value; render(); });
  const dtOwner = node.querySelector('#dtOwnerFilter');
  if(dtOwner) dtOwner.addEventListener('change',()=>{ view.dealTaskOwnerFilter=dtOwner.value; render(); });

  node.querySelectorAll('tr.dt-row[data-cid]').forEach(row=>row.addEventListener('click',()=>{
    const c=state.companies.find(x=>x.id===row.dataset.cid);
    if(c) openTaskModal(c, row.dataset.tid);
  }));
  return node;
}

/* ---------- Deal detail ---------- */
function renderDeal(){
  // ── modo "Todos os deals" ──────────────────────────────────────────────────
  if(view.dealId === '__all__'){
    return renderDealAll();
  }

  const company = state.companies.find(c=>c.id===view.dealId) || state.companies[0];
  if(!company){
    return el(`<div class="text-sm text-gray-500">${isTech ? 'Nenhum projeto selecionado.' : 'Nenhum deal selecionado.'}</div>`);
  }
  view.dealId = company.id;
  const deal = dealOf(company.id);
  const tasks = deal.tasks.map(t=>({...t, _f: computeTaskFields(t, company)}));
  const total = tasks.length, done = tasks.filter(t=>t._f.status==='done').length;
  const late = tasks.filter(t=>t._f.status==='late').length;
  const blocked = tasks.filter(t=>t.bloqueio==='Sim').length;
  const pct = total?Math.round(done/total*100):0;
  const openRaid = (deal.raid||[]).filter(r=>r.status!=='closed').length;
  const synPlan = (deal.synergies||[]).reduce((s,x)=>s+(Number(x.plannedValue)||0),0);
  const synReal = (deal.synergies||[]).reduce((s,x)=>s+(Number(x.realizedValue)||0),0);
  const synPct = synPlan>0 ? Math.round(synReal/synPlan*100) : 0;

  // Ícones SVG inline (mesma família visual do sidebar). Cada um é {16, currentColor}.
  const ICN = {
    tarefas:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="display:inline;vertical-align:-2px;margin-right:.35rem"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>',

    raid:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="display:inline;vertical-align:-2px;margin-right:.35rem"><path d="M12 2L3 6v6c0 5 4 9 9 10 5-1 9-5 9-10V6l-9-4z"/></svg>',
    sinergias: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="display:inline;vertical-align:-2px;margin-right:.35rem"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>',
    health:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="display:inline;vertical-align:-2px;margin-right:.35rem"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></svg>',
    historico: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="display:inline;vertical-align:-2px;margin-right:.35rem"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    briefing:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="display:inline;vertical-align:-2px;margin-right:.35rem"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>',
  };
  const subtabs = isTech ? [
    ['tarefas',   ICN.tarefas   + 'Tarefas',   total],
    ['raid',      ICN.raid      + raidTooltipLabel('Ações de Mitigação'), openRaid],
    ['historico', ICN.historico + 'Histórico', null],
    ['briefing',  ICN.briefing  + 'Briefing',  null],
  ] : [
    ['tarefas',   ICN.tarefas   + 'Tarefas',    total],
    ['raid',      ICN.raid      + raidTooltipLabel('Ações de Mitigação'), openRaid],
    ['sinergias', ICN.sinergias + 'Sinergias',  (deal.synergies||[]).length],
    ['historico', ICN.historico + 'Histórico',  null],
    ['briefing',  ICN.briefing  + 'Briefing',   null],
    ...(isPMI && canAdmin() ? [['integracao', ICN.gantt + 'Integração por Blocos', null]] : []),
  ];

  const subView = (function(){
    switch(view.dealTab){
      case 'raid':      return renderDealRaid(company, deal);
      case 'sinergias': return renderDealSynergies(company, deal);
      case 'historico': return renderDealHistorico(company);
      case 'briefing':     return renderDealBriefing(company, deal, tasks);
      case 'integracao':   return renderDealIntegracao(company, deal, tasks);
      default:             return renderDealTasks(company, deal, tasks);
    }
  })();

  const node = el(`

function renderDealTasks(company, deal, tasks){
  const total = tasks.length;

  // ---- Filter state ----
  const SF      = view.dealTaskStatusFilter || 'all';
  const FA      = view.dealTaskAreaFilter   || '';
  const FO      = view.dealTaskOwnerFilter  || '';

  // unique areas & owners for dropdowns
  const allAreas  = sortAreaNames(Array.from(new Set(tasks.map(t=>t.area||'(sem área)'))));
  const allOwners = Array.from(new Set(tasks.map(t=>t.owner||'').filter(Boolean))).sort();

  // apply filters
  let filteredTasks = tasks;
  if(SF !== 'all'){
    filteredTasks = filteredTasks.filter(t =>
      SF === 'done'    ? t._f.status === 'done'    :
      SF === 'ontrack' ? t._f.status === 'ontrack' :
      SF === 'late'    ? t._f.status === 'late'    :
      SF === 'blocked' ? t.bloqueio  === 'Sim'     : true
    );
  }
  if(FA) filteredTasks = filteredTasks.filter(t => (t.area||'(sem área)') === FA);
  if(FO) filteredTasks = filteredTasks.filter(t => t.owner === FO);

  const sfPills = [
    { key:'all',     label:'Todas',    count: tasks.filter(t=>true).length },
    { key:'done',    label:'Done',     count: tasks.filter(t=>t._f.status==='done').length,    color:'#16a34a' },
    { key:'ontrack', label:'On Track', count: tasks.filter(t=>t._f.status==='ontrack').length, color:'#2563eb' },
    { key:'late',    label:'Atrasadas',count: tasks.filter(t=>t._f.status==='late').length,    color:'#dc2626' },
    { key:'blocked', label:'Bloqueio', count: tasks.filter(t=>t.bloqueio==='Sim').length,      color:'#d97706' },
  ].map(p => {
    const active = SF === p.key;
    const base = active
      ? `background:${p.color||'#0171E4'};color:#fff;border-color:${p.color||'#0171E4'};box-shadow:0 1px 5px ${(p.color||'#0171E4')}55`
      : `background:#fff;color:var(--bhub-navy);border-color:var(--bhub-border)`;
    return `<button class="sf-pill" data-sf="${p.key}" style="font-size:.73rem;padding:.22rem .65rem;border-radius:9999px;border:1px solid;cursor:pointer;white-space:nowrap;transition:all .12s;${base}">${p.label} <span style="opacity:.75">${p.count}</span></button>`;
  }).join('');

  const selStyle = `font-size:.75rem;padding:.25rem .55rem;border:1px solid var(--bhub-border);border-radius:.4rem;background:#fff;color:var(--bhub-navy);cursor:pointer;max-width:170px`;
  const areaSelHtml = `<select id="dtAreaFilter" style="${selStyle}">
    <option value="">Todas as áreas</option>
    ${allAreas.map(a=>`<option value="${escapeHtml(a)}" ${FA===a?'selected':''}>${escapeHtml(a)}</option>`).join('')}
  </select>`;
  const ownerSelHtml = `<select id="dtOwnerFilter" style="${selStyle}">
    <option value="">Todos os owners</option>
    ${allOwners.map(o=>`<option value="${escapeHtml(o)}" ${FO===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}
  </select>`;

  // group by area, sorted by ref within each group, areas in canonical order
  const grouped = {};
  filteredTasks.forEach(t => {
    const a = t.area || '(sem área)';
    if(!grouped[a]) grouped[a] = [];
    grouped[a].push(t);
  });
  Object.values(grouped).forEach(g => g.sort(sortByRef));
  const areasInOrder = sortAreaNames(Object.keys(grouped));
  const phaseLabel = (t) => {
    const p = phaseFor(t, company);
    return p ? `<span class="phase" style="background:${p.color}22;border-color:${p.color}55;color:${p.color}">${p.name}</span>` : '';
  };
  const node = el(`
    <div class="space-y-3">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <div style="display:flex;flex-wrap:wrap;gap:.35rem;align-items:center">
          ${sfPills}
          <span style="color:var(--bhub-border);margin:0 .1rem">|</span>
          ${areaSelHtml}
          ${ownerSelHtml}
        </div>
        <div style="display:flex;gap:.5rem">
          ${canEdit() && total===0 && isPMI ? `<button id="seed" class="btn btn-primary">Criar a partir do Template</button>`:''}
          ${canEdit() ? `<button id="addTask" class="btn btn-primary">+ Tarefa</button>`:''}
        </div>
      </div>
      ${areasInOrder.map(a => `
        <section class="bhub-card overflow-hidden">
          <div class="bhub-card-header"><span class="deal-link" data-area="${escapeHtml(a)}" title="Ver snapshot da área">${escapeHtml(a)}</span>${AREA_TRIGGERS[a]?`<span class="g-tip" data-tip="Gatilho: ${escapeHtml(AREA_TRIGGERS[a])}" style="display:inline-block;margin-left:.4rem;font-size:.6rem;padding:.05rem .35rem;border-radius:9999px;background:#ede9fe;color:#5b21b6;font-weight:700;vertical-align:middle;cursor:default">G</span>`:''}
            <span class="text-xs text-gray-500 font-normal ml-2">(${grouped[a].length} tarefas • ${grouped[a].filter(t=>t._f.status==='done').length} done)</span>
          </div>
          <div class="scroll-x">
            <table class="w-full">
              <thead><tr>
                <th>REF</th><th class="min-w-[18rem]">TAREFA</th><th>SUB-ÁREA</th><th>STATUS</th><th>OWNER</th><th>PRAZO</th><th>PREVISTA</th><th>REAL</th><th>%</th><th>ATRASO</th><th>PRÓX.PASSO</th><th>BLOQ.</th>${canEdit()?'<th></th>':''}
              </tr></thead>
              <tbody>
                ${grouped[a].map(t=>{
                  const hasPendingDel = state.deletionRequests.some(r=>r.task_id===t.id);
                  const pendingBadge = t.pendingApproval
                    ? ` <span title="Aguardando aprovação do admin para ser ativada" style="display:inline-block;font-size:.65rem;padding:.1rem .35rem;border-radius:.75rem;background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe;font-weight:600;white-space:nowrap">⏳ Aguard. aprovação</span>`
                    : '';
                  const approveBtn = t.pendingApproval && canAdmin()
                    ? ` <button data-approve-task="${t.id}" data-company-id="${company.id}" title="Aprovar tarefa" style="margin-left:.25rem;font-size:.65rem;padding:.1rem .4rem;border-radius:.5rem;background:#dcfce7;color:#166534;border:1px solid #bbf7d0;cursor:pointer;font-weight:600">✓ Aprovar</button><button data-reject-task="${t.id}" data-company-id="${company.id}" title="Rejeitar e excluir" style="font-size:.65rem;padding:.1rem .4rem;border-radius:.5rem;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;cursor:pointer;font-weight:600">✕</button>`
                    : '';
                  return `<tr class="dt-row" data-task-edit="${t.id}" style="${t.pendingApproval?'opacity:.55;background:#f8faff;':''}cursor:pointer" title="Clique para editar">
                  <td class="text-xs">${t.ref||''}</td>
                  <td>${escapeHtml(t.task||'')}${pendingBadge}${approveBtn}${hasPendingDel?` <span title="Exclusão aguardando aprovação do admin" style="display:inline-block;font-size:.65rem;padding:.1rem .35rem;border-radius:.75rem;background:#fef3c7;color:#92400e;border:1px solid #fde68a;font-weight:600;white-space:nowrap">⏳ Excl. pendente</span>`:''}</td>
                  <td>${t.bloco?`<span style="display:inline-block;font-size:.65rem;padding:.15rem .5rem;border-radius:999px;background:#ede9fe;color:#5b21b6;border:1px solid #ddd6fe;font-weight:500;white-space:nowrap">${escapeHtml(t.bloco)}</span>`:`<span style="color:#d1d5db">—</span>`}</td>
                  <td><span class="pill ${statusClass(t._f.status)}">${statusLabel(t._f.status)}</span></td>
                  <td>${t.owner?`<span class="deal-link" data-owner="${escapeHtml(t.owner)}">${escapeHtml(t.owner)}</span>`:''}</td>
                  <td class="text-center">${t.prazo||0}</td>
                  <td>${t._f.dataPrevista?fmtDate(t._f.dataPrevista):''}</td>
                  <td>${t._f.dataReal?fmtDate(t._f.dataReal):''}</td>
                  <td class="text-right">${t.completado||0}%</td>
                  <td class="text-right ${t._f.status==='late'?'text-red-700':t._f.atraso!=null?'text-green-700':'text-gray-400'}">${t._f.status==='late'?(t._f.atraso??''):(t._f.atraso!=null?'+'+t._f.atraso:'')}</td>
                  <td>${t.proximoPasso||''}</td>
                  <td>${t.bloqueio==='Sim'?'<span class="pill status-late">Sim</span>':'<span class="pill status-empty">Não</span>'}</td>
                  ${canEdit()?`<td><button class="btn btn-secondary" data-edit="${t.id}">✎</button></td>`:''}
                </tr>`; }).join('')}
              </tbody>
            </table>
          </div>
        </section>
      `).join('') || `<div class="bhub-card p-8 text-center text-gray-500 text-sm">${isPMI ? 'Nenhuma tarefa. Use "Criar a partir do Template" ou adicione tarefas manualmente.' : 'Nenhuma tarefa. Clique em "+ Tarefa" para adicionar.'}</div>`}
    </div>
  `);
  const seed = node.querySelector('#seed');
  if(seed) seed.onclick = async ()=>{
    if(state.template.length===0){ alert('Template está vazio. Cadastre tarefas no Template primeiro.'); return; }
    const ok = await instantiateFromTemplate(company.id);
    if(ok) render();
  };
  // Status filter pills
  node.querySelectorAll('.sf-pill').forEach(b => b.addEventListener('click', ()=>{
    view.dealTaskStatusFilter = b.dataset.sf;
    render();
  }));
  // Area & owner dropdowns
  const dtArea = node.querySelector('#dtAreaFilter');
  if(dtArea) dtArea.addEventListener('change', ()=>{ view.dealTaskAreaFilter = dtArea.value; render(); });
  const dtOwner = node.querySelector('#dtOwnerFilter');
  if(dtOwner) dtOwner.addEventListener('change', ()=>{ view.dealTaskOwnerFilter = dtOwner.value; render(); });

  const addTask = node.querySelector('#addTask');
  if(addTask) addTask.onclick = ()=>openTaskModal(company);
  node.querySelectorAll('[data-edit]').forEach(b=>b.onclick = ()=>openTaskModal(company, b.dataset.edit));
  node.querySelectorAll('tr.dt-row[data-task-edit]').forEach(row=>{
    row.addEventListener('click', e=>{
      if(e.target.closest('button, a, input, select')) return;
      openTaskModal(company, row.dataset.taskEdit);
    });
  });

  // Approve / reject pending task creation
  node.querySelectorAll('[data-approve-task]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const taskId = btn.dataset.approveTask;
    const cid = btn.dataset.companyId;
    if(!confirm('Aprovar a criação desta tarefa?')) return;
    try{
      const { error } = await supa.from('tasks').update({pending_approval: false}).eq('id', taskId);
      if(error) throw error;
      const d = state.deals[cid];
      if(d){ const t = d.tasks.find(x=>x.id===taskId); if(t) t.pendingApproval = false; }
      render();
    }catch(err){ alert('Erro: '+(err.message||err)); }
  }));
  node.querySelectorAll('[data-reject-task]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const taskId = btn.dataset.rejectTask;
    const cid = btn.dataset.companyId;
    if(!confirm('Rejeitar e excluir esta tarefa?')) return;
    try{
      const { error } = await supa.from('tasks').delete().eq('id', taskId);
      if(error) throw error;
      const d = state.deals[cid];
      if(d) d.tasks = d.tasks.filter(x=>x.id!==taskId);
      render();
    }catch(err){ alert('Erro: '+(err.message||err)); }
  }));

  return node;
}

/* ===== RAID Log ===== */
function renderDealRaid(company, deal){
  const items = (deal.raid||[]).slice().sort((a,b)=> (a.status==='closed'?1:0)-(b.status==='closed'?1:0) || (sevRank(b.severity)-sevRank(a.severity)));
  const open = items.filter(x=>x.status!=='closed');
  const closed = items.filter(x=>x.status==='closed');
  const filter = view.raidFilter || 'all';
  const aspectFilterMap = {risco:'riscoDesc', issue:'issueDesc', decisao:'decisaoDesc', premissa:'premissaDesc'};
  const filtered = filter==='all' ? open
    : filter==='closed' ? closed
    : aspectFilterMap[filter] ? open.filter(x=>x[aspectFilterMap[filter]])
    : open;
  const kpiCards = [
    {id:'risco',    icon:'⚠️', label:'Risco',    field:'riscoDesc'},
    {id:'issue',    icon:'🔥', label:'Issue',    field:'issueDesc'},
    {id:'decisao',  icon:'⚖️', label:'Decisão',  field:'decisaoDesc'},
    {id:'premissa', icon:'💡', label:'Premissa', field:'premissaDesc'},
  ];
  const kpiCounts = Object.fromEntries(kpiCards.map(k=>[k.id, open.filter(x=>x[k.field]).length]));

  const node = el(`
    <div class="space-y-3">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <div class="flex gap-1 flex-wrap">
          <button class="btn ${filter==='all'?'btn-primary':'btn-secondary'}" data-rf="all">Todos (${open.length})</button>
          ${kpiCards.map(k=>`<button class="btn ${filter===k.id?'btn-primary':'btn-secondary'}" data-rf="${k.id}">${k.icon} ${k.label} (${kpiCounts[k.id]})</button>`).join('')}
          <button class="btn ${filter==='closed'?'btn-primary':'btn-secondary'}" data-rf="closed">✓ Fechados (${closed.length})</button>
        </div>
        ${canEdit() ? `<button id="addRaid" class="btn btn-primary">+ Nova Ação de Mitigação</button>`:''}
      </div>

      ${filtered.length ? `
      <div class="bhub-card overflow-hidden">
        <div class="scroll-x">
          <table class="w-full">
            <thead><tr><th class="min-w-[16rem]">TÍTULO</th><th>ASPECTOS</th><th>ÁREA</th><th>SEVERIDADE</th><th>STATUS</th><th>OWNER</th><th>PRAZO</th><th class="min-w-[14rem]">MITIGAÇÃO</th>${canEdit()?'<th></th>':''}</tr></thead>
            <tbody id="dealRaidRows"></tbody>
          </table>
        </div>
      </div>` : `<div class="bhub-card p-8 text-center text-gray-500 text-sm">Nenhuma Ação de Mitigação${filter!=='all'?' deste aspecto':''}. ${canEdit()?'Clique em "+ Nova Ação de Mitigação" para começar.':''}</div>`}
    </div>
  `);

  const tbody = node.querySelector('#dealRaidRows');
  if(tbody){
    filtered.forEach(r=>{
      const sev = SEVERITIES.find(x=>x.id===r.severity);
      const st  = RAID_STATUSES.find(x=>x.id===r.status);
      const tr = document.createElement('tr');
      if(r.status==='closed') tr.className='opacity-60';
      tr.innerHTML = '<td><div class="font-medium">'+escapeHtml(r.title||'')+'</div></td>'
        +'<td>'+raidAspectBadges(r)+'</td>'
        +'<td class="text-xs">'+(r.area?'<span class="deal-link" data-area="'+escapeHtml(r.area)+'">'+escapeHtml(r.area)+'</span>':'')+'</td>'
        +'<td>'+(sev?'<span class="pill sev-'+r.severity+'">'+sev.label+'</span>':'')+'</td>'
        +'<td>'+(st?'<span class="pill">'+st.label+'</span>':'')+'</td>'
        +'<td class="text-xs">'+(r.owner?'<span class="deal-link" data-owner="'+escapeHtml(r.owner)+'">'+escapeHtml(r.owner)+'</span>':'')+'</td>'
        +'<td class="text-xs">'+(r.dueDate?fmtDate(parseDate(r.dueDate)):'')+'</td>'
        +'<td class="text-xs">'+escapeHtml(r.mitigation||'')+'</td>'
        +(canEdit()?'<td><button class="btn btn-secondary" data-raid-edit="'+r.id+'">✎</button></td>':'');
      tbody.appendChild(tr);
    });
    node.querySelectorAll('[data-raid-edit]').forEach(b=>b.onclick = ()=>openRaidModal(company, b.dataset.raidEdit));
    node.querySelectorAll('[data-area]').forEach(b=>b.addEventListener('click',()=>{ view.tab='dashboard'; view.dashFilters={...view.dashFilters||{},areas:[b.dataset.area]}; render(); }));
    node.querySelectorAll('[data-owner]').forEach(b=>b.addEventListener('click',()=>{ view.tab='dashboard'; view.dashFilters={...view.dashFilters||{},owners:[b.dataset.owner]}; render(); }));
  }

  node.querySelectorAll('[data-rf]').forEach(b=>b.onclick = ()=>{ view.raidFilter=b.dataset.rf; render(); });
  const add = node.querySelector('#addRaid');
  if(add) add.onclick = ()=>openRaidModal(company);
  return node;
}

            <div id="dealCheckboxes" class="grid grid-cols-2 gap-1 p-2 border rounded-lg bg-gray-50 max-h-36 overflow-y-auto">

                <label class="flex items-center gap-1.5 text-xs cursor-pointer">

          </div>

  document.body.appendChild(m);
  const close = () => m.remove();
  if(existing){
    const raidPanel = m.querySelector('#raidCommentPanel');
    if(raidPanel) renderFreeComments(raidPanel, 'raid_items', existing.id);
  }
  m.querySelector('#cancel').onclick = close;

  const showErr = (msg) => {
    const el2 = m.querySelector('#raidFormErr');
    el2.textContent = msg; el2.classList.remove('hidden');
  };

  const delBtn = m.querySelector('#del');
  if(delBtn) delBtn.onclick = async ()=>{
    if(!confirm(`Excluir esta Ação de Mitigação? Isso removerá o vínculo com todos os ${isTech?'projetos':'deals'}.`)) return;
    try{
      const { error } = await supa.from('raid_items').delete().eq('id', raidId);
      if(error) throw error;
      state.raid = state.raid.filter(r=>r.id!==raidId);
      // Remove from all per-deal arrays
      for(const d of Object.values(state.deals)) d.raid = (d.raid||[]).filter(r=>r.id!==raidId);
      close(); render();
    }catch(err){ alert('Erro: '+(err.message||err)); }
  };

  m.querySelector('#raidForm').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const selectedDeals = Array.from(m.querySelectorAll('input[name="dealIds"]:checked')).map(cb=>cb.value);
    if(!fd.get('owner')) return showErr('Owner é obrigatório.');
    if(!fd.get('dueDate')) return showErr('Prazo é obrigatório.');
    if(selectedDeals.length === 0) return showErr('Selecione ao menos um deal afetado.');
    const payload = {
      area: fd.get('area')||'',
      title: fd.get('title')||'',
      riscoDesc:   fd.get('riscoDesc')||'',
      issueDesc:   fd.get('issueDesc')||'',
      decisaoDesc: fd.get('decisaoDesc')||'',
      premissaDesc:fd.get('premissaDesc')||'',
      severity: fd.get('severity')||'med', status: fd.get('status')||'open',
      owner: fd.get('owner')||'', dueDate: fd.get('dueDate')||'',
      mitigation: fd.get('mitigation')||'',
      participantes: Array.from(m.querySelectorAll('input[name="participantes"]:checked')).map(cb=>cb.value),
    };
    try{
      if(existing){
        const { error } = await supa.from('raid_items').update(raidToDb(payload)).eq('id', existing.id);
        if(error) throw error;
        // Update deal links: delete old, insert new
        await supa.from('raid_deal_links').delete().eq('raid_id', existing.id);
        if(selectedDeals.length){
          await supa.from('raid_deal_links').insert(selectedDeals.map(cid=>({raid_id:existing.id, company_id:cid})));
        }
        Object.assign(existing, payload, {dealIds: selectedDeals});
        // Sync per-deal arrays
        for(const d of Object.values(state.deals)) d.raid = (d.raid||[]).filter(r=>r.id!==existing.id);
        for(const cid of selectedDeals){ if(state.deals[cid]) state.deals[cid].raid.push(existing); }
      }else{
        const { data, error } = await supa.from('raid_items').insert(raidToDb(payload)).select().single();
        if(error) throw error;
        const newItem = raidFromDb(data);
        newItem.dealIds = selectedDeals;
        if(selectedDeals.length){
          await supa.from('raid_deal_links').insert(selectedDeals.map(cid=>({raid_id:data.id, company_id:cid})));
        }
        state.raid.push(newItem);
        for(const cid of selectedDeals){ if(state.deals[cid]) state.deals[cid].raid.push(newItem); }
      }
      close(); render();
    }catch(err){ alert('Erro ao salvar: '+(err.message||err)); }
  };
}

/* ===================================================================
   openTaskModal — cria ou edita uma tarefa de um deal
   company  : objeto { id, name, ... }
   taskId   : string | undefined  (undefined = nova tarefa)
=================================================================== */
function openTaskModal(company, taskId){
  if(!company){ console.warn('openTaskModal: company ausente'); return; }
  const deal     = state.deals[company.id];
  const existing = taskId ? (deal?.tasks||[]).find(t=>t.id===taskId) : null;
  const isNew    = !existing;
  const title    = isNew ? 'Nova Tarefa' : 'Editar Tarefa';

  // ── Status chip ──────────────────────────────────────────────
  let statusChip = '';
  if(existing){
    const cf = computeTaskFields(existing, company);
    const st = cf.status;
    if(st==='done' || existing.dataRealConclusao)
      statusChip = `<span class="status-done pill" style="font-size:.7rem">Done</span>`;
    else if(existing.bloqueio==='Sim')
      statusChip = `<span class="status-late pill" style="font-size:.7rem">Bloqueado</span>`;
    else if(st==='late')
      statusChip = `<span class="status-late pill" style="font-size:.7rem">Atrasado</span>`;
    else if(st==='ontrack')
      statusChip = `<span class="status-ontrack pill" style="font-size:.7rem">Em andamento</span>`;
    else
      statusChip = `<span class="status-empty pill" style="font-size:.7rem">Não iniciado</span>`;
  }

  // ── Prazo ↔ Data prevista ─────────────────────────────────────
  const signDateObj = company.signDate ? parseDate(company.signDate) : null;
  function prazoDays(prazo){ return parseInt(prazo)||0; }
  function dueFromPrazo(p){
    if(!signDateObj || isNaN(signDateObj.getTime())) return '';
    const d = addBusinessDays(signDateObj, prazoDays(p));
    return d ? toIso(d) : '';
  }
  function prazoFromDue(iso){
    if(!iso || !signDateObj || isNaN(signDateObj.getTime())) return 0;
    const d = parseDate(iso); if(!d) return 0;
    return Math.round((d.getTime()-signDateObj.getTime())/(1000*60*60*24));
  }
  const initPrazo = existing?.prazo||0;
  const initDue   = dueFromPrazo(initPrazo);
  const hasDueSync = !!signDateObj;

  // ── Areas + RAID options ──────────────────────────────────────
  const allAreas = Array.from(new Set([
    ...DEFAULT_AREAS.map(a=>a.name),
    ...(state.template||[]).map(t=>t.area),
    ...(deal?.tasks||[]).map(t=>t.area)
  ].filter(Boolean)));

  const areaOpts = allAreas.map(a=>
    `<option value="${escapeHtml(a)}" ${existing?.area===a?'selected':''}>${escapeHtml(a)}</option>`
  ).join('');

  const areaFieldHtml = isTech
    ? `<input type="text" name="area" value="${escapeHtml(existing?.area||'')}" placeholder="Nome da área…" />`
    : `<select name="area"><option value="">— Área —</option>${areaOpts}</select>`;

  const raidList = (state.raid||[]).filter(r=>(r.dealIds||[]).includes(company.id)||r.id===existing?.raidId);
  const raidOpts = [`<option value="">— Nenhuma —</option>`,
    ...raidList.map(r=>`<option value="${r.id}" ${existing?.raidId===r.id?'selected':''}>${escapeHtml(r.title||r.id)}</option>`)

  // ── Delete button (role-aware) ────────────────────────────────

    canAdmin()
      ? `<button type="button" id="tmDel" class="btn" style="background:#fee2e2;color:#991b1b;border:1px solid #fecaca">
           <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
           Excluir

        ? `<button type="button" id="tmDel" class="btn btn-secondary" style="color:#b45309;border-color:#fde68a;font-size:.8rem">
             Solicitar exclusão
           </button>`

  // ── Owner section (non-admin: read-only) ───────────────────────

          <button type="button" id="tmCancel" class="btn btn-secondary">Cancelar</button>

        </div>
      </div>
    </div>
  </div>`);

  document.body.appendChild(m);
  const close = ()=>m.remove();
  m.querySelector('#tmClose').onclick = close;
  m.querySelector('#tmCancel').onclick = close;
  m.addEventListener('click', e=>{ if(e.target.id==='taskModalOverlay') close(); });

  // ── Prazo ↔ Data prevista sync ────────────────────────────────
  const prazoInput = m.querySelector('#tmPrazo');
  const dueDateInput = m.querySelector('#tmDueDate');
  if(hasDueSync){
    prazoInput.addEventListener('input', ()=>{
      const v = dueFromPrazo(prazoInput.value);
      if(v) dueDateInput.value = v;
    });
    dueDateInput.addEventListener('change', ()=>{
      const v = prazoFromDue(dueDateInput.value);

  const tmBlocoEl = m.querySelector('#tmBloco');
  if(tmAreaEl && tmAreaEl.tagName === 'SELECT' && tmBlocoEl){
    tmAreaEl.addEventListener('change', ()=>{

      } else {
        tmBlocoEl.innerHTML = `<option value="">${sel ? '— Nenhuma —' : 'Selecione uma área primeiro'}</option>`

      }
    });
  }

  // ── Bloqueio toggle ───────────────────────────────────────────
  const bloqSel  = m.querySelector('#tmBloqueio');
  const bloqDets = m.querySelector('#bloqueioDetails');
  const raidWarn = m.querySelector('#raidWarning');
  const raidSel  = m.querySelector('#tmRaid');

    const isSim = bloqSel.value==='Sim';
    bloqDets.style.display = isSim ? 'flex' : 'none';
    if(isSim) updateRaidWarning();
  }
  function updateRaidWarning(){
    if(raidWarn) raidWarn.style.display = (!raidSel||!raidSel.value) ? 'flex' : 'none';
  }
  bloqSel.addEventListener('change', updateBloqueioUi);
  if(raidSel) raidSel.addEventListener('change', updateRaidWarning);
  updateBloqueioUi();

  // ── Concluído toggle ──────────────────────────────────────────
  const concluidoBtn = m.querySelector('#tmConcluido');
  const dataRealInput = m.querySelector('#tmDataReal');
  function updateConcluidoBtn(isOn){
    concluidoBtn.dataset.on = isOn ? '1' : '0';
    concluidoBtn.querySelector('#tmConcluidoIcon').textContent = isOn ? '✓' : '○';
    concluidoBtn.querySelector('#tmConcluidoLabel').textContent = isOn ? 'Sim' : 'Não';
    concluidoBtn.style.background = isOn ? '#16a34a' : '#f3f4f6';
    concluidoBtn.style.borderColor = isOn ? '#16a34a' : '#d1d5db';
    concluidoBtn.style.color = isOn ? '#fff' : '#6b7280';
  }
  concluidoBtn.addEventListener('click', ()=>{
    const nowOn = concluidoBtn.dataset.on !== '1';
    updateConcluidoBtn(nowOn);
    if(nowOn && !dataRealInput.value){
      dataRealInput.value = new Date().toISOString().slice(0,10);
    } else if(!nowOn){
      dataRealInput.value = '';
    }
  });
  // If date is manually cleared, uncheck the toggle
  dataRealInput.addEventListener('change', ()=>{
    if(!dataRealInput.value) updateConcluidoBtn(false);
    else updateConcluidoBtn(true);
  });

  // ── Delete ────────────────────────────────────────────────────
  const delBtn = m.querySelector('#tmDel');
