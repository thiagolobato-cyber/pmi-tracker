function renderDealGantt(company, deal, tasks){
  const sd = parseDate(company.signDate);
  const wrap = el(`<div class="space-y-3"></div>`);
  if(!sd){
    wrap.innerHTML = `<div class="bhub-card p-6 text-sm text-gray-600">Defina a <b>data de assinatura</b> da empresa para visualizar o Gantt.</div>`;
    return wrap;
  }
  // Tarefas com data prevista (excluir vazias)
  const items = tasks
    .map(t=>({
      t,
      start: sd,
      end: t._f.dataReal || t._f.dataPrevista,
      status: t._f.status,
      phase: phaseFor(t, company)
    }))
    .filter(x=>x.end);
  if(!items.length){
    wrap.innerHTML = `<div class="bhub-card p-6 text-sm text-gray-600">Sem tarefas com prazo definido.</div>`;
    return wrap;
  }
  // Range: min start -> max end + 10% margem
  const minD = sd;
  const maxD = new Date(Math.max(...items.map(x=>x.end.getTime()), sd.getTime()+86400000*30));
  const totalMs = Math.max(maxD - minD, 86400000);
  // Agrupar por fase
  const groups = DEFAULT_PHASES.map(p=>({
    phase: p,
    items: items.filter(x=>x.phase?.id===p.id).sort((a,b)=>a.end-b.end)
  })).filter(g=>g.items.length);
  // Filtros locais
  const ui = el(`
    <div class="bhub-card p-3 flex flex-wrap items-center gap-3 text-xs">
      <label class="flex items-center gap-1">Agrupar por:
        <select id="gnGroup" class="px-2 py-1 border rounded">
          <option value="phase">Fase</option>
          <option value="area">Área</option>
          <option value="owner">Owner</option>
        </select>
      </label>
      <label class="flex items-center gap-1">Status:
        <select id="gnStatus" class="px-2 py-1 border rounded">
          <option value="all">Todos</option>
          <option value="ontrack">On track</option>
          <option value="late">Atrasados</option>
          <option value="done">Concluídos</option>
          <option value="open">Em aberto</option>
        </select>
      </label>
      <div class="ml-auto flex items-center gap-3 text-xs text-gray-600">
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:#16a34a"></span>Done</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:#0171E4"></span>On track</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:#F25461"></span>Atrasado</span>
      </div>
    </div>
  `);
  const board = el(`<div class="bhub-card p-3"></div>`);
  wrap.appendChild(ui);
  wrap.appendChild(board);

  function statusColor(s){ return s==='done'?'#16a34a':s==='late'?'#F25461':s==='ontrack'?'#0171E4':'#94a3b8'; }
  function fmtShort(d){ return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); }

  function pctOf(d){ return Math.max(0,Math.min(100,((d - minD)/totalMs)*100)); }
  function widthBetween(a,b){ return Math.max(1, ((b - a)/totalMs)*100); }

  // Marcadores de meses
  function monthMarkers(){
    const out = [];
    const cur = new Date(minD.getFullYear(), minD.getMonth(), 1);
    while(cur <= maxD){
      out.push(new Date(cur));
      cur.setMonth(cur.getMonth()+1);
    }
    return out;
  }
  function todayMarker(){
    const today = new Date(); today.setHours(0,0,0,0);
    if(today >= minD && today <= maxD) return pctOf(today);
    return null;
  }

  function buildGroups(by, statusFilter){
    const filt = items.filter(x=>{
      if(statusFilter==='all') return true;
      if(statusFilter==='open') return x.status==='ontrack' || x.status==='late' || x.status==='empty';
      return x.status === statusFilter;
    });
    if(by==='phase'){
      return DEFAULT_PHASES
        .map(p=>({label:p.name, color:p.color, items: filt.filter(x=>x.phase?.id===p.id).sort((a,b)=>a.end-b.end)}))
        .filter(g=>g.items.length);
    }
    if(by==='area'){
      const areas = Array.from(new Set(filt.map(x=>x.t.area||'(sem área)')));
      return areas.sort().map(a=>({label:a, color:'#0F1727', items: filt.filter(x=>(x.t.area||'(sem área)')===a).sort((a,b)=>a.end-b.end)}));
    }
    // owner
    const owners = Array.from(new Set(filt.map(x=>x.t.owner||'(sem owner)')));
    return owners.sort().map(o=>({label:o, color:'#0F1727', items: filt.filter(x=>(x.t.owner||'(sem owner)')===o).sort((a,b)=>a.end-b.end)}));
  }

  function renderBoard(){
    const by = ui.querySelector('#gnGroup').value;
    const st = ui.querySelector('#gnStatus').value;
    const grps = buildGroups(by, st);
    const months = monthMarkers();
    const tMark = todayMarker();

    let html = `
      <div class="overflow-x-auto">
        <div style="min-width:900px">
          <div class="flex border-b text-xs text-gray-600 pb-1 mb-2" style="border-color:var(--bhub-border)">
            <div style="width:220px" class="font-semibold">Tarefa</div>
            <div class="flex-1 relative" style="height:18px">
              ${months.map(m=>`<div style="position:absolute;left:${pctOf(m)}%;font-size:10px;color:#94a3b8">${m.toLocaleDateString('pt-BR',{month:'short'})}</div>`).join('')}
            </div>
          </div>
    `;
    grps.forEach(g=>{
      html += `<div class="text-xs font-bold mt-3 mb-1" style="color:${g.color};font-family:'Roboto'">${escapeHtml(g.label)} <span class="text-gray-400 font-normal">· ${g.items.length}</span></div>`;
      g.items.forEach(x=>{
        const left = pctOf(x.start);
        const right = pctOf(x.end);
        const w = Math.max(0.8, right - left);
        const color = statusColor(x.status);
        const tip = `${x.t.tarefa} — ${statusLabel(x.status)} · fim: ${fmtShort(x.end)}${x.t.owner?` · ${x.t.owner}`:''}`;
        html += `
          <div class="flex items-center text-xs py-0.5 hover:bg-gray-50 rounded gantt-row" data-task-id="${escapeHtml(x.t.id)}" style="cursor:pointer">
            <div style="width:220px" class="truncate pr-2" title="${escapeHtml(x.t.tarefa)}">${escapeHtml(x.t.tarefa)}</div>
            <div class="flex-1 relative" style="height:18px;background:linear-gradient(to right,#f1f5f9 0,#f1f5f9 100%);border-radius:3px">
              ${months.map(m=>`<div style="position:absolute;left:${pctOf(m)}%;top:0;bottom:0;width:1px;background:#e5e7eb"></div>`).join('')}
              ${tMark!==null?`<div style="position:absolute;left:${tMark}%;top:-2px;bottom:-2px;width:2px;background:#F25461;z-index:3"></div>`:''}
              <div title="${escapeHtml(tip)}" style="position:absolute;left:${left}%;width:${w}%;top:3px;bottom:3px;background:${color};border-radius:3px;opacity:.9"></div>
            </div>
          </div>
        `;
      });
    });
    html += `</div></div>`;
    board.innerHTML = html;
    board.querySelectorAll('.gantt-row').forEach(r=>{
      r.addEventListener('click', ()=>{
        const id = r.dataset.taskId;
        if(typeof openTaskModal === 'function') openTaskModal(company, id);
      });
    });
  }
  ui.querySelector('#gnGroup').addEventListener('change', renderBoard);
  ui.querySelector('#gnStatus').addEventListener('change', renderBoard);
  renderBoard();
  return wrap;
}

function renderDealBriefing(company, deal, tasks){
  const total = tasks.length;
  const done = tasks.filter(t=>t._f.status==='done').length;
  const ontrack = tasks.filter(t=>t._f.status==='ontrack').length;
  const late = tasks.filter(t=>t._f.status==='late').length;
  const blocked = tasks.filter(t=>t.bloqueio==='Sim').length;
  const noowner = tasks.filter(t=>!t.owner).length;
  const pct = total?Math.round(done/total*100):0;

  const raid = deal.raid||[];
  const openRaid = raid.filter(r=>r.status!=='closed');
  const topRisks = openRaid.filter(r=>r.riscoDesc).sort((a,b)=>sevRank(b.severity)-sevRank(a.severity)).slice(0,3);
  const openIssues = openRaid.filter(r=>r.issueDesc).length;

  const syns = deal.synergies||[];
  const synPlan = syns.reduce((s,x)=>s+(Number(x.plannedValue)||0),0);
  const synReal = syns.reduce((s,x)=>s+(Number(x.realizedValue)||0),0);
  const synPct = synPlan>0 ? Math.round(synReal/synPlan*100) : 0;

  // Tarefas mais atrasadas (top 5)
  const topLate = tasks.filter(t=>t._f.status==='late' && t._f.diasAtraso)
    .sort((a,b)=>b._f.diasAtraso-a._f.diasAtraso).slice(0,5);

  // Próximos vencimentos (até 14 d.u.)
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = [];
  tasks.forEach(t=>{
    if(t._f.status==='ontrack' && t._f.dataPrevista){
      const diff = businessDaysBetween(today, t._f.dataPrevista);
      if(diff!==null && diff>=0 && diff<=14){
        upcoming.push({task:t.task, area:t.area, owner:t.owner, due:t._f.dataPrevista, diff});
      }
    }
  });
  upcoming.sort((a,b)=>a.diff-b.diff);

  // Bloqueios ativos
  const blocks = tasks.filter(t=>t.bloqueio==='Sim').map(t=>({area:t.area, task:t.task, owner:t.owner, desc:t.bloqueioDescricao}));

  // Status por área (último RAG)
  const allAreas = Array.from(new Set([
    ...DEFAULT_AREAS.map(a=>a.name),
    ...tasks.map(t=>t.area),
    ...(deal.health||[]).map(h=>h.area)
  ].filter(Boolean)));
  function lastRagFor(area){
    const arr = (deal.health||[]).filter(h=>h.area===area).sort((a,b)=>b.weekIso.localeCompare(a.weekIso));
    return arr[0]?.rag || 'na';
  }
  const areaRags = allAreas.map(a=>({area:a, rag:lastRagFor(a)}));

  // Dias desde a assinatura
  let daysSinceSign = null;
  if(company.signDate){
    const d = parseDate(company.signDate);
    if(d){
      const diffMs = today.getTime() - d.getTime();
      daysSinceSign = Math.floor(diffMs/86400000);
    }
  }

  // Status overall
  let overall = 'g', overallLabel = 'Saudável';
  if(late>0 || blocked>0 || topRisks.some(r=>r.severity==='high')){ overall='r'; overallLabel='Atenção crítica'; }
  else if(noowner>0 || openIssues>0 || pct<25){ overall='a'; overallLabel='Atenção'; }

  const node = el(`
    <div class="briefing-page space-y-4">
      <div class="flex items-center justify-end gap-2 no-print">
        <button id="downloadPdf" class="btn btn-primary">📥 Baixar PDF</button>
        <button id="print" class="btn btn-secondary">🖨 Imprimir</button>
      </div>
      <div class="bhub-card p-6 space-y-5">
        <!-- Cabeçalho -->
        <div class="flex items-center justify-between flex-wrap gap-3">
          <div>
            <div class="text-xs uppercase tracking-wider" style="color:var(--bhub-muted)">Executive Briefing</div>
            <h2 class="text-2xl font-bold" style="color:var(--bhub-navy);font-family:'Roboto'">${escapeHtml(company.name)}</h2>
            <div class="text-sm text-gray-500">
              Assinatura: ${company.signDate?fmtDate(parseDate(company.signDate)):'—'}${daysSinceSign!==null?` (D+${daysSinceSign})`:''} • Gerado em ${fmtDate(new Date())}
            </div>
          </div>
          <span class="rag rag-${overall}" style="font-size:.8rem;padding:.3rem .7rem"><span class="rag-dot"></span>${overallLabel}</span>
        </div>

        <!-- KPIs -->
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3">
          <div class="kpi"><div class="kpi-label">% Concluído</div><div class="kpi-value">${pct}%</div></div>
          <div class="kpi"><div class="kpi-label">Done / Total</div><div class="kpi-value">${done} / ${total}</div></div>
          <div class="kpi"><div class="kpi-label">On Track</div><div class="kpi-value" style="color:var(--bhub-blue)">${ontrack}</div></div>
          <div class="kpi"><div class="kpi-label">Atrasadas</div><div class="kpi-value" style="color:var(--bhub-red)">${late}</div></div>
          <div class="kpi"><div class="kpi-label">Bloqueios</div><div class="kpi-value" style="color:#92400e">${blocked}</div></div>
          <div class="kpi"><div class="kpi-label">Ações de Mitigação abertas</div><div class="kpi-value">${openRaid.length}</div></div>
          <div class="kpi"><div class="kpi-label">Sinergia</div><div class="kpi-value">${synPct}%</div></div>
        </div>

        <!-- Status por área -->
        <section>
          <div class="text-sm font-semibold mb-2" style="color:var(--bhub-navy)">Status por área (último RAG)</div>
          <div class="flex flex-wrap gap-2">
            ${areaRags.map(a=>`<div class="flex items-center gap-2 px-2.5 py-1 rounded-md border" style="border-color:var(--bhub-border)"><span class="text-xs">${escapeHtml(a.area)}</span><span class="rag rag-${a.rag}" style="font-size:.6rem;padding:.1rem .35rem"><span class="rag-dot"></span>${a.rag==='g'?'G':a.rag==='a'?'A':a.rag==='r'?'R':'—'}</span></div>`).join('') || `<div class="text-xs text-gray-500">Sem registros de health.</div>`}
          </div>
        </section>

        <div class="grid lg:grid-cols-2 gap-5">
          <!-- Top atrasadas -->
          <section class="bhub-card p-4">
            <div class="text-sm font-semibold mb-2" style="color:var(--bhub-navy)">⚠️ Top tarefas atrasadas</div>
            ${topLate.length ? `<table class="w-full text-xs"><thead><tr><th class="text-left">TAREFA</th><th class="text-left">ÁREA</th><th>OWNER</th><th>DIAS</th></tr></thead><tbody>${topLate.map(t=>`<tr><td>${escapeHtml(t.task||'')}</td><td>${escapeHtml(t.area||'')}</td><td>${escapeHtml(t.owner||'—')}</td><td class="text-center text-red-700 font-semibold">${t._f.diasAtraso}</td></tr>`).join('')}</tbody></table>` : `<div class="text-xs text-gray-500">Nenhuma tarefa atrasada. 🎉</div>`}
          </section>

          <!-- Próximos vencimentos -->
          <section class="bhub-card p-4">
            <div class="text-sm font-semibold mb-2" style="color:var(--bhub-navy)">📅 Próximos vencimentos (≤14 d.u.)</div>
            ${upcoming.length ? `<table class="w-full text-xs"><thead><tr><th class="text-left">TAREFA</th><th class="text-left">ÁREA</th><th>OWNER</th><th>EM</th></tr></thead><tbody>${upcoming.slice(0,8).map(t=>`<tr><td>${escapeHtml(t.task||'')}</td><td>${escapeHtml(t.area||'')}</td><td>${escapeHtml(t.owner||'—')}</td><td class="text-center">${t.diff}d</td></tr>`).join('')}</tbody></table>` : `<div class="text-xs text-gray-500">Nada vencendo em 14 d.u.</div>`}
          </section>

          <!-- Top riscos -->
          <section class="bhub-card p-4">
            <div class="text-sm font-semibold mb-2" style="color:var(--bhub-navy)">🛡️ Top riscos abertos</div>
            ${topRisks.length ? `<ul class="space-y-1.5 text-xs">${topRisks.map(r=>`<li class="flex items-start gap-2"><span class="pill" style="background:${r.severity==='high'?'#fee2e2':r.severity==='med'?'#fef3c7':'#dbeafe'};color:${r.severity==='high'?'#991b1b':r.severity==='med'?'#92400e':'#1e3a8a'}">${(r.severity||'').toUpperCase()}</span><span><strong>${escapeHtml(r.title||'')}</strong> <span class="text-gray-500">— ${escapeHtml(r.area||'')}</span></span></li>`).join('')}</ul>` : `<div class="text-xs text-gray-500">Sem riscos abertos.</div>`}
          </section>

          <!-- Bloqueios -->
          <section class="bhub-card p-4">
            <div class="text-sm font-semibold mb-2" style="color:var(--bhub-navy)">🚧 Bloqueios ativos</div>
            ${blocks.length ? `<ul class="space-y-1.5 text-xs">${blocks.slice(0,5).map(b=>`<li><strong>${escapeHtml(b.task||'')}</strong> <span class="text-gray-500">— ${escapeHtml(b.area||'')}${b.owner?` • ${escapeHtml(b.owner)}`:''}</span>${b.desc?`<div class="text-gray-600 mt-0.5">${escapeHtml(b.desc)}</div>`:''}</li>`).join('')}</ul>` : `<div class="text-xs text-gray-500">Nenhum bloqueio ativo.</div>`}
          </section>
        </div>

        <!-- Sinergias -->
        <section class="bhub-card p-4">
          <div class="flex items-center justify-between mb-2">
            <div class="text-sm font-semibold" style="color:var(--bhub-navy)">💰 Sinergias</div>
            <div class="text-xs" style="color:var(--bhub-muted)">${syns.length} item(ns)</div>
          </div>
          <div class="grid grid-cols-3 gap-3 text-xs">
            <div><div class="text-gray-500">Planejado</div><div class="text-base font-semibold">${fmtBRL(synPlan)}</div></div>
            <div><div class="text-gray-500">Realizado</div><div class="text-base font-semibold">${fmtBRL(synReal)}</div></div>
            <div><div class="text-gray-500">Captura</div><div class="text-base font-semibold">${synPct}%</div></div>
          </div>
        </section>

        ${noowner>0 ? `<div class="text-xs px-3 py-2 rounded-md" style="background:#fef3c7;color:#92400e">⚠️ ${noowner} tarefa(s) sem responsável definido.</div>` : ''}

        <div class="text-xs text-gray-400 border-t pt-3" style="border-color:var(--bhub-border)">Documento gerado pelo BHub PMI Tracker — confidencial.</div>
      </div>
    </div>
  `);

  const btn = node.querySelector('#print');
  if(btn) btn.onclick = ()=>window.print();
  const dlBtn = node.querySelector('#downloadPdf');
  if(dlBtn) dlBtn.onclick = async ()=>{
    if(typeof html2pdf === 'undefined'){ alert('Biblioteca de PDF não carregou. Verifique sua conexão.'); return; }
    const target = node.querySelector('.bhub-card');
    if(!target) return;
    const orig = dlBtn.textContent;
    dlBtn.disabled = true;
    dlBtn.textContent = '⏳ Gerando PDF…';
    try{
      const safeName = (company.name||'briefing').replace(/[^a-zA-Z0-9_-]+/g,'_').slice(0,40);
      const stamp = new Date().toISOString().slice(0,10);
      await html2pdf().set({
        margin: [10,10,10,10],
        filename: `briefing_${safeName}_${stamp}.pdf`,
        image: { type:'jpeg', quality:0.95 },
        html2canvas: { scale:2, useCORS:true, backgroundColor:'#ffffff' },
        jsPDF: { unit:'mm', format:'a4', orientation:'portrait' },
        pagebreak: { mode:['avoid-all','css','legacy'] }
      }).from(target).save();
    }catch(err){
      alert('Erro: '+(err.message||err));
    } finally {
      dlBtn.disabled = false;
      dlBtn.textContent = orig;
    }
  };
  return node;
}

function openTemplateModal(id){
  const t = id ? state.template.find(x=>x.id===id) : {id:uid(), ref:'', area:'', task:'', defaultOwner:'', defaultPrazo:0};
  const isNew = !id;

  // Areas: DEFAULT_AREAS + quaisquer áreas customizadas já no template
  const allAreas = [...DEFAULT_AREAS.map(a=>a.name)];
  state.template.forEach(x=>{ if(x.area && !allAreas.includes(x.area)) allAreas.push(x.area); });

  // Usuários com login para o select de owner
  const users = [...(state.users||[])].sort((a,b)=>a.username.localeCompare(b.username));

  // Auto-gera REF com base na área selecionada
  function nextRefForArea(areaName){
    const entry = DEFAULT_AREAS.find(a=>a.name===areaName);
    if(!entry) return '';
    const prefix = entry.n.split('.')[0]; // "1.0" → "1"
    const nums = state.template
      .filter(x=>x.area===areaName && x.id!==t.id)
      .map(x=>{ const p=(x.ref||'').split('.'); return p.length>=2?parseInt(p[1]):0; })
      .filter(n=>!isNaN(n)&&n>0);
    return `${prefix}.${nums.length?Math.max(...nums)+1:1}`;
  }

  const initRef = t.ref || (t.area ? nextRefForArea(t.area) : '');

  const m = el(`
  <div class="fixed inset-0 bg-black/40 z-20 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl w-full max-w-xl shadow-xl flex flex-col" style="max-height:90vh">
      <div class="p-6 pb-3">
        <div class="text-lg font-semibold mb-4">${isNew?'Nova tarefa no template':'Editar tarefa do template'}</div>
        <form id="tplForm" class="flex flex-col gap-3 text-sm">

          <div>
            <label class="text-xs font-semibold block mb-1" style="color:var(--bhub-navy)">Área *</label>
            <select name="area" id="tplArea" required>
              <option value="">Selecione a área…</option>
              ${allAreas.map(a=>`<option value="${escapeHtml(a)}"${t.area===a?' selected':''}>${escapeHtml(a)}</option>`).join('')}
            </select>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold block mb-1" style="color:var(--bhub-navy)">
                REF # <span style="color:var(--bhub-muted);font-weight:400">(automático)</span>
              </label>
              <input name="ref" id="tplRef" value="${escapeHtml(initRef)}"
                style="background:var(--bhub-beige-soft);color:var(--bhub-muted);cursor:default" readonly/>
            </div>
            <div>
              <label class="text-xs font-semibold block mb-1" style="color:var(--bhub-navy)">Prazo (d.u.)</label>
              <input name="defaultPrazo" type="number" min="0" value="${t.defaultPrazo||0}"/>
            </div>
          </div>

          <div>
            <label class="text-xs font-semibold block mb-1" style="color:var(--bhub-navy)">Tarefa *</label>
            <textarea name="task" rows="3" required>${escapeHtml(t.task||'')}</textarea>
          </div>

          <div>
            <label class="text-xs font-semibold block mb-1" style="color:var(--bhub-navy)">
              Owner padrão
              <span style="color:var(--bhub-muted);font-weight:400">— aparecerá na Visão Usuário</span>
            </label>
            <select name="defaultOwner" id="tplOwner">
              <option value="">— Sem owner —</option>
              ${users.map(u=>`<option value="${escapeHtml(u.username)}"${t.defaultOwner===u.username?' selected':''}>${escapeHtml(u.username)}</option>`).join('')}
            </select>
          </div>

          <div>
            <label class="text-xs font-semibold block mb-1" style="color:var(--bhub-navy)">
              🔗 Dependências
              <span style="color:var(--bhub-muted);font-weight:400">— REFs que precisam ser concluídas antes</span>
            </label>
            ${(()=>{
              const selectedRefs = (t.predecessorRefs||'').split(',').map(r=>r.trim()).filter(Boolean);
              const sortRef = (a,b)=>{ const p=(s)=>{const[x,y]=(s||'').split('.'); return [parseInt(x)||0,parseInt(y)||0];}; const[ax,ay]=p(a.ref); const[bx,by]=p(b.ref); return ax!==bx?ax-bx:ay-by; };
              const others = state.template.filter(x=>x.id!==t.id).sort(sortRef);
              const areas = [...new Set(others.map(x=>x.area).filter(Boolean))].sort();
              if(others.length===0) return '<div class="text-xs text-gray-400 py-1 border rounded-lg p-2">Nenhuma outra tarefa no template ainda.</div>';
              return `
              <select id="predAreaFilter" class="mb-1 text-xs" style="padding:.25rem .5rem;border-radius:.4rem;border:1px solid var(--bhub-border);background:#fff;width:100%">
                <option value="">— Todas as áreas —</option>
                ${areas.map(a=>`<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('')}
              </select>
              <div id="predList" class="border rounded-lg p-2 bg-gray-50 max-h-40 overflow-y-auto" style="border-color:var(--bhub-border)">
                ${others.map(x=>`
                  <label class="pred-row flex items-center gap-2 text-xs py-0.5 cursor-pointer hover:bg-gray-100 rounded px-1" data-area="${escapeHtml(x.area||'')}">
                    <input type="checkbox" name="predecessorRefs" value="${escapeHtml(x.ref)}"${selectedRefs.includes(x.ref)?' checked':''}>
                    <span class="font-mono text-gray-400 shrink-0" style="min-width:2.5rem">${escapeHtml(x.ref)}</span>
                    <span class="truncate">${escapeHtml(x.task)}</span>
                  </label>`).join('')}
              </div>`;
            })()}
          </div>

          <div class="flex justify-end gap-2 pt-3 border-t" style="border-color:var(--bhub-border)">
            ${!isNew?`<button type="button" id="del" class="btn btn-danger mr-auto">Excluir</button>`:''}
            <button type="button" id="cancel" class="btn btn-secondary">Cancelar</button>
            <button class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>`);

  document.body.appendChild(m);

  // Auto-preenche REF ao mudar área
  m.querySelector('#tplArea').addEventListener('change', e=>{
    m.querySelector('#tplRef').value = nextRefForArea(e.target.value);
  });

  // Filtro de área nas dependências
  const predAreaFilter = m.querySelector('#predAreaFilter');
  if(predAreaFilter){
    predAreaFilter.addEventListener('change', ()=>{
      const sel = predAreaFilter.value;
      m.querySelectorAll('.pred-row').forEach(row=>{
        row.style.display = (!sel || row.dataset.area === sel) ? '' : 'none';
      });
    });
  }

  m.querySelector('#cancel').onclick = ()=>m.remove();

  m.querySelector('#tplForm').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const selectedPreds = Array.from(m.querySelectorAll('input[name="predecessorRefs"]:checked')).map(cb=>cb.value);
    const upd = {
      ref: fd.get('ref').trim(),
      area: fd.get('area').trim(),
      task: fd.get('task').trim(),
      defaultOwner: fd.get('defaultOwner').trim(),
      defaultPrazo: parseInt(fd.get('defaultPrazo'))||0,
      ordering: t.ordering || (state.template.length),
      predecessorRefs: selectedPreds.join(', ')
    };
    const needsApproval = !canAdmin();
    try{
      if(isNew){
        const payload = { ...tplToDb(upd), pending_approval: needsApproval };
        const { data, error } = await supa.from('template_tasks').insert(payload).select().single();
        if(error) throw error;
        state.template.push(tplFromDb(data));
      }else{
        const payload = { ...tplToDb(upd), pending_approval: needsApproval ? true : (t.pendingApproval || false) };
        const { error } = await supa.from('template_tasks').update(payload).eq('id', t.id);
        if(error) throw error;
        Object.assign(t, upd);
        if(needsApproval) t.pendingApproval = true;
      }
      m.remove(); render();
      if(needsApproval){
        const toast = el(`<div style="position:fixed;bottom:1.5rem;right:1.5rem;background:#1e2d45;color:#fff;padding:.75rem 1.25rem;border-radius:.75rem;font-size:.85rem;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:320px">
          ⏳ Tarefa enviada para aprovação do admin. Ficará ativa após aprovação.
          </div>`);
        document.body.appendChild(toast);
        setTimeout(()=>toast.remove(), 4000);
      }
    }catch(err){ alert('Erro ao salvar: '+(err.message||err)); }
  };

  const del = m.querySelector('#del');
  if(del) del.onclick = async ()=>{
    if(!canAdmin() && !t.pendingApproval){ alert('Apenas admins podem excluir tarefas aprovadas do template.'); return; }
    if(!confirm('Excluir?')) return;
    try{
      const { error } = await supa.from('template_tasks').delete().eq('id', t.id);
      if(error) throw error;
      state.template = state.template.filter(x=>x.id!==t.id);
      m.remove(); render();
    }catch(err){ alert('Erro: '+(err.message||err)); }
  };
}

/* ---------- Usuários (read-only) + Admin actions ---------- */
/* ===== User Management helpers ===== */
async function createUserViaFunction(email, password, role, username){
  // Chama a Edge Function create-user (server-side, usa service_role key).
  // Requer que o caller seja admin — o JWT é enviado no header.
  const { data: { session } } = await supa.auth.getSession();
  const token = session?.access_token;
  if(!token) throw new Error('Sessão expirada — faça login novamente');

  const res = await fetch(`${SUPABASE_FUNCTIONS_URL}/create-user`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`,
    },
    body: JSON.stringify({ email, password, role, username: username || email.split('@')[0] }),
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || `Erro ${res.status}`);
  return data;
}

async function changeUserRole(userId, newRole){
  const { error } = await supa.from('profiles').update({ role: newRole }).eq('id', userId);
  if(error) throw error;
  // Atualiza state local
  const u = state.users.find(x=>x.id===userId);
  if(u) u.role = newRole;
}

async function removeUserProfile(userId){
  const { error } = await supa.from('profiles').delete().eq('id', userId);
  if(error) throw error;
  state.users = state.users.filter(u=>u.id!==userId);
}

        <div id="editNameErr" class="text-xs rounded-lg p-2 hidden" style="color:#991b1b;background:#fee2e2"></div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="cancelEdit" class="btn btn-secondary">Cancelar</button>
          <button class="btn btn-primary" id="saveNameBtn">Salvar</button>
        </div>
      </form>
    </div>
  </div>`);
  document.body.appendChild(m);
  m.querySelector('#cancelEdit').onclick = ()=>m.remove();
  m.querySelector('#editNameForm').onsubmit = async (e)=>{
    e.preventDefault();
    const newName = new FormData(e.target).get('username').trim();
    if(!newName) return;
    const btn = m.querySelector('#saveNameBtn');
    const errEl = m.querySelector('#editNameErr');
    btn.disabled=true; btn.textContent='Salvando…';
    errEl.classList.add('hidden');
    try{
      const {error} = await supa.from('profiles').update({username: newName}).eq('id', user.id);
      if(error) throw error;
      // Atualiza sessão local se for o próprio usuário
      if(session && user.id===session.id) session.username = newName;
      m.remove();
      await reloadState(); render();
    }catch(err){
      errEl.textContent = err.message||'Erro ao salvar nome';
      errEl.classList.remove('hidden');
      btn.disabled=false; btn.textContent='Salvar';
    }
  };
}

/* ================================================================
   HOMEBROKER — visão PMO executiva de integração (McKinsey style)
   ================================================================ */
function renderHomebroker(){
  if(!canAdmin()) return el('<div></div>');
  const today = new Date(); today.setHours(0,0,0,0);
  const data = aggregate();
  if(!view.hbWatchlist) view.hbWatchlist = [];
  if(!view.hotlistOpen) view.hotlistOpen = {};

  // ── Deal status helper ──────────────────────────────────────────
  function dealStatus(d){
    const pct = d.total > 0 ? d.late/d.total*100 : 0;
    if(pct > 30) return { label:'Crítico',  color:'#dc2626', dot:'#dc2626' };
    if(pct > 15) return { label:'Em Risco', color:'#d97706', dot:'#d97706' };
    return               { label:'On Track',color:'#16a34a', dot:'#16a34a' };
  }

  // ── WATCHLIST ───────────────────────────────────────────────────
  const watchDeals     = view.hbWatchlist.map(id=>data.find(d=>d.company.id===id)).filter(Boolean);
  const availableToAdd = data.filter(d=>!view.hbWatchlist.includes(d.company.id));
  const watchCardsHtml = watchDeals.map(d=>{
    const st = dealStatus(d);
    const latePct = d.total>0 ? Math.round(d.late/d.total*100) : 0;
    return '<div style="border:1.5px solid '+st.dot+';border-radius:.75rem;padding:.65rem .85rem;min-width:180px;max-width:220px;position:relative;background:#fff">'
      +'<button class="hb-watch-remove" data-remove-watch="'+d.company.id+'" style="position:absolute;top:.3rem;right:.4rem;background:none;border:none;cursor:pointer;color:var(--bhub-muted);font-size:.9rem;line-height:1;padding:.1rem" title="Remover">\xd7</button>'
      +'<div style="display:flex;align-items:center;gap:.45rem;margin-bottom:.35rem">'
      +'<span style="display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:'+st.dot+';flex-shrink:0"></span>'
      +'<span style="font-size:.82rem;font-weight:700;color:var(--bhub-navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px">'+escapeHtml(d.company.name)+'</span>'
      +'</div>'
      +'<div style="font-size:.72rem;color:var(--bhub-muted)">'+d.total+' tarefas \xb7 '+latePct+'% atrasadas</div>'
      +'<div style="font-size:.72rem;font-weight:700;color:'+st.color+';margin-top:.2rem">'+st.label+'</div>'
      +'</div>';
  }).join('');
  const addSelectHtml = availableToAdd.length
    ? '<div style="min-width:200px"><select id="hbAddWatch" style="width:100%;padding:.45rem .6rem;border:1.5px dashed var(--bhub-border);border-radius:.75rem;font-size:.78rem;color:var(--bhub-muted);background:#fafaf8">'
      +'<option value="">+ Adicionar empresa...</option>'
      +availableToAdd.map(d=>'<option value="'+escapeHtml(d.company.id)+'">'+escapeHtml(d.company.name)+'</option>').join('')
      +'</select></div>' : '';

  // ── TIMELINE ───────────────────────────────────────────────────
  const allDates = [];
  data.forEach(d=>{
    if(d.company.signDate) allDates.push(new Date(d.company.signDate));
    d.tasks.forEach(t=>{ if(t._f?.dataPrevista) allDates.push(t._f.dataPrevista); });
  });
  let tlMin, tlMax;
  if(allDates.length){
    tlMin = new Date(Math.min(...allDates.map(d=>d.getTime())));
    tlMax = new Date(Math.max(...allDates.map(d=>d.getTime())));
  } else {
    tlMin = new Date(today); tlMin.setMonth(tlMin.getMonth()-6);
    tlMax = new Date(today); tlMax.setMonth(tlMax.getMonth()+6);
  }
  tlMin = new Date(tlMin.getFullYear(), tlMin.getMonth()-1, 1);
  tlMax = new Date(tlMax.getFullYear(), tlMax.getMonth()+2, 1);
  const tlMs  = tlMax - tlMin;
  const tlPct = d => Math.max(0, Math.min(100, (d-tlMin)/tlMs*100));

  const months = [];
  let mCur = new Date(tlMin);
  while(mCur < tlMax){ months.push(new Date(mCur)); mCur = new Date(mCur.getFullYear(), mCur.getMonth()+1, 1); }
  // Step adaptativo para não sobrecarregar labels
  const totalMonths = months.length;
  const labelStep = totalMonths <= 12 ? 1 : totalMonths <= 24 ? 2 : totalMonths <= 36 ? 3 : 6;
  const monthLabels = months.filter((_,i)=>i%labelStep===0).map(m=>{
    const p = tlPct(m);
    const lb = m.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});
    return '<div style="position:absolute;left:'+p+'%;transform:translateX(-50%);font-size:.6rem;color:var(--bhub-muted);white-space:nowrap">'+lb+'</div>';
  }).join('');
  // Grid lines a cada labelStep meses (mesmo step dos labels)
  const monthLines = months.filter((_,i)=>i%labelStep===0).map(m=>'<div style="position:absolute;left:'+tlPct(m)+'%;top:0;bottom:0;border-left:1px solid #e6e3d9;pointer-events:none"></div>').join('');
  const todayPct = tlPct(today);

  const ganttRows = data.map((d,i)=>{
    const tds = d.tasks.map(t=>t._f?.dataPrevista).filter(Boolean);
    const dStart = d.company.signDate ? new Date(d.company.signDate) : (tds.length ? new Date(Math.min(...tds.map(x=>x.getTime()))) : null);
    const dEnd   = tds.length ? new Date(Math.max(...tds.map(x=>x.getTime()))) : null;
    if(!dStart || !dEnd) return '';
    const st = dealStatus(d);
    const bL = tlPct(dStart), bR = tlPct(dEnd), bW = Math.max(0.5, bR-bL);
    const lbl = d.done+'/'+d.total+' \xb7 '+st.label;
    const rowBg = i%2===0 ? '#fff' : '#f8fafb';
    return '<div style="display:flex;align-items:center;height:36px;border-bottom:1px solid #e5e7eb;background:'+rowBg+'">'
      +'<div style="width:140px;flex-shrink:0;font-size:.72rem;font-weight:600;color:var(--bhub-navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:.5rem;padding-left:.3rem;border-left:3px solid '+st.dot+'" title="'+escapeHtml(d.company.name)+'">'+escapeHtml(d.company.name)+'</div>'
      +'<div style="flex:1;position:relative;height:22px">'
      +'<div style="position:absolute;left:'+bL+'%;width:'+bW+'%;height:100%;background:'+st.dot+';border-radius:3px;display:flex;align-items:center;padding:0 .35rem;overflow:hidden">'
      +'<span style="font-size:.62rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+lbl+'</span>'
      +'</div>'
      +'<div style="position:absolute;left:'+tlPct(dEnd)+'%;top:-2px;font-size:.6rem;transform:translateX(-50%);color:#0F1727;pointer-events:none;line-height:1">▼</div>'
      +'</div>'
      +'</div>';
  }).join('');

  // ── HOT LIST ───────────────────────────────────────────────────
  const lateTasks = [];
  data.forEach(d=>d.tasks.forEach(t=>{
    if(t._f.status!=='late') return;
    const dias = t._f.dataPrevista ? businessDaysBetween(t._f.dataPrevista, today) : null;
    lateTasks.push({cid:d.company.id, deal:d.company.name, owner:t.owner||'—', task:t.task||'', due:t._f.dataPrevista, val:dias});
  }));
  lateTasks.sort((a,b)=>(b.val||0)-(a.val||0));

  const openRaidItems = state.raid.filter(r=>r.status!=='closed').map(r=>{
    const dealName = (r.dealIds||[]).map(id=>state.companies.find(c=>c.id===id)?.name||'').filter(Boolean).join(', ')||'—';
    const daysLeft = r.dueDate ? Math.round((new Date(r.dueDate)-today)/(1000*60*60*24)) : null;
    return {cid:(r.dealIds||[])[0]||'', deal:dealName, owner:r.owner||'—', task:r.title||'(sem t\xedtulo)', due:r.dueDate||'', val:daysLeft};
  });

  function tasksDueInRange(minDays, maxDays){
    const out = [];
    const dMin = new Date(today); dMin.setDate(dMin.getDate()+minDays);
    const dMax = new Date(today); dMax.setDate(dMax.getDate()+maxDays);
    data.forEach(d=>d.tasks.forEach(t=>{
      if(!t._f.dataPrevista || t._f.status==='done' || t._f.status==='late') return;
      const due = new Date(t._f.dataPrevista);
      if(due>dMin && due<=dMax){
        const dL = Math.round((due-today)/(1000*60*60*24));
        out.push({cid:d.company.id, deal:d.company.name, owner:t.owner||'—', task:t.task||'', due:t._f.dataPrevista, val:dL});
      }
    }));
    out.sort((a,b)=>a.val-b.val);
    return out;
  }
  const bucket15 = tasksDueInRange(0,15);
  const bucket30 = tasksDueInRange(15,30);
  const bucket45 = tasksDueInRange(30,45);
  const bucket60 = tasksDueInRange(45,60);

  function hotRow(t, idx){
    const ds = t.val!=null ? t.val+'d' : '—';
    const daysColor = t.val!=null && t.val > 30 ? '#7c2d12' : '#a01923';
    const rowBg = idx%2===0 ? '#fff' : '#f8fafb';
    const due = t.due ? fmtDate(t.due) : '—';
    return '<div class="hot-row" style="display:flex;align-items:center;gap:.45rem;padding:.3rem .7rem;border-bottom:1px solid #f3f4f6;background:'+rowBg+';min-width:0">'
      +'<span class="deal-link" data-summary="'+escapeHtml(t.cid)+'" style="font-size:.62rem;font-weight:700;color:#5b21b6;background:#ede9fe;border-radius:9999px;padding:.05rem .4rem;cursor:pointer;white-space:nowrap;flex-shrink:0">'+escapeHtml(t.deal)+'</span>'
      +'<span style="font-size:.72rem;color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0" title="'+escapeHtml(t.task)+'">'+escapeHtml(t.task)+'</span>'
      +'<span style="font-size:.68rem;color:#9ca3af;white-space:nowrap;flex-shrink:0" title="'+escapeHtml(t.owner||'')+'">'+escapeHtml(t.owner||'—')+'</span>'
      +'<span style="font-size:.65rem;color:#d1d5db;flex-shrink:0">·</span>'
      +'<span style="font-size:.68rem;color:#9ca3af;white-space:nowrap;flex-shrink:0">'+due+'</span>'
      +'<span style="font-size:.72rem;font-weight:800;color:'+daysColor+';white-space:nowrap;flex-shrink:0;min-width:2rem;text-align:right">'+ds+'</span>'
      +'</div>';
  }
  function hotSection(key, icon, label, items, badgeColor){
    const isOpen = !!view.hotlistOpen[key];
    const count  = items.length;
    const hdrBg  = isOpen ? '#fafaf8' : '#fff';
    const chevron = isOpen ? '180' : '0';
    const rows = items.slice(0,100).map((t,i)=>hotRow(t,i)).join('');
    const more = items.length>100 ? '<div style="padding:.3rem .85rem;font-size:.65rem;color:var(--bhub-muted);text-align:center">+ '+(items.length-100)+' mais…</div>' : '';
    const body = count>0 ? '<div>'+rows+more+'</div>' : '';
    return '<div>'
      +'<div class="hb-hot-hdr" data-hot-key="'+key+'" style="display:flex;align-items:center;justify-content:space-between;padding:.6rem .85rem;cursor:pointer;border-bottom:1px solid #f3f4f6;background:'+hdrBg+';user-select:none">'
      +'<div style="font-size:.8rem;font-weight:600;color:var(--bhub-navy)">'+icon+' '+label+'</div>'
      +'<div style="display:flex;align-items:center;gap:.5rem">'
      +'<span style="background:'+badgeColor+';color:#fff;font-size:.65rem;font-weight:700;border-radius:9999px;padding:.1rem .5rem;min-width:1.6rem;text-align:center">'+count+'</span>'
      +'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="transition:transform .15s;transform:rotate('+chevron+'deg)"><polyline points="6 9 12 15 18 9"/></svg>'
      +'</div></div>'
      +(isOpen ? body : '')
      +'</div>';
  }

  // ── BUILD HTML ─────────────────────────────────────────────────
  const html =
    '<div class="space-y-5">'
    // Header
    +'<div class="page-header">'
    +'<div><h1>PMO \xb7 Cockpit</h1><p class="subtitle">Vis\xe3o exclusiva de administradores \xb7 Dados em tempo real</p></div>'
    +'<span style="background:#0171E4;color:#fff;font-size:.7rem;font-weight:700;border-radius:.35rem;padding:.2rem .6rem;letter-spacing:.05em">ADMIN</span>'
    +'</div>'
    // Watchlist
    +'<section class="bhub-card overflow-hidden">'
    +'<div style="padding:.65rem 1rem;background:var(--bhub-beige-soft);border-bottom:1px solid var(--bhub-border);display:flex;align-items:center;gap:.5rem">'
    +'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'
    +'<span style="font-size:.82rem;font-weight:700;color:var(--bhub-navy)">Watchlist</span>'
    +'</div>'
    +'<div style="padding:.75rem 1rem"><div style="display:flex;flex-wrap:wrap;gap:.65rem;align-items:flex-start">'
    +watchCardsHtml+addSelectHtml
    +'</div></div></section>'
    // Timeline
    +'<section class="bhub-card overflow-hidden">'
    +'<div style="padding:.65rem 1rem;background:var(--bhub-beige-soft);border-bottom:1px solid var(--bhub-border);display:flex;align-items:center;gap:.5rem">'
    +'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'
    +'<span style="font-size:.82rem;font-weight:700;color:var(--bhub-navy)">Timeline — Cronograma</span>'
    +'</div>'
    +'<div style="padding:.75rem 1rem;overflow-x:auto"><div style="min-width:700px">'
    +'<div style="display:flex;height:22px;margin-bottom:.3rem"><div style="width:140px;flex-shrink:0"></div>'
    +'<div style="flex:1;position:relative">'+monthLabels+'</div></div>'
    +'<div style="position:relative">'
    +'<div style="position:absolute;left:140px;right:0;top:0;bottom:0;pointer-events:none">'+monthLines
    +'<div style="position:absolute;left:'+todayPct+'%;top:0;bottom:0;border-left:2px dashed #ef4444;z-index:2"></div>'
    +'</div>'
    +ganttRows
    +'</div>'
    +'<div style="display:flex;flex-wrap:wrap;gap:.9rem;margin-top:.5rem;padding-left:140px">'
    +'<span style="font-size:.63rem;display:flex;align-items:center;gap:.3rem"><span style="width:10px;height:8px;background:#16a34a;border-radius:2px;display:inline-block"></span>On Track ≤15%</span>'
    +'<span style="font-size:.63rem;display:flex;align-items:center;gap:.3rem"><span style="width:10px;height:8px;background:#d97706;border-radius:2px;display:inline-block"></span>Em Risco 15-30%</span>'
    +'<span style="font-size:.63rem;display:flex;align-items:center;gap:.3rem"><span style="width:10px;height:8px;background:#dc2626;border-radius:2px;display:inline-block"></span>Cr\xedtico >30%</span>'
    +'<span style="font-size:.63rem;display:flex;align-items:center;gap:.3rem"><span style="display:inline-block;width:1px;height:12px;border-left:2px dashed #ef4444"></span>Hoje</span>'
    +'<span style="font-size:.63rem">▼ Prevista</span>'
    +'</div>'
    +'</div></div></section>'
    // Hot List
    +'<section class="bhub-card overflow-hidden">'
    +'<div style="padding:.65rem 1rem;background:var(--bhub-beige-soft);border-bottom:1px solid var(--bhub-border);display:flex;align-items:center;gap:.5rem">'
    +'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 01-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/></svg>'
    +'<span style="font-size:.82rem;font-weight:700;color:var(--bhub-navy)">Hot List — Vencimentos &amp; Atrasos</span>'
    +'</div>'
    +hotSection('late','🔴','Tarefas Atrasadas',lateTasks,'#dc2626')
    +hotSection('raid','🔔','A\xe7\xf5es de Mitiga\xe7\xe3o em aberto',openRaidItems,'#7c3aed')
    +hotSection('b15','⚡','Tarefas vencendo em 15 dias',bucket15,'#f59e0b')
    +hotSection('b30','📅','Tarefas vencendo em 30 dias',bucket30,'#2563eb')
    +hotSection('b45','📅','Tarefas vencendo em 45 dias',bucket45,'#0891b2')
    +hotSection('b60','📅','Tarefas vencendo em 60 dias',bucket60,'#059669')
    +'</section>'
    +'</div>';

  const node = el(html);

  // Event: add to watchlist
  const addSel = node.querySelector('#hbAddWatch');
  if(addSel) addSel.addEventListener('change',()=>{
    const id = addSel.value;
    if(id && !view.hbWatchlist.includes(id)){ view.hbWatchlist=[...view.hbWatchlist,id]; render(); }
  });
  // Event: remove from watchlist
  node.querySelectorAll('[data-remove-watch]').forEach(btn=>{
    btn.addEventListener('click',()=>{ view.hbWatchlist=view.hbWatchlist.filter(x=>x!==btn.dataset.removeWatch); render(); });
  });
  // Event: accordion toggle
  node.querySelectorAll('.hb-hot-hdr').forEach(h=>{
    h.addEventListener('click',()=>{ view.hotlistOpen[h.dataset.hotKey]=!view.hotlistOpen[h.dataset.hotKey]; render(); });
  });
  // Event: deal links
  node.querySelectorAll('[data-summary]').forEach(b=>{
    b.addEventListener('click',e=>{ e.stopPropagation(); view.tab='deal'; view.dealId=b.dataset.summary; render(); });
  });
  return node;
}

/* ================================================================
   HOJE — visão pessoal de ação ("What should I do today?")
   ================================================================ */
function renderHoje(){
  const PAGE = 10;
  const today = new Date(); today.setHours(0,0,0,0);

  // Tokens que identificam "eu"
  const meTokens = new Set(
    [session.username||'', session.email||'', (session.email||'').split('@')[0]]
      .map(s=>s.trim().toLowerCase()).filter(Boolean)
  );
  const isMe = (owner) => {
    const o = (owner||'').trim().toLowerCase();
    if(!o) return false;
    if(meTokens.has(o)) return true;
    for(const tok of meTokens){
      if(tok && (o.includes(tok) || tok.includes(o))) return true;
    }
    return false;
  };

  // Coleta todas as tarefas/RAID de todos os deals
  const allTasks = [];
  for(const c of state.companies){
    const deal = state.deals[c.id];
    if(!deal) continue;
    for(const t of (deal.tasks||[])) allTasks.push({...t, _f:computeTaskFields(t,c), _deal:c});
  }
  const allRaid = state.raid.map(r => {
    const firstDealId = r.dealIds[0];
    const _deal = firstDealId ? state.companies.find(c=>c.id===firstDealId)||null : null;
    return {...r, _deal};
  });

  // ---- Listas base (sem filtro de deal/pessoa) ----
  const myLate = allTasks
    .filter(t => t._f.status==='late')
    .sort((a,b) => (b._f.diasAtraso||0) - (a._f.diasAtraso||0));

  const decisions = allRaid
    .filter(r => r.decisaoDesc && r.status==='open')
    .sort((a,b) => (b.severity==='high'?2:b.severity==='med'?1:0) - (a.severity==='high'?2:a.severity==='med'?1:0));

  const myUpcoming = allTasks
    .filter(t => {
      if(t._f.status!=='ontrack' || !t._f.dataPrevista) return false;
      const diff = businessDaysBetween(today, t._f.dataPrevista);
      return diff>=0 && diff<=10;
    })
    .map(t => ({...t, _diff: businessDaysBetween(today, t._f.dataPrevista)}))
    .sort((a,b) => a._diff - b._diff);

  // Todos os owners únicos (para o filtro de pessoa)
  const allOwners = [...new Set(allTasks.map(t=>t.owner).filter(Boolean))].sort();

  // Deals únicos que aparecem em qualquer seção (para o filtro)
  const dealsInView = new Map();
  [...myLate, ...myUpcoming].forEach(t => dealsInView.set(t._deal.id, t._deal.name));
  decisions.forEach(r => dealsInView.set(r._deal.id, r._deal.name));
  const dealList = [...dealsInView.entries()].sort((a,b)=>a[1].localeCompare(b[1]));

  // Estado local: filtro de deal + filtro de pessoa + limites de paginação por seção
  let filterDeal = '';
  let filterOwner = '';
  const limits = { late: PAGE, dec: PAGE, up: PAGE };

  const hour = new Date().getHours();
  const greet = hour<12?'Bom dia':hour<18?'Boa tarde':'Boa noite';
  const firstName = (session.username||'').split(' ')[0];

  // ---- Funções de row ----
  function taskRow(t){
    const dias = t._f.diasAtraso||0;
    const hasPendingDel = (state.deletionRequests||[]).some(r=>r.task_id===t.id);
    return `<div class="hoje-row" data-task-id="${t.id}" data-company-id="${t._deal.id}" title="Clique para editar">
      <div class="hoje-row-left">
        <div class="hoje-row-task" title="${escapeHtml(t.task)}">${escapeHtml(t.task)}${hasPendingDel?` <span title="Exclusão aguardando aprovação do admin" style="display:inline-block;font-size:.65rem;padding:.1rem .35rem;border-radius:.75rem;background:#fef3c7;color:#92400e;border:1px solid #fde68a;font-weight:600;white-space:nowrap">⏳ Excl. pendente</span>`:''}</div>
        <div class="hoje-row-meta">
          <span>${escapeHtml(t._deal.name)}</span><span class="sep">·</span>
          <span>${escapeHtml(t.area||'—')}</span>
          ${t.ref?`<span class="sep">·</span><span>${escapeHtml(t.ref)}</span>`:''}
        </div>
      </div>
      <div class="hoje-row-right"><span class="hoje-urgency late">${dias===1?'1 d.u. de atraso':`${dias} d.u. de atraso`}</span></div>
    </div>`;
  }
  function decisionRow(r){
    const sev = r.severity==='high'?'Alta':r.severity==='med'?'Média':'Baixa';
    // data-raid-id → navega para Ações de Mitigação e abre o modal de edição
    return `<div class="hoje-row" data-raid-id="${r.id}" style="cursor:pointer">
      <div class="hoje-row-left">
        <div class="hoje-row-task" title="${escapeHtml(r.title)}">${escapeHtml(r.title)}</div>
        <div class="hoje-row-meta">
          <span>${escapeHtml(r._deal?.name||'')}</span><span class="sep">·</span>
          <span>${escapeHtml(r.area||'—')}</span>
          ${r.owner?`<span class="sep">·</span><span>Resp: ${escapeHtml(r.owner)}</span>`:''}
        </div>
      </div>
      <div class="hoje-row-right"><span class="hoje-urgency decision">Prioridade ${sev}</span></div>
    </div>`;
  }
  function upcomingRow(t){
    const d = t._diff;
    const hasPendingDelUp = (state.deletionRequests||[]).some(r=>r.task_id===t.id);
    return `<div class="hoje-row" data-task-id="${t.id}" data-company-id="${t._deal.id}" title="Clique para editar">
      <div class="hoje-row-left">
        <div class="hoje-row-task" title="${escapeHtml(t.task)}">${escapeHtml(t.task)}${hasPendingDelUp?` <span title="Exclusão aguardando aprovação do admin" style="display:inline-block;font-size:.65rem;padding:.1rem .35rem;border-radius:.75rem;background:#fef3c7;color:#92400e;border:1px solid #fde68a;font-weight:600;white-space:nowrap">⏳ Excl. pendente</span>`:''}</div>
        <div class="hoje-row-meta">
          <span>${escapeHtml(t._deal.name)}</span><span class="sep">·</span>
          <span>${escapeHtml(t.area||'—')}</span>
          ${t.ref?`<span class="sep">·</span><span>${escapeHtml(t.ref)}</span>`:''}
        </div>
      </div>
      <div class="hoje-row-right"><span class="hoje-urgency soon">${d===0?'Vence hoje':d===1?'Vence amanhã':`${d} d.u.`}</span></div>
    </div>`;
  }

  // ---- Aplica filtros de deal e pessoa a uma lista ----
  function applyFilters(items, skipOwner){
    let v = filterDeal ? items.filter(x=>x._deal.id===filterDeal) : items;
    if(!skipOwner){
      if(filterOwner==='__me__') v = v.filter(x=>isMe(x.owner));
      else if(filterOwner) v = v.filter(x=>x.owner===filterOwner);
    }
    return v;
  }

  // ---- Renderiza uma seção (lista filtrada + paginação) ----
  function renderSec(containerId, badgeId, limitKey, items, rowFn, emptyMsg, skipOwner){
    const visible = applyFilters(items, skipOwner);
    const limit = limits[limitKey];
    const slice = visible.slice(0, limit);
    const rest = visible.length - slice.length;

    const container = node.querySelector('#'+containerId);
    const badge = node.querySelector('#'+badgeId);
    if(badge) badge.textContent = visible.length;

    container.innerHTML = visible.length===0
      ? `<div class="hoje-empty">${emptyMsg}</div>`
      : slice.map(rowFn).join('') + (rest>0
          ? `<div class="hoje-load-more" id="more-${limitKey}">Ver mais ${rest} item${rest!==1?'s':''} →</div>`
          : '');

    // Tarefas: abre modal de edição direto
    container.querySelectorAll('[data-task-id]').forEach(row=>{
      row.addEventListener('click',()=>{
        const company = state.companies.find(c=>c.id===row.dataset.companyId);
        if(company) openTaskModal(company, row.dataset.taskId);
      });
    });
    // Ações de Mitigação (Decisões): navega para o subtab Ações de Mitigação do deal e abre o modal
    container.querySelectorAll('[data-raid-id]').forEach(row=>{
      row.addEventListener('click',()=>{
        const raidId = row.dataset.raidId;
        const raidItem = decisions.find(x=>x.id===raidId);
        if(raidItem && raidItem._deal){
          // Abre o deal correto já na aba Ações de Mitigação
          view.tab='deal';
          view.dealId=raidItem._deal.id;
          view.dealTab='raid';
        } else {
          // Fallback: página global de Ações de Mitigação
          view.tab='raid';
        }
        render();
        setTimeout(()=>openRaidModal(raidItem?._deal||null, raidId), 50);
      });
    });
    const moreBtn = container.querySelector('#more-'+limitKey);
    if(moreBtn) moreBtn.addEventListener('click',()=>{
      limits[limitKey] += PAGE;
      renderSec(containerId, badgeId, limitKey, items, rowFn, emptyMsg);
    });
  }

  // ---- Atualiza total + todas as seções ----
  function refresh(){
    const totLate = applyFilters(myLate).length;
    const totDec  = applyFilters(decisions, true).length; // decisões: sem filtro de pessoa
    const totUp   = applyFilters(myUpcoming).length;
    const total   = totLate + totDec + totUp;
    const totalEl = node.querySelector('#hoje-total');
    const ownerLabel = filterOwner==='__me__' ? ` (${[...meTokens][0]||'eu'})` : filterOwner ? ` (${filterOwner})` : '';
    if(totalEl) totalEl.innerHTML = total===0
      ? 'Nenhuma ação pendente. Tudo em dia!'
      : `<strong>${total}</strong> item${total!==1?'s':''}${ownerLabel} que precisam de atenção.`;

    renderSec('sec-late', 'badge-late', 'late', myLate, taskRow, 'Nenhuma tarefa atrasada. ✓');
    renderSec('sec-dec', 'badge-dec', 'dec', decisions, decisionRow, 'Nenhuma decisão aberta no portfólio.', true);
    renderSec('sec-up', 'badge-up', 'up', myUpcoming, upcomingRow, 'Nenhuma tarefa vence nos próximos 10 dias úteis.');
  }

  const totalActions = myLate.length + decisions.length + myUpcoming.length;

  const node = el(`
    <div class="py-2">
      <div class="hoje-greeting">
        <h1>${greet}, ${escapeHtml(firstName)} 👋</h1>
        <p id="hoje-total">${totalActions===0
          ? 'Nenhuma ação pendente no momento. Tudo em dia!'
          : `Você tem <strong>${totalActions}</strong> item${totalActions!==1?'s':''} que precisam de atenção.`
        }</p>
        <p style="font-size:.72rem;color:var(--bhub-muted);margin-top:.3rem">
          Buscando por owner: <strong>${[...meTokens].join(' · ')}</strong>
        </p>
      </div>

      <div class="hoje-filter-bar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--bhub-muted);flex-shrink:0"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        <span style="font-size:.78rem;color:var(--bhub-muted);font-weight:600;white-space:nowrap">Deal:</span>
        <select id="dealFilter" style="min-width:160px">
          <option value="">Todos os deals${dealList.length>0?` (${dealList.length})`:''}</option>
          ${dealList.map(([id,name])=>`<option value="${id}">${escapeHtml(name)}</option>`).join('')}
        </select>
        <span style="font-size:.78rem;color:var(--bhub-muted);font-weight:600;white-space:nowrap;margin-left:.25rem">Pessoa:</span>
        <select id="ownerFilter" style="min-width:160px">
          <option value="">Todo mundo</option>
          <option value="__me__">⭐ Meu nome (${escapeHtml([...meTokens][0]||'eu')})</option>
          ${allOwners.filter(o=>!isMe(o)).map(o=>`<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}
        </select>
      </div>

      <!-- Seção 1: Tarefas atrasadas -->
      <div class="hoje-section">
        <div class="hoje-section-header">
          <div class="h-icon" style="background:#fde0e3;color:#a01923">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <span class="h-title">Tarefas críticas (atrasadas)</span>
          <span id="badge-late" class="h-badge" style="background:#fde0e3;color:#a01923">${myLate.length}</span>
        </div>
        <div id="sec-late"></div>
      </div>

      <!-- Seção 2: Decisões pendentes -->
      <div class="hoje-section">
        <div class="hoje-section-header">
          <div class="h-icon" style="background:#ede9fe;color:#5b21b6">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <span class="h-title">Decisões pendentes</span>
          <span id="badge-dec" class="h-badge" style="background:#ede9fe;color:#5b21b6">${decisions.length}</span>
        </div>
        <div id="sec-dec"></div>
      </div>

      <!-- Seção 3: Próximos a vencer -->
      <div class="hoje-section">
        <div class="hoje-section-header">
          <div class="h-icon" style="background:#fef3c7;color:#92400e">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <span class="h-title">Próximos a vencer (≤ 10 dias úteis)</span>
          <span id="badge-up" class="h-badge" style="background:#fef3c7;color:#92400e">${myUpcoming.length}</span>
        </div>
        <div id="sec-up"></div>
      </div>

      ${session?.role==='admin' ? `
      <!-- Seção admin: Novas tarefas aguardando aprovação -->
      <div class="hoje-section" id="sec-newtasks-wrap" style="${Object.values(state.deals).flatMap(d=>d.tasks||[]).filter(t=>t.pendingApproval).length===0?'display:none':''}">
        <div class="hoje-section-header">
          <div class="h-icon" style="background:#dbeafe;color:#1e40af">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
          <span class="h-title">Novas tarefas aguardando aprovação</span>
          <span id="badge-newtasks" class="h-badge" style="background:#dbeafe;color:#1e40af">${Object.values(state.deals).flatMap(d=>d.tasks||[]).filter(t=>t.pendingApproval).length}</span>
        </div>
        <div id="sec-newtasks"></div>
      </div>
      <!-- Seção admin: Template tasks pendentes -->
      <div class="hoje-section" id="sec-tpltasks-wrap" style="${state.template.filter(t=>t.pendingApproval).length===0?'display:none':''}">
        <div class="hoje-section-header">
          <div class="h-icon" style="background:#dcfce7;color:#166534">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>
          </div>
          <span class="h-title">Tarefas de template aguardando aprovação</span>
          <span id="badge-tpltasks" class="h-badge" style="background:#dcfce7;color:#166534">${state.template.filter(t=>t.pendingApproval).length}</span>
        </div>
        <div id="sec-tpltasks"></div>
      </div>
      <!-- Seção admin: Solicitações de exclusão pendentes -->
      <div class="hoje-section" id="sec-delreqs-wrap" style="${(state.deletionRequests||[]).length===0?'display:none':''}">
        <div class="hoje-section-header">
          <div class="h-icon" style="background:#dcfce7;color:#166534">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </div>
          <span class="h-title">Exclusões pendentes de aprovação</span>
          <span id="badge-delreqs" class="h-badge" style="background:#dcfce7;color:#166534">${(state.deletionRequests||[]).length}</span>
        </div>
        <div id="sec-delreqs"></div>
      </div>` : ''}
    </div>
  `);

  // Wiring: filtro de deal
  const filterEl = node.querySelector('#dealFilter');
  if(filterEl) filterEl.addEventListener('change', ()=>{
    filterDeal = filterEl.value;
    limits.late = PAGE; limits.dec = PAGE; limits.up = PAGE;
    refresh();
  });

  // Wiring: filtro de pessoa
  const ownerFilterEl = node.querySelector('#ownerFilter');
  if(ownerFilterEl) ownerFilterEl.addEventListener('change', ()=>{
    filterOwner = ownerFilterEl.value;
    limits.late = PAGE; limits.dec = PAGE; limits.up = PAGE;
    refresh();
  });

  // Render inicial das seções
  refresh();

  // ---- Seção admin: solicitações de exclusão pendentes ----
  if(session?.role==='admin'){
    const secNewTasks = node.querySelector('#sec-newtasks');
    if(secNewTasks) renderNewTasksSection();

    function renderNewTasksSection(){
      const pending = Object.entries(state.deals).flatMap(([cid, d])=>
        (d.tasks||[]).filter(t=>t.pendingApproval).map(t=>({...t, _companyId: cid, _companyName: state.companies.find(c=>c.id===cid)?.name||'—'}))
      );
      const wrap = node.querySelector('#sec-newtasks-wrap');
      const badge = node.querySelector('#badge-newtasks');
      if(badge) badge.textContent = pending.length;
      if(wrap) wrap.style.display = pending.length===0 ? 'none' : '';
      if(!secNewTasks) return;
      secNewTasks.innerHTML = pending.length===0
        ? `<div class="hoje-empty">Nenhuma tarefa aguardando aprovação.</div>`
        : pending.map(t=>`
          <div class="hoje-row" data-newtask-id="${t.id}" style="align-items:flex-start">
            <div class="hoje-row-left" style="flex:1;min-width:0">
              <div class="hoje-row-task" style="font-weight:600">${t.ref?`<span style="font-family:monospace;font-size:.78rem;background:#f3f4f6;padding:.1rem .3rem;border-radius:.25rem;margin-right:.35rem">${escapeHtml(t.ref)}</span>`:''}${escapeHtml(t.task||'(sem nome)')}</div>
              <div class="hoje-row-meta">
                <span>${escapeHtml(t._companyName)}</span><span class="sep">·</span>
                <span>${escapeHtml(t.area||'—')}</span><span class="sep">·</span>
                <span>Owner: <strong>${escapeHtml(t.owner||'—')}</strong></span>
              </div>
            </div>
            <div class="hoje-row-right" style="gap:.5rem;flex-shrink:0">
              <button class="btn btn-primary" style="font-size:.75rem;padding:.3rem .65rem;background:#16a34a" data-nt-approve="${t.id}" data-nt-cid="${t._companyId}">✓ Aprovar</button>
              <button class="btn btn-secondary" style="font-size:.75rem;padding:.3rem .65rem" data-nt-reject="${t.id}" data-nt-cid="${t._companyId}">✕ Rejeitar</button>
            </div>
          </div>`).join('');

      secNewTasks.querySelectorAll('[data-nt-approve]').forEach(btn=>btn.addEventListener('click', async ()=>{
        const taskId = btn.dataset.ntApprove;
        const cid = btn.dataset.ntCid;
        if(!confirm('Aprovar a criação desta tarefa?')) return;
        try{
          const { error } = await supa.from('tasks').update({pending_approval: false}).eq('id', taskId);
          if(error) throw error;
          const d = state.deals[cid];
          if(d){ const t2 = d.tasks.find(x=>x.id===taskId); if(t2) t2.pendingApproval = false; }
          renderNewTasksSection(); render();
        }catch(err){ alert('Erro: '+(err.message||err)); }
      }));
      secNewTasks.querySelectorAll('[data-nt-reject]').forEach(btn=>btn.addEventListener('click', async ()=>{
        const taskId = btn.dataset.ntReject;
        const cid = btn.dataset.ntCid;
        if(!confirm('Rejeitar e excluir esta tarefa?')) return;
        try{
          const { error } = await supa.from('tasks').delete().eq('id', taskId);
          if(error) throw error;
          const d = state.deals[cid];
          if(d) d.tasks = d.tasks.filter(x=>x.id!==taskId);
          renderNewTasksSection(); render();
        }catch(err){ alert('Erro: '+(err.message||err)); }
      }));
    }

    const secTplTasks = node.querySelector('#sec-tpltasks');
    if(secTplTasks) renderPendingTplSection();

    function renderPendingTplSection(){
      const pending = state.template.filter(t=>t.pendingApproval);
      const wrap = node.querySelector('#sec-tpltasks-wrap');
      const badge = node.querySelector('#badge-tpltasks');
      if(badge) badge.textContent = pending.length;
      if(wrap) wrap.style.display = pending.length===0 ? 'none' : '';
      if(!secTplTasks) return;
      secTplTasks.innerHTML = pending.length===0
        ? `<div class="hoje-empty">Nenhuma tarefa de template aguardando aprovação.</div>`
        : pending.map(t=>`
          <div class="hoje-row">
            <div class="hoje-row-left" style="flex:1;min-width:0">
              <div class="hoje-row-task" style="font-weight:600">${t.ref?`<span style="font-family:monospace;font-size:.78rem;background:#f3f4f6;padding:.1rem .3rem;border-radius:.25rem;margin-right:.35rem">${escapeHtml(t.ref)}</span>`:''}${escapeHtml(t.task||'(sem nome)')}</div>
              <div class="hoje-row-meta">
                <span>Área: <strong>${escapeHtml(t.area||'—')}</strong></span><span class="sep">·</span>
                <span>Owner padrão: <strong>${escapeHtml(t.defaultOwner||'—')}</strong></span><span class="sep">·</span>
                <span>Prazo: ${t.defaultPrazo||0} d.u.</span>
              </div>
            </div>
            <div class="hoje-row-right" style="gap:.5rem;flex-shrink:0">
              <button class="btn btn-primary" style="font-size:.75rem;padding:.3rem .65rem;background:#16a34a" data-tpl-approve="${t.id}">✓ Aprovar</button>
              <button class="btn btn-secondary" style="font-size:.75rem;padding:.3rem .65rem" data-tpl-reject="${t.id}">✕ Rejeitar</button>
            </div>
          </div>`).join('');

      secTplTasks.querySelectorAll('[data-tpl-approve]').forEach(btn=>btn.addEventListener('click', async ()=>{
        const tid = btn.dataset.tplApprove;
        if(!confirm('Aprovar esta tarefa no template?')) return;
        try{
          const { error } = await supa.from('template_tasks').update({pending_approval: false}).eq('id', tid);
          if(error) throw error;
          const tpl = state.template.find(x=>x.id===tid);
          if(tpl) tpl.pendingApproval = false;
          renderPendingTplSection(); render();
        }catch(err){ alert('Erro: '+(err.message||err)); }
      }));
      secTplTasks.querySelectorAll('[data-tpl-reject]').forEach(btn=>btn.addEventListener('click', async ()=>{
        const tid = btn.dataset.tplReject;
        if(!confirm('Rejeitar e excluir esta tarefa do template?')) return;
        try{
          const { error } = await supa.from('template_tasks').delete().eq('id', tid);
          if(error) throw error;
          state.template = state.template.filter(x=>x.id!==tid);
          renderPendingTplSection(); render();
        }catch(err){ alert('Erro: '+(err.message||err)); }
      }));
    }

    const secDelReqs = node.querySelector('#sec-delreqs');
    if(secDelReqs) renderDelReqsSection();

    function renderDelReqsSection(){
      const reqs = state.deletionRequests || [];
      const wrap = node.querySelector('#sec-delreqs-wrap');
      const badge = node.querySelector('#badge-delreqs');
      if(badge) badge.textContent = reqs.length;
      if(wrap) wrap.style.display = reqs.length===0 ? 'none' : '';

      secDelReqs.innerHTML = reqs.length===0
        ? `<div class="hoje-empty">Nenhuma solicitação de exclusão pendente.</div>`
        : reqs.map(r=>`
          <div class="hoje-row" data-delreq-id="${r.id}" style="align-items:flex-start">
            <div class="hoje-row-left" style="flex:1;min-width:0">
              <div class="hoje-row-task" style="font-weight:600">${r.task_ref?`<span style="font-family:monospace;font-size:.78rem;background:#f3f4f6;padding:.1rem .3rem;border-radius:.25rem;margin-right:.35rem">${escapeHtml(r.task_ref)}</span>`:''}${escapeHtml(r.task_name||'(sem nome)')}</div>
              <div class="hoje-row-meta">
                <span>${escapeHtml(r.company_name||'—')}</span><span class="sep">·</span>
                <span>${escapeHtml(r.area||'—')}</span><span class="sep">·</span>
                <span>Solicitado por <strong>${escapeHtml(r.requested_by_name||'?')}</strong></span><span class="sep">·</span>
                <span>${r.requested_at ? fmtDate(new Date(r.requested_at)) : ''}</span>
              </div>
            </div>
            <div class="hoje-row-right" style="gap:.5rem;flex-shrink:0">
              <button class="btn btn-danger" style="font-size:.75rem;padding:.3rem .65rem" data-approve="${r.id}" data-task-id="${r.task_id}" data-company-id="${r.company_id}">✓ Aprovar</button>
              <button class="btn btn-secondary" style="font-size:.75rem;padding:.3rem .65rem" data-reject="${r.id}">✕ Rejeitar</button>
            </div>
          </div>`).join('');

      // Approve handler
      secDelReqs.querySelectorAll('[data-approve]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const reqId = btn.dataset.approve;
          const taskId = btn.dataset.taskId;
          const req = reqs.find(r=>r.id===reqId);
          const ok = await confirmDeleteModal({
            title: 'Confirmar exclusão?',
            ref: req?.task_ref||'',
            description: req?.task_name||'',
            warning: 'Você está aprovando a exclusão desta tarefa. A ação é <strong>irreversível</strong>.'
          });
          if(!ok) return;
          try{
            // delete the task
            const { error: delErr } = await supa.from('tasks').delete().eq('id', taskId);
            if(delErr) throw delErr;
            // mark request as approved
            await supa.from('deletion_requests').update({status:'approved'}).eq('id', reqId);
            // update local state
            state.deletionRequests = state.deletionRequests.filter(r=>r.id!==reqId);
            // remove task from deal state
            const companyId = btn.dataset.companyId;
            if(state.deals[companyId]) state.deals[companyId].tasks = state.deals[companyId].tasks.filter(t=>t.id!==taskId);
            renderDelReqsSection();
          }catch(err){ alert('Erro: '+(err.message||err)); }
        });
      });

      // Reject handler
      secDelReqs.querySelectorAll('[data-reject]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const reqId = btn.dataset.reject;
          if(!confirm('Rejeitar a solicitação de exclusão? A tarefa permanecerá inalterada.')) return;
          try{
            await supa.from('deletion_requests').update({status:'rejected'}).eq('id', reqId);
            state.deletionRequests = state.deletionRequests.filter(r=>r.id!==reqId);
            renderDelReqsSection();
          }catch(err){ alert('Erro: '+(err.message||err)); }
        });
      });
    }
  }

  return node;
}

/* ---------- Import legado localStorage -> Supabase ---------- */
async function importFromLocalStorage(){
  if(!canAdmin()){ alert('Apenas admin pode importar.'); return; }
  const raw = localStorage.getItem(STORE_KEY);
  if(!raw){ alert('Nenhum dado encontrado no localStorage (chave '+STORE_KEY+').'); return; }
  let old;
  try{ old = JSON.parse(raw); }catch{ alert('localStorage corrompido.'); return; }
  const nCompanies = (old.companies||[]).length;
  const nTemplate = (old.template||[]).length;
  if(!confirm(`Importar do localStorage para o Supabase?\n\nEmpresas: ${nCompanies}\nTemplate: ${nTemplate} tarefas\n\nNenhum dado será apagado — apenas inserido.`)) return;

  let okCo=0, okT=0, okR=0, okS=0, okH=0, okTpl=0;
  try{
    // Template
    if((old.template||[]).length){
      const rows = old.template.map((t,i)=>({
        ref: t.ref||'', area: t.area||'', task: t.task||'',
        default_owner: t.defaultOwner||'', default_prazo: parseInt(t.defaultPrazo)||0,
        ordering: i
      }));
      const { error } = await supa.from('template_tasks').insert(rows);
      if(error) throw error;
      okTpl = rows.length;
    }
    // Companies (uma a uma para mapear id->cid e inserir filhos)
    for(const c of (old.companies||[])){
      const { data, error } = await supa.from('companies').insert({ name: c.name, sign_date: emptyDate(c.signDate) }).select().single();
      if(error) throw error;
      const cid = data.id;
      okCo++;
      const deal = old.deals?.[c.id] || {};
      if((deal.tasks||[]).length){
        const rows = deal.tasks.map(t => taskToDb(t, cid));
        const r = await supa.from('tasks').insert(rows);
        if(r.error) throw r.error;
        okT += rows.length;
      }
      if((deal.raid||[]).length){
        const rows = deal.raid.map(x => raidToDb(x, cid));
        const r = await supa.from('raid_items').insert(rows);
        if(r.error) throw r.error;
        okR += rows.length;
      }
      if((deal.synergies||[]).length){
        const rows = deal.synergies.map(x => synToDb(x, cid));
        const r = await supa.from('synergies').insert(rows);
        if(r.error) throw r.error;
        okS += rows.length;
      }
      if((deal.health||[]).length){
        const rows = deal.health.map(x => healthToDb(x, cid));
        const r = await supa.from('health_entries').upsert(rows, { onConflict: 'company_id,area,week_iso' });
        if(r.error) throw r.error;
        okH += rows.length;
      }
    }
    alert(`Importação OK!\n\nEmpresas: ${okCo}\nTarefas: ${okT}\nRAID: ${okR}\nSinergias: ${okS}\nHealth: ${okH}\nTemplate: ${okTpl}`);
    await reloadState();
    render();
  }catch(err){
    alert('Erro durante importação: '+(err.message||err)+'\n\nParcial inserido: empresas='+okCo+', tasks='+okT+', raid='+okR+', syn='+okS+', health='+okH+', tpl='+okTpl);
  }
}

      modals[modals.length-1].remove();
      e.preventDefault();
      e.stopPropagation();
    }
  }
  // Ctrl+K (ou Cmd+K) foca a busca de empresas
  if((e.ctrlKey||e.metaKey) && (e.key === 'k' || e.key === 'K')){
    const inp = document.getElementById('dealSearch');
    if(inp){ inp.focus(); inp.select(); e.preventDefault(); }
  }
  // [ recolhe / expande a sidebar
  if(e.key === '[' && !['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName) && !e.ctrlKey && !e.metaKey){
    view.sidebarCollapsed = !view.sidebarCollapsed;
    render();
  }
});
