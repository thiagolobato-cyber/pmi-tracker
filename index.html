<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BHub PMI — Acompanhamento de Integração</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --bhub-navy:#0F1727;
    --bhub-navy-700:#1a2438;
    --bhub-blue:#0171E4;
    --bhub-blue-700:#005bb8;
    --bhub-beige:#E1DCCC;
    --bhub-beige-soft:#F4F1E8;
    --bhub-red:#F25461;
    --bhub-red-700:#d83e4b;
    --bhub-green:#16a34a;
    --bhub-text:#0F1727;
    --bhub-muted:#5b6478;
    --bhub-border:#e6e3d9;
  }
  html,body{font-family:'Lato',ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:var(--bhub-text)}
  h1,h2,h3,h4,h5,h6,.font-display{font-family:'Roboto',sans-serif;letter-spacing:-0.01em}
  body{background:#f8f7f2}
  .status-done{background:#dcfce7;color:#0f5e2c;padding:.2rem .85rem}
  .status-ontrack{background:#dde9fa;color:#005bb8;padding:.2rem .85rem}
  .status-late{background:#fde0e3;color:#a01923;padding:.2rem .85rem}
  .status-empty{background:#efece2;color:#6b6755;padding:.2rem .85rem}
  .hm-done{background:var(--bhub-green);color:#fff}
  .hm-ontrack{background:var(--bhub-blue);color:#fff}
  .hm-late{background:var(--bhub-red);color:#fff}
  .hm-empty{background:#efece2;color:#5b5847}
  .deal-link{cursor:pointer;transition:color .15s,text-decoration-color .15s;text-decoration:underline transparent;text-underline-offset:3px}
  .deal-link:hover{color:var(--bhub-blue);text-decoration-color:var(--bhub-blue)}
  .row-clickable{cursor:pointer;transition:background .12s}
  .row-clickable:hover{background:var(--bhub-beige-soft,#f7f3ec)}
  .row-clickable:hover .deal-link{color:var(--bhub-blue)}
  .role-pill{display:inline-flex;align-items:center;gap:.25rem;padding:.15rem .55rem;border-radius:9999px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-family:'Roboto',sans-serif;border:1px solid transparent}
  .role-pill.role-admin{background:#fee2e2;color:#991b1b;border-color:#fecaca}
  .role-pill.role-owner{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}
  .role-pill.role-leitor{background:#f3f4f6;color:#374151;border-color:#e5e7eb}
  /* Indicador global de salvamento */
  #save-indicator{position:fixed;bottom:1rem;right:1rem;background:var(--bhub-navy);color:#fff;padding:.5rem .9rem;border-radius:.75rem;font-size:.75rem;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.25);display:none;align-items:center;gap:.55rem;font-family:'Roboto',sans-serif;font-weight:500}
  #save-indicator.show{display:inline-flex}
  #save-indicator::before{content:'';display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:#fbbf24;animation:savep 1.1s infinite}
  @keyframes savep{0%,100%{opacity:.35}50%{opacity:1}}
  /* Skeleton loading */
  .skel{background:linear-gradient(90deg,#f3f4f6 0%,#e5e7eb 50%,#f3f4f6 100%);background-size:200% 100%;animation:skelp 1.4s linear infinite;border-radius:.5rem;display:inline-block}
  @keyframes skelp{0%{background-position:200% 0}100%{background-position:-200% 0}}
  /* Responsive */
  @media (max-width: 768px){
    .max-w-screen-2xl{max-width:100% !important}
    .bhub-header > div{flex-wrap:wrap !important;gap:.5rem !important;padding:.5rem 0.75rem !important}
    .bhub-header nav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap}
    .bhub-header .flex-1{order:4;width:100%;padding:0 !important}
    .tab{padding:.6rem .7rem !important;font-size:.75rem !important}
    .kpi{padding:.7rem .8rem}
    .kpi-value{font-size:1.25rem}
    h1.text-xl{font-size:1.05rem}
    table{font-size:.7rem}
    th,td{padding:.4rem .45rem !important}
  }
  .header-search{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:.625rem;padding:.45rem .8rem;font-size:.85rem;color:#fff;font-family:inherit;width:100%;transition:all .2s}
  .header-search::placeholder{color:rgba(255,255,255,.6)}
  .header-search:focus{outline:none;background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45);box-shadow:0 0 0 3px rgba(255,255,255,.1)}
  .search-result-item{display:flex;align-items:center;justify-content:space-between;padding:.55rem .75rem;cursor:pointer;border-bottom:1px solid var(--bhub-border);transition:background .12s}
  .search-result-item:last-child{border-bottom:none}
  .search-result-item:hover{background:#f3f6fb}
  input[type=text],input[type=email],input[type=number],input[type=date],input[type=password],select,textarea{
    border:1px solid var(--bhub-border);border-radius:.625rem;padding:.45rem .7rem;font-size:.875rem;width:100%;background:#fff;
    font-family:inherit;color:var(--bhub-text);transition:border-color .2s,box-shadow .2s
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--bhub-blue);box-shadow:0 0 0 3px rgba(1,113,228,.15)}
  .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .95rem;border-radius:.625rem;font-size:.875rem;font-weight:600;
    cursor:pointer;border:1px solid transparent;font-family:'Roboto',sans-serif;transition:all .2s;letter-spacing:.01em}
  .btn-primary{background:var(--bhub-blue);color:#fff;box-shadow:0 2px 6px rgba(1,113,228,.25)}
  .btn-primary:hover{background:var(--bhub-blue-700);box-shadow:0 4px 12px rgba(1,113,228,.35);transform:translateY(-1px)}
  .btn-secondary{background:#fff;color:var(--bhub-navy);border-color:var(--bhub-border)}
  .btn-secondary:hover{background:var(--bhub-beige-soft);border-color:var(--bhub-beige)}
  .btn-danger{background:var(--bhub-red);color:#fff}
  .btn-danger:hover{background:var(--bhub-red-700)}
  .tab{padding:.85rem 1.1rem;border-bottom:3px solid transparent;cursor:pointer;font-size:.875rem;font-weight:600;
    color:#cbd2dd;font-family:'Roboto',sans-serif;transition:color .2s,border-color .2s}
  .tab:hover{color:#fff}
  .tab.active{border-color:var(--bhub-blue);color:#fff}
  table{border-collapse:collapse}
  th,td{border:1px solid var(--bhub-border);padding:.55rem .65rem;font-size:.8rem;vertical-align:top}
  th{background:var(--bhub-beige-soft);text-align:left;font-weight:600;color:var(--bhub-navy);
    font-family:'Roboto',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:.7rem}
  .pill{display:inline-block;padding:.15rem .65rem;border-radius:9999px;font-size:.7rem;font-weight:700;letter-spacing:.02em}
  .scroll-x{overflow-x:auto}
  .sticky-col{position:sticky;left:0;z-index:2;background:#fff}
  .hb-hot-hdr:hover{background:#f5f3ff!important}
  .dt-row{cursor:pointer;transition:background .12s}
  .dt-row:hover{background:#f5f3ff!important}
  .dt-row:hover td:first-child{box-shadow:inset 3px 0 0 #5b21b6}
  .tt-wrap{position:relative;display:inline-block;cursor:default}
  .tt-wrap .tt-box{display:none;position:absolute;bottom:calc(100% + 5px);left:0;background:#0f172a;color:#fff;font-size:.68rem;padding:.3rem .55rem;border-radius:.4rem;white-space:nowrap;z-index:50;pointer-events:none}
  .tt-wrap .tt-box::after{content:'';position:absolute;top:100%;left:10px;border:4px solid transparent;border-top-color:#0f172a}
  .tt-wrap:hover .tt-box{display:block}
  thead .sticky-col{background:var(--bhub-beige-soft);z-index:3}
  .sticky-col-2{position:sticky;left:2.25rem;z-index:2;background:#fff}
  thead .sticky-col-2{background:var(--bhub-beige-soft);z-index:3}
  .exec-area-header td{background:var(--bhub-beige-soft);font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--bhub-navy);padding:.45rem .75rem;border-top:2px solid var(--bhub-border)}
  .kpi{background:#fff;border:1px solid var(--bhub-border);border-radius:1.25rem;padding:1.1rem 1.2rem;transition:transform .2s,box-shadow .2s}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,23,39,.08)}
  .kpi-label{font-size:.7rem;color:var(--bhub-muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-family:'Roboto',sans-serif}
  .kpi-value{font-size:1.75rem;font-weight:700;color:var(--bhub-navy);margin-top:.3rem;font-family:'Roboto',sans-serif;line-height:1.1}
  .bhub-card{background:#fff;border:1px solid var(--bhub-border);border-radius:1.25rem;overflow:hidden}
  .bhub-card-header{background:var(--bhub-beige-soft);border-bottom:1px solid var(--bhub-border);padding:.7rem 1.1rem;font-weight:600;font-size:.9rem;color:var(--bhub-navy);font-family:'Roboto',sans-serif}
  .bhub-header{background:var(--bhub-navy);color:#fff;border-bottom:1px solid #1a2438}
  .bhub-brand{font-family:'Roboto',sans-serif;font-weight:700;letter-spacing:-.02em}
  .bhub-brand .dot{color:var(--bhub-blue)}
  .bhub-logo{display:inline-block;vertical-align:middle}
  .bhub-logo svg{display:block;height:100%;width:auto}
  a{color:var(--bhub-blue)}
  /* Sub-tabs dentro do deal */
  .subtabs{display:flex;gap:.25rem;border-bottom:1px solid var(--bhub-border);margin-bottom:1rem;overflow-x:auto}
  .subtab{padding:.6rem 1rem;font-size:.85rem;font-weight:600;color:var(--bhub-muted);font-family:'Roboto',sans-serif;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;background:transparent;border-radius:0}
  .subtab:hover{color:var(--bhub-navy);background:transparent}
  .subtab.active{color:var(--bhub-navy);border-bottom-color:var(--bhub-blue);background:transparent}
  /* RAG */
  .rag{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .55rem;border-radius:.5rem;font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;border:1px solid transparent}
  .rag-g{background:#dcfce7;color:#166534;border-color:#bbf7d0}
  .rag-a{background:#fef3c7;color:#92400e;border-color:#fde68a}
  .rag-r{background:#fee2e2;color:#991b1b;border-color:#fecaca}
  .rag-na{background:#f3f4f6;color:#6b7280;border-color:#e5e7eb}
  /* Glifo (acessibilidade colour-blind): G=✓ A=⚠ R=✕ NA=— */
  .rag-dot{display:inline-flex;align-items:center;justify-content:center;width:.95rem;height:.95rem;line-height:1;font-size:.7rem;font-weight:700;background:transparent}
  .rag-g .rag-dot::before{content:'\2713'} /* ✓ */
  .rag-a .rag-dot::before{content:'\26A0'} /* ⚠ */
  .rag-r .rag-dot::before{content:'\2715'} /* ✕ */
  .rag-na .rag-dot::before{content:'\2013'} /* – */
  /* Severity */
  .sev-high{background:#fee2e2;color:#991b1b}
  .sev-med{background:#fef3c7;color:#92400e}
  .sev-low{background:#dbeafe;color:#1e40af}
  /* RAID acronym tooltip */
  .raid-tip{display:inline-flex;align-items:center;gap:.25rem;cursor:help;position:relative}
  .raid-tip-icon{width:13px;height:13px;border-radius:50%;background:rgba(1,113,228,.15);color:var(--bhub-blue);font-size:.6rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0}
  .raid-tip:hover .raid-tip-box{display:block}
  .raid-tip-box{display:none;position:absolute;top:calc(100% + 6px);left:0;transform:none;background:#1e2d45;color:#fff;border-radius:.5rem;padding:.6rem .8rem;font-size:.72rem;line-height:1.6;white-space:normal;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.3);pointer-events:none;min-width:260px;max-width:300px}
  .raid-tip-box::after{content:'';position:absolute;bottom:100%;left:16px;transform:none;border:5px solid transparent;border-bottom-color:#1e2d45}
  .raid-tip-box b{color:#60a5fa}

  /* RAID type chips */
  .raid-risk{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
  .raid-issue{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
  .raid-decision{background:#ede9fe;color:#5b21b6;border:1px solid #ddd6fe}
  .raid-assumption{background:#e0f2fe;color:#075985;border:1px solid #bae6fd}
  /* Phase badge */
  .phase{display:inline-block;padding:.15rem .5rem;border-radius:9999px;font-size:.65rem;font-weight:700;font-family:'Roboto',sans-serif;letter-spacing:.04em;background:var(--bhub-beige-soft);color:var(--bhub-navy);border:1px solid var(--bhub-border)}
  /* Gantt de Integração por Blocos */
  .gantt-cell{padding:.42rem .35rem;text-align:center;border:1px solid #e5e7eb;white-space:nowrap}
  .gantt-cell .gantt-dot{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:middle;flex-shrink:0}
  .gantt-cell .gantt-lbl{font-size:.65rem;margin-left:3px;vertical-align:middle;font-weight:500}
  .gantt-done {background:#bbf7d0;border-left:3px solid #16a34a}
  .gantt-track{background:#fef08a;border-left:3px solid #ca8a04}
  .gantt-late {background:#fecaca;border-left:3px solid #dc2626}
  .gantt-plan {background:#f1f5f9;color:#94a3b8;border-left:3px solid #cbd5e1}
  .gantt-empty{background:#fafafa;color:#d1d5db;font-size:.65rem}
  .today-gantt{background:#e0e7ff !important}
  .gantt-done.today-gantt {background:#86efac !important;border-left-color:#15803d !important}
  .gantt-track.today-gantt{background:#fde047 !important;border-left-color:#a16207 !important}
  .gantt-late.today-gantt {background:#fca5a5 !important;border-left-color:#b91c1c !important}
  /* Gantt popover */
  .gantt-popover{position:fixed;z-index:9999;background:white;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.18);padding:.85rem;min-width:230px;max-width:340px;font-size:.72rem;line-height:1.4}
  .gantt-popover-title{font-weight:700;color:var(--bhub-navy);margin-bottom:.5rem;padding-bottom:.4rem;border-bottom:1px solid #f1f5f9;font-size:.78rem}
  .gantt-cell[data-gn]{cursor:pointer;transition:filter .12s}
  .gantt-cell[data-gn]:hover{filter:brightness(.91)}
  /* Briefing print */
  @media print{
    .no-print{display:none !important}
    body{background:#fff}
    .bhub-card{box-shadow:none !important;border:1px solid #ddd !important}
    .briefing-page{padding:0 !important}
  }
  .briefing-page{max-width:900px;margin:0 auto}
  /* Mini stats row */
  .mini-stat{padding:.5rem .75rem;border-radius:.6rem;background:#fff;border:1px solid var(--bhub-border)}
  .mini-stat .lbl{font-size:.65rem;color:var(--bhub-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-family:'Roboto',sans-serif}
  .mini-stat .val{font-size:1.1rem;font-weight:700;font-family:'Roboto',sans-serif;color:var(--bhub-navy)}
  /* ============================================================ */
  /* NEW SHELL LAYOUT (Phase 1) — sidebar + topbar moderno         */
  /* ============================================================ */
  .app-shell{display:flex;min-height:100vh}
  .sidebar{
    width:240px;flex:0 0 240px;
    background:var(--bhub-navy);color:#fff;
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
    border-right:1px solid #1a2438;z-index:10;
  }
  .sidebar-brand{padding:1.35rem 1.25rem 1.1rem;display:flex;align-items:center;gap:.625rem}
  .sidebar-brand .logo-text{font-family:'Roboto',sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:-.02em;color:#fff}
  .sidebar-brand .logo-text .blue{color:var(--bhub-blue)}
  .sidebar-nav{flex:1;padding:.4rem .625rem;overflow-y:auto;display:flex;flex-direction:column;gap:.15rem}
  .sidebar-item{
    display:flex;align-items:center;gap:.7rem;
    padding:.625rem .75rem;border-radius:.5rem;
    font-family:'Roboto',sans-serif;font-weight:500;font-size:.875rem;
    color:rgba(255,255,255,.65);
    cursor:pointer;transition:all .15s;
    border:none;background:transparent;width:100%;text-align:left;
  }
  .sidebar-item:hover{background:rgba(255,255,255,.05);color:#fff}
  .sidebar-item.active{background:rgba(255,255,255,.08);color:#fff}
  .sidebar-item .icon{width:1.125rem;height:1.125rem;flex-shrink:0;opacity:.95}
  .sidebar-item .icon svg{width:100%;height:100%;display:block}
  .sidebar-footer{padding:.625rem;border-top:1px solid rgba(255,255,255,.08)}
  .sidebar-user{display:flex;align-items:center;gap:.625rem;padding:.5rem .5rem}
  .sidebar-user .avatar{
    width:2.25rem;height:2.25rem;border-radius:50%;
    background:linear-gradient(135deg,var(--bhub-blue) 0%,#005bb8 100%);
    color:#fff;display:grid;place-items:center;
    font-weight:700;font-size:.8rem;font-family:'Roboto',sans-serif;flex-shrink:0;
  }
  .sidebar-user .info{flex:1;min-width:0;line-height:1.2}
  .sidebar-user .info .name{font-size:.825rem;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sidebar-user .info .role{font-size:.7rem;color:rgba(255,255,255,.55);text-transform:capitalize;font-weight:500}

  /* Sidebar group labels */
  .sidebar-group-label{font-size:.62rem;font-weight:700;letter-spacing:.09em;color:rgba(255,255,255,.3);text-transform:uppercase;padding:.8rem .875rem .2rem;user-select:none}

  /* Sidebar collapse button (bottom of nav) */
  .sidebar-collapse-btn{display:flex;align-items:center;justify-content:center;width:2rem;height:2rem;margin:auto auto .2rem auto;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.3);border-radius:.375rem;transition:color .15s,background .15s;flex-shrink:0}
  .sidebar-collapse-btn:hover{color:rgba(255,255,255,.7);background:rgba(255,255,255,.05)}

  /* Collapsible sidebar state */
  .sidebar{transition:width .22s ease,flex-basis .22s ease}
  .sidebar.collapsed{width:56px;flex:0 0 56px}
  .sidebar.collapsed .sidebar-brand{justify-content:center;padding:1.35rem .5rem 1.1rem}
  .sidebar.collapsed .sidebar-brand .logo-text{display:none}
  .sidebar.collapsed .sidebar-group-label{display:none}
  .sidebar.collapsed .sidebar-item{justify-content:center;padding:.625rem}
  .sidebar.collapsed .sidebar-item .sidebar-label{display:none}
  .sidebar.collapsed .sidebar-user{justify-content:center}
  .sidebar.collapsed .sidebar-user .info{display:none}
  .hot-row{transition:background .1s}
  .hot-row:hover{background:#eff6ff !important}
  .g-tip{display:inline-block;cursor:default;}
  #g-tooltip{position:fixed;background:#1e293b;color:#fff;font-size:.72rem;font-weight:500;padding:.35rem .65rem;border-radius:.4rem;white-space:nowrap;pointer-events:none;z-index:99999;box-shadow:0 4px 12px rgba(0,0,0,.25);display:none;letter-spacing:.01em;}

  /* Avatar dropdown */
  .sidebar-footer{position:relative}
  .sidebar-user-btn{display:block;width:100%;background:none;border:none;cursor:pointer;border-radius:.5rem;transition:background .15s;padding:0}
  .sidebar-user-btn:hover{background:rgba(255,255,255,.05)}
  .sidebar-avatar-menu{position:absolute;bottom:100%;left:.625rem;right:.625rem;margin-bottom:.375rem;background:#1e2d45;border:1px solid rgba(255,255,255,.12);border-radius:.625rem;overflow:hidden;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4)}

      atraso = diasAtraso;
    } else {
      status = 'ontrack';
      atraso = businessDaysBetween(today, dataPrevista);

/* ---------- Indicador global "salvando…" ---------- */
let _savingOps = 0;
function _bumpSaving(delta){
  _savingOps = Math.max(0, _savingOps + delta);
  const ind = document.getElementById('save-indicator');
  if(!ind) return;
  if(_savingOps > 0) ind.classList.add('show');
  else ind.classList.remove('show');
}
// Instrumenta supa.from() para detectar inserts/updates/deletes/upserts automaticamente
(function instrumentSupa(){
  const origFrom = supa.from.bind(supa);
  supa.from = function(...args){
    const builder = origFrom(...args);
    ['insert','update','delete','upsert'].forEach(method=>{
      const orig = builder[method];
      if(typeof orig !== 'function') return;
      builder[method] = function(...mArgs){
        _bumpSaving(+1);
        const ret = orig.apply(builder, mArgs);
        if(ret && typeof ret.then === 'function'){
          const origThen = ret.then.bind(ret);
          ret.then = function(...thenArgs){
            return origThen(...thenArgs).finally(()=>_bumpSaving(-1));
          };
        }else{
          _bumpSaving(-1);
        }
        return ret;
      };
    });
    return builder;
  };
})();

/* ---------- Sub-area helper ---------- */
// Garante que (area, name) existe na tabela sub_areas.
// Usa on conflict do nothing — idempotente, seguro chamar múltiplas vezes.
// Só admin chama; atualiza state.subAreas localmente para refletir imediatamente.
async function ensureSubArea(area, name){
  if(!area || !name) return;
  const already = state.subAreas.some(s => s.area === area && s.name === name);
  if(already) return;
  const { error } = await supa.from('sub_areas').insert({ area, name }).select().maybeSingle();
  // on conflict do nothing retorna null data sem erro — tratamos os dois casos
  if(error && error.code !== '23505') console.warn('ensureSubArea error', error);
  // Atualiza estado local independente do resultado (pode já existir no BD)
  if(!state.subAreas.some(s => s.area === area && s.name === name)){
    state.subAreas.push({ area, name });
    state.subAreas.sort((a,b) => a.area.localeCompare(b.area,'pt') || a.name.localeCompare(b.name,'pt'));
  }
}

/* ---------- Auth ---------- */
// applySession: converte um objeto session do Supabase no shape interno do app,
// fazendo o fetch do perfil. Nao depende de supa.auth.getSession() — evita o
// deadlock conhecido do lock interno do supabase-js quando getSession e' chamado
// concorrentemente com signInWithPassword + onAuthStateChange.
async function applySession(sess){
  if(!sess || !sess.user){ session = null; return; }
  let profile = null;
  try {
    const { data, error } = await supa.from('profiles').select('id,username,role,workspace').eq('id', sess.user.id).maybeSingle();
    if (error) console.warn('profile load error', error);
    profile = data;
  } catch(e){ console.warn('profile fetch threw', e); }
  const profileWs = profile?.workspace || 'pmi';
  const isAdminRole = (profile?.role || 'leitor') === 'admin';
  // Verifica acesso ao workspace — admin sempre passa; outros só se tiverem permissão
  if(!isAdminRole && profileWs !== 'ambos' && profileWs !== WS){
    session = null;
    _wsAccessDenied = true;
    return;
  }
  _wsAccessDenied = false;
  session = {
    id: sess.user.id,
    email: sess.user.email,
    username: profile?.username || (sess.user.email||'').split('@')[0],
    role: profile?.role || 'leitor',
    workspace: profileWs   // 'pmi' | 'tech' | 'ambos'
  };
}
// Le a sessao crua do localStorage (sync). Esta e' a fonte de verdade do
// supabase-js v2 — ele guarda em sb-<projectref>-auth-token. Se nao houver,
// retorna null. Se houver mas estiver expirado, retorna null tambem.
function readStoredSession(){
  try {
    const projectRef = (SUPABASE_URL.match(/https?:\/\/([a-z0-9]+)\./i) || [])[1];
    if(!projectRef) return null;
    const raw = localStorage.getItem(`sb-${projectRef}-auth-token`);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    // O shape pode ser { currentSession, expiresAt } (v1) ou { access_token, refresh_token, user, expires_at } (v2 flat).
    const sess = parsed.currentSession || parsed;
    if(!sess || !sess.user || !sess.access_token) return null;
    // Checa expiracao basica
    if(sess.expires_at && Date.now()/1000 > sess.expires_at + 60) return null;
    return sess;
  } catch(e){
    console.warn('[readStoredSession] parse falhou', e);
    return null;
  }
}
async function login(email, password){
  const { data, error } = await supa.auth.signInWithPassword({ email: String(email||'').trim(), password });
  if(error) return error.message || 'Falha no login';
  // Usa direto a session retornada — NAO chama loadSession/getSession (evita deadlock).
  await applySession(data?.session || null);
  if(!session) return 'Sessão não pôde ser carregada';
  await reloadState();
  return null;
}
async function logout(){
  stopRealtime();
  // Limpa estado e renderiza ANTES de esperar a rede — usuário sai visualmente imediato
  session = null;

  view = { tab: 'dashboard', dealId:null, dealTab:'tarefas', executiveArea:DEFAULT_AREAS[0]?.name||'', raidFilter:'all', raidPortfolioFilter:'all', raidDealFilter:[], synergyFilter:'all', dashFilters:{deals:[],areas:[],owners:[]}, empresasSearch:'', empresasSortCol:'date', empresasSortDir:'desc', sidebarCollapsed:false, executivaDealSearch:'', execPdfDeals:null, triggersCardOpen:true };
  render();
  // signOut com timeout de 3s para não travar
  try { await Promise.race([supa.auth.signOut({scope:'global'}), new Promise(r=>setTimeout(r,3000))]); } catch(e){}
}
// loadSession: usado SO no boot. Le do storage (sync, nunca trava) e aplica.
// Se o token estiver corrompido/expirado, limpa e segue como sem sessao.
async function loadSession(){
  const sess = readStoredSession();
  if(!sess){
    // Nao ha token valido — garante storage limpo pra evitar refresh em loop.
    try {
      Object.keys(localStorage).filter(k => k.startsWith('sb-')).forEach(k => localStorage.removeItem(k));
      Object.keys(sessionStorage).filter(k => k.startsWith('sb-')).forEach(k => sessionStorage.removeItem(k));
    } catch(_) {}
    session = null;
    return;
  }
  await applySession(sess);
}

const getLideradosAll = () => {
  if(!session) return [];
  const all = state.users || [];
  const result = [];
  const visited = new Set();
  function collect(managerName){
    const directs = all.filter(u => u.managerUsername === managerName);
    for(const u of directs){
      if(visited.has(u.username)) continue; // evita loop infinito em caso de ciclo
      visited.add(u.username);
      result.push(u);
      if(u.username) collect(u.username);
    }
  }
  collect(session.username);
  return result;
};

  }
  const allUsers = (state && state.users) ? state.users : [];
  // Em Tech, mostrar apenas usuários com workspace='tech' ou 'ambos'
  const users = isTech
    ? allUsers.filter(u => u.workspace === 'tech' || u.workspace === 'ambos')
    : allUsers;
  if(!users.length){
    return `<select name="owner" disabled title="Cadastre usuários em Usuários antes de atribuir responsáveis">
      <option value="">⚠ Nenhum usuário cadastrado</option>
    </select>
    <div class="text-xs mt-1" style="color:#b45309">Acesse <strong>Usuários</strong> e crie um perfil antes de atribuir esta tarefa.</div>`;
  }
  // Se o owner atual não está na lista de usuários, adiciona como opção extra
  // (evita aparecer em branco quando ainda não tem conta criada)
  const matchedInList = users.some(u => (u.username||'').trim() === (currentOwner||'').trim());
  const extraOpt = (currentOwner && !matchedInList)
    ? `<option value="${escapeHtml(currentOwner)}" selected>${escapeHtml(currentOwner)}</option>`
    : '';
  const opts = users.map(u=>{
    const sel = (u.username||'').trim() === (currentOwner||'').trim() ? 'selected' : '';
    return `<option value="${escapeHtml(u.username)}" ${sel}>${escapeHtml(u.username)}</option>`;
  }).join('');
  return `<select name="owner">
    <option value="" ${!currentOwner?'selected':''}>— Responsável —</option>
    ${extraOpt}
    ${opts}
  </select>`;
}

/* ---------- Helpers: ordenação por REF e por área ---------- */
// Ordena tasks pelo número do REF (ex: "1.9" < "1.10" < "2.1")
function sortByRef(a, b){
  const parse = r => { const p = String(r||'0.0').split('.'); return [parseInt(p[0])||0, parseInt(p[1])||0]; };
  const [a0,a1] = parse(a.ref), [b0,b1] = parse(b.ref);
  return a0 !== b0 ? a0 - b0 : a1 - b1;
}
// Ordena nomes de área pela ordem canônica de DEFAULT_AREAS; áreas desconhecidas vão ao fim
function sortAreaNames(names){
  return [...names].sort((a,b)=>{
    const ia = DEFAULT_AREAS.findIndex(x=>x.name===a);
    const ib = DEFAULT_AREAS.findIndex(x=>x.name===b);
    const ra = ia===-1 ? 999 : ia;
    const rb = ib===-1 ? 999 : ib;
    return ra !== rb ? ra - rb : a.localeCompare(b, 'pt');
  });
}

/* ---------- Reload state from Supabase ---------- */
// Helper: pagina automaticamente em chunks de 1000 (limite default do PostgREST).
// Recebe uma funcao que cria um NOVO builder a cada chamada (o builder e' "consumido"
// quando awaited, entao nao da' pra reusar o mesmo).
async function fetchAll(makeBuilder){
  const PAGE = 1000;
  let out = [];
  for(let from = 0; ; from += PAGE){
    const { data, error } = await makeBuilder().range(from, from + PAGE - 1);
    if(error) return { data: null, error };
    out = out.concat(data || []);
    if(!data || data.length < PAGE) break;
  }
  return { data: out, error: null };
}
async function reloadState(){
  if(!session){ state = defaultState(); return; }
  const [profiles, companies, template, tasks, raid, raidLinks, syn, health, delReqs, subAreasRes, weekMeetings, meetItems] = await Promise.all([
    supa.from('profiles').select('id,username,role,manager_username,workspace').order('username',{nullsFirst:false}),
    supa.from('companies').select('*').eq('workspace', WS).order('name'),
    fetchAll(() => supa.from('template_tasks').select('*').order('ordering').order('ref')),
    fetchAll(() => supa.from('tasks').select('*')),
    fetchAll(() => supa.from('raid_items').select('*')),
    supa.from('raid_deal_links').select('*'),
    fetchAll(() => supa.from('synergies').select('*')),
    fetchAll(() => supa.from('health_entries').select('*')),
    session.role === 'admin'
      ? supa.from('deletion_requests').select('*').eq('status','pending')
      : supa.from('deletion_requests').select('*').eq('status','pending').eq('requested_by_id', session.id),
    supa.from('sub_areas').select('area,name').order('area').order('name'),
    supa.from('weekly_meetings').select('*').eq('workspace', WS).order('week_date', {ascending:false}),
    supa.from('meeting_items').select('*').order('created_at'),
  ]);
  const errs = [profiles, companies, template, tasks, raid, syn, health].map(r=>r.error).filter(Boolean);
  if(errs.length){ console.warn('reloadState errors', errs); }

  state = defaultState();
  state.users = (profiles.data||[]).map(p => ({ id: p.id, username: p.username || '(sem nome)', role: p.role || 'leitor', managerUsername: p.manager_username || null, workspace: p.workspace || 'pmi' }));

  // Build global RAID portfolio with dealIds from links
  const linksByRaid = {};
  for(const l of (raidLinks.data||[])){
    if(!linksByRaid[l.raid_id]) linksByRaid[l.raid_id] = [];
    linksByRaid[l.raid_id].push(l.company_id);
  }
  const wsCompanyIds = new Set(); // filled after state.companies is built below
  state.raid = (raid.data||[]).map(r => {
    const item = raidFromDb(r);
    item.dealIds = linksByRaid[r.id] || (r.company_id ? [r.company_id] : []);
    return item;
  });
  state.deletionRequests = (delReqs.data||[]);
  if(subAreasRes.error) console.warn('[reloadState] sub_areas fetch error:', subAreasRes.error);
  state.subAreas = (subAreasRes.data||[]).map(r => ({ area: r.area, name: r.name }));
  console.log('[reloadState] subAreas loaded:', state.subAreas.length);
  state.weeklyMeetings = (weekMeetings.data||[]);
  state.meetingItems   = (meetItems.data||[]);
  state.companies = (companies.data||[]).map(companyFromDb)
    .sort((a,b)=>{
      // Mais recente primeiro; sem data vai para o final
      if(!a.signDate && !b.signDate) return a.name.localeCompare(b.name);
      if(!a.signDate) return 1;
      if(!b.signDate) return -1;
      return b.signDate.localeCompare(a.signDate);
    });
  state.template = (template.data||[]).map(tplFromDb);
  for(const c of state.companies){
    state.deals[c.id] = { tasks: [], raid: [], synergies: [], health: [] };
    wsCompanyIds.add(c.id);
  }
  // Filter RAID to only items linked to this workspace's companies (or unlinked global items)
  state.raid = state.raid.filter(r => r.dealIds.length === 0 || r.dealIds.some(did => wsCompanyIds.has(did)));
  for(const r of (tasks.data||[])){
    if(!state.deals[r.company_id]) continue; // skip tasks from other workspaces
    state.deals[r.company_id].tasks.push(taskFromDb(r));
  }
  // Populate per-deal raid arrays from global state.raid (filtered by dealIds)
  for(const r of state.raid){
    for(const cid of r.dealIds){
      if(state.deals[cid]) state.deals[cid].raid.push(r);
    }
  }
  for(const r of (syn.data||[])){
    if(!state.deals[r.company_id]) continue;
    state.deals[r.company_id].synergies.push(synFromDb(r));
  }
  for(const r of (health.data||[])){
    if(!state.deals[r.company_id]) continue;
    state.deals[r.company_id].health.push(healthFromDb(r));
  }
}

/* ---------- Deal helpers ---------- */
function dealOf(companyId){
  if(!state.deals[companyId]) state.deals[companyId] = { tasks:[], raid:[], synergies:[], health:[] };
  const d = state.deals[companyId];
  if(!d.raid) d.raid = [];
  if(!d.synergies) d.synergies = [];
  if(!d.health) d.health = [];
  return d;
}
/* fmtBRL, isoWeek, currentIsoWeek e phaseFor importados de js/pure.js */
async function instantiateFromTemplate(companyId){
  const deal = dealOf(companyId);
  if(deal.tasks.length>0) return false;
  if(state.template.length===0) return false;
  const rows = state.template.map(t => ({
    company_id: companyId,
    ref: t.ref || '',
    area: t.area || '',
    bloco: t.bloco || '',
    task: t.task || '',
    owner: t.defaultOwner || '',
    ferramenta: '',
    prazo: parseInt(t.defaultPrazo)||0,
    completado: 0,
    bloqueio: 'Não'
  }));
  const { data, error } = await supa.from('tasks').insert(rows).select();
  if(error){ alert('Erro ao criar tarefas a partir do template: '+error.message); return false; }
  deal.tasks = (data||[]).map(taskFromDb);
  return true;
}

function askImportStrategy(){
  return new Promise((resolve)=>{
    const modal = el(`
      <div class="fixed inset-0 z-50 flex items-center justify-center" style="background:rgba(0,0,0,.5)">
        <div class="bhub-card p-6 w-full max-w-md" style="background:white">
          <h3 class="text-lg font-bold mb-3" style="color:var(--bhub-navy);font-family:'Roboto'">Como importar?</h3>
          <p class="text-sm text-gray-600 mb-4">Escolha o que fazer com tarefas/empresas já existentes:</p>
          <label class="block border rounded p-3 mb-2 cursor-pointer hover:bg-gray-50" style="border-color:var(--bhub-border)">
            <input type="radio" name="strat" value="merge" checked> <b>Mesclar (recomendado)</b>
            <div class="text-xs text-gray-500 mt-1">Atualiza tarefas existentes por REF/nome e adiciona as novas. Não apaga nada.</div>
          </label>
          <label class="block border rounded p-3 mb-2 cursor-pointer hover:bg-gray-50" style="border-color:var(--bhub-border)">
            <input type="radio" name="strat" value="add"> <b>Apenas adicionar novas</b>
            <div class="text-xs text-gray-500 mt-1">Mantém as tarefas existentes intactas e insere só as que não existem.</div>
          </label>
          <label class="block border rounded p-3 mb-3 cursor-pointer hover:bg-gray-50" style="border-color:var(--bhub-border)">
            <input type="radio" name="strat" value="replace"> <b>Substituir tudo (cuidado)</b>
            <div class="text-xs text-gray-500 mt-1">Apaga todas as tarefas das empresas no arquivo antes de importar.</div>
          </label>
          <div class="flex justify-end gap-2 mt-4">
            <button id="cancelImp" class="btn btn-secondary">Cancelar</button>
            <button id="okImp" class="btn btn-primary">Continuar</button>
          </div>
        </div>
      </div>
    `);
    document.body.appendChild(modal);
    modal.querySelector('#cancelImp').onclick = ()=>{ modal.remove(); resolve(null); };
    modal.querySelector('#okImp').onclick = ()=>{
      const v = modal.querySelector('input[name="strat"]:checked').value;
      modal.remove(); resolve(v);
    };
  });
}

async function importXlsx(file){
  if(!canEdit()){ alert('Sem permissão para importar.'); return; }
  const strategy = await askImportStrategy();
  if(!strategy) return;
  const data = await file.arrayBuffer();
  const wb = XLSX.read(data, {cellDates:true});
  let importedCompanies = 0, importedDeals = 0, importedTemplate = 0;
  let updatedTasks = 0, insertedTasks = 0, deletedTasks = 0;

  // Estrutura intermediária: companies em buffer; depois bulk insert
  const buffer = []; // {name, signDate, deal:{tasks:[]}, existingId?}

  function addOrFindBuffered(name, signDateIso){
    const norm = name.trim().toLowerCase();
    let entry = buffer.find(b => b.name.trim().toLowerCase()===norm);
    if(entry) return entry;
    const existing = state.companies.find(c => c.name.trim().toLowerCase()===norm);
    entry = {
      name: name.trim(),
      signDate: signDateIso || (existing?.signDate || ''),
      deal: { tasks: [] },
      existingId: existing?.id || null
    };
    buffer.push(entry);
    return entry;
  }

  // Companies from "Auxiliar - Empresas"
  const aux = wb.Sheets['Auxiliar - Empresas'];
  if(aux){
    const rows = XLSX.utils.sheet_to_json(aux, {header:1, defval:''});
    for(const r of rows){
      const cells = r.map(c => (c===null||c===undefined)?'':c);
      for(let i=0;i<cells.length-2;i++){
        const a = cells[i], b = cells[i+1], c = cells[i+2];
        if(typeof a==='number' && typeof b==='string' && b.trim() && (c instanceof Date || typeof c==='number' || (typeof c==='string' && c.match(/\d/)))){
          const name = b.trim();
          const signDate = parseDate(c);
          addOrFindBuffered(name, signDate ? toIso(signDate) : '');
          break;
        }
      }
    }
  }

  // Helper to parse a "deal sheet" (Template Deal style)
  function parseDealSheet(ws){
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    // Find header row containing "REF #" and "TAREFA"
    let headerIdx = -1, cols = {};
    for(let i=0;i<rows.length;i++){
      const cells = rows[i].map(c => (c===null||c===undefined)?'':String(c));
      const has = (label) => cells.findIndex(c => c.replace(/[\s\n]+/g,' ').trim().toUpperCase().includes(label));
      const refIdx = has('REF #');
      const taskIdx = has('TAREFA');
      if(refIdx>=0 && taskIdx>=0){
        headerIdx = i;
        cells.forEach((c,idx)=>{
          const n = c.replace(/[\s\n]+/g,' ').trim().toUpperCase();
          if(n.includes('REF #')) cols.ref = idx;
          else if(n==='TAREFA') cols.task = idx;
          else if(n==='STATUS') cols.status = idx;
          else if(n.includes('OWNER')) cols.owner = idx;
          else if(n.includes('FERRAMENTA')) cols.ferramenta = idx;
          else if(n.includes('GATILHO')) cols.gatilho = idx;
          else if(n.includes('EMPRESA')) cols.empresa = idx;
          else if(n.includes('PRAZO')) cols.prazo = idx;
          else if(n.includes('DATA REAL')) cols.dataReal = idx;
          else if(n.includes('% COMPLETADO') || n.includes('COMPLETADO')) cols.completado = idx;
          else if(n.includes('EVIDÊNCIA') || n.includes('EVIDENCIA')) cols.evidencia = idx;
          else if(n.includes('ÚLTIMO UPDATE') || n.includes('ULTIMO UPDATE')) cols.update = idx;
          else if(n.includes('PRÓXIMO PASSO') || n.includes('PROXIMO PASSO')) cols.proximo = idx;
          else if(n.includes('BLOQUEIO')) cols.bloqueio = idx;
        });
        break;
      }
    }
    if(headerIdx<0) return {tasks:[], company:null};
    const tasks = [];
    let company = null;
    let currentArea = '';
    for(let i=headerIdx+1;i<rows.length;i++){
      const cells = rows[i].map(c => (c===null||c===undefined)?'':c);
      const ref = String(cells[cols.ref]||'').trim();
      const taskName = String(cells[cols.task]||'').trim();
      if(!ref && !taskName) continue;
      // Area row: ref like "1.0", task name = area name
      if(/^\d+\.0$/.test(ref) && taskName){
        currentArea = taskName;
        if(cols.empresa!=null && cells[cols.empresa] && !company){
          company = String(cells[cols.empresa]).trim();
        }
        continue;
      }
      if(cols.empresa!=null && cells[cols.empresa] && !company){
        company = String(cells[cols.empresa]).trim();
      }
      const t = {
        id: uid(),
        ref,
        area: currentArea,
        task: taskName,
        owner: cols.owner!=null ? String(cells[cols.owner]||'').trim() : '',
        ferramenta: cols.ferramenta!=null ? String(cells[cols.ferramenta]||'').trim() : '',
        prazo: cols.prazo!=null ? (parseInt(cells[cols.prazo])||0) : 0,
        dataRealConclusao: cols.dataReal!=null ? (cells[cols.dataReal] ? toIso(parseDate(cells[cols.dataReal])) : '') : '',
        completado: cols.completado!=null ? (parseFloat(cells[cols.completado])||0) : 0,
        evidencia: cols.evidencia!=null ? String(cells[cols.evidencia]||'').trim() : '',
        ultimoUpdate: cols.update!=null && cells[cols.update] ? toIso(parseDate(cells[cols.update])) : '',
        proximoPasso: cols.proximo!=null ? String(cells[cols.proximo]||'').trim() : '',
        bloqueio: cols.bloqueio!=null ? (String(cells[cols.bloqueio]||'').toLowerCase().startsWith('s')?'Sim':'Não') : 'Não',
        bloqueioDescricao: ''
      };
      if(t.task) tasks.push(t);
    }
    return {tasks, company};
  }

  // Template Deal -> template_tasks
  let templateRows = [];
  const tplWs = wb.Sheets['Template Deal'] || wb.Sheets['Template 1'] || wb.Sheets['Template 2'];
  if(tplWs){
    const {tasks} = parseDealSheet(tplWs);
    if(tasks.length){
      templateRows = tasks.map((t,i) => ({
        ref: t.ref || '',
        area: t.area || '',
        task: t.task || '',
        default_owner: t.owner || '',
        default_prazo: parseInt(t.prazo)||0,
        ordering: i
      }));
      importedTemplate = tasks.length;
    }
  }

  // Deal sheets
  for(const name of wb.SheetNames){
    if(['LEIA-ME','Auxiliar - Empresas','Dashboard','Visão Executiva','Aux_Dashboard','Template Deal','Template 1','Template 2','Integração - Visão Ferramentas'].includes(name)) continue;
    const ws = wb.Sheets[name];
    const {tasks, company} = parseDealSheet(ws);
    if(tasks.length===0) continue;
    const matchName = (company || name).trim();
    const entry = addOrFindBuffered(matchName, '');
    entry.deal.tasks = tasks;
  }

  // Helper: chave de identidade de uma tarefa para merge
  function taskKey(t){
    if(t.ref && String(t.ref).trim()) return 'ref:'+String(t.ref).trim().toLowerCase();
    return 'nm:'+(t.area||'').trim().toLowerCase()+'|'+(t.task||'').trim().toLowerCase();
  }

  // Bulk insert/merge no Supabase
  try{
    if(templateRows.length){
      if(strategy === 'replace'){
        // Wipe template antes
        const { error: delErr } = await supa.from('template_tasks').delete().neq('id', '00000000-0000-0000-0000-000000000000');
        if(delErr) throw delErr;
        const { error } = await supa.from('template_tasks').insert(templateRows);
        if(error) throw error;
      } else {
        // Buscar existentes para merge/add
        const { data: existingTpl, error: e1 } = await supa.from('template_tasks').select('id, ref, area, task');
        if(e1) throw e1;
        const mapTpl = new Map();
        (existingTpl||[]).forEach(r=>{
          const k = r.ref ? 'ref:'+String(r.ref).trim().toLowerCase() : 'nm:'+(r.area||'').trim().toLowerCase()+'|'+(r.task||'').trim().toLowerCase();
          mapTpl.set(k, r.id);
        });
        const toInsert = [], toUpdate = [];
        templateRows.forEach(r=>{
          const k = r.ref ? 'ref:'+String(r.ref).trim().toLowerCase() : 'nm:'+(r.area||'').trim().toLowerCase()+'|'+(r.task||'').trim().toLowerCase();
          const eid = mapTpl.get(k);
          if(eid && strategy === 'merge'){ toUpdate.push({id: eid, ...r}); }
          else if(!eid){ toInsert.push(r); }
          // strategy === 'add' e já existe: pula
        });
        if(toInsert.length){
          const { error } = await supa.from('template_tasks').insert(toInsert);
          if(error) throw error;
        }
        for(const u of toUpdate){
          const { id, ...rest } = u;
          const { error } = await supa.from('template_tasks').update(rest).eq('id', id);
          if(error) throw error;
        }
      }
    }
    for(const b of buffer){
      let cid = b.existingId;
      if(!cid){
        const { data, error } = await supa.from('companies').insert(companyToDb(b)).select().single();
        if(error) throw error;
        cid = data.id;
        importedCompanies++;
      } else if(b.signDate){
        // Atualiza signDate se vier no arquivo e estiver vazio no banco
        const existingC = state.companies.find(c=>c.id===cid);
        if(existingC && !existingC.signDate){
          await supa.from('companies').update({sign_date: emptyDate(b.signDate)}).eq('id', cid);
        }
      }
      if(b.deal.tasks.length){
        if(strategy === 'replace'){
          // Apaga todas tarefas da company antes
          const { count: delCount } = await supa.from('tasks').delete({count:'exact'}).eq('company_id', cid);
          deletedTasks += delCount || 0;
          const rows = b.deal.tasks.map(t => taskToDb(t, cid));
          const { error } = await supa.from('tasks').insert(rows);
          if(error) throw error;
          insertedTasks += rows.length;
          importedDeals++;
        } else {
          // Carregar existentes da company
          const { data: existingTasks, error: e2 } = await supa.from('tasks').select('id, ref, area, task').eq('company_id', cid);
          if(e2) throw e2;
          const map = new Map();
          (existingTasks||[]).forEach(t=>{
            const k = t.ref ? 'ref:'+String(t.ref).trim().toLowerCase() : 'nm:'+(t.area||'').trim().toLowerCase()+'|'+(t.task||'').trim().toLowerCase();
            map.set(k, t.id);
          });
          const toInsert = [], toUpdate = [];
          b.deal.tasks.forEach(t=>{
            const k = taskKey(t);
            const eid = map.get(k);
            const row = taskToDb(t, cid);
            if(eid && strategy === 'merge'){
              // Mesclar: só envia campos não-vazios
              const patch = {};
              Object.entries(row).forEach(([k2, v])=>{
                if(v === '' || v === null || v === undefined || v === 0) return; // mantém valor existente
                if(k2 === 'company_id') return;
                patch[k2] = v;
              });
              toUpdate.push({id: eid, patch});
            } else if(!eid){
              toInsert.push(row);
            }
          });
          if(toInsert.length){
            const { error } = await supa.from('tasks').insert(toInsert);
            if(error) throw error;
            insertedTasks += toInsert.length;
          }
          for(const u of toUpdate){
            if(Object.keys(u.patch).length === 0) continue;
            const { error } = await supa.from('tasks').update(u.patch).eq('id', u.id);
            if(error) throw error;
            updatedTasks++;
          }
          importedDeals++;
        }
      }
    }
  }catch(err){
    alert('Erro durante import: '+(err.message||err));
    return;
  }

  alert(`Import concluído (modo: ${strategy}).\nEmpresas novas: ${importedCompanies}\nDeals processados: ${importedDeals}\nTarefas inseridas: ${insertedTasks}\nTarefas atualizadas: ${updatedTasks}${deletedTasks?'\nTarefas removidas: '+deletedTasks:''}\nTemplate: ${importedTemplate} linhas`);
  await reloadState();
  render();
}

    deal.tasks.forEach(t=>{
      const f = computeTaskFields(t, c);
      rows.push([t.ref, t.area, t.task, statusLabel(f.status), t.owner, t.ferramenta, t.prazo,
        c.signDate?fmtDate(c.signDate):'', f.dataPrevista?fmtDate(f.dataPrevista):'',
        t.dataRealConclusao?fmtDate(t.dataRealConclusao):'',
        t.completado, t.evidencia, f.atraso??'', f.diasReais??'',
        t.ultimoUpdate?fmtDate(t.ultimoUpdate):'', t.proximoPasso,
        t.bloqueio==='Sim' ? `Sim - ${t.bloqueioDescricao||''}` : 'Não']);
    });
    const sheetName = c.name.substring(0,31).replace(/[\\\/\?\*\[\]:]/g,'_');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sheetName);
  });

  XLSX.writeFile(wb, `BHub_PMI_export_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }

function render(){
  const root = document.getElementById('app');
  root.innerHTML = '';
  if(!session){ root.appendChild(renderLogin()); return; }
  root.appendChild(renderShell());
  // Delegação global: clique em nome de empresa/área/owner abre o snapshot correspondente
  root.querySelectorAll('[data-summary]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); openCompanySummary(el.dataset.summary); });
  });
  root.querySelectorAll('[data-area]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); if(el.dataset.area) openAreaSummary(el.dataset.area); });
  });
  root.querySelectorAll('[data-owner]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); if(el.dataset.owner) openOwnerSummary(el.dataset.owner); });
  });
}

              <button type="button" id="toggleLoginPwd" tabindex="-1" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--bhub-muted);line-height:1;padding:.2rem" title="Mostrar/ocultar senha">
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>

    const err = await login(fd.get('u'), fd.get('p'));
    btn.disabled = false; btn.textContent = 'Entrar →';
    if(err){
      const errEl = node.querySelector('#loginErr');
      errEl.textContent = err; errEl.classList.remove('hidden');
    }else render();
  });
  // Toggle mostrar/ocultar senha
  node.querySelector('#toggleLoginPwd').addEventListener('click', ()=>{
    const inp = node.querySelector('#loginPwd');
    const icon = node.querySelector('#eyeIcon');
    const showing = inp.type === 'text';
    inp.type = showing ? 'password' : 'text';
    // Olho aberto vs. riscado
    icon.innerHTML = showing
      ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
      : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
  });

  // Esqueci minha senha — painel inline
  const resetPanel = node.querySelector('#resetPanel');
  const forgotBtn = node.querySelector('#forgotPwd');
  const okEl = node.querySelector('#loginOk');
  const errEl = node.querySelector('#loginErr');

  forgotBtn.addEventListener('click', ()=>{
    // Pré-preenche com e-mail já digitado
    const emailVal = (node.querySelector('input[name="u"]').value||'').trim();
    if(emailVal) node.querySelector('#resetEmail').value = emailVal;
    resetPanel.classList.remove('hidden');
    forgotBtn.classList.add('hidden');
    node.querySelector('#resetEmail').focus();
  });

  node.querySelector('#cancelReset').addEventListener('click', ()=>{
    resetPanel.classList.add('hidden');
    forgotBtn.classList.remove('hidden');
  });

  node.querySelector('#sendReset').addEventListener('click', async ()=>{
    const email = (node.querySelector('#resetEmail').value||'').trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
      errEl.textContent = 'Digite um e-mail válido.';
      errEl.classList.remove('hidden');
      okEl.classList.add('hidden');
      return;
    }
    const sendBtn = node.querySelector('#sendReset');
    sendBtn.disabled = true; sendBtn.textContent = 'Enviando…';
    errEl.classList.add('hidden'); okEl.classList.add('hidden');
    try{
      const { error } = await supa.auth.resetPasswordForEmail(email, {
        redirectTo: location.origin + location.pathname
      });
      if(error) throw error;
      okEl.textContent = `Link enviado para ${email}. Verifique sua caixa de entrada.`;
      okEl.classList.remove('hidden');
      resetPanel.classList.add('hidden');
      forgotBtn.classList.remove('hidden');
    }catch(err){
      const msg = (err.message||'').toLowerCase();
      if(msg.includes('rate limit') || msg.includes('too many')){
        errEl.textContent = 'Muitas tentativas em pouco tempo. Aguarde uma hora e tente novamente.';
      } else {
        errEl.textContent = 'Não foi possível enviar o link. Tente novamente em instantes.';
      }
      errEl.classList.remove('hidden');
    }finally{
      sendBtn.disabled = false; sendBtn.textContent = 'Enviar link →';
    }
  });

  return node;
}

function renderLiderPanel(){
  const allLiderados = getLideradosAll();
  const today = new Date(); today.setHours(0,0,0,0);

  // ── Monta card de uma pessoa ──────────────────────────────────
  function buildCard(u){
    const ownerTasksAll = [];
    state.companies.forEach(c => {
      const deal = state.deals[c.id];
      if(!deal) return;
      (deal.tasks||[]).forEach(t => {
        if((t.owner||'').trim().toLowerCase() === (u.username||'').trim().toLowerCase()){
          ownerTasksAll.push({ ...t, _f: computeTaskFields(t, c), _company: c });
        }
      });
    });
    const open    = ownerTasksAll.filter(t => t._f.status === 'ontrack').length;
    const late    = ownerTasksAll.filter(t => t._f.status === 'late').length;
    const blocked = ownerTasksAll.filter(t => t.bloqueio === 'Sim' && t._f.status !== 'done').length;
    const upcoming = ownerTasksAll
      .filter(t => t._f.status === 'ontrack' && t._f.dataPrevista)
      .sort((a,b) => a._f.dataPrevista - b._f.dataPrevista)[0];
    const initials  = (u.username||'?').slice(0,2).toUpperCase();
    const allLateTasks = ownerTasksAll.filter(t => t._f.status === 'late')
      .sort((a,b) => (b._f.diasAtraso||0) - (a._f.diasAtraso||0)).slice(0,5);
    // Split: com ação de mitigação associada vs sem cobertura
    const lateWithCoverage = allLateTasks.filter(t => t.bloqueio === 'Sim' && t.raidId);
    const lateNoCoverage   = allLateTasks.filter(t => !(t.bloqueio === 'Sim' && t.raidId));
    return `
      <div class="bhub-card" style="padding:0;overflow:hidden">
        <div style="padding:.9rem 1rem;border-bottom:1px solid var(--bhub-border);display:flex;align-items:center;gap:.75rem;background:#f8fafc">
          <div style="width:36px;height:36px;border-radius:50%;background:var(--bhub-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;flex-shrink:0">${initials}</div>
          <div style="font-weight:600;color:var(--bhub-navy);font-size:.95rem">${escapeHtml(u.username)}</div>
          <span class="role-pill role-${u.role}" style="margin-left:auto">${u.role}</span>
        </div>
        <div style="padding:.3rem 1rem;background:#f1f5f9;border-bottom:1px solid var(--bhub-border);display:flex;align-items:center;gap:.35rem">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" style="flex-shrink:0"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <span style="font-size:.67rem;color:#64748b;font-weight:600">tarefas individuais desta pessoa</span>
        </div>
        <div style="padding:.85rem 1rem;display:flex;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--bhub-border)">
          <div style="text-align:center;min-width:60px"><div style="font-size:1.4rem;font-weight:700;color:var(--bhub-navy)">${open}</div><div style="font-size:.7rem;color:var(--bhub-muted)">On track</div></div>
          <div style="text-align:center;min-width:60px"><div style="font-size:1.4rem;font-weight:700;color:${late>0?'#dc2626':'#16a34a'}">${late}</div><div style="font-size:.7rem;color:var(--bhub-muted)">Atrasadas</div></div>
          <div style="text-align:center;min-width:60px"><div style="font-size:1.4rem;font-weight:700;color:${blocked>0?'#d97706':'#6b7280'}">${blocked}</div><div style="font-size:.7rem;color:var(--bhub-muted)">Bloqueadas</div></div>
          <div style="text-align:center;min-width:80px"><div style="font-size:1rem;font-weight:700;color:var(--bhub-navy)">${upcoming ? fmtDate(upcoming._f.dataPrevista) : '—'}</div><div style="font-size:.7rem;color:var(--bhub-muted)">Próximo prazo</div></div>
        </div>
        ${allLateTasks.length ? `
        <div style="padding:.6rem 1rem">
          ${lateWithCoverage.length ? `
            <div style="margin-bottom:.55rem">
              <div style="font-size:.67rem;font-weight:700;color:#d97706;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem">🛡️ Com mitigação (${lateWithCoverage.length})</div>
              ${lateWithCoverage.map(t=>{
                const raid=t.raidId?(state.deals[t._company?.id]?.raid||[]).find(r=>r.id===t.raidId):null;
                return `<div style="display:flex;align-items:flex-start;gap:.5rem;padding:.3rem 0;border-bottom:1px solid #fef3c7;font-size:.78rem" class="lider-task-row" data-deal="${t._company?.id||''}" data-task="${t.id}">
                  <span style="color:#d97706;font-weight:600;min-width:28px;text-align:right;flex-shrink:0">${t._f.diasAtraso||0}d</span>
                  <div style="flex:1;min-width:0">
                    <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(t.task||'')}">${escapeHtml(t.task||'')}</div>
                    ${raid?`<div style="font-size:.67rem;color:#92400e;margin-top:.1rem">⚙️ ${escapeHtml(raid.title||'')}${raid.owner?` · <em>${escapeHtml(raid.owner)}</em>`:''}</div>`:''}
                  </div>
                  <span style="color:var(--bhub-muted);font-size:.7rem;flex-shrink:0">${escapeHtml(t._company?.name||'')}</span>
                </div>`;
              }).join('')}
            </div>` : ''}
          ${lateNoCoverage.length ? `
            <div>
              <div style="font-size:.67rem;font-weight:700;color:#dc2626;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem">🚨 Sem cobertura (${lateNoCoverage.length}) — requer ação</div>
              ${lateNoCoverage.map(t=>`
                <div style="display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-bottom:1px solid #fee2e2;font-size:.78rem" class="lider-task-row" data-deal="${t._company?.id||''}" data-task="${t.id}">
                  <span style="color:#dc2626;font-weight:600;min-width:28px;text-align:right">${t._f.diasAtraso||0}d</span>
                  <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(t.task||'')}">${escapeHtml(t.task||'')}</span>

        </div>` : `<div style="padding:.75rem 1rem;font-size:.78rem;color:#16a34a;display:flex;align-items:center;gap:.4rem"><span>✓</span> Sem tarefas atrasadas</div>`}
      </div>`;
  }

  // ── Agrupa pessoas por gestor imediato, em ordem BFS da hierarquia ──
  const byManager = {};
  for(const u of allLiderados){
    const mgr = u.managerUsername || '__none__';
    if(!byManager[mgr]) byManager[mgr] = [];
    byManager[mgr].push(u);
  }
  const sections = [];
  const queue = [session.username];
  while(queue.length){
    const mgr = queue.shift();
    const members = byManager[mgr];
    if(!members || !members.length) continue;
    const isDirect = mgr === session.username;
    sections.push({ label: isDirect ? 'Liderados diretos' : `Equipe do ${mgr}`, isDirect, members });
    for(const m of members){ if(m.username && byManager[m.username]) queue.push(m.username); }
  }

  const sectionsHtml = sections.length
    ? sections.map(s => `
        <div style="${s.isDirect ? 'background:rgba(59,130,246,.04);border:1.5px solid rgba(59,130,246,.22);border-radius:.75rem;padding:1rem 1.1rem 1.1rem;' : 'padding:.1rem 0'}">
          <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.85rem;${s.isDirect ? 'border-bottom:1.5px solid rgba(59,130,246,.18);padding-bottom:.7rem;' : ''}">
            ${s.isDirect ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="#2563eb" stroke="none"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>` : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>`}
            <span style="font-size:${s.isDirect?'.82rem':'.72rem'};font-weight:${s.isDirect?'800':'600'};text-transform:uppercase;letter-spacing:.07em;color:${s.isDirect?'#1d4ed8':'var(--bhub-muted)'}">${escapeHtml(s.label)}</span>
            <span style="font-size:.7rem;color:${s.isDirect?'#3b82f6':'var(--bhub-muted)'};">(${s.members.length} pessoa${s.members.length!==1?'s':''})</span>
            ${s.isDirect ? `<span style="font-size:.67rem;background:#dbeafe;color:#1e40af;padding:.18rem .55rem;border-radius:9999px;font-weight:700;letter-spacing:.04em;margin-left:.25rem">RESPONSABILIDADE DIRETA</span>` : `<span style="font-size:.68rem;color:#9ca3af;margin-left:.25rem">— cobrar do gestor acima</span>`}
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem">${s.members.map(buildCard).join('')}</div>
        </div>`).join('<div style="margin-top:1.5rem"></div>')
    : '<div class="bhub-card p-6 text-center text-gray-400">Nenhum liderado configurado. Configure em Usuários → Gestor Direto.</div>';

  // ── Deals com envolvimento da equipe ──────────────────────────
  const lideradoNames = new Set(allLiderados.map(u=>(u.username||'').trim().toLowerCase()));
  const teamDeals = state.companies.filter(c => {
    const deal = state.deals[c.id];
    if(!deal) return false;
    return (deal.tasks||[]).some(t => lideradoNames.has((t.owner||'').trim().toLowerCase()));
  });
  const dealsHtml = teamDeals.length ? `
    <div class="bhub-card overflow-hidden" style="margin-top:.5rem">
      <div class="bhub-card-header">Deals com envolvimento da equipe <span class="text-xs font-normal text-gray-500 ml-2">(${teamDeals.length})</span></div>
      <table class="w-full">
        <thead><tr><th>Deal</th><th>Sign Date</th><th>On track</th><th>Atrasadas</th><th>Bloqueadas</th></tr></thead>
        <tbody>
          ${teamDeals.map(c => {
            const deal = state.deals[c.id];
            const ts = (deal?.tasks||[]).filter(t=>lideradoNames.has((t.owner||'').trim().toLowerCase()))
              .map(t=>({...t,_f:computeTaskFields(t,c)}));
            const o = ts.filter(t=>t._f.status==='ontrack').length;
            const l = ts.filter(t=>t._f.status==='late').length;
            const b = ts.filter(t=>t.bloqueio==='Sim'&&t._f.status!=='done').length;
            return `<tr>
              <td><button class="deal-link font-medium" data-open="${c.id}">${escapeHtml(c.name)}</button></td>
              <td class="text-xs">${c.signDate?fmtDate(c.signDate):'—'}</td>
              <td class="text-center">${o}</td>
              <td class="text-center ${l>0?'text-red-600 font-semibold':''}">${l}</td>
              <td class="text-center ${b>0?'text-amber-600 font-semibold':''}">${b}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>` : '';

  const node = el(`
    <div class="space-y-4">
      <div>
        <h1 class="text-xl font-bold">Painel do Líder</h1>
        <p class="text-sm text-gray-500">Visão consolidada de toda a sua equipe (${allLiderados.length} pessoa${allLiderados.length!==1?'s':''} na hierarquia).</p>
      </div>
      <div class="space-y-6">${sectionsHtml}</div>
      ${dealsHtml}
    </div>
  `);

  // Click on lider-task-row → opens deal
  node.querySelectorAll('.lider-task-row[data-deal]').forEach(row=>{
    row.style.cursor='pointer';
    row.addEventListener('click',()=>{
      const cid = row.dataset.deal;
      if(cid){ view.tab='deal'; view.dealId=cid; view.dealTab='tarefas'; view.dealGanttOffset=0; render(); }
    });
  });

  // deal-link buttons
  node.querySelectorAll('.deal-link[data-open]').forEach(btn=>{
    btn.addEventListener('click',()=>{ view.tab='deal'; view.dealId=btn.dataset.open; view.dealTab='tarefas'; render(); });
  });

  return node;
}

function renderTechTarefas(){
  const today = new Date(); today.setHours(0,0,0,0);
  if(!view.techTarefasFilters) view.techTarefasFilters = { dealId:'', owner:'', status:'' };

  // Collect all tasks across all projects
  const allTasks = [];
  state.companies.forEach(c => {
    const deal = state.deals[c.id];
    if(!deal) return;
    (deal.tasks||[]).forEach(t => {
      const f = computeTaskFields(t, c);
      allTasks.push({ ...t, dealId: c.id, dealName: c.name, _f: f });
    });
  });

  // Filter
  const fDeal   = view.techTarefasFilters.dealId;
  const fOwner  = view.techTarefasFilters.owner;
  const fStatus = view.techTarefasFilters.status;
  const filtered = allTasks.filter(t => {
    if(fDeal   && t.dealId      !== fDeal)   return false;
    if(fOwner  && (t.owner||'') !== fOwner)  return false;
    if(fStatus && t._f.status   !== fStatus) return false;
    return true;
  });

  const uniqueDeals  = Array.from(new Set(allTasks.map(t=>t.dealId))).map(id=>({id, name:(allTasks.find(t=>t.dealId===id)||{}).dealName||id})).sort((a,b)=>a.name.localeCompare(b.name));
  const uniqueOwners = Array.from(new Set(allTasks.map(t=>t.owner||'').filter(Boolean))).sort();

  // Group by deal
  const byDeal = {};
  filtered.forEach(t => {
    if(!byDeal[t.dealId]) byDeal[t.dealId] = { name: t.dealName, tasks: [] };
    byDeal[t.dealId].tasks.push(t);
  });

  const isFiltered = fDeal || fOwner || fStatus;
  const node = el(`
    <div class="space-y-5">
      <div class="page-header">
        <div>
          <h1 style="display:flex;align-items:center;gap:.5rem">
            <span style="display:inline-flex;align-items:center;justify-content:center;width:1.8rem;height:1.8rem;border-radius:.45rem;background:#ede9fe;color:#5b21b6">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><polyline points="3 6 4 7 6 5"/><polyline points="3 12 4 13 6 11"/><polyline points="3 18 4 19 6 17"/></svg>
            </span>
            Tarefas por projeto
          </h1>
          <p class="subtitle">${filtered.length} tarefa${filtered.length!==1?'s':''} ${isFiltered?'filtradas ':''} em ${Object.keys(byDeal).length} projeto${Object.keys(byDeal).length!==1?'s':''}</p>
        </div>
      </div>

      <!-- Filtros -->
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:.5rem">
        <select id="ttFiltroProj" style="font-size:.75rem;padding:.25rem .5rem;border:1px solid ${fDeal?'#7F77DD':'var(--bhub-border)'};border-radius:999px;background:${fDeal?'#ede9fe':'#fff'};color:${fDeal?'#5b21b6':'var(--bhub-navy)'};font-weight:${fDeal?'700':'400'};cursor:pointer;max-width:200px">
          <option value="">Todos os projetos</option>
          ${uniqueDeals.map(d=>`<option value="${escapeHtml(d.id)}" ${fDeal===d.id?'selected':''}>${escapeHtml(d.name)}</option>`).join('')}
        </select>
        <select id="ttFiltroOwner" style="font-size:.75rem;padding:.25rem .5rem;border:1px solid ${fOwner?'#7F77DD':'var(--bhub-border)'};border-radius:999px;background:${fOwner?'#ede9fe':'#fff'};color:${fOwner?'#5b21b6':'var(--bhub-navy)'};font-weight:${fOwner?'700':'400'};cursor:pointer;max-width:180px">
          <option value="">Responsável</option>
          ${uniqueOwners.map(o=>`<option value="${escapeHtml(o)}" ${fOwner===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}
        </select>
        <select id="ttFiltroStatus" style="font-size:.75rem;padding:.25rem .5rem;border:1px solid ${fStatus?'#7F77DD':'var(--bhub-border)'};border-radius:999px;background:${fStatus?'#ede9fe':'#fff'};color:${fStatus?'#5b21b6':'var(--bhub-navy)'};font-weight:${fStatus?'700':'400'};cursor:pointer">
          <option value="">Status</option>
          <option value="late" ${fStatus==='late'?'selected':''}>Atrasadas</option>
          <option value="ontrack" ${fStatus==='ontrack'?'selected':''}>No prazo</option>
          <option value="done" ${fStatus==='done'?'selected':''}>Concluídas</option>
          <option value="blocked" ${fStatus==='blocked'?'selected':''}>Bloqueadas</option>
        </select>
        ${isFiltered ? `<button id="ttClearFilters" style="font-size:.72rem;padding:.22rem .6rem;border:1px solid #c4b5fd;border-radius:999px;background:#fff;cursor:pointer;color:#5b21b6;font-weight:600">✕ Limpar</button>` : ''}
      </div>

      ${Object.keys(byDeal).length === 0 ? `
        <div class="bhub-card p-10 text-center text-gray-400">
          <div style="font-size:2rem;margin-bottom:.5rem">📋</div>
          <div class="font-medium text-gray-600">Nenhuma tarefa encontrada</div>
        </div>` : Object.entries(byDeal).map(([dealId, deal]) => {
          const late    = deal.tasks.filter(t=>t._f.status==='late').length;
          const done    = deal.tasks.filter(t=>t._f.status==='done').length;
          const blocked = deal.tasks.filter(t=>t.bloqueio==='Sim').length;
          const total   = deal.tasks.length;
          const pct     = total ? Math.round(done/total*100) : 0;
          return `
          <section class="bhub-card overflow-hidden">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:.65rem 1rem;background:var(--bhub-beige-soft);border-bottom:1px solid var(--bhub-border)">
              <div style="display:flex;align-items:center;gap:.55rem;flex-wrap:wrap">
                <span class="deal-link font-bold" data-open="${escapeHtml(dealId)}" style="font-size:.9rem;color:var(--bhub-navy)">${escapeHtml(deal.name)}</span>
                ${late>0?`<span style="font-size:.72rem;padding:.1rem .5rem;border-radius:9999px;background:#fee2e2;color:#991b1b;font-weight:700">${late} atrasada${late!==1?'s':''}</span>`:''}
                ${blocked>0?`<span style="font-size:.72rem;padding:.1rem .5rem;border-radius:9999px;background:#fef3c7;color:#92400e;font-weight:700">${blocked} bloqueio${blocked!==1?'s':''}</span>`:''}
                <span style="font-size:.72rem;color:var(--bhub-muted)">${pct}% concluído</span>
              </div>
              <span style="font-size:.72rem;color:var(--bhub-muted)">${total} tarefa${total!==1?'s':''}</span>
            </div>
            <div class="scroll-x">
              <table class="w-full">
                <thead><tr>
                  <th style="width:4rem">REF</th>
                  <th style="width:10rem">ÁREA</th>
                  <th>TAREFA</th>
                  <th style="width:9rem">OWNER</th>
                  <th style="width:7rem">PRAZO</th>
                  <th style="width:7rem">STATUS</th>
                </tr></thead>
                <tbody>
                  ${deal.tasks.map(t=>`
                  <tr class="row-clickable" data-open="${escapeHtml(dealId)}">
                    <td style="font-family:monospace;font-size:.75rem">${escapeHtml(t.ref||'—')}</td>
                    <td style="font-size:.75rem">${escapeHtml(t.area||'—')}</td>
                    <td style="max-width:22rem;font-size:.8rem">${escapeHtml(t.task||'')}</td>
                    <td style="font-size:.75rem">${escapeHtml(t.owner||'—')}</td>
                    <td style="white-space:nowrap;font-size:.75rem">${t._f.dataPrevista?fmtDate(t._f.dataPrevista):'—'}</td>
                    <td><span class="pill ${statusClass(t._f.status)}">${statusLabel(t._f.status)}</span></td>
