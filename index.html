  // Filtros
  node.querySelector('#ttFiltroProj')?.addEventListener('change', e=>{view.techTarefasFilters.dealId=e.target.value;render();});
  node.querySelector('#ttFiltroOwner')?.addEventListener('change', e=>{view.techTarefasFilters.owner=e.target.value;render();});
  node.querySelector('#ttFiltroStatus')?.addEventListener('change', e=>{view.techTarefasFilters.status=e.target.value;render();});
  node.querySelector('#ttClearFilters')?.addEventListener('click', ()=>{view.techTarefasFilters={dealId:'',owner:'',status:''};render();});

  // Click em linha → abre deal
  node.querySelectorAll('[data-open]').forEach(b=>{
    b.addEventListener('click', ()=>{ view.tab='deal'; view.dealId=b.dataset.open; view.dealTab='tarefas'; render(); });
  });

  return node;
}

function renderTechDashboard(){
  const rawData = aggregate();
  const data    = applyDashFilters(rawData);
  const total   = data.reduce((s,d)=>s+d.total,0);
  const done    = data.reduce((s,d)=>s+d.done,0);
  const ontrack = data.reduce((s,d)=>s+d.ontrack,0);
  const late    = data.reduce((s,d)=>s+d.late,0);
  const blocked = data.reduce((s,d)=>s+d.blocked,0);
  const noowner = data.reduce((s,d)=>s+d.noowner,0);
  const avgPct  = total > 0 ? Math.round(done/total*100) : 0;
  const P = '#9f8ff0';

  // Filter options
  const allProjects = state.companies.map(c=>({id:c.id,name:c.name})).sort((a,b)=>a.name.localeCompare(b.name));
  const allAreasD   = Array.from(new Set(Object.values(state.deals).flatMap(d=>d.tasks.map(t=>t.area)).filter(Boolean))).sort();
  const allOwnersD  = Array.from(new Set(Object.values(state.deals).flatMap(d=>d.tasks.map(t=>t.owner)).filter(Boolean))).sort();
  const f = view.dashFilters || {deals:[],areas:[],owners:[]};

  // Vencimentos ≤10 d.u.
  const today = new Date(); today.setHours(0,0,0,0);
  const due10 = [];
  data.forEach(d=>d.tasks.forEach(t=>{
    if(t._f.status==='ontrack' && t._f.dataPrevista){
      const diff = businessDaysBetween(today, t._f.dataPrevista);
      if(diff!==null && diff>=0 && diff<=10)
        due10.push({dealId:d.company.id, deal:d.company.name, owner:t.owner||'', task:t.task||'', area:t.area||'', due:t._f.dataPrevista, diff});
    }
  }));
  due10.sort((a,b)=>a.diff-b.diff);

  // Bloqueios ativos
  const blocks = [];
  data.forEach(d=>d.tasks.forEach(t=>{
    if(t.bloqueio==='Sim') blocks.push({dealId:d.company.id, deal:d.company.name, area:t.area||'', task:t.task||'', owner:t.owner||'', desc:t.bloqueioDescricao||''});
  }));

  // Maiores atrasos
  const topLate = [];
  data.forEach(d=>d.tasks.forEach(t=>{
    if(t._f.status==='late' && t._f.diasAtraso)
      topLate.push({dealId:d.company.id, deal:d.company.name, area:t.area||'', owner:t.owner||'', task:t.task||'', dias:t._f.diasAtraso});
  }));
  topLate.sort((a,b)=>b.dias-a.dias);

  // Heatmap: area × project (status label, same as PMI)
  const hmAreas = Array.from(new Set(data.flatMap(d=>d.tasks.map(t=>t.area)).filter(Boolean))).sort();
  function techCellStatus(deal, area){
    const ts = deal.tasks.filter(t=>t.area===area);
    if(!ts.length) return 'empty';
    if(ts.every(t=>t._f.status==='done')) return 'done';
    if(ts.some(t=>t._f.status==='late')) return 'late';
    if(ts.some(t=>t._f.status==='ontrack')) return 'ontrack';
    return 'empty';
  }

  const node = el(`
    <div class="space-y-6">

      <!-- Header -->
      <div class="page-header">
        <div>
          <h1>Dashboard de Projetos Tech</h1>
          <p class="subtitle">Visão consolidada do portfólio • Atualização automática</p>
        </div>
        <div class="flex gap-2 flex-wrap items-center">
          <button id="techCmpBtn" class="btn-filled" style="background:${P};border-color:${P}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            Comparar
          </button>
        </div>
      </div>

      <!-- Filtros -->
      <section class="bhub-card p-3">
        <div class="flex items-center gap-3 flex-wrap">
          <div class="text-xs font-semibold text-gray-700">Filtros:</div>
          <select id="fltDeals" multiple size="1" class="text-xs" style="min-width:180px;max-width:240px;height:32px">
            ${allProjects.map(d=>`<option value="${d.id}" ${f.deals?.includes(d.id)?'selected':''}>${escapeHtml(d.name)}</option>`).join('')}
          </select>
          <select id="fltAreas" multiple size="1" class="text-xs" style="min-width:160px;max-width:220px;height:32px">
            ${allAreasD.map(a=>`<option value="${escapeHtml(a)}" ${f.areas?.includes(a)?'selected':''}>${escapeHtml(a)}</option>`).join('')}
          </select>
          <select id="fltOwners" multiple size="1" class="text-xs" style="min-width:160px;max-width:220px;height:32px">
            ${allOwnersD.map(o=>`<option value="${escapeHtml(o)}" ${f.owners?.includes(o)?'selected':''}>${escapeHtml(o)}</option>`).join('')}
          </select>
          ${dashFiltersActive()?`<button id="fltClear" class="btn btn-secondary" style="padding:.3rem .7rem;font-size:.75rem">✕ Limpar (${dashFiltersActive()})</button>`:''}
          <div class="text-[11px] text-gray-500 ml-auto">Segure Ctrl/Cmd para selecionar múltiplos</div>
        </div>
        ${dashFiltersActive()?`<div class="filter-chips">
          ${(f.deals||[]).map(id=>{const d=allProjects.find(x=>x.id===id);return d?`<span class="filter-chip" data-chip-deal="${id}">Projeto: ${escapeHtml(d.name)} <span class="chip-x">✕</span></span>`:''}).join('')}
          ${(f.areas||[]).map(a=>`<span class="filter-chip" data-chip-area="${escapeHtml(a)}">Área: ${escapeHtml(a)} <span class="chip-x">✕</span></span>`).join('')}
          ${(f.owners||[]).map(o=>`<span class="filter-chip" data-chip-owner="${escapeHtml(o)}">Owner: ${escapeHtml(o)} <span class="chip-x">✕</span></span>`).join('')}
        </div>`:''}
      </section>

      <!-- Hero KPI section -->
      <section class="kpi-hero-section">
        <div class="kpi-hero" style="background:linear-gradient(135deg,#2d1f5e 0%,#4c3494 100%)" title="Tarefas concluídas ÷ total (ponderado por projeto)">
          <div class="kpi-label">% Progresso<br>do Portfólio</div>
          <div class="hero-center">
            <div class="kpi-value">${avgPct}%</div>
            <div class="hero-bar"><div class="hero-bar-fill" style="width:${avgPct}%;background:${P}"></div></div>
            <div class="kpi-sub">${done} de ${total} concluídas</div>
          </div>
          <div class="hero-mini-stats">
            <div class="hero-mini-stat"><div class="hero-mini-stat-value">${done}</div><div class="hero-mini-stat-label">feitas</div></div>
            <div class="hero-mini-stat"><div class="hero-mini-stat-value">${total}</div><div class="hero-mini-stat-label">total</div></div>
          </div>
        </div>
        <div class="kpi-secondary-grid">
          <div class="kpi" data-kpi-nav="empresas" style="cursor:pointer">
            <div class="kpi-head"><div class="kpi-label">Projetos Ativos</div><div class="kpi-icon" style="background:#ede9ff;color:${P}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="8" height="14" rx="1"/><rect x="13" y="3" width="8" height="17" rx="1"/></svg></div></div>
            <div class="kpi-value">${data.length}</div>
            <div class="kpi-sub">em acompanhamento</div>
          </div>
          <div class="kpi">
            <div class="kpi-head"><div class="kpi-label">Tasks Done</div><div class="kpi-icon kpi-icon-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div></div>
            <div class="kpi-value">${done} <span style="font-size:1rem;font-weight:500;color:var(--bhub-muted)">/ ${total}</span></div>
            <div class="kpi-sub">tarefas concluídas</div>
          </div>
          <div class="kpi">
            <div class="kpi-head"><div class="kpi-label">On Track</div><div class="kpi-icon kpi-icon-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></div></div>
            <div class="kpi-value tone-blue">${ontrack}</div>
            <div class="kpi-sub">dentro do prazo</div>
          </div>
          <div class="kpi">
            <div class="kpi-head"><div class="kpi-label">⚠ Atrasadas</div><div class="kpi-icon kpi-icon-red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div></div>
            <div class="kpi-value tone-red">${late}</div>
            <div class="kpi-sub">${total>0?Math.round(late/total*100):0}% do portfólio</div>
          </div>
          <div class="kpi">
            <div class="kpi-head"><div class="kpi-label">Bloqueios</div><div class="kpi-icon kpi-icon-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div></div>
            <div class="kpi-value tone-amber">${blocked}</div>
            <div class="kpi-sub">tarefas bloqueadas</div>
          </div>
          <div class="kpi">
            <div class="kpi-head"><div class="kpi-label">Sem Responsável</div><div class="kpi-icon" style="background:#f3f4f6;color:#9ca3af"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div></div>
            <div class="kpi-value">${noowner}</div>
            <div class="kpi-sub">tarefas sem dono</div>
          </div>
        </div>
      </section>

      <!-- % por Projeto -->
      <section class="bhub-card p-4">
        <div class="text-sm font-semibold mb-3">% por Projeto</div>
        ${data.length===0?`<div class="text-xs text-gray-500">Nenhum projeto ainda.</div>`:`
        <div class="space-y-2">
          ${data.map(d=>`
            <div class="flex items-center gap-3 text-xs">
              <button class="w-44 text-left truncate font-medium hover:underline" style="color:${P}" data-open="${d.company.id}" title="Ver projeto">${escapeHtml(d.company.name)}</button>
              <div class="flex-1 rounded h-3 overflow-hidden" style="background:#f3f4f6">
                <div class="h-full rounded" style="width:${d.pct}%;background:${P}"></div>

              Vencimento em ≤ 10 d.u. (${due10.length})
            </h3>
          </div>
          ${due10.length?dashExpandTable('tdue10',due10,['Projeto','Área','Tarefa','Owner','Vence em','d.u.'],r=>`<tr><td><span class="deal-link" data-open="${r.dealId}">${escapeHtml(r.deal)}</span></td><td>${escapeHtml(r.area)}</td><td>${escapeHtml(r.task)}</td><td>${escapeHtml(r.owner)}</td><td>${fmtDate(r.due)}</td><td class="text-center">${r.diff}</td></tr>`):`
          <div class="empty-state">

            <p class="empty-title">Nada vencendo nos próximos 10 dias úteis</p>

              <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
              Bloqueios ativos (${blocks.length})
            </h3>

          ${blocks.length?dashExpandTable('tblocks',blocks,['Projeto','Área','Tarefa','Owner','Descrição'],r=>`<tr><td><span class="deal-link" data-open="${r.dealId}">${escapeHtml(r.deal)}</span></td><td>${escapeHtml(r.area)}</td><td>${escapeHtml(r.task)}</td><td>${escapeHtml(r.owner)}</td><td>${escapeHtml(r.desc)}</td></tr>`):`

          </div>`}

      <section class="bhub-card p-4">

      </section>

      <!-- Heatmap Área × Projeto -->
      ${hmAreas.length && data.length ? `
      <section class="widget-card">

          <h3 class="widget-title">
            <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>

          </h3>
        </div>

          <table class="text-xs">
            <thead><tr>
              <th class="sticky-col">ÁREA</th>

                }).join('')}
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </section>` : ''}

    </div>
  `);

  // Filter selects
  const fltD = node.querySelector('#fltDeals');
  const fltA = node.querySelector('#fltAreas');
  const fltO = node.querySelector('#fltOwners');
  if(fltD) fltD.addEventListener('change', ()=>{ view.dashFilters={...f, deals:Array.from(fltD.selectedOptions).map(o=>o.value)}; render(); });
  if(fltA) fltA.addEventListener('change', ()=>{ view.dashFilters={...f, areas:Array.from(fltA.selectedOptions).map(o=>o.value)}; render(); });
  if(fltO) fltO.addEventListener('change', ()=>{ view.dashFilters={...f, owners:Array.from(fltO.selectedOptions).map(o=>o.value)}; render(); });
  const fltClear = node.querySelector('#fltClear');
  if(fltClear) fltClear.addEventListener('click', ()=>{ view.dashFilters={deals:[],areas:[],owners:[]}; render(); });
  // Filter chips
  node.querySelectorAll('[data-chip-deal]').forEach(c=>c.addEventListener('click',()=>{ view.dashFilters={...f,deals:(f.deals||[]).filter(x=>x!==c.dataset.chipDeal)}; render(); }));
  node.querySelectorAll('[data-chip-area]').forEach(c=>c.addEventListener('click',()=>{ view.dashFilters={...f,areas:(f.areas||[]).filter(x=>x!==c.dataset.chipArea)}; render(); }));
  node.querySelectorAll('[data-chip-owner]').forEach(c=>c.addEventListener('click',()=>{ view.dashFilters={...f,owners:(f.owners||[]).filter(x=>x!==c.dataset.chipOwner)}; render(); }));
  // Navigation
  node.querySelectorAll('[data-kpi-nav]').forEach(el=>el.addEventListener('click',()=>{ view.tab=el.dataset.kpiNav; render(); }));
  node.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{ view.tab='empresas'; view.dealId=el.dataset.open; render(); }));
  // More buttons
  node.querySelectorAll('[id^="more-"]').forEach(btn=>btn.addEventListener('click',()=>{ const id=btn.id.replace('more-',''); const extra=node.querySelector('#extra-'+id); if(extra){extra.style.display=''; btn.remove();} }));
  // Comparar projetos
  const techCmpBtn = node.querySelector('#techCmpBtn');
  if(techCmpBtn) techCmpBtn.onclick = ()=>openCompareDealsPicker();
  return node;
}

function renderGestao(){
  // Sub-tabs: 'hb' (Visão Executiva, admin default), 'gantt' (admin), 'tarefas' (todos), 'reuniao' (feature-flagged)
  const canSeeReuniao = session?.email === 'thiago.lobato@bhub.ai';
  if(!view.acompSubTab) view.acompSubTab = canAdmin() ? 'hb' : 'tarefas';
  if((view.acompSubTab==='hb'||view.acompSubTab==='gantt') && !canAdmin()) view.acompSubTab='tarefas';
  if(view.acompSubTab==='reuniao' && !canSeeReuniao) view.acompSubTab = canAdmin() ? 'hb' : 'tarefas';

  // Shared tab bar (admin only)
  function _gestaoTabBar(){
    const act = k => view.acompSubTab===k
      ? 'border-bottom:2px solid #4f46e5;color:#4f46e5;font-weight:600'
      : 'border-bottom:2px solid transparent;color:var(--bhub-muted)';
    const bar = el(`<div style="display:flex;gap:.25rem;border-bottom:1px solid var(--bhub-border);margin-bottom:.5rem;padding-bottom:0">
      <button class="acomp-subtab" data-tab="hb" style="padding:.5rem 1rem;font-size:.8rem;${act('hb')};cursor:pointer;background:none;border-left:none;border-right:none;border-top:none">Visão Executiva</button>
      <button class="acomp-subtab" data-tab="gantt" style="padding:.5rem 1rem;font-size:.8rem;${act('gantt')};cursor:pointer;background:none;border-left:none;border-right:none;border-top:none">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:-1px;margin-right:.3rem"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Gantt de Integração
        <span style="background:#e0e7ff;color:#3730a3;font-size:.62rem;padding:.1rem .4rem;border-radius:999px;margin-left:.3rem;font-weight:700">Admin</span>
      </button>
      <button class="acomp-subtab" data-tab="tarefas" style="padding:.5rem 1rem;font-size:.8rem;${act('tarefas')};cursor:pointer;background:none;border-left:none;border-right:none;border-top:none">Tarefas Atrasadas</button>
      ${canSeeReuniao ? `<button class="acomp-subtab" data-tab="reuniao" style="padding:.5rem 1rem;font-size:.8rem;${act('reuniao')};cursor:pointer;background:none;border-left:none;border-right:none;border-top:none">📋 Reunião <span style="background:#fef3c7;color:#92400e;font-size:.6rem;padding:.1rem .4rem;border-radius:999px;margin-left:.25rem;font-weight:700">Beta</span></button>` : ''}
    </div>`);
    bar.querySelectorAll('.acomp-subtab').forEach(btn => btn.addEventListener('click', () => { view.acompSubTab = btn.dataset.tab; render(); }));
    return bar;
  }

  if(view.acompSubTab === 'reuniao' && canSeeReuniao) {
    const wrap = el('<div class="space-y-4"></div>');
    wrap.appendChild(_gestaoTabBar());
    wrap.appendChild(renderReuniao());
    return wrap;
  }

  if(view.acompSubTab === 'hb' && canAdmin()) {
    const wrap = el('<div class="space-y-4"></div>');
    wrap.appendChild(_gestaoTabBar());
    wrap.appendChild(renderHomebroker());
    return wrap;
  }
  if(view.acompSubTab === 'gantt' && canAdmin()) {
    const wrap = el('<div class="space-y-4"></div>');
    wrap.appendChild(_gestaoTabBar());
    wrap.appendChild(renderGanttIntegracao());
    return wrap;
  }

  // Collect all late tasks across all deals
  const today = new Date(); today.setHours(0,0,0,0);
  if(!view.cobrancaFilters) view.cobrancaFilters = { trigger:'', dealId:'', owner:'' };

  // Se não for admin, filtra apenas liderados do usuário logado
  const lideradoNames = canAdmin()
    ? null  // null = sem filtro (vê tudo)
    : new Set(getLideradosAll().map(u => (u.username||'').trim().toLowerCase()));

  const allLateTasks = [];
  state.companies.forEach(c => {
    const deal = state.deals[c.id];
    if(!deal) return;
    (deal.tasks||[]).forEach(t => {
      const f = computeTaskFields(t, c);
      if(f.status !== 'late') return;
      // Filtro por liderado (apenas para não-admins)
      if(lideradoNames && !lideradoNames.has((t.owner||'').trim().toLowerCase())) return;
      const dias = f.dataPrevista ? businessDaysBetween(f.dataPrevista, today) : null;
      allLateTasks.push({ dealId:c.id, deal:c.name, area:t.area||'Sem área', owner:t.owner||'Sem responsável', task:t.task||'', dataPrevista:f.dataPrevista, dias: dias !== null ? dias : '?', bloqueio: t.bloqueio||'Não', bloqueioDescricao: t.bloqueioDescricao||'' });
    });
  });
  allLateTasks.sort((a,b) => (b.dias||0) - (a.dias||0));

  // Filter options
  const uniqueTriggers = Array.from(new Set(
    allLateTasks.map(t=>AREA_TRIGGERS[t.area]).filter(Boolean)
  )).sort();
  // Show all companies/projects in filter (not just those with late tasks)
  const uniqueDeals = state.companies
    .map(c => ({id: c.id, name: c.name}))
    .sort((a,b) => a.name.localeCompare(b.name));
  // Mostrar todos os usuários do workspace no filtro (não só quem tem atraso agora)
  const uniqueOwners = Array.from(new Set([
    ...state.users.filter(u => u.workspace === WS || u.workspace === 'ambos').map(u => u.username).filter(Boolean),
    ...allLateTasks.map(t => t.owner).filter(Boolean)
  ])).sort();

  // Apply filters
  const fTrigger = view.cobrancaFilters.trigger;
  const fDealId  = view.cobrancaFilters.dealId;
  const fOwner   = view.cobrancaFilters.owner;
  const lateTasks = allLateTasks.filter(t => {
    if(fTrigger && AREA_TRIGGERS[t.area] !== fTrigger) return false;
    if(fDealId  && t.dealId !== fDealId) return false;
    if(fOwner   && t.owner  !== fOwner)  return false;
    return true;
  });

  // Group: area → owner → tasks
  const byArea = {};
  lateTasks.forEach(t => {
    if(!byArea[t.area]) byArea[t.area] = {};
    if(!byArea[t.area][t.owner]) byArea[t.area][t.owner] = [];
    byArea[t.area][t.owner].push(t);
  });

  const areasSorted = sortAreaNames(Object.keys(byArea));

  // Build "Copiar lista" text (WhatsApp / email)
  function buildCopyText(){
    const lines = ['📋 *Cobrança PMI Tracker* — ' + today.toLocaleDateString('pt-BR'), ''];
    areasSorted.forEach(area => {
      lines.push('*' + area + '*');
      Object.keys(byArea[area]).sort().forEach(owner => {
        byArea[area][owner].forEach(t => {
          const prazo = t.dataPrevista ? fmtDate(t.dataPrevista) : 'sem prazo';
          lines.push(`• *${t.owner}* | ${t.deal} — ${t.task} (${t.dias} d.u. atrasado${t.dias!==1?'s':''}; venceu ${prazo})`);
        });
      });
      lines.push('');
    });
    return lines.join('\n');
  }

  const totalLate = lateTasks.length;
  const totalAll  = allLateTasks.length;
  const isFiltered = fTrigger || fDealId || fOwner;
  const node = el(`
    <div class="space-y-5">
      <div class="page-header">
        <div>
          <h1 style="display:flex;align-items:center;gap:.5rem">
            <span style="display:inline-flex;align-items:center;justify-content:center;width:1.8rem;height:1.8rem;border-radius:.45rem;background:#fee2e2;color:#991b1b">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r=".5" fill="currentColor"/></svg>
            </span>
            Gestão
          </h1>
          <p class="subtitle">Tarefas atrasadas por área e responsável${lideradoNames ? ` — equipe de ${escapeHtml(session.username||'')}` : ''} — ${isFiltered ? totalLate+' de '+totalAll : totalAll} tarefa${totalAll!==1?'s':''} em atraso</p>
        </div>
        ${totalAll > 0 ? `<button id="cobrancaCopyBtn" class="btn btn-primary" style="gap:.4rem">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copiar lista
        </button>` : ''}
      </div>


      <!-- Filtros compactos -->
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:.5rem">
        ${isPMI ? `<select id="cobrFiltroGatilho" style="font-size:.75rem;padding:.25rem .5rem;border:1px solid ${fTrigger?'#0171E4':'var(--bhub-border)'};border-radius:999px;background:${fTrigger?'#eff6ff':'#fff'};color:${fTrigger?'#0171E4':'var(--bhub-navy)'};font-weight:${fTrigger?'700':'400'};cursor:pointer;max-width:180px">
          <option value="">Gatilho</option>
          ${uniqueTriggers.map(t=>`<option value="${escapeHtml(t)}" ${fTrigger===t?'selected':''}>${escapeHtml(t)}</option>`).join('')}
        </select>` : ''}
        <select id="cobrFiltroDeal" style="font-size:.75rem;padding:.25rem .5rem;border:1px solid ${fDealId?'#0171E4':'var(--bhub-border)'};border-radius:999px;background:${fDealId?'#eff6ff':'#fff'};color:${fDealId?'#0171E4':'var(--bhub-navy)'};font-weight:${fDealId?'700':'400'};cursor:pointer;max-width:180px">
          <option value="">${isTech ? 'Projeto' : 'Deal'}</option>
          ${uniqueDeals.map(d=>`<option value="${escapeHtml(d.id)}" ${fDealId===d.id?'selected':''}>${escapeHtml(d.name)}</option>`).join('')}
        </select>
        <select id="cobrFiltroOwner" style="font-size:.75rem;padding:.25rem .5rem;border:1px solid ${fOwner?'#0171E4':'var(--bhub-border)'};border-radius:999px;background:${fOwner?'#eff6ff':'#fff'};color:${fOwner?'#0171E4':'var(--bhub-navy)'};font-weight:${fOwner?'700':'400'};cursor:pointer;max-width:180px">
          <option value="">Responsável</option>
          ${uniqueOwners.map(o=>`<option value="${escapeHtml(o)}" ${fOwner===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}
        </select>
        ${isFiltered ? `<button id="cobrClearFilters" style="font-size:.72rem;padding:.22rem .6rem;border:1px solid #fca5a5;border-radius:999px;background:#fff;cursor:pointer;color:#dc2626;font-weight:600">✕ Limpar</button>` : ''}
      </div>

      ${totalLate === 0 ? `
        <div class="bhub-card p-10 text-center text-gray-400">
          <div style="font-size:2.5rem;margin-bottom:.6rem">✅</div>
          <div class="font-medium text-gray-600">Nenhuma tarefa atrasada!</div>
          <div class="text-xs mt-1">Todas as tarefas estão em dia ou concluídas.</div>
        </div>` : areasSorted.map(area => {
          const ownersSorted = Object.keys(byArea[area]).sort();
          const areaTotal = ownersSorted.reduce((n,o)=>n+byArea[area][o].length, 0);
          const gatilho = AREA_TRIGGERS[area];
          return `
          <section class="bhub-card overflow-hidden">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:.65rem 1rem;background:var(--bhub-beige-soft);border-bottom:1px solid var(--bhub-border)">
              <div style="display:flex;align-items:center;gap:.55rem">
                <span style="font-size:.9rem;font-weight:700;color:var(--bhub-navy)">${escapeHtml(area)}</span>
                <span style="font-size:.72rem;padding:.1rem .5rem;border-radius:9999px;background:#fee2e2;color:#991b1b;font-weight:700">${areaTotal} atrasada${areaTotal!==1?'s':''}</span>
                ${isPMI && gatilho ? `<span style="font-size:.72rem;color:var(--bhub-muted)">Gatilho: <strong>${escapeHtml(gatilho)}</strong></span>` : ''}
              </div>
            </div>
            <div style="padding:.5rem 0">
              ${ownersSorted.map(owner => {
                const tasks = byArea[area][owner];
                return `
                <div style="padding:.4rem 1rem">
                  <div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem">
                    <span style="font-size:.78rem;font-weight:700;color:var(--bhub-navy);padding:.15rem .55rem;border-radius:9999px;background:#ede9fe;cursor:pointer" class="cobr-owner-link" data-owner="${escapeHtml(owner)}">${escapeHtml(owner)}</span>
                    <span style="font-size:.72rem;color:var(--bhub-muted)">${tasks.length} tarefa${tasks.length!==1?'s':''}</span>
                  </div>
                  <div class="scroll-x">
                  <table class="w-full text-xs" style="margin-bottom:.3rem">
                    <thead><tr>
                      <th style="text-align:left;padding:.2rem .4rem;font-size:.68rem;color:var(--bhub-muted)">${isTech ? 'PROJETO' : 'DEAL'}</th>
                      <th style="text-align:left;padding:.2rem .4rem;font-size:.68rem;color:var(--bhub-muted)">TAREFA</th>
                      <th style="text-align:center;padding:.2rem .4rem;font-size:.68rem;color:var(--bhub-muted)">BLOQUEIO</th>
                      <th style="text-align:right;padding:.2rem .4rem;font-size:.68rem;color:var(--bhub-muted)">VENCEU</th>
                      <th style="text-align:right;padding:.2rem .4rem;font-size:.68rem;color:var(--bhub-muted)">D.U. ATRASO</th>
                    </tr></thead>
                    <tbody>
                      ${tasks.map(t=>`<tr>
                        <td style="padding:.2rem .4rem"><span class="deal-link text-xs" data-summary="${escapeHtml(t.dealId)}">${escapeHtml(t.deal)}</span></td>
                        <td style="padding:.2rem .4rem;max-width:18rem">${escapeHtml(t.task)}</td>
                        <td style="padding:.2rem .4rem;text-align:center">${t.bloqueio==='Sim'?`<span title="${escapeHtml(t.bloqueioDescricao||'Sem descrição')}" style="display:inline-flex;align-items:center;gap:.2rem;background:#fef3c7;color:#92400e;font-size:.62rem;font-weight:600;padding:.1rem .35rem;border-radius:4px;border:1px solid #fde68a;cursor:default">⚠ Bloqueado</span>`:'<span style="color:var(--bhub-muted);font-size:.68rem">—</span>'}</td>
                        <td style="padding:.2rem .4rem;text-align:right;white-space:nowrap">${t.dataPrevista ? fmtDate(t.dataPrevista) : '—'}</td>
                        <td style="padding:.2rem .4rem;text-align:right;font-weight:700;color:#a01923">${t.dias}</td>
                      </tr>`).join('')}
                    </tbody>
                  </table>
                  </div>
                </div>`;
              }).join('<hr style="border:none;border-top:1px solid var(--bhub-border);margin:.2rem 0">')}
            </div>
          </section>`;
        }).join('')}
    </div>
  `);

  // Filtros
  const selGatilho = node.querySelector('#cobrFiltroGatilho');
  const selDeal    = node.querySelector('#cobrFiltroDeal');
  const selOwner   = node.querySelector('#cobrFiltroOwner');
  const btnClear   = node.querySelector('#cobrClearFilters');
  if(selGatilho) selGatilho.addEventListener('change', ()=>{ view.cobrancaFilters.trigger=selGatilho.value; render(); });
  if(selDeal)    selDeal.addEventListener('change',    ()=>{ view.cobrancaFilters.dealId=selDeal.value; render(); });
  if(selOwner)   selOwner.addEventListener('change',   ()=>{ view.cobrancaFilters.owner=selOwner.value; render(); });
  if(btnClear)   btnClear.addEventListener('click',    ()=>{ view.cobrancaFilters={trigger:'',dealId:'',owner:''}; render(); });

  // Copy button
  const copyBtn = node.querySelector('#cobrancaCopyBtn');
  if(copyBtn) copyBtn.addEventListener('click', ()=>{
    navigator.clipboard.writeText(buildCopyText()).then(()=>{
      copyBtn.textContent = '✓ Copiado!';
      setTimeout(()=>{ copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copiar lista'; }, 2000);
    }).catch(()=>{ alert(buildCopyText()); });
  });
  // Deal links
  node.querySelectorAll('[data-summary]').forEach(b=>b.addEventListener('click',()=>{ view.tab='deal'; view.dealId=b.dataset.summary; render(); }));
  // Owner links
  node.querySelectorAll('.cobr-owner-link').forEach(b=>b.addEventListener('click',()=>openOwnerSummary(b.dataset.owner)));
  // Para admin: wrap com tab bar compartilhado no topo
  if(isPMI && canAdmin()){
    const wrap = el('<div class="space-y-4"></div>');
    wrap.appendChild(_gestaoTabBar());
    wrap.appendChild(node);
    return wrap;
  }
  return node;
}

/* ===== Reunião Semanal ===== */
function renderReuniao(){
  if(!view.reuniaoPanelW) view.reuniaoPanelW = 130;

  const meetings = (state.weeklyMeetings||[])
    .filter(m => m.workspace === WS)
    .sort((a,b) => b.week_date.localeCompare(a.week_date));

  if(!view.reuniaoWeekId && meetings.length > 0) view.reuniaoWeekId = meetings[0].id;
  const selected = meetings.find(m => m.id === view.reuniaoWeekId) || null;
  const items = selected ? (state.meetingItems||[]).filter(mi => mi.meeting_id === selected.id) : [];

  const wrap = el('<div style="display:flex;height:720px;border:0.5px solid var(--bhub-border);border-radius:.75rem;overflow:hidden;background:#fff"></div>');

  // ── LEFT PANEL ────────────────────────────────────────────────────
  const left = el(`<div style="width:${view.reuniaoPanelW}px;min-width:100px;max-width:280px;flex-shrink:0;border-right:0.5px solid var(--bhub-border);background:#fafafa;display:flex;flex-direction:column;overflow:hidden"></div>`);

  const leftHeader = el(`<div style="padding:.6rem .75rem .5rem;border-bottom:0.5px solid var(--bhub-border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
    <span style="font-size:.62rem;font-weight:700;color:var(--bhub-muted);text-transform:uppercase;letter-spacing:.06em">Semanas</span>
    ${canAdmin() ? `<button id="rnNewBtn" style="width:22px;height:22px;border-radius:5px;border:0.5px solid #0171E4;background:#0171E4;color:#fff;font-size:1rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-weight:600" title="Nova reunião">+</button>` : ''}
  </div>`);
  left.appendChild(leftHeader);

  const weekList = el('<div style="flex:1;overflow-y:auto;padding:.25rem 0"></div>');
  if(meetings.length === 0){
    weekList.appendChild(el('<div style="padding:1.25rem .75rem;font-size:.73rem;color:var(--bhub-muted);text-align:center;line-height:1.5">Nenhuma reunião.<br>Clique + para criar.</div>'));
  }
  meetings.forEach(m => {
    const d = new Date(m.week_date + 'T00:00:00');
    const label = d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
    const yr    = d.getFullYear().toString().slice(-2);
    const dot   = m.status==='closed' ? '#16a34a' : m.status==='published' ? '#d97706' : '#94a3b8';
    const isAct = m.id === view.reuniaoWeekId;
    const row = el(`<div style="padding:.4rem .75rem;cursor:pointer;display:flex;align-items:center;gap:.45rem;border-left:2.5px solid ${isAct?'#0171E4':'transparent'};background:${isAct?'#eff6ff':'transparent'};transition:background .1s">
      <span style="width:7px;height:7px;border-radius:50%;background:${dot};flex-shrink:0"></span>
      <span style="font-size:.75rem;color:${isAct?'#0171E4':'var(--bhub-navy)'};font-weight:${isAct?'600':'400'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Qua ${label}/${yr}</span>
    </div>`);
    row.addEventListener('click', ()=>{ view.reuniaoWeekId = m.id; render(); });
    weekList.appendChild(row);
  });
  left.appendChild(weekList);

  // Legend
  left.appendChild(el(`<div style="padding:.4rem .75rem;border-top:0.5px solid var(--bhub-border);flex-shrink:0;display:flex;gap:.5rem;flex-direction:column">
    <div style="display:flex;align-items:center;gap:.3rem"><span style="width:6px;height:6px;border-radius:50%;background:#94a3b8;display:inline-block;flex-shrink:0"></span><span style="font-size:.62rem;color:var(--bhub-muted)">Rascunho</span></div>
    <div style="display:flex;align-items:center;gap:.3rem"><span style="width:6px;height:6px;border-radius:50%;background:#d97706;display:inline-block;flex-shrink:0"></span><span style="font-size:.62rem;color:var(--bhub-muted)">Publicada</span></div>
    <div style="display:flex;align-items:center;gap:.3rem"><span style="width:6px;height:6px;border-radius:50%;background:#16a34a;display:inline-block;flex-shrink:0"></span><span style="font-size:.62rem;color:var(--bhub-muted)">Encerrada</span></div>
  </div>`));

  wrap.appendChild(left);

  // ── DIVIDER ───────────────────────────────────────────────────────
  const divider = el('<div style="width:6px;cursor:col-resize;flex-shrink:0;background:transparent;position:relative;z-index:1;display:flex;align-items:center;justify-content:center" title="Arrastar para redimensionar"><div style="width:2px;height:32px;border-radius:2px;background:var(--bhub-border)"></div></div>');
  divider.addEventListener('mousedown', e => {
    const startX = e.clientX;
    const startW = view.reuniaoPanelW;
    const onMove = ev => {
      const newW = Math.max(100, Math.min(280, startW + ev.clientX - startX));
      view.reuniaoPanelW = newW;
      left.style.width = newW + 'px';
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    e.preventDefault();
  });
  wrap.appendChild(divider);

  // ── RIGHT PANEL ───────────────────────────────────────────────────
  const right = el('<div style="flex:1;overflow-y:auto;padding:1.25rem 1.5rem;min-width:0"></div>');
  if(!selected){
    right.innerHTML = `<div style="text-align:center;padding:5rem 2rem;color:var(--bhub-muted)">
      <div style="font-size:3rem;margin-bottom:.75rem">📋</div>
      <div style="font-size:1rem;font-weight:700;color:var(--bhub-navy);margin-bottom:.5rem">Nenhuma reunião selecionada</div>
      <div style="font-size:.82rem;line-height:1.6">${canAdmin() ? 'Clique em <strong>+</strong> para criar a<br>reunião desta semana.' : 'Aguardando a criação da próxima reunião.'}</div>
    </div>`;
  } else {
    right.appendChild(renderMeetingDoc(selected, items));
  }
  wrap.appendChild(right);

  // Events on left panel
  wrap.querySelector('#rnNewBtn')?.addEventListener('click', ()=>openNewMeetingModal());

  return wrap;
}

function renderMeetingDoc(meeting, items){
  const wd = new Date(meeting.week_date + 'T00:00:00');
  const statusLabel = {draft:'Rascunho', published:'Publicada', closed:'Encerrada'}[meeting.status] || meeting.status;
  const statusStyle = meeting.status==='draft'
    ? 'background:#f1f5f9;color:#64748b'
    : meeting.status==='published'
    ? 'background:#fef3c7;color:#92400e'
    : 'background:#d1fae5;color:#065f46';
  const canEdit = canAdmin() && meeting.status !== 'closed';

  const SECTIONS = [
    { key:'pauta',    label:'Pauta',           icon:'📋' },
    { key:'bloqueio', label:'Bloqueios',        icon:'🚧' },
    { key:'ajuda',    label:'Pedidos de ajuda', icon:'🙋' },
    { key:'combinado',label:'Combinados',       icon:'✅' },
  ];

  // Document wrapper — generous padding, page feel
  const doc = el('<div style="max-width:700px;padding:2rem 2.5rem 3rem"></div>');

  // ── Header ────────────────────────────────────────────────────────
  const hdr = el(`<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;padding-bottom:1.25rem;border-bottom:1px solid var(--bhub-border);margin-bottom:2rem">
    <div>
      <h2 style="font-size:1.25rem;font-weight:700;color:var(--bhub-navy);margin:0 0 .3rem;letter-spacing:-.01em">Reunião de Integração</h2>
      <p style="font-size:.82rem;color:var(--bhub-muted);margin:0">${wd.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
    </div>
    <div style="display:flex;align-items:center;gap:.4rem;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">
      <span style="font-size:.7rem;font-weight:600;padding:.2rem .7rem;border-radius:999px;${statusStyle}">${statusLabel}</span>
      ${canAdmin() && meeting.status==='draft' ? `<button id="rnPublishBtn" style="font-size:.7rem;padding:.2rem .7rem;border-radius:999px;border:0.5px solid #0171E4;color:#0171E4;background:#fff;cursor:pointer;font-weight:600">Publicar</button>` : ''}
      ${canAdmin() && meeting.status==='published' ? `<button id="rnCloseBtn" style="font-size:.7rem;padding:.2rem .7rem;border-radius:999px;border:0.5px solid #16a34a;color:#16a34a;background:#fff;cursor:pointer;font-weight:600">Encerrar</button>` : ''}
      ${canAdmin() ? `<button id="rnDeleteBtn" style="font-size:.7rem;padding:.2rem .7rem;border-radius:999px;border:0.5px solid #fca5a5;color:#dc2626;background:#fff;cursor:pointer">Excluir</button>` : ''}
    </div>
  </div>`);
  doc.appendChild(hdr);

  // ── Sections ──────────────────────────────────────────────────────
  SECTIONS.forEach(sec => {
    // Aggregate all existing items for this section (legacy support: merge into one blob)
    const secItems = items
      .filter(i => i.section === sec.key)
      .sort((a,b) => (a.created_at||'').localeCompare(b.created_at||''));

    // Primary item = most recently updated (the "master" blob for this section)
    const primaryItem = [...secItems].sort((a,b) =>
      ((b.updated_at||b.created_at||'').localeCompare(a.updated_at||a.created_at||''))
    )[0] || null;

    // Content = join all items (migration from card model) or primary item content
    const textContent = primaryItem
      ? secItems.map(i => i.content).join('\n')
      : '';

    const secEl = el('<div style="margin-bottom:2.25rem"></div>');

    // Section label — subtle, document-style
    secEl.appendChild(el(`<div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.5rem">
      <span style="font-size:.8rem">${sec.icon}</span>
      <span style="font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--bhub-muted)">${sec.label}</span>
    </div>`));

    if(canEdit){
      // Auto-grow textarea — seamless document feel
      const ta = el(`<textarea data-sec="${sec.key}" style="width:100%;min-height:64px;padding:.6rem 0;border:none;border-bottom:1.5px solid var(--bhub-border);border-radius:0;font-size:.92rem;font-family:inherit;line-height:1.8;color:var(--bhub-navy);background:transparent;resize:none;overflow:hidden;display:block;outline:none;transition:border-color .15s" placeholder="Escreva aqui…">${escapeHtml(textContent)}</textarea>`);

      // Auto-grow on input
      const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.max(64, ta.scrollHeight) + 'px'; };
      ta.addEventListener('input', grow);
      setTimeout(grow, 0);

      ta.addEventListener('focus', () => { ta.style.borderBottomColor = '#0171E4'; });
      ta.addEventListener('blur', () => {
        ta.style.borderBottomColor = 'var(--bhub-border)';
        // Only save if there is actual content
        if(ta.value.trim()) saveSection(meeting.id, sec.key, ta.value.trim(), primaryItem, secEl, secItems);
      });

      secEl.appendChild(ta);
    } else {
      // Read-only — same visual weight, no border
      secEl.appendChild(el(`<div style="font-size:.92rem;line-height:1.8;color:${textContent ? 'var(--bhub-navy)' : 'var(--bhub-muted)'};white-space:pre-wrap;padding:.6rem 0;border-bottom:1px solid var(--bhub-border);min-height:40px">${textContent ? escapeHtml(textContent) : '<em>Sem conteúdo</em>'}</div>`));
    }

    // Editor chip — only show if section has actual content
    const editorRow = el(`<div class="rn-erow-${sec.key}" style="display:flex;align-items:center;gap:.35rem;margin-top:.35rem;min-height:16px"></div>`);
    if(primaryItem && primaryItem.content && primaryItem.content.trim()) editorRow.innerHTML = _editorChip(primaryItem);
    secEl.appendChild(editorRow);

    doc.appendChild(secEl);
  });

  // ── Header button events ──────────────────────────────────────────
  doc.querySelector('#rnPublishBtn')?.addEventListener('click', async ()=>{
    const {error} = await supa.from('weekly_meetings').update({status:'published'}).eq('id', meeting.id);
    if(error){alert('Erro: '+(error.message||error)); return;}
    meeting.status = 'published'; render();
  });
  doc.querySelector('#rnCloseBtn')?.addEventListener('click', async ()=>{
    if(!confirm('Encerrar esta reunião? Não será mais possível editar.')) return;
    const {error} = await supa.from('weekly_meetings').update({status:'closed'}).eq('id', meeting.id);
    if(error){alert('Erro: '+(error.message||error)); return;}
    meeting.status = 'closed'; render();
  });
  doc.querySelector('#rnDeleteBtn')?.addEventListener('click', ()=>{
    if(!confirm('Excluir esta reunião e todo o conteúdo? Esta ação é irreversível.')) return;
    (async()=>{
      await supa.from('meeting_items').delete().eq('meeting_id', meeting.id);
      const {error} = await supa.from('weekly_meetings').delete().eq('id', meeting.id);
      if(error){alert('Erro: '+(error.message||error)); return;}
      state.weeklyMeetings = state.weeklyMeetings.filter(m => m.id !== meeting.id);
      state.meetingItems   = state.meetingItems.filter(mi => mi.meeting_id !== meeting.id);
      view.reuniaoWeekId = null; render();
    })();
  });

  return doc;
}

// ── saveSection — upsert one text blob per section ────────────────
async function saveSection(meetingId, section, content, primaryItem, secEl, secItems){
  const erow = secEl.querySelector(`.rn-erow-${section}`);
  if(erow) erow.innerHTML = '<span style="font-size:.65rem;color:var(--bhub-muted)">Salvando…</span>';

  const now = new Date().toISOString();
  let data, error;

  if(primaryItem){
    ({data, error} = await supa.from('meeting_items')
      .update({ content, author_name: session.username||'—', author_email: session.email||'', updated_at: now })
      .eq('id', primaryItem.id)
      .select().single());
  } else {
    ({data, error} = await supa.from('meeting_items')
      .insert({ meeting_id: meetingId, section, content, author_name: session.username||'—', author_email: session.email||'', resolved: false })
      .select().single());
  }

  if(error){
    if(erow) erow.innerHTML = '<span style="font-size:.65rem;color:#dc2626">Erro ao salvar</span>';
    console.warn('[saveSection]', error);
    return;
  }

  // Merge: delete any duplicate items for this section (legacy cards)
  const dupes = (secItems||[]).filter(i => i.id !== (primaryItem?.id || data.id));
  for(const d of dupes){
    await supa.from('meeting_items').delete().eq('id', d.id);
    state.meetingItems = state.meetingItems.filter(i => i.id !== d.id);
  }

  // Update local state
  if(primaryItem){
    const idx = state.meetingItems.findIndex(i => i.id === primaryItem.id);
    if(idx >= 0) state.meetingItems[idx] = { ...state.meetingItems[idx], content, author_name: session.username||'—', updated_at: now };
  } else {
    if(!state.meetingItems) state.meetingItems = [];
    state.meetingItems.push(data);
  }

  if(erow) erow.innerHTML = _editorChip({...( primaryItem || data ), author_name: session.username||'—', updated_at: now });
}

// ── _editorChip — compact "last edited by" line ───────────────────
function _editorChip(item){
  const initials = (item.author_name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const ts = item.updated_at || item.created_at;
  const timeStr = ts ? new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
  return `<span style="width:14px;height:14px;border-radius:50%;background:#1a1f36;color:#fff;font-size:.5rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0">${escapeHtml(initials)}</span><span style="font-size:.67rem;color:var(--bhub-muted)">${escapeHtml(item.author_name||'—')}${timeStr ? ' · '+timeStr : ''}</span>`;
}
