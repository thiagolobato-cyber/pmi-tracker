              <button id="confNo" class="btn btn-secondary">Cancelar</button>
              <button id="confYes" class="btn" style="background:#fee2e2;color:#991b1b;border:1px solid #fecaca">Excluir permanentemente</button>
            </div>
          </div>
        </div>`);
      document.body.appendChild(conf);
      conf.querySelector('#confNo').onclick = ()=>conf.remove();
      conf.querySelector('#confYes').onclick = async ()=>{
        conf.remove();
        try{
          const { error } = await supa.from('tasks').delete().eq('id', existing.id);
          if(error) throw error;
          if(deal) deal.tasks = deal.tasks.filter(t=>t.id!==existing.id);
          close(); render();
        }catch(err){ alert('Erro ao excluir: '+(err.message||err)); }
      };
    } else {
      // Non-admin owner: create deletion_request
      const conf2 = el(`
        <div class="fixed inset-0 z-30 flex items-center justify-center" style="background:rgba(15,23,39,.5);backdrop-filter:blur(2px)">
          <div class="bg-white rounded-2xl p-6 shadow-2xl" style="max-width:400px;width:100%">
            <div style="display:flex;gap:.75rem;align-items:flex-start;margin-bottom:1rem">
              <div style="width:40px;height:40px;border-radius:99px;background:#fef3c7;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              </div>
              <div>
                <div style="font-size:.95rem;font-weight:700;color:var(--bhub-navy);font-family:'Roboto',sans-serif">Solicitar exclusão</div>
                <div style="font-size:.82rem;color:var(--bhub-muted);margin-top:.3rem">Sua solicitação será enviada ao admin para aprovação. A tarefa permanecerá visível até ser aprovada.</div>
              </div>
            </div>
            <div style="display:flex;gap:.5rem;justify-content:flex-end">
              <button id="confNo" class="btn btn-secondary">Cancelar</button>
              <button id="confYes" class="btn btn-primary">Enviar solicitação</button>
            </div>
          </div>
        </div>`);
      document.body.appendChild(conf2);
      conf2.querySelector('#confNo').onclick = ()=>conf2.remove();
      conf2.querySelector('#confYes').onclick = async ()=>{
        conf2.remove();
        try{
          const { data, error } = await supa.from('deletion_requests').insert({
            task_id: existing.id,
            company_id: company.id,
            requested_by_id: session?.id,
            requested_by_name: session?.username||session?.email||'—',
            status: 'pending',
            task_ref: existing.ref||'',
            task_desc: existing.task||''
          }).select().single();
          if(error) throw error;
          if(!state.deletionRequests) state.deletionRequests = [];
          state.deletionRequests.push(data);
          close(); render();
        }catch(err){ alert('Erro ao solicitar exclusão: '+(err.message||err)); }
      };
    }
  };

  // ── Save ──────────────────────────────────────────────────────
  m.querySelector('#tmSave').onclick = async ()=>{
    const showErr = msg=>{ const e2=m.querySelector('#tmErr'); e2.textContent=msg; e2.style.display='block'; e2.scrollIntoView({behavior:'smooth',block:'nearest'}); };
    const taskVal = m.querySelector('[name="task"]').value?.trim();
    if(!taskVal) return showErr('A descrição da tarefa é obrigatória.');
    // Validação: bloqueio sem RAID vinculado (apenas PMI)
    if(bloqSel.value==='Sim' && !(raidSel?.value)){

      if(raidSel){ raidSel.style.borderColor='#f25461'; raidSel.style.boxShadow='0 0 0 3px rgba(242,84,97,.15)'; setTimeout(()=>{ raidSel.style.borderColor=''; raidSel.style.boxShadow=''; },3000); }
      return showErr('Tarefas bloqueadas precisam de uma Ação de Mitigação vinculada. Selecione uma no campo acima ou crie uma na aba Ações de Mitigação.');

    // Auto-ref for Tech workspace: assign next sequential number if new task
    let autoRef = m.querySelector('[name="ref"]').value||existing?.ref||'';
    if(isTech && isNew && !autoRef){

    }
    const blocoVal = (m.querySelector('[name="bloco"]')?.value||'').trim();
    const payload = {
      ref:              autoRef,
      area:             m.querySelector('[name="area"]').value||existing?.area||'',
      bloco:            blocoVal,
      task:             taskVal,
      owner:            m.querySelector('[name="owner"]')?.value||existing?.owner||'',
      ferramenta:       existing?.ferramenta||'',
      prazo:            parseInt(prazoInput.value)||0,
      dataPrevista:     m.querySelector('#tmDueDate')?.value||'',
      completado:       parseInt(m.querySelector('[name="completado"]')?.value)||existing?.completado||0,
      bloqueio:         bloqSel.value||'Não',
      bloqueioDescricao:m.querySelector('[name="bloqueioDescricao"]')?.value||'',
      dataRealConclusao:m.querySelector('[name="dataRealConclusao"]').value||'',
      ultimoUpdate:     existing?.ultimoUpdate||'',
      proximoPasso:     existing?.proximoPasso||'',
      evidencia:        m.querySelector('[name="evidencia"]').value||'',
      raidId:           raidSel?.value||null,
      phaseId:          existing?.phaseId||'',
      pendingApproval:  isNew ? !canAdmin() : (existing?.pendingApproval||false)
    };
    // Se admin digitou sub-área nova, persiste na tabela de referência
    if(canAdmin() && blocoVal && payload.area) await ensureSubArea(payload.area, blocoVal);
    const saveBtn = m.querySelector('#tmSave');
    saveBtn.disabled = true; saveBtn.textContent = 'Salvando…';
    try{
      if(existing){
        const { error } = await supa.from('tasks').update(taskToDb(payload, company.id)).eq('id', existing.id);
        if(error) throw error;
        Object.assign(existing, payload);
      } else {
        const { data, error } = await supa.from('tasks').insert(taskToDb(payload, company.id)).select().single();
        if(error) throw error;
        if(!deal.tasks) deal.tasks = [];
        deal.tasks.push(taskFromDb(data));
        if(!canAdmin()){
          // Mostra aviso de aprovação pendente
          const toast = el(`<div style="position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1e40af;color:#fff;padding:.65rem 1.1rem;border-radius:.875rem;font-size:.82rem;z-index:99;box-shadow:0 4px 20px rgba(0,0,0,.2);display:flex;align-items:center;gap:.5rem">

            Tarefa criada e aguardando aprovação do admin
          </div>`);
          document.body.appendChild(toast);
          setTimeout(()=>toast.remove(), 4000);
        }
      }
      close(); render();
    }catch(err){ saveBtn.disabled=false; saveBtn.textContent=isNew?'+ Criar tarefa':'Salvar alterações'; showErr('Erro: '+(err.message||err)); }
  };

  // ── Comments ─────────────────────────────────────────────────
  if(existing){
    const histEl = m.querySelector('#tmHistory');
    if(histEl) renderFreeComments(histEl, 'tasks', existing.id);
  }
}

/* ===================================================================
   renderFreeComments — painel de comentários livres
   container  : elemento DOM onde renderizar
   entityType : 'tasks' | 'raid_items'
   entityId   : UUID do item
=================================================================== */
async function renderFreeComments(container, entityType, entityId){
  if(!container) return;

  function initials(name){
    return (name||'?').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
  }
  function timeAgo(iso){
    const d = new Date(iso), now = new Date();
    const diff = Math.floor((now-d)/1000);
    if(diff<60)   return 'agora';
    if(diff<3600) return Math.floor(diff/60)+'min atrás';
    if(diff<86400)return Math.floor(diff/3600)+'h atrás';
    return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  }

  async function load(){
    container.innerHTML = `<div style="font-size:.75rem;color:#9ca3af;padding:.5rem 0">Carregando…</div>`;
    try{
      const { data, error } = await supa.from('audit_log').select('*')
        .eq('entity_type', entityType).eq('entity_id', entityId)
        .eq('action','comment')
        .order('ts', {ascending:true}).limit(100);
      if(error) throw error;
      renderComments(data||[]);
    }catch(err){
      container.innerHTML = `<div style="font-size:.75rem;color:#ef4444">Erro ao carregar comentários.</div>`;
    }
  }

  function renderComments(rows){
    const list = rows.length ? rows.map(r=>{
      const actor = r.actor_name||r.actor_email||'—';
      let msg = '';
      try{ msg = (typeof r.changes==='object' ? r.changes?.message : JSON.parse(r.changes||'{}').message) || ''; }catch{ msg = ''; }
      const color = stringToColor(actor);
      return `<div style="display:flex;gap:.65rem;align-items:flex-start">
        <div style="width:30px;height:30px;border-radius:99px;background:${color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;flex-shrink:0;font-family:'Roboto',sans-serif">${escapeHtml(initials(actor))}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:baseline;gap:.5rem;margin-bottom:.25rem">
            <span style="font-size:.8rem;font-weight:700;color:var(--bhub-navy)">${escapeHtml(actor)}</span>
            <span style="font-size:.68rem;color:#9ca3af">${timeAgo(r.ts)}</span>
          </div>
          <div style="font-size:.82rem;color:#374151;line-height:1.5;background:#f8fafc;border-radius:0 .75rem .75rem .75rem;padding:.5rem .7rem;border:1px solid #e2e8f0">${escapeHtml(msg)}</div>
        </div>
      </div>`;
    }).join('') : `<div style="font-size:.8rem;color:#9ca3af;text-align:center;padding:1.25rem 0">Nenhum comentário ainda. Seja o primeiro!</div>`;

    container.innerHTML = `
      <div id="cmtList" style="display:flex;flex-direction:column;gap:.85rem;margin-bottom:1rem">${list}</div>
      <div style="display:flex;gap:.5rem;align-items:flex-end">
        <textarea id="cmtInput" rows="2" placeholder="Escreva um comentário…"
          style="flex:1;resize:none;border-radius:.75rem;font-size:.82rem;padding:.5rem .7rem;border:1px solid var(--bhub-border);font-family:inherit;transition:border-color .2s"
          onfocus="this.style.borderColor='var(--bhub-blue)'" onblur="this.style.borderColor='var(--bhub-border)'"></textarea>
        <button id="cmtSend" style="padding:.5rem .9rem;border-radius:.75rem;background:var(--bhub-blue);color:#fff;border:none;cursor:pointer;font-size:.8rem;font-weight:600;font-family:'Roboto',sans-serif;white-space:nowrap;flex-shrink:0;transition:background .15s"
          onmouseover="this.style.background='var(--bhub-blue-700)'" onmouseout="this.style.background='var(--bhub-blue)'">Enviar</button>
      </div>`;

    container.querySelector('#cmtSend').onclick = async ()=>{
      const input = container.querySelector('#cmtInput');
      const msg = input.value.trim();
      if(!msg) return;
      const btn = container.querySelector('#cmtSend');
      btn.disabled = true; btn.textContent = '…';
      try{
        const actor = session?.username||session?.email||'—';
        // Derive company_id from entity if possible (audit_log requires it)
        let companyId = null;
        if(entityType==='tasks'){
          for(const [cid, d] of Object.entries(state.deals||{})){
            if((d.tasks||[]).some(t=>t.id===entityId)){ companyId=cid; break; }
          }
        } else if(entityType==='raid_items'){
          const ri = (state.raid||[]).find(r=>r.id===entityId);
          companyId = ri?.dealIds?.[0] || null;
        }
        const { error } = await supa.from('audit_log').insert({
          entity_type: entityType,
          entity_id: entityId,
          action: 'comment',
          actor_name: actor,
          actor_email: session?.email||null,
          changes: { message: msg },
          company_id: companyId,
          ts: new Date().toISOString()
        });
        if(error) throw error;
        input.value = '';
        await load(); // reload comments
      }catch(err){
        btn.disabled=false; btn.textContent='Enviar';
        alert('Erro ao enviar comentário: '+(err.message||err));
      }
    };

    // Ctrl+Enter to send
    const input = container.querySelector('#cmtInput');
    if(input) input.addEventListener('keydown', e=>{
      if((e.ctrlKey||e.metaKey) && e.key==='Enter') container.querySelector('#cmtSend').click();
    });
  }

  // Deterministic color from name string
  function stringToColor(str){
    let h = 0;
    for(let i=0;i<str.length;i++) h = str.charCodeAt(i) + ((h<<5)-h);
    const hue = ((h%360)+360)%360;
    return `hsl(${hue},55%,40%)`;
  }

  await load();
}

/* ===== Synergy Tracker ===== */
function renderDealSynergies(company, deal){
  const syns = (deal.synergies||[]);
  const filter = view.synergyFilter || 'all';
  const filtered = filter==='all' ? syns : syns.filter(s=>s.type===filter);
  const totalPlan = syns.reduce((s,x)=>s+(Number(x.plannedValue)||0),0);
  const totalReal = syns.reduce((s,x)=>s+(Number(x.realizedValue)||0),0);
  const costPlan = syns.filter(x=>x.type==='cost').reduce((s,x)=>s+(Number(x.plannedValue)||0),0);
  const costReal = syns.filter(x=>x.type==='cost').reduce((s,x)=>s+(Number(x.realizedValue)||0),0);
  const revPlan = syns.filter(x=>x.type==='revenue').reduce((s,x)=>s+(Number(x.plannedValue)||0),0);
  const revReal = syns.filter(x=>x.type==='revenue').reduce((s,x)=>s+(Number(x.realizedValue)||0),0);
  const pct = totalPlan>0 ? Math.round(totalReal/totalPlan*100) : 0;

  const node = el(`
    <div class="space-y-4">
      <div class="grid grid-cols-2 md:grid-cols-5 gap-2">
        <div class="mini-stat"><div class="lbl">Plano total</div><div class="val">${fmtBRL(totalPlan)}</div></div>
        <div class="mini-stat"><div class="lbl">Realizado</div><div class="val">${fmtBRL(totalReal)}</div></div>
        <div class="mini-stat"><div class="lbl">% Captura</div><div class="val">${pct}%</div></div>
        <div class="mini-stat"><div class="lbl">Custo (P/R)</div><div class="val">${fmtBRL(costReal)} / ${fmtBRL(costPlan)}</div></div>
        <div class="mini-stat"><div class="lbl">Receita (P/R)</div><div class="val">${fmtBRL(revReal)} / ${fmtBRL(revPlan)}</div></div>
      </div>

      <div class="bhub-card p-3">
        <canvas id="synChart" height="80"></canvas>
      </div>

      <div class="flex items-center justify-between flex-wrap gap-2">
        <div class="flex gap-1">
          <button class="btn ${filter==='all'?'btn-primary':'btn-secondary'}" data-sf="all">Todas (${syns.length})</button>
          <button class="btn ${filter==='cost'?'btn-primary':'btn-secondary'}" data-sf="cost">Custo (${syns.filter(x=>x.type==='cost').length})</button>
          <button class="btn ${filter==='revenue'?'btn-primary':'btn-secondary'}" data-sf="revenue">Receita (${syns.filter(x=>x.type==='revenue').length})</button>
        </div>
        ${canEdit() ? `<button id="addSyn" class="btn btn-primary">+ Sinergia</button>`:''}
      </div>

      ${filtered.length ? `
      <div class="bhub-card overflow-hidden">
        <div class="scroll-x">
          <table class="w-full">
            <thead><tr><th class="min-w-[14rem]">SINERGIA</th><th>ÁREA</th><th>TIPO</th><th>STATUS</th><th class="text-right">PLANO</th><th class="text-right">REAL</th><th class="text-right">%</th><th>OWNER</th><th class="min-w-[12rem]">NOTAS</th>${canEdit()?'<th></th>':''}</tr></thead>
            <tbody>
              ${filtered.map(s=>{
                const p = Number(s.plannedValue)||0, r = Number(s.realizedValue)||0;
                const pc = p>0?Math.round(r/p*100):0;
                const st = SYNERGY_STATUSES.find(x=>x.id===s.status);
                const ph = DEFAULT_PHASES.find(x=>x.id===s.targetPhase);
                return `<tr>
                  <td><div class="font-medium">${escapeHtml(s.name||'')}</div></td>
                  <td class="text-xs">${s.area?`<span class="deal-link" data-area="${escapeHtml(s.area)}">${escapeHtml(s.area)}</span>`:''}</td>
                  <td><span class="pill ${s.type==='cost'?'sev-med':'sev-low'}">${s.type==='cost'?'💸 Custo':'📈 Receita'}</span></td>
                  <td>${st?`<span class="pill">${st.label}</span>`:''}</td>
                  <td class="text-right">${fmtBRL(p)}</td>
                  <td class="text-right">${fmtBRL(r)}</td>
                  <td class="text-right ${pc>=100?'text-green-700':pc>=70?'text-blue-700':'text-amber-700'}">${pc}%</td>
                  <td class="text-xs">${s.owner?`<span class="deal-link" data-owner="${escapeHtml(s.owner)}">${escapeHtml(s.owner)}</span>`:''}</td>
                  <td class="text-xs">${escapeHtml(s.notes||'')}</td>
                  ${canEdit()?`<td><button class="btn btn-secondary" data-syn-edit="${s.id}">✎</button></td>`:''}
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>` : `<div class="bhub-card p-8 text-center text-gray-500 text-sm">Nenhuma sinergia cadastrada. ${canEdit()?'Comece adicionando as oportunidades identificadas no Due Diligence.':''}</div>`}
    </div>
  `);
  node.querySelectorAll('[data-sf]').forEach(b=>b.onclick = ()=>{ view.synergyFilter=b.dataset.sf; render(); });
  const add = node.querySelector('#addSyn');

  node.querySelectorAll('[data-syn-edit]').forEach(b=>b.onclick = ()=>openSynergyModal(company, b.dataset.synEdit));

  // Render chart after attach
  setTimeout(()=>{
    const canvas = node.querySelector('#synChart');
    if(canvas && window.Chart){
      const ctx = canvas.getContext('2d');
      const byArea = {};
      syns.forEach(s=>{
        const a = s.area || '(sem área)';
        if(!byArea[a]) byArea[a] = {plan:0, real:0};
        byArea[a].plan += Number(s.plannedValue)||0;
        byArea[a].real += Number(s.realizedValue)||0;
      });
      const labels = Object.keys(byArea);
      new Chart(ctx, {
        type:'bar',
        data:{
          labels,
          datasets:[
            {label:'Plano', data:labels.map(l=>byArea[l].plan), backgroundColor:'#94a3b8'},
            {label:'Realizado', data:labels.map(l=>byArea[l].real), backgroundColor:'#0171E4'},
          ]
        },
        options:{
          responsive:true, maintainAspectRatio:false,
          plugins:{legend:{position:'top'}, title:{display:true,text:'Sinergias por área (R$)'}},
          scales:{y:{ticks:{callback:v=>'R$ '+(v/1000).toFixed(0)+'k'}}}
        }
      });
    }
  },0);
  return node;
}

/* ===== Histórico / Auditoria ===== */
const AUDIT_FIELD_LABELS = {
  task:'Tarefa', status:'Status', owner:'Owner', prazo:'Prazo (dias)',
  completado:'Concluído (%)', bloqueio:'Bloqueio', ref:'REF', area:'Área',
  data_real:'Data real', due_date:'Data prevista', raid_id:'Ação de Mitigação',
  proximo_passo:'Próximo passo', bloqueio_descricao:'Descrição do bloqueio',
  ferramenta:'Ferramenta', evidencia:'Evidência', pending_approval:'Aprovação pendente',
  title:'Título', severity:'Severidade', mitigation:'Mitigação',
  risco_desc:'Risco', issue_desc:'Issue', decisao_desc:'Decisão', premissa_desc:'Premissa',
  name:'Nome', sign_date:'Data assinatura',
  planned_value:'Valor planejado', realized_value:'Valor realizado',
  message:'Mensagem', type:'Tipo', participants:'Participantes',
};
const AUDIT_SKIP_FIELDS = new Set(['company_id','id','created_at','updated_at','_ts']);
function _auditEmpty(v){ return v===null||v===undefined||String(v||'').trim()===''||v==='null'; }
function describeAuditChanges(row){
  const c = row.changes;
  if(!c) return '';
  if(row.action==='comment') return `<span style="color:#374151;font-style:italic">"${escapeHtml(c.message||'')}"</span>`;
  if(row.action==='insert') return '';
  if(row.action==='delete') return '';
  const entries = Object.entries(c)
    .filter(([k,v])=>{
      if(AUDIT_SKIP_FIELDS.has(k)) return false;
      const ov = v?.old; const nv = v?.new;
      if(_auditEmpty(ov) && _auditEmpty(nv)) return false;
      if(String(ov??'').trim()===String(nv??'').trim()) return false;
      return true;
    })
    .slice(0,8);
  if(!entries.length) return '';
  function resolveVal(k, raw){
    if(_auditEmpty(raw)) return null;
    const s = String(raw);
    // UUIDs for raid_id → resolve to RAID title
    if(k==='raid_id'||k==='raid_item_id'){
      const r = state.raid.find(x=>x.id===s);
      return r ? (r.title||s).slice(0,80) : s.slice(0,36);
    }
    // company_id → company name
    if(k==='company_id'||k==='deal_id'){
      const c = state.companies.find(x=>x.id===s);
      return c ? c.name : s.slice(0,36);
    }
    return s.slice(0,80);
  }
  return entries.map(([k,v])=>{
    const label = AUDIT_FIELD_LABELS[k] || k.replace(/_/g,' ');
    const ovText = resolveVal(k, v?.old);
    const nvText = resolveVal(k, v?.new);
    const ov = ovText===null
      ? `<span style="color:#9ca3af">vazio</span>`
      : `<span style="background:#fee2e2;color:#991b1b;padding:.05rem .3rem;border-radius:3px">${escapeHtml(ovText)}</span>`;
    const nv = nvText===null
      ? `<span style="color:#9ca3af">vazio</span>`
      : `<span style="background:#dcfce7;color:#166534;padding:.05rem .3rem;border-radius:3px;font-weight:600">${escapeHtml(nvText)}</span>`;
    return `<span style="color:#6b7280;font-size:.68rem">${escapeHtml(label)}</span>&nbsp;${ov}&nbsp;→&nbsp;${nv}`;
  }).join('<br>');
}
function entityIcon(t){
  return {task:'📋', companies:'🏢', raid_items:'🛡️', synergies:'💰', health_entries:'🚦', template_tasks:'📐', comments:'💬', attachments:'📎', task_dependencies:'🔗'}[t]||'•';
}
function entityLabel(t){
  return {tasks:'Tarefa', companies:'Empresa', raid_items:'RAID', synergies:'Sinergia', health_entries:'Health', template_tasks:'Template', comments:'Comentário', attachments:'Anexo', task_dependencies:'Dependência'}[t]||t;
}

      const name = entityName(r);
      const nameHtml = name ? `<span style="background:#f1f5f9;padding:.1rem .35rem;border-radius:4px;color:#374151;font-weight:500">${escapeHtml(name)}</span>` : '';
      const changes = describeAuditChanges(r);
      return `<div style="border-left:3px solid ${borderColor};padding:.4rem .6rem .4rem .75rem;background:#fafafa;border-radius:0 6px 6px 0">

            ${nameHtml ? ' ' + nameHtml : ''}
          </div>
          <div style="color:#9ca3af;font-size:.68rem;white-space:nowrap">${escapeHtml(whenStr)}</div>
        </div>
        ${changes ? `<div style="margin-top:.3rem;line-height:1.6">${changes}</div>` : ''}
      </div>`;
    }).join('')}</div>`;
  }
  wrap.querySelector('#histType').addEventListener('change', load);
  wrap.querySelector('#histReload').addEventListener('click', load);
  load();
  return wrap;
}

  const board = el(`<div class="bhub-card p-3"></div>`);
  wrap.appendChild(ui);
  wrap.appendChild(board);

  function statusColor(s){ return s==='done'?'#16a34a':s==='late'?'#F25461':s==='ontrack'?'#0171E4':'#94a3b8'; }
  function fmtShort(d){ return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); }

  function pctOf(d){ return Math.max(0,Math.min(100,((d - minD)/totalMs)*100)); }
  function widthBetween(a,b){ return Math.max(1, ((b - a)/totalMs)*100); }

  // Marcadores de meses
  function monthMarkers(){
    const out = [];
    const cur = new Date(minD.getFullYear(), minD.getMonth(), 1);
    while(cur <= maxD){
      out.push(new Date(cur));
      cur.setMonth(cur.getMonth()+1);
    }
    return out;
  }
  function todayMarker(){
    const today = new Date(); today.setHours(0,0,0,0);
    if(today >= minD && today <= maxD) return pctOf(today);
    return null;
  }

  function buildGroups(by, statusFilter){
    const filt = items.filter(x=>{
      if(statusFilter==='all') return true;
      if(statusFilter==='open') return x.status==='ontrack' || x.status==='late' || x.status==='empty';
      return x.status === statusFilter;
    });
    if(by==='phase'){
      return DEFAULT_PHASES
        .map(p=>({label:p.name, color:p.color, items: filt.filter(x=>x.phase?.id===p.id).sort((a,b)=>a.end-b.end)}))
        .filter(g=>g.items.length);
    }
    if(by==='area'){
      const areas = Array.from(new Set(filt.map(x=>x.t.area||'(sem área)')));
      return areas.sort().map(a=>({label:a, color:'#0F1727', items: filt.filter(x=>(x.t.area||'(sem área)')===a).sort((a,b)=>a.end-b.end)}));
    }
    // owner
    const owners = Array.from(new Set(filt.map(x=>x.t.owner||'(sem owner)')));
    return owners.sort().map(o=>({label:o, color:'#0F1727', items: filt.filter(x=>(x.t.owner||'(sem owner)')===o).sort((a,b)=>a.end-b.end)}));
  }

  function renderBoard(){
    const by = ui.querySelector('#gnGroup').value;
    const st = ui.querySelector('#gnStatus').value;
    const grps = buildGroups(by, st);
    const months = monthMarkers();
    const tMark = todayMarker();

    let html = `
      <div class="overflow-x-auto">
        <div style="min-width:900px">
          <div class="flex border-b text-xs text-gray-600 pb-1 mb-2" style="border-color:var(--bhub-border)">
            <div style="width:220px" class="font-semibold">Tarefa</div>
            <div class="flex-1 relative" style="height:18px">
              ${months.map(m=>`<div style="position:absolute;left:${pctOf(m)}%;font-size:10px;color:#94a3b8">${m.toLocaleDateString('pt-BR',{month:'short'})}</div>`).join('')}
            </div>
          </div>
    `;
    grps.forEach(g=>{
      html += `<div class="text-xs font-bold mt-3 mb-1" style="color:${g.color};font-family:'Roboto'">${escapeHtml(g.label)} <span class="text-gray-400 font-normal">· ${g.items.length}</span></div>`;
      g.items.forEach(x=>{
        const left = pctOf(x.start);
        const right = pctOf(x.end);
        const w = Math.max(0.8, right - left);
        const color = statusColor(x.status);
        const tip = `${x.t.tarefa} — ${statusLabel(x.status)} · fim: ${fmtShort(x.end)}${x.t.owner?` · ${x.t.owner}`:''}`;
        html += `
          <div class="flex items-center text-xs py-0.5 hover:bg-gray-50 rounded gantt-row" data-task-id="${escapeHtml(x.t.id)}" style="cursor:pointer">
            <div style="width:220px" class="truncate pr-2" title="${escapeHtml(x.t.tarefa)}">${escapeHtml(x.t.tarefa)}</div>
            <div class="flex-1 relative" style="height:18px;background:linear-gradient(to right,#f1f5f9 0,#f1f5f9 100%);border-radius:3px">
              ${months.map(m=>`<div style="position:absolute;left:${pctOf(m)}%;top:0;bottom:0;width:1px;background:#e5e7eb"></div>`).join('')}
              ${tMark!==null?`<div style="position:absolute;left:${tMark}%;top:-2px;bottom:-2px;width:2px;background:#F25461;z-index:3"></div>`:''}
              <div title="${escapeHtml(tip)}" style="position:absolute;left:${left}%;width:${w}%;top:3px;bottom:3px;background:${color};border-radius:3px;opacity:.9"></div>
            </div>
          </div>
        `;
      });
    });
    html += `</div></div>`;
    board.innerHTML = html;
    board.querySelectorAll('.gantt-row').forEach(r=>{
      r.addEventListener('click', ()=>{
        const id = r.dataset.taskId;
        if(typeof openTaskModal === 'function') openTaskModal(company, id);
      });
    });
  }
  ui.querySelector('#gnGroup').addEventListener('change', renderBoard);
  ui.querySelector('#gnStatus').addEventListener('change', renderBoard);
  renderBoard();
  return wrap;
}

function renderDealBriefing(company, deal, tasks){
  const total = tasks.length;
  const done = tasks.filter(t=>t._f.status==='done').length;
  const ontrack = tasks.filter(t=>t._f.status==='ontrack').length;
  const late = tasks.filter(t=>t._f.status==='late').length;
  const blocked = tasks.filter(t=>t.bloqueio==='Sim').length;
  const noowner = tasks.filter(t=>!t.owner).length;
  const pct = total?Math.round(done/total*100):0;

  const raid = deal.raid||[];
  const openRaid = raid.filter(r=>r.status!=='closed');
  const topRisks = openRaid.filter(r=>r.riscoDesc).sort((a,b)=>sevRank(b.severity)-sevRank(a.severity)).slice(0,3);
  const openIssues = openRaid.filter(r=>r.issueDesc).length;

  const syns = deal.synergies||[];
  const synPlan = syns.reduce((s,x)=>s+(Number(x.plannedValue)||0),0);
  const synReal = syns.reduce((s,x)=>s+(Number(x.realizedValue)||0),0);
  const synPct = synPlan>0 ? Math.round(synReal/synPlan*100) : 0;

  // Tarefas mais atrasadas (top 5)
  const topLate = tasks.filter(t=>t._f.status==='late' && t._f.diasAtraso)
    .sort((a,b)=>b._f.diasAtraso-a._f.diasAtraso).slice(0,5);

  // Próximos vencimentos (até 14 d.u.)
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = [];
  tasks.forEach(t=>{
    if(t._f.status==='ontrack' && t._f.dataPrevista){
      const diff = businessDaysBetween(today, t._f.dataPrevista);
      if(diff!==null && diff>=0 && diff<=14){
        upcoming.push({task:t.task, area:t.area, owner:t.owner, due:t._f.dataPrevista, diff});
      }
    }
  });
  upcoming.sort((a,b)=>a.diff-b.diff);

  // Bloqueios ativos
  const blocks = tasks.filter(t=>t.bloqueio==='Sim').map(t=>({area:t.area, task:t.task, owner:t.owner, desc:t.bloqueioDescricao}));

  // Status por área (último RAG)
  const allAreas = Array.from(new Set([
    ...DEFAULT_AREAS.map(a=>a.name),
    ...tasks.map(t=>t.area),
    ...(deal.health||[]).map(h=>h.area)
  ].filter(Boolean)));
  function lastRagFor(area){
    const arr = (deal.health||[]).filter(h=>h.area===area).sort((a,b)=>b.weekIso.localeCompare(a.weekIso));
    return arr[0]?.rag || 'na';
  }
  const areaRags = allAreas.map(a=>({area:a, rag:lastRagFor(a)}));

  // Dias desde a assinatura
  let daysSinceSign = null;
  if(company.signDate){
    const d = parseDate(company.signDate);
    if(d){
      const diffMs = today.getTime() - d.getTime();
      daysSinceSign = Math.floor(diffMs/86400000);
    }
  }

  // Status overall
  let overall = 'g', overallLabel = 'Saudável';
  if(late>0 || blocked>0 || topRisks.some(r=>r.severity==='high')){ overall='r'; overallLabel='Atenção crítica'; }
  else if(noowner>0 || openIssues>0 || pct<25){ overall='a'; overallLabel='Atenção'; }

  const node = el(`
    <div class="briefing-page space-y-4">
      <div class="flex items-center justify-end gap-2 no-print">
        <button id="downloadPdf" class="btn btn-primary">📥 Baixar PDF</button>
        <button id="print" class="btn btn-secondary">🖨 Imprimir</button>
      </div>
      <div class="bhub-card p-6 space-y-5">
        <!-- Cabeçalho -->
        <div class="flex items-center justify-between flex-wrap gap-3">
          <div>
            <div class="text-xs uppercase tracking-wider" style="color:var(--bhub-muted)">Executive Briefing</div>
            <h2 class="text-2xl font-bold" style="color:var(--bhub-navy);font-family:'Roboto'">${escapeHtml(company.name)}</h2>
            <div class="text-sm text-gray-500">
              ${isTech ? 'Início' : 'Assinatura'}: ${company.signDate?fmtDate(parseDate(company.signDate)):'—'}${daysSinceSign!==null?` (D+${daysSinceSign})`:''} • Gerado em ${fmtDate(new Date())}
            </div>
          </div>
          <span class="rag rag-${overall}" style="font-size:.8rem;padding:.3rem .7rem"><span class="rag-dot"></span>${overallLabel}</span>
        </div>

        <!-- KPIs -->
        <div class="grid grid-cols-2 md:grid-cols-4 ${isPMI ? 'lg:grid-cols-7' : 'lg:grid-cols-6'} gap-3">
          <div class="kpi"><div class="kpi-label">% Concluído</div><div class="kpi-value">${pct}%</div></div>
          <div class="kpi"><div class="kpi-label">Done / Total</div><div class="kpi-value">${done} / ${total}</div></div>
          <div class="kpi"><div class="kpi-label">On Track</div><div class="kpi-value" style="color:var(--bhub-blue)">${ontrack}</div></div>
          <div class="kpi"><div class="kpi-label">Atrasadas</div><div class="kpi-value" style="color:var(--bhub-red)">${late}</div></div>
          <div class="kpi"><div class="kpi-label">Bloqueios</div><div class="kpi-value" style="color:#92400e">${blocked}</div></div>
          <div class="kpi"><div class="kpi-label">Ações de Mitigação abertas</div><div class="kpi-value">${openRaid.length}</div></div>
          ${isPMI ? `<div class="kpi"><div class="kpi-label">Sinergia</div><div class="kpi-value">${synPct}%</div></div>` : ''}
        </div>

        <div class="grid lg:grid-cols-2 gap-5">
          <!-- Top atrasadas -->
          <section class="bhub-card p-4">
            <div class="text-sm font-semibold mb-2" style="color:var(--bhub-navy)">⚠️ Top tarefas atrasadas</div>
            ${topLate.length ? `<table class="w-full text-xs"><thead><tr><th class="text-left">TAREFA</th><th class="text-left">ÁREA</th><th>OWNER</th><th>DIAS</th></tr></thead><tbody>${topLate.map(t=>`<tr><td>${escapeHtml(t.task||'')}</td><td>${escapeHtml(t.area||'')}</td><td>${escapeHtml(t.owner||'—')}</td><td class="text-center text-red-700 font-semibold">${t._f.diasAtraso}</td></tr>`).join('')}</tbody></table>` : `<div class="text-xs text-gray-500">Nenhuma tarefa atrasada. 🎉</div>`}
          </section>

          <!-- Próximos vencimentos -->
          <section class="bhub-card p-4">
            <div class="text-sm font-semibold mb-2" style="color:var(--bhub-navy)">📅 Próximos vencimentos (≤14 d.u.)</div>
            ${upcoming.length ? `<table class="w-full text-xs"><thead><tr><th class="text-left">TAREFA</th><th class="text-left">ÁREA</th><th>OWNER</th><th>EM</th></tr></thead><tbody>${upcoming.slice(0,8).map(t=>`<tr><td>${escapeHtml(t.task||'')}</td><td>${escapeHtml(t.area||'')}</td><td>${escapeHtml(t.owner||'—')}</td><td class="text-center">${t.diff}d</td></tr>`).join('')}</tbody></table>` : `<div class="text-xs text-gray-500">Nada vencendo em 14 d.u.</div>`}
          </section>

          ${isPMI ? `<!-- Top riscos -->
          <section class="bhub-card p-4">
            <div class="text-sm font-semibold mb-2" style="color:var(--bhub-navy)">🛡️ Top riscos abertos</div>
            ${topRisks.length ? `<ul class="space-y-1.5 text-xs">${topRisks.map(r=>`<li class="flex items-start gap-2"><span class="pill" style="background:${r.severity==='high'?'#fee2e2':r.severity==='med'?'#fef3c7':'#dbeafe'};color:${r.severity==='high'?'#991b1b':r.severity==='med'?'#92400e':'#1e3a8a'}">${(r.severity||'').toUpperCase()}</span><span><strong>${escapeHtml(r.title||'')}</strong> <span class="text-gray-500">— ${escapeHtml(r.area||'')}</span></span></li>`).join('')}</ul>` : `<div class="text-xs text-gray-500">Sem riscos abertos.</div>`}
          </section>` : ''}

          <!-- Bloqueios -->
          <section class="bhub-card p-4">
            <div class="text-sm font-semibold mb-2" style="color:var(--bhub-navy)">🚧 Bloqueios ativos</div>
            ${blocks.length ? `<ul class="space-y-1.5 text-xs">${blocks.slice(0,5).map(b=>`<li><strong>${escapeHtml(b.task||'')}</strong> <span class="text-gray-500">— ${escapeHtml(b.area||'')}${b.owner?` • ${escapeHtml(b.owner)}`:''}</span>${b.desc?`<div class="text-gray-600 mt-0.5">${escapeHtml(b.desc)}</div>`:''}</li>`).join('')}</ul>` : `<div class="text-xs text-gray-500">Nenhum bloqueio ativo.</div>`}
          </section>
        </div>

        ${isPMI ? `<!-- Sinergias -->
        <section class="bhub-card p-4">
          <div class="flex items-center justify-between mb-2">
            <div class="text-sm font-semibold" style="color:var(--bhub-navy)">💰 Sinergias</div>
            <div class="text-xs" style="color:var(--bhub-muted)">${syns.length} item(ns)</div>
          </div>
          <div class="grid grid-cols-3 gap-3 text-xs">
            <div><div class="text-gray-500">Planejado</div><div class="text-base font-semibold">${fmtBRL(synPlan)}</div></div>
            <div><div class="text-gray-500">Realizado</div><div class="text-base font-semibold">${fmtBRL(synReal)}</div></div>
            <div><div class="text-gray-500">Captura</div><div class="text-base font-semibold">${synPct}%</div></div>
          </div>
        </section>` : ''}

        ${noowner>0 ? `<div class="text-xs px-3 py-2 rounded-md" style="background:#fef3c7;color:#92400e">⚠️ ${noowner} tarefa(s) sem responsável definido.</div>` : ''}

        <div class="text-xs text-gray-400 border-t pt-3" style="border-color:var(--bhub-border)">Documento gerado pelo BHub PMI Tracker — confidencial.</div>
      </div>
    </div>
  `);

  const btn = node.querySelector('#print');
  if(btn) btn.onclick = ()=>window.print();
  const dlBtn = node.querySelector('#downloadPdf');
  if(dlBtn) dlBtn.onclick = async ()=>{
    if(typeof html2pdf === 'undefined'){ alert('Biblioteca de PDF não carregou. Verifique sua conexão.'); return; }
    const target = node.querySelector('.bhub-card');
    if(!target) return;
    const orig = dlBtn.textContent;
    dlBtn.disabled = true;
    dlBtn.textContent = '⏳ Gerando PDF…';
    try{
      const safeName = (company.name||'briefing').replace(/[^a-zA-Z0-9_-]+/g,'_').slice(0,40);
      const stamp = new Date().toISOString().slice(0,10);
      await html2pdf().set({
        margin: [10,10,10,10],
        filename: `briefing_${safeName}_${stamp}.pdf`,
        image: { type:'jpeg', quality:0.95 },
        html2canvas: { scale:2, useCORS:true, backgroundColor:'#ffffff' },
        jsPDF: { unit:'mm', format:'a4', orientation:'portrait' },
        pagebreak: { mode:['avoid-all','css','legacy'] }
      }).from(target).save();
    }catch(err){
      alert('Erro: '+(err.message||err));
    } finally {
      dlBtn.disabled = false;
      dlBtn.textContent = orig;
    }
  };
  return node;
}

            <button id="dmCancel" class="btn btn-secondary">Cancelar</button>
            <button id="dmConfirm" class="btn btn-danger">${escapeHtml(confirmLabel)}</button>
          </div>
        </div>
      </div>`);

                  <div style="display:flex;flex-wrap:wrap;gap:.25rem" data-sa-area="${escapeHtml(area)}">
                    ${names.map(n=>`<span class="sa-chip" data-sa-area="${escapeHtml(area)}" data-sa-name="${escapeHtml(n)}"
                      style="display:inline-flex;align-items:center;gap:.25rem;background:#fff;border:1px solid #c7d2fe;border-radius:999px;padding:.1rem .5rem;font-size:.72rem;color:var(--bhub-navy)">
                      ${escapeHtml(n)}
                      <button class="sa-del" data-sa-area="${escapeHtml(area)}" data-sa-name="${escapeHtml(n)}"
                        style="background:none;border:none;cursor:pointer;color:#dc2626;font-size:.85rem;line-height:1;padding:0 .1rem" title="Remover">×</button>
                    </span>`).join('')}
                  </div>
                </div>
              `).join('');
            })()}
          </div>
          <div style="display:flex;gap:.5rem;align-items:flex-end;flex-wrap:wrap">
            <div>
              <div style="font-size:.68rem;font-weight:600;color:var(--bhub-navy);margin-bottom:.25rem">Área</div>
              <select id="saNewArea" style="font-size:.8rem;padding:.3rem .6rem">
                <option value="">— Selecione —</option>
                ${[...DEFAULT_AREAS.map(a=>a.name),...new Set(state.subAreas.map(s=>s.area))].filter((v,i,a)=>a.indexOf(v)===i).map(a=>`<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('')}
              </select>
            </div>
            <div>
              <div style="font-size:.68rem;font-weight:600;color:var(--bhub-navy);margin-bottom:.25rem">Nome da sub-área</div>
              <input id="saNewName" type="text" placeholder="ex: Cobrança" style="font-size:.8rem;padding:.3rem .6rem;width:180px" />
            </div>
            <button id="saAddBtn" class="btn btn-primary" style="font-size:.78rem;padding:.3rem .75rem">+ Adicionar</button>
          </div>
        </div>
      </section>
      ` : ''}

      ${order.map(a=>`
        <section class="bhub-card overflow-hidden">
          <div class="px-4 py-2 bg-gray-50 border-b font-semibold text-sm">${a} <span class="text-xs text-gray-500 font-normal">(${grouped[a].length})</span></div>
          <div class="scroll-x">
            <table class="w-full"><thead><tr><th>REF</th><th class="min-w-[24rem]">TAREFA</th><th>SUB-ÁREA</th><th>OWNER PADRÃO</th><th>PRAZO (d.u.)</th><th>DEPENDE DE</th>${canEdit()?'<th></th>':''}</tr></thead>
            <tbody>
              ${grouped[a].map(t=>{
                const pendingTplBadge = t.pendingApproval
                  ? ` <span title="Aguardando aprovação do admin" style="display:inline-block;font-size:.65rem;padding:.1rem .35rem;border-radius:.75rem;background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe;font-weight:600;white-space:nowrap">⏳ Aguard. aprovação</span>`
                  : '';
                const approveTplBtn = t.pendingApproval && canAdmin()
                  ? ` <button data-approve-tpl="${t.id}" title="Aprovar" style="font-size:.65rem;padding:.1rem .4rem;border-radius:.5rem;background:#dcfce7;color:#166534;border:1px solid #bbf7d0;cursor:pointer;font-weight:600">✓</button><button data-reject-tpl="${t.id}" title="Rejeitar e excluir" style="font-size:.65rem;padding:.1rem .4rem;border-radius:.5rem;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;cursor:pointer;font-weight:600">✕</button>`
                  : '';
                const blocoChip = t.bloco
                  ? `<span style="display:inline-block;font-size:.65rem;padding:.15rem .5rem;border-radius:999px;background:#ede9fe;color:#5b21b6;border:1px solid #ddd6fe;font-weight:500;white-space:nowrap">${escapeHtml(t.bloco)}</span>`
                  : `<span style="color:#d1d5db">—</span>`;
                return `<tr${t.pendingApproval?' style="opacity:.55;background:#f8faff"':''}>
                <td>${t.ref||''}</td>
                <td>${t.task||''}${pendingTplBadge}${approveTplBtn}</td>
                <td>${blocoChip}</td>
                <td>${t.defaultOwner||''}</td>
                <td class="text-center">${t.defaultPrazo||0}</td>
                <td class="text-xs text-gray-500 font-mono">${t.predecessorRefs ? escapeHtml(t.predecessorRefs) : '<span class="text-gray-300">—</span>'}</td>
                ${canEdit()?`<td><button class="btn btn-secondary" data-edt="${t.id}">✎</button></td>`:''}
              </tr>`;}).join('')}
            </tbody></table>
          </div>
        </section>
      `).join('') || `<div class="bhub-card p-10">
        <div class="flex flex-col items-center gap-3 text-gray-500 text-center">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-gray-300">
            <rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h4"/>
          </svg>
          <div class="font-medium text-gray-700">Template vazio</div>
          <div class="text-sm">O template é o conjunto de tarefas-padrão que será aplicado a novos deals.<br/>Importe a planilha do Modelo Ouro ou cadastre tarefas manualmente.</div>
          ${canEdit() ? `<button id="emptyAddTpl" class="btn btn-primary mt-2">+ Tarefa no template</button>` : ''}
        </div>
      </div>`}
    </div>
  `);
  // ── Sub-areas management panel (admin only) ──────────────────
  const saAddBtn = node.querySelector('#saAddBtn');
  if(saAddBtn){
    saAddBtn.onclick = async ()=>{
      const area = node.querySelector('#saNewArea').value.trim();
      const name = node.querySelector('#saNewName').value.trim();
      if(!area){ alert('Selecione a área.'); return; }
      if(!name){ alert('Digite o nome da sub-área.'); return; }
      if(state.subAreas.some(s=>s.area===area && s.name===name)){ alert('Já existe.'); return; }
      saAddBtn.disabled=true; saAddBtn.textContent='Salvando…';
      try{
        await ensureSubArea(area, name);
        node.querySelector('#saNewName').value = '';
        // Re-render the template page to reflect new sub-area
        render();
      }catch(err){ alert('Erro: '+(err.message||err)); saAddBtn.disabled=false; saAddBtn.textContent='+ Adicionar'; }
    };
    // Delete chips
    node.querySelectorAll('.sa-del').forEach(btn=>{
      btn.onclick = async (e)=>{
        e.stopPropagation();
        const area = btn.dataset.saArea;
        const name = btn.dataset.saName;
        if(!confirm(`Remover sub-área "${name}" de "${area}"?\nNota: tarefas existentes com essa sub-área não são alteradas.`)) return;
        btn.disabled=true;
        try{
          const { error } = await supa.from('sub_areas').delete().eq('area', area).eq('name', name);
          if(error) throw error;
          state.subAreas = state.subAreas.filter(s=>!(s.area===area && s.name===name));
          render();
        }catch(err){ alert('Erro ao remover: '+(err.message||err)); btn.disabled=false; }
      };
    });
  }

  const add = node.querySelector('#addRow');
  if(add) add.onclick = ()=>openTemplateModal();
  const emptyAdd = node.querySelector('#emptyAddTpl');
  if(emptyAdd) emptyAdd.onclick = ()=>openTemplateModal();
  const clr = node.querySelector('#clearTpl');
  if(clr) clr.onclick = ()=>{
    // Double-confirmation modal — admin only
    const total = state.template.length;
    const dm = el(`
      <div class="fixed inset-0 bg-black/50 z-20 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl w-full max-w-md shadow-2xl p-6 flex flex-col gap-4">
          <div class="flex items-center gap-3">
            <div style="background:#fee2e2;border-radius:50%;width:2.5rem;height:2.5rem;display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <div>
              <div class="font-bold text-gray-900" style="font-size:1rem">Limpar template?</div>
              <div class="text-sm text-gray-500 mt-0.5">Esta ação é <strong>irreversível</strong>. As <strong>${total} tarefas</strong> serão apagadas permanentemente do banco de dados.</div>
            </div>
          </div>
          <div class="rounded-lg p-3 text-sm" style="background:#fef2f2;border:1px solid #fecaca;color:#991b1b">
            ⚠️ Deals já criados <strong>não são afetados</strong>, mas nenhum novo deal terá tarefas aplicadas automaticamente.
          </div>
          <div>
            <label class="text-xs font-semibold block mb-1" style="color:#374151">Digite <strong>LIMPAR</strong> para confirmar:</label>
            <input id="confirmInput" type="text" placeholder="LIMPAR" autocomplete="off"
              style="width:100%;padding:.5rem .75rem;border:2px solid #e5e7eb;border-radius:.5rem;font-size:.95rem;outline:none"/>
          </div>
          <div class="flex gap-2 justify-end">
            <button id="dmCancel" class="btn btn-secondary">Cancelar</button>
            <button id="dmConfirm" class="btn btn-danger" disabled style="opacity:.4;cursor:not-allowed">Sim, limpar tudo</button>
          </div>
        </div>
      </div>`);
    document.body.appendChild(dm);
    const inp = dm.querySelector('#confirmInput');
    const btn = dm.querySelector('#dmConfirm');
    inp.focus();
    inp.addEventListener('input', ()=>{
      const ok = inp.value.trim() === 'LIMPAR';
      btn.disabled = !ok;
      btn.style.opacity = ok ? '1' : '.4';
      btn.style.cursor = ok ? 'pointer' : 'not-allowed';
    });
    dm.querySelector('#dmCancel').onclick = ()=>dm.remove();
    btn.onclick = async ()=>{
      if(inp.value.trim() !== 'LIMPAR') return;
      btn.disabled = true;
      btn.textContent = 'Apagando…';
      try{
        const ids = state.template.map(t=>t.id);
        if(ids.length){
          const { error } = await supa.from('template_tasks').delete().in('id', ids);
          if(error) throw error;
        }
        state.template = [];
        dm.remove();
        render();
      }catch(err){
        alert('Erro: '+(err.message||err));
        dm.remove();
      }
    };
  };
  node.querySelectorAll('[data-edt]').forEach(b=>b.onclick=()=>openTemplateModal(b.dataset.edt));
  // Approve/reject pending template tasks (admin only)
  node.querySelectorAll('[data-approve-tpl]').forEach(b=>b.onclick=async()=>{
    const tid = b.dataset.approveTpl;
    const { error } = await supa.from('template_tasks').update({pending_approval: false}).eq('id', tid);
    if(error){ alert('Erro: '+error.message); return; }
    const tpl = state.template.find(x=>x.id===tid);
    if(tpl) tpl.pendingApproval = false;
    render();
  });
  node.querySelectorAll('[data-reject-tpl]').forEach(b=>b.onclick=async()=>{
    const tid = b.dataset.rejectTpl;
    if(!confirm('Rejeitar e excluir esta tarefa do template?')) return;
    const { error } = await supa.from('template_tasks').delete().eq('id', tid);
    if(error){ alert('Erro: '+error.message); return; }
    state.template = state.template.filter(x=>x.id!==tid);
    render();
  });
  return node;
}
function openTemplateModal(id){
  const t = id ? state.template.find(x=>x.id===id) : {id:uid(), ref:'', area:'', task:'', defaultOwner:'', defaultPrazo:0};
  const isNew = !id;

  // Areas: DEFAULT_AREAS + quaisquer áreas customizadas já no template
  const allAreas = [...DEFAULT_AREAS.map(a=>a.name)];
  state.template.forEach(x=>{ if(x.area && !allAreas.includes(x.area)) allAreas.push(x.area); });

  // Usuários com login para o select de owner
  const users = [...(state.users||[])].sort((a,b)=>a.username.localeCompare(b.username));

  // Auto-gera REF com base na área selecionada
  function nextRefForArea(areaName){
    const idx = DEFAULT_AREAS.findIndex(a=>a.name===areaName);
    // Áreas canônicas → prefixo 1-based; áreas customizadas → após o último canônico
    const prefix = idx >= 0 ? idx + 1 : DEFAULT_AREAS.length + 1;
    const nums = state.template
      .filter(x=>x.area===areaName && x.id!==t.id)
      .map(x=>{ const p=(x.ref||'').split('.'); return p.length>=2?parseInt(p[1]):0; })
      .filter(n=>!isNaN(n)&&n>0);
    return `${prefix}.${nums.length?Math.max(...nums)+1:1}`;
  }

  const initRef = t.ref || (t.area ? nextRefForArea(t.area) : '');

  const m = el(`
  <div class="fixed inset-0 bg-black/40 z-20 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl w-full max-w-xl shadow-xl flex flex-col" style="max-height:90vh">
      <div class="p-6 pb-3">
        <div class="text-lg font-semibold mb-4">${isNew?'Nova tarefa no template':'Editar tarefa do template'}</div>
        <form id="tplForm" class="flex flex-col gap-3 text-sm">

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold block mb-1" style="color:var(--bhub-navy)">Área *</label>
              <select name="area" id="tplArea" required>
                <option value="">Selecione a área…</option>
                ${allAreas.map(a=>`<option value="${escapeHtml(a)}"${t.area===a?' selected':''}>${escapeHtml(a)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="text-xs font-semibold block mb-1" style="color:var(--bhub-navy)">
                Sub-área
                <span style="color:var(--bhub-muted);font-weight:400">— opcional</span>
              </label>
              ${canAdmin() ? `
                <input name="bloco" id="tplBloco" list="tplBlocoList" value="${escapeHtml(t.bloco||'')}"
                  placeholder="${t.area ? 'Selecione ou digite…' : 'Selecione uma área primeiro'}"
                  autocomplete="off" ${!t.area ? 'disabled style="opacity:.45;cursor:not-allowed"' : ''} />
                <datalist id="tplBlocoList">
                  ${state.subAreas.filter(s=>s.area===t.area).map(s=>`<option value="${escapeHtml(s.name)}"></option>`).join('')}
                </datalist>
              ` : `
                <select name="bloco" id="tplBloco" ${!t.area ? 'disabled style="opacity:.45;cursor:not-allowed"' : ''}>
                  <option value="">${t.area ? '— Nenhuma —' : 'Selecione uma área primeiro'}</option>
                  ${state.subAreas.filter(s=>s.area===t.area).map(s=>`<option value="${escapeHtml(s.name)}"${t.bloco===s.name?' selected':''}>${escapeHtml(s.name)}</option>`).join('')}
                </select>
              `}
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold block mb-1" style="color:var(--bhub-navy)">
                REF # <span style="color:var(--bhub-muted);font-weight:400">(automático)</span>
              </label>
              <input name="ref" id="tplRef" value="${escapeHtml(initRef)}"
                style="background:var(--bhub-beige-soft);color:var(--bhub-muted);cursor:default" readonly/>
            </div>
            <div>
              <label class="text-xs font-semibold block mb-1" style="color:var(--bhub-navy)">Prazo (d.u.)</label>
              <input name="defaultPrazo" type="number" min="0" value="${t.defaultPrazo||0}"/>
            </div>
          </div>

          <div>
            <label class="text-xs font-semibold block mb-1" style="color:var(--bhub-navy)">Tarefa *</label>
            <textarea name="task" rows="3" required>${escapeHtml(t.task||'')}</textarea>
          </div>

          <div>
            <label class="text-xs font-semibold block mb-1" style="color:var(--bhub-navy)">
              Owner padrão
              <span style="color:var(--bhub-muted);font-weight:400">— aparecerá na Visão Usuário</span>
            </label>
            <select name="defaultOwner" id="tplOwner">
              <option value="">— Sem owner —</option>
              ${users.map(u=>`<option value="${escapeHtml(u.username)}"${t.defaultOwner===u.username?' selected':''}>${escapeHtml(u.username)}</option>`).join('')}
            </select>
          </div>

          <div>
            <label class="text-xs font-semibold block mb-1" style="color:var(--bhub-navy)">
              🔗 Dependências
              <span style="color:var(--bhub-muted);font-weight:400">— REFs que precisam ser concluídas antes</span>
            </label>
            ${(()=>{
              const selectedRefs = (t.predecessorRefs||'').split(',').map(r=>r.trim()).filter(Boolean);
              const sortRef = (a,b)=>{ const p=(s)=>{const[x,y]=(s||'').split('.'); return [parseInt(x)||0,parseInt(y)||0];}; const[ax,ay]=p(a.ref); const[bx,by]=p(b.ref); return ax!==bx?ax-bx:ay-by; };
              const others = state.template.filter(x=>x.id!==t.id).sort(sortRef);
              const areas = [...new Set(others.map(x=>x.area).filter(Boolean))].sort();
              if(others.length===0) return '<div class="text-xs text-gray-400 py-1 border rounded-lg p-2">Nenhuma outra tarefa no template ainda.</div>';
              return `
              <select id="predAreaFilter" class="mb-1 text-xs" style="padding:.25rem .5rem;border-radius:.4rem;border:1px solid var(--bhub-border);background:#fff;width:100%">
                <option value="">— Todas as áreas —</option>
                ${areas.map(a=>`<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('')}
              </select>
              <div id="predList" class="border rounded-lg p-2 bg-gray-50 max-h-40 overflow-y-auto" style="border-color:var(--bhub-border)">
                ${others.map(x=>`
                  <label class="pred-row flex items-center gap-2 text-xs py-0.5 cursor-pointer hover:bg-gray-100 rounded px-1" data-area="${escapeHtml(x.area||'')}">
                    <input type="checkbox" name="predecessorRefs" value="${escapeHtml(x.ref)}"${selectedRefs.includes(x.ref)?' checked':''}>
                    <span class="font-mono text-gray-400 shrink-0" style="min-width:2.5rem">${escapeHtml(x.ref)}</span>
                    <span class="truncate">${escapeHtml(x.task)}</span>
                  </label>`).join('')}
              </div>`;
            })()}
          </div>

          <div class="flex justify-end gap-2 pt-3 border-t" style="border-color:var(--bhub-border)">
            ${!isNew?`<button type="button" id="del" class="btn btn-danger mr-auto">Excluir</button>`:''}
            <button type="button" id="cancel" class="btn btn-secondary">Cancelar</button>
            <button class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>`);

  document.body.appendChild(m);

  // Auto-preenche REF ao mudar área; habilita e atualiza opções de sub-área
  m.querySelector('#tplArea').addEventListener('change', e=>{
    m.querySelector('#tplRef').value = nextRefForArea(e.target.value);
    const selectedArea = e.target.value;
    const blocoEl = m.querySelector('#tplBloco');
    if(!blocoEl) return;
    const filtered = state.subAreas.filter(s => s.area === selectedArea);
    blocoEl.disabled = !selectedArea;
    blocoEl.style.opacity = selectedArea ? '' : '.45';
    blocoEl.style.cursor = selectedArea ? '' : 'not-allowed';
    if(canAdmin()){
      const dl = m.querySelector('#tplBlocoList');
      if(dl){ dl.innerHTML = filtered.map(s=>`<option value="${escapeHtml(s.name)}"></option>`).join(''); }
      blocoEl.value = '';
      blocoEl.placeholder = selectedArea ? 'Selecione ou digite…' : 'Selecione uma área primeiro';
    } else {
      blocoEl.innerHTML = `<option value="">${selectedArea ? '— Nenhuma —' : 'Selecione uma área primeiro'}</option>`
        + filtered.map(s=>`<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`).join('');
    }
  });

  // Filtro de área nas dependências
  const predAreaFilter = m.querySelector('#predAreaFilter');
  if(predAreaFilter){
    predAreaFilter.addEventListener('change', ()=>{
      const sel = predAreaFilter.value;
      m.querySelectorAll('.pred-row').forEach(row=>{
        row.style.display = (!sel || row.dataset.area === sel) ? '' : 'none';
      });
    });
  }

  m.querySelector('#cancel').onclick = ()=>m.remove();

  m.querySelector('#tplForm').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const selectedPreds = Array.from(m.querySelectorAll('input[name="predecessorRefs"]:checked')).map(cb=>cb.value);
    const upd = {
      ref: fd.get('ref').trim(),
      area: fd.get('area').trim(),
      bloco: (fd.get('bloco')||'').trim(),
      task: fd.get('task').trim(),
      defaultOwner: fd.get('defaultOwner').trim(),
      defaultPrazo: parseInt(fd.get('defaultPrazo'))||0,
      ordering: t.ordering || (state.template.length),
      predecessorRefs: selectedPreds.join(', ')
    };
    const needsApproval = !canAdmin();
    try{
      // Se admin digitou uma sub-área nova, persiste na tabela de referência
      if(canAdmin() && upd.bloco && upd.area) await ensureSubArea(upd.area, upd.bloco);
      if(isNew){
        const payload = { ...tplToDb(upd), pending_approval: needsApproval };
        const { data, error } = await supa.from('template_tasks').insert(payload).select().single();
        if(error) throw error;
        state.template.push(tplFromDb(data));
      }else{
        const payload = { ...tplToDb(upd), pending_approval: needsApproval ? true : (t.pendingApproval || false) };
        const { error } = await supa.from('template_tasks').update(payload).eq('id', t.id);
        if(error) throw error;
        Object.assign(t, upd);
        if(needsApproval) t.pendingApproval = true;
      }
      m.remove(); render();
      if(needsApproval){
        const toast = el(`<div style="position:fixed;bottom:1.5rem;right:1.5rem;background:#1e2d45;color:#fff;padding:.75rem 1.25rem;border-radius:.75rem;font-size:.85rem;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:320px">
          ⏳ Tarefa enviada para aprovação do admin. Ficará ativa após aprovação.
          </div>`);
        document.body.appendChild(toast);
        setTimeout(()=>toast.remove(), 4000);
      }
    }catch(err){ alert('Erro ao salvar: '+(err.message||err)); }
  };

  const del = m.querySelector('#del');
  if(del) del.onclick = async ()=>{
    if(!canAdmin() && !t.pendingApproval){ alert('Apenas admins podem excluir tarefas aprovadas do template.'); return; }
    if(!confirm('Excluir?')) return;
    try{
      const { error } = await supa.from('template_tasks').delete().eq('id', t.id);
      if(error) throw error;
      state.template = state.template.filter(x=>x.id!==t.id);
      m.remove(); render();
    }catch(err){ alert('Erro: '+(err.message||err)); }
  };
}

/* ---------- Usuários (read-only) + Admin actions ---------- */
/* ===== User Management helpers ===== */
async function createUserViaFunction(email, password, role, username){
  // Chama a Edge Function create-user (server-side, usa service_role key).
  // Requer que o caller seja admin — o JWT é enviado no header.
  const { data: { session } } = await supa.auth.getSession();
  const token = session?.access_token;
  if(!token) throw new Error('Sessão expirada — faça login novamente');

  const res = await fetch(`${SUPABASE_FUNCTIONS_URL}/create-user`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`,
    },
    body: JSON.stringify({ email, password, role, username: username || email.split('@')[0] }),
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || `Erro ${res.status}`);
  return data;
}

async function changeUserRole(userId, newRole){
  const { error } = await supa.from('profiles').update({ role: newRole }).eq('id', userId);
  if(error) throw error;
  // Atualiza state local
  const u = state.users.find(x=>x.id===userId);
  if(u) u.role = newRole;
}

async function removeUserProfile(userId){
  const { error } = await supa.from('profiles').delete().eq('id', userId);
  if(error) throw error;
  state.users = state.users.filter(u=>u.id!==userId);
}

/* Edita o nome de exibição (owner name) de um usuário */
function openEditUsernameModal(user){
  const m = el(`
  <div class="fixed inset-0 bg-black/40 z-20 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl w-full max-w-sm p-6 shadow-xl">
      <div class="text-lg font-semibold mb-1" style="font-family:'Roboto'">Editar nome de owner</div>
      <p class="text-sm text-gray-500 mb-4">Este nome deve ser <strong>idêntico</strong> ao campo Owner nas planilhas para que o "Hoje" funcione corretamente.</p>
      <form id="editNameForm" class="space-y-3">
        <div>
          <label class="text-xs font-semibold uppercase tracking-wider" style="color:var(--bhub-muted)">Nome de exibição</label>
          <input name="username" type="text" value="${escapeHtml(user.username)}" placeholder="Ex: Thiago Lobato" required />
        </div>
        <div id="editNameErr" class="text-xs rounded-lg p-2 hidden" style="color:#991b1b;background:#fee2e2"></div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="cancelEdit" class="btn btn-secondary">Cancelar</button>
          <button class="btn btn-primary" id="saveNameBtn">Salvar</button>
        </div>
      </form>
    </div>
  </div>`);
  document.body.appendChild(m);
  m.querySelector('#cancelEdit').onclick = ()=>m.remove();
  m.querySelector('#editNameForm').onsubmit = async (e)=>{
    e.preventDefault();
    const newName = new FormData(e.target).get('username').trim();
    if(!newName) return;
    const btn = m.querySelector('#saveNameBtn');
    const errEl = m.querySelector('#editNameErr');
    btn.disabled=true; btn.textContent='Salvando…';
    errEl.classList.add('hidden');
    try{
      const {error} = await supa.from('profiles').update({username: newName}).eq('id', user.id);
      if(error) throw error;
      // Atualiza sessão local se for o próprio usuário
      if(session && user.id===session.id) session.username = newName;
      m.remove();
      await reloadState(); render();
    }catch(err){
      errEl.textContent = err.message||'Erro ao salvar nome';
      errEl.classList.remove('hidden');
      btn.disabled=false; btn.textContent='Salvar';
    }
  };
}

/* ================================================================
   HOMEBROKER — visão PMO executiva de integração (McKinsey style)
   ================================================================ */
function renderHomebroker(){
  if(!canAdmin()) return el('<div></div>');
  const today = new Date(); today.setHours(0,0,0,0);
  const data = aggregate();
  if(!view.hbWatchlist) view.hbWatchlist = [];
  if(!view.hotlistOpen) view.hotlistOpen = {};

  // ── Deal status helper ──────────────────────────────────────────
  function dealStatus(d){
    const pct = d.total > 0 ? d.late/d.total*100 : 0;
    if(pct > 30) return { label:'Crítico',  color:'#dc2626', dot:'#dc2626' };
    if(pct > 15) return { label:'Em Risco', color:'#d97706', dot:'#d97706' };
    return               { label:'On Track',color:'#16a34a', dot:'#16a34a' };
  }

  // ── WATCHLIST ───────────────────────────────────────────────────
  const watchDeals     = view.hbWatchlist.map(id=>data.find(d=>d.company.id===id)).filter(Boolean);
  const availableToAdd = data.filter(d=>!view.hbWatchlist.includes(d.company.id));
  const watchCardsHtml = watchDeals.map(d=>{
    const st = dealStatus(d);
    const latePct = d.total>0 ? Math.round(d.late/d.total*100) : 0;
    return '<div style="border:1.5px solid '+st.dot+';border-radius:.75rem;padding:.65rem .85rem;min-width:180px;max-width:220px;position:relative;background:#fff">'
      +'<button class="hb-watch-remove" data-remove-watch="'+d.company.id+'" style="position:absolute;top:.3rem;right:.4rem;background:none;border:none;cursor:pointer;color:var(--bhub-muted);font-size:.9rem;line-height:1;padding:.1rem" title="Remover">\xd7</button>'
      +'<div style="display:flex;align-items:center;gap:.45rem;margin-bottom:.35rem">'
      +'<span style="display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:'+st.dot+';flex-shrink:0"></span>'
      +'<span style="font-size:.82rem;font-weight:700;color:var(--bhub-navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px">'+escapeHtml(d.company.name)+'</span>'
      +'</div>'
      +'<div style="font-size:.72rem;color:var(--bhub-muted)">'+d.total+' tarefas \xb7 '+latePct+'% atrasadas</div>'
      +'<div style="font-size:.72rem;font-weight:700;color:'+st.color+';margin-top:.2rem">'+st.label+'</div>'
      +'</div>';
  }).join('');
  const addSelectHtml = availableToAdd.length
    ? '<div style="min-width:200px"><select id="hbAddWatch" style="width:100%;padding:.45rem .6rem;border:1.5px dashed var(--bhub-border);border-radius:.75rem;font-size:.78rem;color:var(--bhub-muted);background:#fafaf8">'
      +'<option value="">+ Adicionar empresa...</option>'
      +availableToAdd.map(d=>'<option value="'+escapeHtml(d.company.id)+'">'+escapeHtml(d.company.name)+'</option>').join('')
      +'</select></div>' : '';

  // ── TIMELINE ───────────────────────────────────────────────────
  const allDates = [];
  data.forEach(d=>{
    if(d.company.signDate) allDates.push(new Date(d.company.signDate));
    d.tasks.forEach(t=>{ if(t._f?.dataPrevista) allDates.push(t._f.dataPrevista); });
  });
  let tlMin, tlMax;
  if(allDates.length){
    tlMin = new Date(Math.min(...allDates.map(d=>d.getTime())));
    tlMax = new Date(Math.max(...allDates.map(d=>d.getTime())));
  } else {
    tlMin = new Date(today); tlMin.setMonth(tlMin.getMonth()-6);
    tlMax = new Date(today); tlMax.setMonth(tlMax.getMonth()+6);
  }
  tlMin = new Date(tlMin.getFullYear(), tlMin.getMonth()-1, 1);
  tlMax = new Date(tlMax.getFullYear(), tlMax.getMonth()+2, 1);
  const tlMs  = tlMax - tlMin;
  const tlPct = d => Math.max(0, Math.min(100, (d-tlMin)/tlMs*100));

  const months = [];
  let mCur = new Date(tlMin);
  while(mCur < tlMax){ months.push(new Date(mCur)); mCur = new Date(mCur.getFullYear(), mCur.getMonth()+1, 1); }
  // Step adaptativo para não sobrecarregar labels
  const totalMonths = months.length;
  const labelStep = totalMonths <= 12 ? 1 : totalMonths <= 24 ? 2 : totalMonths <= 36 ? 3 : 6;
  const monthLabels = months.filter((_,i)=>i%labelStep===0).map(m=>{
    const p = tlPct(m);
    const lb = m.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});
    return '<div style="position:absolute;left:'+p+'%;transform:translateX(-50%);font-size:.6rem;color:var(--bhub-muted);white-space:nowrap">'+lb+'</div>';
  }).join('');
  // Grid lines a cada labelStep meses (mesmo step dos labels)
  const monthLines = months.filter((_,i)=>i%labelStep===0).map(m=>'<div style="position:absolute;left:'+tlPct(m)+'%;top:0;bottom:0;border-left:1px solid #e6e3d9;pointer-events:none"></div>').join('');
  const todayPct = tlPct(today);

  const ganttRows = data.map((d,i)=>{
    const tds = d.tasks.map(t=>t._f?.dataPrevista).filter(Boolean);
    const dStart = d.company.signDate ? new Date(d.company.signDate) : (tds.length ? new Date(Math.min(...tds.map(x=>x.getTime()))) : null);
    const dEnd   = tds.length ? new Date(Math.max(...tds.map(x=>x.getTime()))) : null;
    if(!dStart || !dEnd) return '';
    const st = dealStatus(d);
    const bL = tlPct(dStart), bR = tlPct(dEnd), bW = Math.max(0.5, bR-bL);
    const lbl = d.done+'/'+d.total+' \xb7 '+st.label;
    const rowBg = i%2===0 ? '#fff' : '#f8fafb';
    return '<div style="display:flex;align-items:center;height:36px;border-bottom:1px solid #e5e7eb;background:'+rowBg+'">'
      +'<div style="width:140px;flex-shrink:0;font-size:.72rem;font-weight:600;color:var(--bhub-navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:.5rem;padding-left:.3rem;border-left:3px solid '+st.dot+'" title="'+escapeHtml(d.company.name)+'">'+escapeHtml(d.company.name)+'</div>'
      +'<div style="flex:1;position:relative;height:22px">'
      +'<div style="position:absolute;left:'+bL+'%;width:'+bW+'%;height:100%;background:'+st.dot+';border-radius:3px;display:flex;align-items:center;padding:0 .35rem;overflow:hidden">'
      +'<span style="font-size:.62rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+lbl+'</span>'
      +'</div>'
      +'<div style="position:absolute;left:'+tlPct(dEnd)+'%;top:-2px;font-size:.6rem;transform:translateX(-50%);color:#0F1727;pointer-events:none;line-height:1">▼</div>'
      +'</div>'
      +'</div>';
  }).join('');

  // ── HOT LIST ───────────────────────────────────────────────────
  const lateTasks = [];
  data.forEach(d=>d.tasks.forEach(t=>{
    if(t._f.status!=='late') return;
    const dias = t._f.dataPrevista ? businessDaysBetween(t._f.dataPrevista, today) : null;
    lateTasks.push({cid:d.company.id, deal:d.company.name, owner:t.owner||'—', task:t.task||'', due:t._f.dataPrevista, val:dias});
  }));
  lateTasks.sort((a,b)=>(b.val||0)-(a.val||0));

  const openRaidItems = state.raid.filter(r=>r.status!=='closed').map(r=>{
    const dealName = (r.dealIds||[]).map(id=>state.companies.find(c=>c.id===id)?.name||'').filter(Boolean).join(', ')||'—';
    const daysLeft = r.dueDate ? Math.round((new Date(r.dueDate)-today)/(1000*60*60*24)) : null;
    return {cid:(r.dealIds||[])[0]||'', deal:dealName, owner:r.owner||'—', task:r.title||'(sem t\xedtulo)', due:r.dueDate||'', val:daysLeft};
  });

  function tasksDueInRange(minDays, maxDays){
    const out = [];
    const dMin = new Date(today); dMin.setDate(dMin.getDate()+minDays);
    const dMax = new Date(today); dMax.setDate(dMax.getDate()+maxDays);
    data.forEach(d=>d.tasks.forEach(t=>{
      if(!t._f.dataPrevista || t._f.status==='done' || t._f.status==='late') return;
      const due = new Date(t._f.dataPrevista);
      if(due>dMin && due<=dMax){
        const dL = Math.round((due-today)/(1000*60*60*24));
        out.push({cid:d.company.id, deal:d.company.name, owner:t.owner||'—', task:t.task||'', due:t._f.dataPrevista, val:dL});
      }
    }));
    out.sort((a,b)=>a.val-b.val);
    return out;
  }
  const bucket15 = tasksDueInRange(0,15);
  const bucket30 = tasksDueInRange(15,30);
  const bucket45 = tasksDueInRange(30,45);
  const bucket60 = tasksDueInRange(45,60);

  function hotRow(t, idx){
    const ds = t.val!=null ? t.val+'d' : '—';

  function hotSection(key, icon, label, items, badgeColor){

    return '<div>'
      +'<div class="hb-hot-hdr" data-hot-key="'+key+'" style="display:flex;align-items:center;justify-content:space-between;padding:.6rem .85rem;cursor:pointer;border-bottom:1px solid #f3f4f6;background:'+hdrBg+';user-select:none">'

      +'<div style="display:flex;align-items:center;gap:.5rem">'
      +'<span style="background:#1e293b;color:#fff;font-size:.65rem;font-weight:700;border-radius:9999px;padding:.1rem .5rem;min-width:1.6rem;text-align:center">'+count+'</span>'
      +'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="transition:transform .15s;transform:rotate('+chevron+'deg)"><polyline points="6 9 12 15 18 9"/></svg>'

  // ── BUILD HTML ─────────────────────────────────────────────────
  const html =
    '<div class="space-y-5">'
    // Header
    +'<div class="page-header">'
    +'<div><h1>Vis\xe3o Estrat\xe9gica</h1><p class="subtitle">Vis\xe3o exclusiva de administradores \xb7 Dados em tempo real</p></div>'
    +'<span style="background:#0171E4;color:#fff;font-size:.7rem;font-weight:700;border-radius:.35rem;padding:.2rem .6rem;letter-spacing:.05em">ADMIN</span>'
    +'</div>'
    // Watchlist
    +'<section class="bhub-card overflow-hidden">'
    +'<div style="padding:.65rem 1rem;background:var(--bhub-beige-soft);border-bottom:1px solid var(--bhub-border);display:flex;align-items:center;gap:.5rem">'
    +'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'
    +'<span style="font-size:.82rem;font-weight:700;color:var(--bhub-navy)">Watchlist</span>'
    +'</div>'
    +'<div style="padding:.75rem 1rem"><div style="display:flex;flex-wrap:wrap;gap:.65rem;align-items:flex-start">'
    +watchCardsHtml+addSelectHtml
    +'</div></div></section>'
    // Timeline
    +'<section class="bhub-card overflow-hidden">'
    +'<div style="padding:.65rem 1rem;background:var(--bhub-beige-soft);border-bottom:1px solid var(--bhub-border);display:flex;align-items:center;gap:.5rem">'
    +'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'
    +'<span style="font-size:.82rem;font-weight:700;color:var(--bhub-navy)">Timeline — Cronograma</span>'
    +'</div>'
    +'<div style="padding:.75rem 1rem;overflow-x:auto"><div style="min-width:700px">'
    +'<div style="display:flex;height:22px;margin-bottom:.3rem"><div style="width:140px;flex-shrink:0"></div>'
    +'<div style="flex:1;position:relative">'+monthLabels+'</div></div>'
    +'<div style="position:relative">'
    +'<div style="position:absolute;left:140px;right:0;top:0;bottom:0;pointer-events:none">'+monthLines
    +'<div style="position:absolute;left:'+todayPct+'%;top:0;bottom:0;border-left:2px dashed #ef4444;z-index:2"></div>'
    +'</div>'
    +ganttRows
    +'</div>'
    +'<div style="display:flex;flex-wrap:wrap;gap:.9rem;margin-top:.5rem;padding-left:140px">'
    +'<span style="font-size:.63rem;display:flex;align-items:center;gap:.3rem"><span style="width:10px;height:8px;background:#16a34a;border-radius:2px;display:inline-block"></span>On Track ≤15%</span>'
    +'<span style="font-size:.63rem;display:flex;align-items:center;gap:.3rem"><span style="width:10px;height:8px;background:#d97706;border-radius:2px;display:inline-block"></span>Em Risco 15-30%</span>'
    +'<span style="font-size:.63rem;display:flex;align-items:center;gap:.3rem"><span style="width:10px;height:8px;background:#dc2626;border-radius:2px;display:inline-block"></span>Cr\xedtico >30%</span>'
    +'<span style="font-size:.63rem;display:flex;align-items:center;gap:.3rem"><span style="display:inline-block;width:1px;height:12px;border-left:2px dashed #ef4444"></span>Hoje</span>'
    +'<span style="font-size:.63rem">▼ Prevista</span>'
    +'</div>'
    +'</div></div></section>'
    // Hot List
    +'<section class="bhub-card overflow-hidden">'

    +'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 01-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/></svg>'
    +'<span style="font-size:.82rem;font-weight:700;color:var(--bhub-navy)">Hot List — Vencimentos &amp; Atrasos</span>'
    +'</div>'
    +hotSection('late','🔴','Tarefas Atrasadas',lateTasks,'#dc2626')
    +hotSection('raid','🔔','A\xe7\xf5es de Mitiga\xe7\xe3o em aberto',openRaidItems,'#7c3aed')
    +hotSection('b15','⚡','Tarefas vencendo em 15 dias',bucket15,'#f59e0b')
    +hotSection('b30','📅','Tarefas vencendo em 30 dias',bucket30,'#2563eb')
    +hotSection('b45','📅','Tarefas vencendo em 45 dias',bucket45,'#0891b2')
    +hotSection('b60','📅','Tarefas vencendo em 60 dias',bucket60,'#059669')
    +'</section>'
    +'</div>';

  const node = el(html);

  // Event: add to watchlist
  const addSel = node.querySelector('#hbAddWatch');
  if(addSel) addSel.addEventListener('change',()=>{
    const id = addSel.value;
    if(id && !view.hbWatchlist.includes(id)){ view.hbWatchlist=[...view.hbWatchlist,id]; render(); }
  });
  // Event: remove from watchlist
  node.querySelectorAll('[data-remove-watch]').forEach(btn=>{
    btn.addEventListener('click',()=>{ view.hbWatchlist=view.hbWatchlist.filter(x=>x!==btn.dataset.removeWatch); render(); });
  });
  // Event: accordion toggle
  node.querySelectorAll('.hb-hot-hdr').forEach(h=>{
    h.addEventListener('click',()=>{ view.hotlistOpen[h.dataset.hotKey]=!view.hotlistOpen[h.dataset.hotKey]; render(); });
  });
  // Event: deal links
  node.querySelectorAll('[data-summary]').forEach(b=>{
    b.addEventListener('click',e=>{ e.stopPropagation(); view.tab='deal'; view.dealId=b.dataset.summary; render(); });
