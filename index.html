  return node;
}

/* ================================================================
   HOJE — visão pessoal de ação ("What should I do today?")
   ================================================================ */
function renderHoje(){
  const PAGE = 10;
  const today = new Date(); today.setHours(0,0,0,0);

  // Tokens que identificam "eu"
  const meTokens = new Set(
    [session.username||'', session.email||'', (session.email||'').split('@')[0]]
      .map(s=>s.trim().toLowerCase()).filter(Boolean)
  );
  const isMe = (owner) => {
    const o = (owner||'').trim().toLowerCase();
    if(!o) return false;
    if(meTokens.has(o)) return true;
    for(const tok of meTokens){
      if(tok && (o.includes(tok) || tok.includes(o))) return true;
    }
    return false;
  };

  // Coleta todas as tarefas/RAID de todos os deals
  const allTasks = [];
  for(const c of state.companies){
    const deal = state.deals[c.id];
    if(!deal) continue;
    for(const t of (deal.tasks||[])) allTasks.push({...t, _f:computeTaskFields(t,c), _deal:c});
  }
  const allRaid = state.raid.map(r => {
    const firstDealId = r.dealIds[0];
    const _deal = firstDealId ? state.companies.find(c=>c.id===firstDealId)||null : null;
    return {...r, _deal};
  });

  // ---- Listas base (sem filtro de deal/pessoa) ----
  const myLate = allTasks
    .filter(t => t._f.status==='late')
    .sort((a,b) => (b._f.diasAtraso||0) - (a._f.diasAtraso||0));

  const decisions = allRaid
    .filter(r => r.decisaoDesc && r.status==='open' && r._deal)
    .map(r => {
      // Relação do usuário logado com esta decisão
      const iAmOwner      = isMe(r.owner);
      const iAmParticipant = allTasks.some(t => t.raidId === r.id && isMe(t.owner));
      const _relation = iAmOwner ? 'owner' : iAmParticipant ? 'participant' : null;
      return {...r, _relation};
    })
    // Não-admins só veem decisões onde têm relação direta
    .filter(r => canAdmin() || r._relation)
    .sort((a,b) => (b.severity==='high'?2:b.severity==='med'?1:0) - (a.severity==='high'?2:a.severity==='med'?1:0));

  const myUpcoming = allTasks
    .filter(t => {
      if(t._f.status!=='ontrack' || !t._f.dataPrevista) return false;
      const diff = businessDaysBetween(today, t._f.dataPrevista);
      return diff>=0 && diff<=10;
    })
    .map(t => ({...t, _diff: businessDaysBetween(today, t._f.dataPrevista)}))
    .sort((a,b) => a._diff - b._diff);

  // Todos os owners únicos (para o filtro de pessoa)
  const allOwners = [...new Set(allTasks.map(t=>t.owner).filter(Boolean))].sort();

  // Deals únicos que aparecem em qualquer seção (para o filtro)
  const dealsInView = new Map();
  [...myLate, ...myUpcoming].forEach(t => dealsInView.set(t._deal.id, t._deal.name));
  decisions.forEach(r => r._deal && dealsInView.set(r._deal.id, r._deal.name));
  const dealList = [...dealsInView.entries()].sort((a,b)=>a[1].localeCompare(b[1]));

  // Estado local: filtro de deal + filtro de pessoa + limites de paginação por seção
  let filterDeal = '';
  // Owners só veem suas próprias tarefas; admins podem ver todos
  let filterOwner = canAdmin() ? '' : '__me__';
  const limits = { late: PAGE, dec: PAGE, up: PAGE };

  const hour = new Date().getHours();
  const greet = hour<12?'Bom dia':hour<18?'Boa tarde':'Boa noite';
  const firstName = (session.username||'').split(' ')[0];

  // ---- Funções de row ----
  function taskRow(t){
    const dias = t._f.diasAtraso||0;
    const hasPendingDel = (state.deletionRequests||[]).some(r=>r.task_id===t.id);
    return `<div class="hoje-row" data-task-id="${t.id}" data-company-id="${t._deal.id}" title="Clique para editar">
      <div class="hoje-row-left">
        <div class="hoje-row-task" title="${escapeHtml(t.task)}">${escapeHtml(t.task)}${hasPendingDel?` <span title="Exclusão aguardando aprovação do admin" style="display:inline-block;font-size:.65rem;padding:.1rem .35rem;border-radius:.75rem;background:#fef3c7;color:#92400e;border:1px solid #fde68a;font-weight:600;white-space:nowrap">⏳ Excl. pendente</span>`:''}</div>
        <div class="hoje-row-meta">
          <span>${escapeHtml(t._deal.name)}</span><span class="sep">·</span>
          <span>${escapeHtml(t.area||'—')}</span>
          ${t.ref?`<span class="sep">·</span><span>${escapeHtml(t.ref)}</span>`:''}
        </div>
      </div>
      <div class="hoje-row-right"><span class="hoje-urgency late">${dias===1?'1 d.u. de atraso':`${dias} d.u. de atraso`}</span></div>
    </div>`;
  }
  function decisionRow(r){
    const sev = r.severity==='high'?'Alta':r.severity==='med'?'Média':'Baixa';
    // Badge de relação
    const relBadge = r._relation==='owner'
      ? `<span style="display:inline-flex;align-items:center;gap:.25rem;font-size:.65rem;font-weight:700;padding:.15rem .5rem;border-radius:99px;background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe;white-space:nowrap">
           <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
           Você é o owner
         </span>`
      : r._relation==='participant'
        ? `<span style="display:inline-flex;align-items:center;gap:.25rem;font-size:.65rem;font-weight:700;padding:.15rem .5rem;border-radius:99px;background:#f3e8ff;color:#6b21a8;border:1px solid #e9d5ff;white-space:nowrap">
             <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
             Você é participante
           </span>`
        : '';
    return `<div class="hoje-row" data-raid-id="${r.id}" style="cursor:pointer">
      <div class="hoje-row-left">
        <div class="hoje-row-task" title="${escapeHtml(r.title)}" style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
          <span>${escapeHtml(r.title)}</span>
          ${relBadge}
        </div>
        <div class="hoje-row-meta">
          <span>${escapeHtml(r._deal?.name||'')}</span><span class="sep">·</span>
          <span>${escapeHtml(r.area||'—')}</span>
          ${r.owner?`<span class="sep">·</span><span>Resp: ${escapeHtml(r.owner)}</span>`:''}
        </div>
      </div>
      <div class="hoje-row-right"><span class="hoje-urgency decision">Prioridade ${sev}</span></div>
    </div>`;
  }
  function upcomingRow(t){
    const d = t._diff;
    const hasPendingDelUp = (state.deletionRequests||[]).some(r=>r.task_id===t.id);
    return `<div class="hoje-row" data-task-id="${t.id}" data-company-id="${t._deal.id}" title="Clique para editar">
      <div class="hoje-row-left">
        <div class="hoje-row-task" title="${escapeHtml(t.task)}">${escapeHtml(t.task)}${hasPendingDelUp?` <span title="Exclusão aguardando aprovação do admin" style="display:inline-block;font-size:.65rem;padding:.1rem .35rem;border-radius:.75rem;background:#fef3c7;color:#92400e;border:1px solid #fde68a;font-weight:600;white-space:nowrap">⏳ Excl. pendente</span>`:''}</div>
        <div class="hoje-row-meta">
          <span>${escapeHtml(t._deal.name)}</span><span class="sep">·</span>
          <span>${escapeHtml(t.area||'—')}</span>
          ${t.ref?`<span class="sep">·</span><span>${escapeHtml(t.ref)}</span>`:''}
        </div>
      </div>
      <div class="hoje-row-right"><span class="hoje-urgency soon">${d===0?'Vence hoje':d===1?'Vence amanhã':`${d} d.u.`}</span></div>
    </div>`;
  }

  // ---- Aplica filtros de deal e pessoa a uma lista ----
  function applyFilters(items, skipOwner){
    let v = filterDeal ? items.filter(x=>x._deal.id===filterDeal) : items;
    if(!skipOwner){
      if(filterOwner==='__me__') v = v.filter(x=>isMe(x.owner));
      else if(filterOwner) v = v.filter(x=>x.owner===filterOwner);
    }
    return v;
  }

  // ---- Renderiza uma seção (lista filtrada + paginação) ----
  function renderSec(containerId, badgeId, limitKey, items, rowFn, emptyMsg, skipOwner){
    const visible = applyFilters(items, skipOwner);
    const limit = limits[limitKey];
    const slice = visible.slice(0, limit);
    const rest = visible.length - slice.length;

    const container = node.querySelector('#'+containerId);
    const badge = node.querySelector('#'+badgeId);
    if(badge) badge.textContent = visible.length;

    container.innerHTML = visible.length===0
      ? `<div class="hoje-empty">${emptyMsg}</div>`
      : slice.map(rowFn).join('') + (rest>0
          ? `<div class="hoje-load-more" id="more-${limitKey}">Ver mais ${rest} item${rest!==1?'s':''} →</div>`
          : '');

    // Tarefas: abre modal de edição direto
    container.querySelectorAll('[data-task-id]').forEach(row=>{
      row.addEventListener('click',()=>{
        const company = state.companies.find(c=>c.id===row.dataset.companyId);
        if(company) openTaskModal(company, row.dataset.taskId);
      });
    });
    // Ações de Mitigação (Decisões): navega para o subtab Ações de Mitigação do deal e abre o modal
    container.querySelectorAll('[data-raid-id]').forEach(row=>{
      row.addEventListener('click',()=>{
        const raidId = row.dataset.raidId;
        const raidItem = decisions.find(x=>x.id===raidId);
        if(raidItem && raidItem._deal){
          // Abre o deal correto já na aba Ações de Mitigação
          view.tab='deal';
          view.dealId=raidItem._deal.id;
          view.dealTab='raid';
        } else {
          // Fallback: página global de Ações de Mitigação
          view.tab='raid';
        }
        render();
        setTimeout(()=>openRaidModal(raidItem?._deal||null, raidId), 50);
      });
    });
    const moreBtn = container.querySelector('#more-'+limitKey);
    if(moreBtn) moreBtn.addEventListener('click',()=>{
      limits[limitKey] += PAGE;
      renderSec(containerId, badgeId, limitKey, items, rowFn, emptyMsg);
    });
  }

  // ---- Atualiza total + todas as seções ----
  function refresh(){
    const totLate = applyFilters(myLate).length;
    const totDec  = applyFilters(decisions, true).length; // decisões: sem filtro de pessoa
    const totUp   = applyFilters(myUpcoming).length;
    const total   = totLate + totDec + totUp;
    const totalEl = node.querySelector('#hoje-total');
    const ownerLabel = filterOwner==='__me__' ? ` (${[...meTokens][0]||'eu'})` : filterOwner ? ` (${filterOwner})` : '';
    if(totalEl) totalEl.innerHTML = total===0
      ? 'Nenhuma ação pendente. Tudo em dia!'
      : `<strong>${total}</strong> item${total!==1?'s':''}${ownerLabel} que precisam de atenção.`;

    renderSec('sec-late', 'badge-late', 'late', myLate, taskRow, 'Nenhuma tarefa atrasada. ✓');
    renderSec('sec-dec', 'badge-dec', 'dec', decisions, decisionRow, 'Nenhuma decisão aberta no portfólio.', true);
    renderSec('sec-up', 'badge-up', 'up', myUpcoming, upcomingRow, 'Nenhuma tarefa vence nos próximos 10 dias úteis.');
  }

  const totalActions = myLate.length + decisions.length + myUpcoming.length;

  const node = el(`
    <div class="py-2">
      <div class="hoje-greeting">
        <h1>${greet}, ${escapeHtml(firstName)} 👋</h1>
        <p id="hoje-total">${totalActions===0
          ? 'Nenhuma ação pendente no momento. Tudo em dia!'
          : `Você tem <strong>${totalActions}</strong> item${totalActions!==1?'s':''} que precisam de atenção.`
        }</p>
        <p style="font-size:.72rem;color:var(--bhub-muted);margin-top:.3rem">
          Buscando por owner: <strong>${[...meTokens].join(' · ')}</strong>
        </p>
      </div>

      <div class="hoje-filter-bar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--bhub-muted);flex-shrink:0"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        <span style="font-size:.78rem;color:var(--bhub-muted);font-weight:600;white-space:nowrap">Deal:</span>
        <select id="dealFilter" style="min-width:160px">
          <option value="">Todos os deals${dealList.length>0?` (${dealList.length})`:''}</option>
          ${dealList.map(([id,name])=>`<option value="${id}">${escapeHtml(name)}</option>`).join('')}
        </select>
        ${canAdmin() ? `
        <span style="font-size:.78rem;color:var(--bhub-muted);font-weight:600;white-space:nowrap;margin-left:.25rem">Pessoa:</span>
        <select id="ownerFilter" style="min-width:160px">
          <option value="">Todo mundo</option>
          <option value="__me__">⭐ Meu nome (${escapeHtml([...meTokens][0]||'eu')})</option>
          ${allOwners.filter(o=>!isMe(o)).map(o=>`<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}
        </select>` : ''}
      </div>

      <!-- Seção 1: Tarefas atrasadas -->
      <div class="hoje-section">
        <div class="hoje-section-header">
          <div class="h-icon" style="background:#fde0e3;color:#a01923">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <span class="h-title">Tarefas críticas (atrasadas)</span>
          <span id="badge-late" class="h-badge" style="background:#fde0e3;color:#a01923">${myLate.length}</span>
        </div>
        <div id="sec-late"></div>
      </div>

      <!-- Seção 2: Decisões pendentes -->
      <div class="hoje-section">
        <div class="hoje-section-header">
          <div class="h-icon" style="background:#ede9fe;color:#5b21b6">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <span class="h-title">Decisões pendentes</span>
          <span id="badge-dec" class="h-badge" style="background:#ede9fe;color:#5b21b6">${decisions.length}</span>
        </div>
        <div id="sec-dec"></div>
      </div>

      <!-- Seção 3: Próximos a vencer -->
      <div class="hoje-section">
        <div class="hoje-section-header">
          <div class="h-icon" style="background:#fef3c7;color:#92400e">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <span class="h-title">Próximos a vencer (≤ 10 dias úteis)</span>
          <span id="badge-up" class="h-badge" style="background:#fef3c7;color:#92400e">${myUpcoming.length}</span>
        </div>
        <div id="sec-up"></div>
      </div>

      ${session?.role==='admin' ? `
      <!-- Seção admin: Novas tarefas aguardando aprovação -->
      <div class="hoje-section" id="sec-newtasks-wrap" style="${Object.values(state.deals).flatMap(d=>d.tasks||[]).filter(t=>t.pendingApproval).length===0?'display:none':''}">
        <div class="hoje-section-header">
          <div class="h-icon" style="background:#dbeafe;color:#1e40af">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
          <span class="h-title">Novas tarefas aguardando aprovação</span>
          <span id="badge-newtasks" class="h-badge" style="background:#dbeafe;color:#1e40af">${Object.values(state.deals).flatMap(d=>d.tasks||[]).filter(t=>t.pendingApproval).length}</span>
        </div>
        <div id="sec-newtasks"></div>
      </div>
      <!-- Seção admin: Template tasks pendentes -->
      <div class="hoje-section" id="sec-tpltasks-wrap" style="${state.template.filter(t=>t.pendingApproval).length===0?'display:none':''}">
        <div class="hoje-section-header">
          <div class="h-icon" style="background:#dcfce7;color:#166534">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>
          </div>
          <span class="h-title">Tarefas de template aguardando aprovação</span>
          <span id="badge-tpltasks" class="h-badge" style="background:#dcfce7;color:#166534">${state.template.filter(t=>t.pendingApproval).length}</span>
        </div>
        <div id="sec-tpltasks"></div>
      </div>
      <!-- Seção admin: Solicitações de exclusão pendentes -->
      <div class="hoje-section" id="sec-delreqs-wrap" style="${(state.deletionRequests||[]).length===0?'display:none':''}">
        <div class="hoje-section-header">
          <div class="h-icon" style="background:#dcfce7;color:#166534">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </div>
          <span class="h-title">Exclusões pendentes de aprovação</span>
          <span id="badge-delreqs" class="h-badge" style="background:#dcfce7;color:#166534">${(state.deletionRequests||[]).length}</span>
        </div>
        <div id="sec-delreqs"></div>
      </div>` : ''}
    </div>
  `);

  // Wiring: filtro de deal
  const filterEl = node.querySelector('#dealFilter');
  if(filterEl) filterEl.addEventListener('change', ()=>{
    filterDeal = filterEl.value;
    limits.late = PAGE; limits.dec = PAGE; limits.up = PAGE;
    refresh();
  });

  // Wiring: filtro de pessoa
  const ownerFilterEl = node.querySelector('#ownerFilter');
  if(ownerFilterEl) ownerFilterEl.addEventListener('change', ()=>{
    filterOwner = ownerFilterEl.value;
    limits.late = PAGE; limits.dec = PAGE; limits.up = PAGE;
    refresh();
  });

  // Render inicial das seções
  refresh();

  // ---- Seção admin: solicitações de exclusão pendentes ----
  if(session?.role==='admin'){
    const secNewTasks = node.querySelector('#sec-newtasks');
    if(secNewTasks) renderNewTasksSection();

    function renderNewTasksSection(){
      const pending = Object.entries(state.deals).flatMap(([cid, d])=>
        (d.tasks||[]).filter(t=>t.pendingApproval).map(t=>({...t, _companyId: cid, _companyName: state.companies.find(c=>c.id===cid)?.name||'—'}))
      );
      const wrap = node.querySelector('#sec-newtasks-wrap');
      const badge = node.querySelector('#badge-newtasks');
      if(badge) badge.textContent = pending.length;
      if(wrap) wrap.style.display = pending.length===0 ? 'none' : '';
      if(!secNewTasks) return;
      secNewTasks.innerHTML = pending.length===0
        ? `<div class="hoje-empty">Nenhuma tarefa aguardando aprovação.</div>`
        : pending.map(t=>`
          <div class="hoje-row" data-newtask-id="${t.id}" style="align-items:flex-start">
            <div class="hoje-row-left" style="flex:1;min-width:0">
              <div class="hoje-row-task" style="font-weight:600">${t.ref?`<span style="font-family:monospace;font-size:.78rem;background:#f3f4f6;padding:.1rem .3rem;border-radius:.25rem;margin-right:.35rem">${escapeHtml(t.ref)}</span>`:''}${escapeHtml(t.task||'(sem nome)')}</div>
              <div class="hoje-row-meta">
                <span>${escapeHtml(t._companyName)}</span><span class="sep">·</span>
                <span>${escapeHtml(t.area||'—')}</span><span class="sep">·</span>
                <span>Owner: <strong>${escapeHtml(t.owner||'—')}</strong></span>
              </div>
            </div>
            <div class="hoje-row-right" style="gap:.5rem;flex-shrink:0">
              <button class="btn btn-primary" style="font-size:.75rem;padding:.3rem .65rem;background:#16a34a" data-nt-approve="${t.id}" data-nt-cid="${t._companyId}">✓ Aprovar</button>
              <button class="btn btn-secondary" style="font-size:.75rem;padding:.3rem .65rem" data-nt-reject="${t.id}" data-nt-cid="${t._companyId}">✕ Rejeitar</button>
            </div>
          </div>`).join('');

      secNewTasks.querySelectorAll('[data-nt-approve]').forEach(btn=>btn.addEventListener('click', async ()=>{
        const taskId = btn.dataset.ntApprove;
        const cid = btn.dataset.ntCid;
        if(!confirm('Aprovar a criação desta tarefa?')) return;
        try{
          const { error } = await supa.from('tasks').update({pending_approval: false}).eq('id', taskId);
          if(error) throw error;
          const d = state.deals[cid];
          if(d){ const t2 = d.tasks.find(x=>x.id===taskId); if(t2) t2.pendingApproval = false; }
          renderNewTasksSection(); render();
        }catch(err){ alert('Erro: '+(err.message||err)); }
      }));
      secNewTasks.querySelectorAll('[data-nt-reject]').forEach(btn=>btn.addEventListener('click', async ()=>{
        const taskId = btn.dataset.ntReject;
        const cid = btn.dataset.ntCid;
        if(!confirm('Rejeitar e excluir esta tarefa?')) return;
        try{
          const { error } = await supa.from('tasks').delete().eq('id', taskId);
          if(error) throw error;
          const d = state.deals[cid];
          if(d) d.tasks = d.tasks.filter(x=>x.id!==taskId);
          renderNewTasksSection(); render();
        }catch(err){ alert('Erro: '+(err.message||err)); }
      }));
    }

    const secTplTasks = node.querySelector('#sec-tpltasks');
    if(secTplTasks) renderPendingTplSection();

    function renderPendingTplSection(){
      const pending = state.template.filter(t=>t.pendingApproval);
      const wrap = node.querySelector('#sec-tpltasks-wrap');
      const badge = node.querySelector('#badge-tpltasks');
      if(badge) badge.textContent = pending.length;
      if(wrap) wrap.style.display = pending.length===0 ? 'none' : '';
      if(!secTplTasks) return;
      secTplTasks.innerHTML = pending.length===0
        ? `<div class="hoje-empty">Nenhuma tarefa de template aguardando aprovação.</div>`
        : pending.map(t=>`
          <div class="hoje-row">
            <div class="hoje-row-left" style="flex:1;min-width:0">
              <div class="hoje-row-task" style="font-weight:600">${t.ref?`<span style="font-family:monospace;font-size:.78rem;background:#f3f4f6;padding:.1rem .3rem;border-radius:.25rem;margin-right:.35rem">${escapeHtml(t.ref)}</span>`:''}${escapeHtml(t.task||'(sem nome)')}</div>
              <div class="hoje-row-meta">
                <span>Área: <strong>${escapeHtml(t.area||'—')}</strong></span><span class="sep">·</span>
                <span>Owner padrão: <strong>${escapeHtml(t.defaultOwner||'—')}</strong></span><span class="sep">·</span>
                <span>Prazo: ${t.defaultPrazo||0} d.u.</span>
              </div>
            </div>
            <div class="hoje-row-right" style="gap:.5rem;flex-shrink:0">
              <button class="btn btn-primary" style="font-size:.75rem;padding:.3rem .65rem;background:#16a34a" data-tpl-approve="${t.id}">✓ Aprovar</button>
              <button class="btn btn-secondary" style="font-size:.75rem;padding:.3rem .65rem" data-tpl-reject="${t.id}">✕ Rejeitar</button>
            </div>
          </div>`).join('');

      secTplTasks.querySelectorAll('[data-tpl-approve]').forEach(btn=>btn.addEventListener('click', async ()=>{
        const tid = btn.dataset.tplApprove;
        if(!confirm('Aprovar esta tarefa no template?')) return;
        try{
          const { error } = await supa.from('template_tasks').update({pending_approval: false}).eq('id', tid);
          if(error) throw error;
          const tpl = state.template.find(x=>x.id===tid);
          if(tpl) tpl.pendingApproval = false;
          renderPendingTplSection(); render();
        }catch(err){ alert('Erro: '+(err.message||err)); }
      }));
      secTplTasks.querySelectorAll('[data-tpl-reject]').forEach(btn=>btn.addEventListener('click', async ()=>{
        const tid = btn.dataset.tplReject;
        if(!confirm('Rejeitar e excluir esta tarefa do template?')) return;
        try{
          const { error } = await supa.from('template_tasks').delete().eq('id', tid);
          if(error) throw error;
          state.template = state.template.filter(x=>x.id!==tid);
          renderPendingTplSection(); render();
        }catch(err){ alert('Erro: '+(err.message||err)); }
      }));
    }

    const secDelReqs = node.querySelector('#sec-delreqs');
    if(secDelReqs) renderDelReqsSection();

    function renderDelReqsSection(){
      const reqs = state.deletionRequests || [];
      const wrap = node.querySelector('#sec-delreqs-wrap');
      const badge = node.querySelector('#badge-delreqs');
      if(badge) badge.textContent = reqs.length;
      if(wrap) wrap.style.display = reqs.length===0 ? 'none' : '';

      secDelReqs.innerHTML = reqs.length===0
        ? `<div class="hoje-empty">Nenhuma solicitação de exclusão pendente.</div>`
        : reqs.map(r=>`
          <div class="hoje-row" data-delreq-id="${r.id}" style="align-items:flex-start">
            <div class="hoje-row-left" style="flex:1;min-width:0">
              <div class="hoje-row-task" style="font-weight:600">${r.task_ref?`<span style="font-family:monospace;font-size:.78rem;background:#f3f4f6;padding:.1rem .3rem;border-radius:.25rem;margin-right:.35rem">${escapeHtml(r.task_ref)}</span>`:''}${escapeHtml(r.task_name||'(sem nome)')}</div>
              <div class="hoje-row-meta">
                <span>${escapeHtml(r.company_name||'—')}</span><span class="sep">·</span>
                <span>${escapeHtml(r.area||'—')}</span><span class="sep">·</span>
                <span>Solicitado por <strong>${escapeHtml(r.requested_by_name||'?')}</strong></span><span class="sep">·</span>
                <span>${r.requested_at ? fmtDate(new Date(r.requested_at)) : ''}</span>
              </div>
            </div>
            <div class="hoje-row-right" style="gap:.5rem;flex-shrink:0">
              <button class="btn btn-danger" style="font-size:.75rem;padding:.3rem .65rem" data-approve="${r.id}" data-task-id="${r.task_id}" data-company-id="${r.company_id}">✓ Aprovar</button>
              <button class="btn btn-secondary" style="font-size:.75rem;padding:.3rem .65rem" data-reject="${r.id}">✕ Rejeitar</button>
            </div>
          </div>`).join('');

      // Approve handler
      secDelReqs.querySelectorAll('[data-approve]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const reqId = btn.dataset.approve;
          const taskId = btn.dataset.taskId;
          const req = reqs.find(r=>r.id===reqId);
          const ok = await confirmDeleteModal({
            title: 'Confirmar exclusão?',
            ref: req?.task_ref||'',
            description: req?.task_name||'',
            warning: 'Você está aprovando a exclusão desta tarefa. A ação é <strong>irreversível</strong>.'
          });
          if(!ok) return;
          try{
            // delete the task
            const { error: delErr } = await supa.from('tasks').delete().eq('id', taskId);
            if(delErr) throw delErr;
            // mark request as approved
            await supa.from('deletion_requests').update({status:'approved'}).eq('id', reqId);
            // update local state
            state.deletionRequests = state.deletionRequests.filter(r=>r.id!==reqId);
            // remove task from deal state
            const companyId = btn.dataset.companyId;
            if(state.deals[companyId]) state.deals[companyId].tasks = state.deals[companyId].tasks.filter(t=>t.id!==taskId);
            renderDelReqsSection();
          }catch(err){ alert('Erro: '+(err.message||err)); }
        });
      });

      // Reject handler
      secDelReqs.querySelectorAll('[data-reject]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const reqId = btn.dataset.reject;
          if(!confirm('Rejeitar a solicitação de exclusão? A tarefa permanecerá inalterada.')) return;
          try{
            await supa.from('deletion_requests').update({status:'rejected'}).eq('id', reqId);
            state.deletionRequests = state.deletionRequests.filter(r=>r.id!==reqId);
            renderDelReqsSection();
          }catch(err){ alert('Erro: '+(err.message||err)); }
        });
      });
    }
  }

  return node;
}

        </button>
        <select id="filterByLider" style="font-size:.72rem;padding:.2rem .5rem;border-radius:.4rem;border:1px solid ${filterLiderName?'#93c5fd':'#e5e7eb'};background:${filterLiderName?'#eff6ff':'transparent'};color:${filterLiderName?'#1d4ed8':'#6b7280'};cursor:pointer;max-width:160px">
          <option value="">por líder...</option>

      <div class="bhub-card overflow-hidden">

                  <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>

/* ---------- Import legado localStorage -> Supabase ---------- */
async function importFromLocalStorage(){
  if(!canAdmin()){ alert('Apenas admin pode importar.'); return; }
  const raw = localStorage.getItem(STORE_KEY);
  if(!raw){ alert('Nenhum dado encontrado no localStorage (chave '+STORE_KEY+').'); return; }
  let old;
  try{ old = JSON.parse(raw); }catch{ alert('localStorage corrompido.'); return; }
  const nCompanies = (old.companies||[]).length;
  const nTemplate = (old.template||[]).length;
  if(!confirm(`Importar do localStorage para o Supabase?\n\nEmpresas: ${nCompanies}\nTemplate: ${nTemplate} tarefas\n\nNenhum dado será apagado — apenas inserido.`)) return;

  let okCo=0, okT=0, okR=0, okS=0, okH=0, okTpl=0;
  try{
    // Template
    if((old.template||[]).length){
      const rows = old.template.map((t,i)=>({
        ref: t.ref||'', area: t.area||'', task: t.task||'',
        default_owner: t.defaultOwner||'', default_prazo: parseInt(t.defaultPrazo)||0,
        ordering: i
      }));
      const { error } = await supa.from('template_tasks').insert(rows);
      if(error) throw error;
      okTpl = rows.length;
    }
    // Companies (uma a uma para mapear id->cid e inserir filhos)
    for(const c of (old.companies||[])){
      const { data, error } = await supa.from('companies').insert({ name: c.name, sign_date: emptyDate(c.signDate), workspace: WS }).select().single();
      if(error) throw error;
      const cid = data.id;
      okCo++;
      const deal = old.deals?.[c.id] || {};
      if((deal.tasks||[]).length){
        const rows = deal.tasks.map(t => taskToDb(t, cid));
        const r = await supa.from('tasks').insert(rows);
        if(r.error) throw r.error;
        okT += rows.length;
      }
      if((deal.raid||[]).length){
        const rows = deal.raid.map(x => raidToDb(x, cid));
        const r = await supa.from('raid_items').insert(rows);
        if(r.error) throw r.error;
        okR += rows.length;
      }
      if((deal.synergies||[]).length){
        const rows = deal.synergies.map(x => synToDb(x, cid));
        const r = await supa.from('synergies').insert(rows);
        if(r.error) throw r.error;
        okS += rows.length;
      }
      if((deal.health||[]).length){
        const rows = deal.health.map(x => healthToDb(x, cid));
        const r = await supa.from('health_entries').upsert(rows, { onConflict: 'company_id,area,week_iso' });
        if(r.error) throw r.error;
        okH += rows.length;
      }
    }
    alert(`Importação OK!\n\nEmpresas: ${okCo}\nTarefas: ${okT}\nRAID: ${okR}\nSinergias: ${okS}\nHealth: ${okH}\nTemplate: ${okTpl}`);
    await reloadState();
    render();
  }catch(err){
    alert('Erro durante importação: '+(err.message||err)+'\n\nParcial inserido: empresas='+okCo+', tasks='+okT+', raid='+okR+', syn='+okS+', health='+okH+', tpl='+okTpl);
  }
}

/* ===== Realtime: re-render quando outro usuário/tab altera dados ===== */
let _realtimeCh = null;
let _realtimeDebounce = null;
let _realtimeIndicator = null;
function showRealtimePulse(label){
  if(!_realtimeIndicator){
    _realtimeIndicator = document.createElement('div');
    _realtimeIndicator.id = 'realtime-pulse';
    _realtimeIndicator.style.cssText = 'position:fixed;bottom:50px;right:20px;background:#0171E4;color:white;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.15)';
    document.body.appendChild(_realtimeIndicator);
  }
  _realtimeIndicator.textContent = '↻ ' + (label||'atualizado');
  _realtimeIndicator.style.opacity = '1';
  clearTimeout(_realtimeIndicator._t);
  _realtimeIndicator._t = setTimeout(()=>{ _realtimeIndicator.style.opacity = '0'; }, 1500);
}
function startRealtime(){
  if(_realtimeCh) return;
  // Não dispara reload por mudanças causadas localmente (já temos render)
  // mas é melhor sempre rodar reloadState para garantir consistência cross-tab/usuário.
  const tables = ['tasks','companies','raid_items','raid_deal_links','synergies','health_entries','template_tasks','comments','attachments','task_dependencies'];
  _realtimeCh = supa.channel('pmi-app');
  tables.forEach(t=>{
    _realtimeCh.on('postgres_changes', { event:'*', schema:'public', table:t }, (payload)=>{
      // Se estamos no meio de uma operação de salvar, ignora (já temos UI atualizada)
      if(_savingOps > 0) return;
      const label = `${t} ${payload.eventType||''}`.trim();
      clearTimeout(_realtimeDebounce);
      _realtimeDebounce = setTimeout(async ()=>{
        try{
          await reloadState();
          // Re-render preservando o panel atual se houver modal aberto
          const hadOpenTaskModal = document.querySelector('[data-modal="task"]');
          render();
          if(hadOpenTaskModal){
            // O modal foi removido pelo render; uma re-abertura seria possível mas exigiria persistir o id.
          }
          showRealtimePulse(label);
        }catch(e){ console.error('realtime reload:', e); }
      }, 600);
    });
  });
  _realtimeCh.subscribe((status)=>{
    if(status === 'SUBSCRIBED') console.log('[realtime] conectado');
  });
}
function stopRealtime(){
  if(_realtimeCh){ supa.removeChannel(_realtimeCh); _realtimeCh = null; }
}

// Detecta erros do Supabase Auth no fragmento da URL (#error=...&error_code=...).
// Acontece quando o usuario clica em magic link expirado ou ja usado.
// Retorna { code, friendly } ou null. Sempre limpa o hash da URL.
let _authBanner = null;
let _wsAccessDenied = false;
function detectAuthErrorFragment(){
  const hash = location.hash || '';
  if(!hash.startsWith('#') || !hash.includes('error')) return null;
  const params = new URLSearchParams(hash.slice(1));
  const error = params.get('error');
  if(!error) return null;
  const code = params.get('error_code') || error;
  const desc = params.get('error_description') || '';
  // Limpa o fragmento da URL pra nao ficar feio nem reprocessar em reloads.
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  // Mapeia mensagens conhecidas pra texto amigavel em pt-BR.
  let friendly = decodeURIComponent(desc.replace(/\+/g, ' ')) || code;
  if(code === 'otp_expired') friendly = 'Esse link de login expirou ou ja foi usado. Faca login com seu e-mail e senha abaixo.';
  else if(error === 'access_denied') friendly = 'Acesso negado. Faca login com seu e-mail e senha abaixo.';
  return { code, friendly };
}

// Helper: corre uma Promise com timeout. Se estourar, rejeita com erro claro.
function withTimeout(promise, ms, label){
  return new Promise((resolve, reject) => {
    const t = setTimeout(()=> reject(new Error(`[timeout] ${label} (${ms}ms)`)), ms);
    promise.then(v => { clearTimeout(t); resolve(v); },
                 e => { clearTimeout(t); reject(e); });
  });
}

        <pre class="text-xs text-left bg-gray-50 rounded p-2 mt-4 overflow-auto" style="color:#7b1f1f;max-height:8em">${msg.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</pre>

}

      btn.disabled = true; btn.textContent = 'Salvando…';
      try{
        const { error } = await supa.auth.updateUser({ password: pwd });
        if(error) throw error;
        okEl.textContent = 'Senha redefinida com sucesso! Redirecionando…';
        okEl.classList.remove('hidden');
        setTimeout(()=>{ m.remove(); render(); }, 1800);
      }catch(err){
        errEl.textContent = 'Erro ao salvar: ' + (err.message || err);
        errEl.classList.remove('hidden');
        btn.disabled = false; btn.textContent = 'Salvar nova senha →';
      }
    });

    // Permitir submeter com Enter
    [m.querySelector('#newPwd'), m.querySelector('#confirmPwd')].forEach(inp=>{
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter') m.querySelector('#savePwd').click(); });
    });

    // Foca no campo de nova senha
    setTimeout(()=>m.querySelector('#newPwd').focus(), 100);
  }

  supa.auth.onAuthStateChange(async (event, sess)=>{
    if(event === 'SIGNED_OUT'){
      session = null; state = defaultState(); stopRealtime(); render();
      return;
    }
    if(event === 'PASSWORD_RECOVERY'){
      // Usuário chegou pelo link de reset de senha — mostrar modal para definir nova senha
      openPasswordResetModal();
      return;
    }
    if(event === 'TOKEN_REFRESHED' || event === 'SIGNED_IN' || event === 'INITIAL_SESSION'){
      // Se ja temos session local com o mesmo user, nao re-aplica (evita flash + duplo fetch de profile).
      if(session && sess && session.id === sess.user?.id) return;
      await applySession(sess);
      if(session && !_realtimeCh) startRealtime();
      // Nao recarrega state aqui: login() ja fez reloadState no fluxo normal.
      // Se a sessao chegou por outro caminho (ex.: outra aba), forca render pra sair do login.
      try { render(); } catch(_){}
    }
  });
})();
</script>

<div id="g-tooltip"></div>
<script>
(function(){
  const tip = document.getElementById('g-tooltip');
  document.addEventListener('mouseover', e=>{
    const el = e.target.closest('.g-tip');
    if(!el) return;
    tip.textContent = el.dataset.tip || '';
    tip.style.display = 'block';
  });
  document.addEventListener('mousemove', e=>{
    if(tip.style.display==='none') return;
    const x = e.clientX, y = e.clientY;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight;
    tip.style.left = Math.min(x + 12, vw - tw - 8) + 'px';
    tip.style.top  = (y + 20 + th > vh ? y - th - 8 : y + 20) + 'px';
  });
  document.addEventListener('mouseout', e=>{
    if(e.target.closest('.g-tip') && !e.relatedTarget?.closest('.g-tip'))
      tip.style.display = 'none';
  });
})();
</script>
