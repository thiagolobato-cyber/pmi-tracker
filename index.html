/* ===== Integração por Blocos — helpers de Gantt ===== */
function _monthKey(d){ return d.getFullYear()*12 + d.getMonth(); }
function _ganttMonths(startMk, count){
  const N=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return Array.from({length:count},(_,i)=>{ const mk=startMk+i; return {mk, label:N[mk%12]+'/'+String(Math.floor(mk/12)).slice(-2)}; });
}
function _blocoMonthStatus(tasks, mk, today){
  const todMk = _monthKey(today);
  // Status acumulativo: considera tudo que venceu até este mês
  const upTo = tasks.filter(t=>t._f&&t._f.dataPrevista&&_monthKey(t._f.dataPrevista)<=mk);
  if(!upTo.length) return ''; // nada planejado até aqui
  const inM = upTo.filter(t=>_monthKey(t._f.dataPrevista)===mk);
  // Para o mês atual: tarefas em andamento este mês têm prioridade sobre atrasos acumulados do passado
  if(mk === todMk && inM.length) {
    if(inM.every(t=>t._f.status==='done') && upTo.every(t=>t._f.status==='done')) return 'done';
    if(inM.some(t=>t._f.status==='ontrack')) return 'track';
  }
  // Herança de meses anteriores genuinamente atrasada
  const latePrior = upTo.filter(t=>_monthKey(t._f.dataPrevista)<mk&&t._f.status==='late');
  if(latePrior.length) return 'late-prior';
  // Tarefas deste mês que estão atrasadas
  if(inM.some(t=>t._f.status==='late')) return 'late';
  // Todas as tarefas até este mês concluídas → mantém Concluído (não regride)
  if(upTo.every(t=>t._f.status==='done')) return 'done';
  // Tarefas deste mês em progresso
  if(inM.some(t=>t._f.status==='ontrack'||t._f.status==='done')) return 'track';
  // Mês passado sem conclusão
  if(mk<todMk) return 'late';
  // Mês futuro com tarefas planejadas → em branco (ainda não iniciado)
  return '';
}
function _ganttCell(st, isTod){
  const t2 = isTod ? 'today-gantt' : '';
  if(!st) return `<td class="gantt-cell gantt-empty ${t2}">—</td>`;
  const cfg={done:{c:'gantt-done',bg:'#16a34a',lbl:'Concluído'},track:{c:'gantt-track',bg:'#ca8a04',lbl:'Em andamento'},late:{c:'gantt-late',bg:'#dc2626',lbl:'Atrasado'},'late-prior':{c:'gantt-late',bg:'#dc2626',lbl:'Atrasado ⚠️'},plan:{c:'gantt-plan',bg:'#94a3b8',lbl:'Planejado'}}[st];
  return `<td class="gantt-cell ${cfg.c} ${t2}" title="${cfg.lbl}"><span class="gantt-dot" style="background:${cfg.bg}"></span><span class="gantt-lbl">${cfg.lbl}</span></td>`;
}

/* ===== Bloco detail panel (all tasks, all months) ===== */
function _showBlocoDetail(e, companyId, bloco){
  document.querySelectorAll('.gantt-popover').forEach(p=>p.remove());
  // gather tasks from _gnPop for this company+bloco across all months
  const allTasks=[];
  const seen=new Set();
  if(window._gnPop){
    Object.keys(window._gnPop).forEach(k=>{
      if(!k.startsWith(companyId+'_'+bloco+'_')) return;
      window._gnPop[k].tasks.forEach(t=>{
        const uid=t.id||t.task;
        if(!seen.has(uid)){seen.add(uid);allTasks.push(t);}
      });
    });
  }
  if(!allTasks.length) return;
  const ST={done:{bg:'#16a34a',lbl:'Concluído'},track:{bg:'#ca8a04',lbl:'Em andamento'},late:{bg:'#dc2626',lbl:'Atrasado'},plan:{bg:'#94a3b8',lbl:'Planejado'}};
  const groups={done:[],track:[],late:[],plan:[]};
  allTasks.forEach(t=>{const s=(t._f&&t._f.status)||'plan';(groups[s]||groups.plan).push(t);});
  const ORDER=['late','track','plan','done'];
  let rows='';
  ORDER.forEach(s=>{
    if(!groups[s].length) return;
    const cfg=ST[s];
    rows+=`<div style="margin-bottom:.6rem"><div style="font-size:.67rem;font-weight:700;color:${cfg.bg};text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25rem">${cfg.lbl} (${groups[s].length})</div>`;
    groups[s].forEach(t=>{
      const owner=t.owner||t.default_owner||'';
      const dp=t._f&&t._f.dataPrevista?fmtDate(t._f.dataPrevista):'';
      rows+=`<div style="display:flex;gap:.4rem;align-items:flex-start;padding:.2rem 0;border-bottom:1px solid #f8fafc">
        <span style="width:6px;height:6px;border-radius:50%;background:${cfg.bg};flex-shrink:0;margin-top:.3rem"></span>
        <div style="flex:1;min-width:0">
          <div style="color:#1e293b;word-break:break-word">${escapeHtml(t.task||'')}</div>
          <div style="font-size:.63rem;color:var(--bhub-muted);display:flex;gap:.5rem;margin-top:.1rem">
            ${owner?`<span>${escapeHtml(owner)}</span>`:''}
            ${dp?`<span>📅 ${dp}</span>`:''}
          </div>
        </div>
      </div>`;
    });
    rows+='</div>';
  });
  const pop=document.createElement('div'); pop.className='gantt-popover';
  pop.style.maxHeight='420px'; pop.style.overflowY='auto';
  pop.innerHTML=`<div class="gantt-popover-title" style="position:sticky;top:0;background:white;z-index:1">${escapeHtml(bloco)} <span style="font-weight:400;font-size:.65rem;color:var(--bhub-muted)">${allTasks.length} tarefa${allTasks.length>1?'s':''}</span></div>${rows}`;
  document.body.appendChild(pop);
  const r=e.target.closest('td')?e.target.closest('td').getBoundingClientRect():{left:e.clientX,bottom:e.clientY,width:0};
  let left=r.right+8, top=r.top;
  pop.style.left='0'; pop.style.top='0';
  pop.style.visibility='hidden';
  requestAnimationFrame(()=>{
    const pw=pop.offsetWidth,ph=pop.offsetHeight;
    if(left+pw>window.innerWidth-8) left=r.left-pw-8;
    if(left<8) left=8;
    if(top+ph>window.innerHeight-8) top=window.innerHeight-ph-8;
    if(top<8) top=8;
    pop.style.left=left+'px'; pop.style.top=top+'px'; pop.style.visibility='visible';
  });
  e.stopPropagation();
  setTimeout(()=>{document.addEventListener('click',function h(ev){if(!pop.contains(ev.target)){pop.remove();document.removeEventListener('click',h);}});},50);
}

/* ===== Gantt popover helper ===== */
function _showGanttPopover(e, key){
  document.querySelectorAll('.gantt-popover').forEach(p=>p.remove());
  const d=window._gnPop&&window._gnPop[key]; if(!d||!d.tasks.length) return;
  const ST={done:{bg:'#16a34a',lbl:'Concluído'},track:{bg:'#ca8a04',lbl:'Em andamento'},late:{bg:'#dc2626',lbl:'Atrasado'},plan:{bg:'#94a3b8',lbl:'Planejado'}};
  const pop=document.createElement('div'); pop.className='gantt-popover';
  const overdueNote=d.isOverdue?`<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:.3rem .5rem;margin-bottom:.45rem;font-size:.63rem;color:#dc2626;display:flex;align-items:center;gap:.3rem"><span>⚠️</span> Atrasado por atividades de meses anteriores</div>`:'';
  pop.innerHTML=`<div class="gantt-popover-title">${escapeHtml(d.bloco)} <span style="color:#6366f1">·</span> ${escapeHtml(d.month)} <span style="font-weight:400;font-size:.65rem;color:var(--bhub-muted)">${d.tasks.length} tarefa${d.tasks.length>1?'s':''}</span></div>${overdueNote}`+
    d.tasks.map(t=>{
      const s=(t._f&&t._f.status)||'plan'; const cfg=ST[s]||ST.plan;
      const owner=t.owner||t.default_owner||'';
      return `<div style="display:flex;gap:.4rem;align-items:flex-start;padding:.25rem 0;border-bottom:1px solid #f8fafc">
        <span style="width:7px;height:7px;border-radius:50%;background:${cfg.bg};flex-shrink:0;margin-top:.25rem"></span>
        <div><div style="color:#1e293b">${escapeHtml(t.task||'')}</div>${owner?`<div style="font-size:.63rem;color:var(--bhub-muted)">${escapeHtml(owner)}</div>`:''}</div>
      </div>`;
    }).join('');
  document.body.appendChild(pop);
  const td=e.target.closest('[data-gn]');
  const r=td?td.getBoundingClientRect():{left:e.clientX,bottom:e.clientY,width:0};
  let left=r.left, top=r.bottom+6;
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  if(left+pw>window.innerWidth-8) left=window.innerWidth-pw-8;
  if(left<8) left=8;
  if(top+ph>window.innerHeight-8) top=r.top-ph-6;
  pop.style.left=left+'px'; pop.style.top=top+'px';
  e.stopPropagation();
  setTimeout(()=>{document.addEventListener('click',function h(ev){if(!pop.contains(ev.target)){pop.remove();document.removeEventListener('click',h);}});},50);
}

/* ===== Gantt por deal (aba Integração por Blocos) ===== */
function renderDealIntegracao(company, deal, tasks){
  if(!canAdmin()) return el('<div class="bhub-card p-6 text-sm text-gray-500">Acesso restrito a administradores.</div>');
  const today=new Date(); today.setHours(0,0,0);
  const sd=parseDate(company.signDate);
  if(!sd) return el('<div class="bhub-card p-6 text-sm text-gray-500">Defina a data de assinatura para visualizar o Gantt.</div>');
  const tw=tasks.filter(t=>t.bloco);
  if(!tw.length) return el('<div class="bhub-card p-6 text-sm text-gray-500">Nenhuma tarefa com sub-área. Execute o SQL <code>populate_blocos.sql</code> no Supabase.</div>');
  const sdMk=_monthKey(sd);
  const maxMk=Math.max(...tw.map(t=>t._f&&t._f.dataPrevista?_monthKey(t._f.dataPrevista):sdMk));
  const todMk=_monthKey(today);
  if(view.dealGanttOffset===undefined) view.dealGanttOffset=0;
  // Window: starts at sdMk shifted by offset*3, shows enough to cover all tasks + buffer
  const winStart=sdMk+(view.dealGanttOffset||0)*3;
  const naturalCount=Math.max(maxMk-sdMk+2,8);
  const shiftedCount=Math.max(maxMk-winStart+2,8);
  const months=_ganttMonths(winStart, shiftedCount);
  const AREA_ORDER=['Financeiro','P&C','Marketing & Comunicação','Comercial','PMI / M&A','CExp','System Integration / TI / Digital Workplace','Operações','Tech','Treinamentos para colaboradores'];
  const byArea={};
  tw.forEach(t=>{
    const a=t.area||'Sem área', b=t.bloco;
    if(!byArea[a]) byArea[a]={};
    if(!byArea[a][b]) byArea[a][b]=[];
    byArea[a][b].push(t);
  });
  const areas=AREA_ORDER.filter(a=>byArea[a]).concat(Object.keys(byArea).filter(a=>!AREA_ORDER.includes(a)));
  const wrap=el('<div class="space-y-3"></div>');
  const _dgnb=s=>`<button ${s} style="font-size:.72rem;padding:.1rem .32rem;border:0.5px solid var(--bhub-border);border-radius:5px;background:#f9fafb;cursor:pointer;color:var(--bhub-muted);line-height:1.4">`;
  const dealLegEl=el(`<div class="bhub-card" style="padding:0;overflow:hidden">
    <div style="display:flex;align-items:center;gap:5px;padding:.32rem .65rem;background:#f8fafc;border-bottom:1px solid var(--bhub-border);flex-wrap:nowrap;overflow-x:auto">
      <span style="font-size:.72rem;font-weight:700;color:var(--bhub-navy);white-space:nowrap;flex-shrink:0">Integração por Blocos — ${escapeHtml(company.name)}</span>
      <div style="flex:1"></div>
      ${_dgnb('id="dgnPrev"')}‹</button>
      <button id="dgnReset" style="font-size:.65rem;padding:.1rem .4rem;border:0.5px solid ${view.dealGanttOffset?'#6366f1':'var(--bhub-border)'};background:${view.dealGanttOffset?'#eef2ff':'#f9fafb'};cursor:pointer;color:${view.dealGanttOffset?'#3730a3':'var(--bhub-muted)'};border-radius:5px;line-height:1.4;min-width:40px;text-align:center">Hoje</button>
      ${_dgnb('id="dgnNext"')}›</button>
      <span style="width:1px;height:14px;background:var(--bhub-border);flex-shrink:0;margin:0 2px"></span>
      <span style="background:#e0e7ff;color:#3730a3;padding:.1rem .5rem;border-radius:999px;font-size:.65rem;font-weight:600;flex-shrink:0">Admin only</span>
    </div>
    <div style="padding:.25rem .65rem;display:flex;gap:.55rem;align-items:center;font-size:.62rem;color:var(--bhub-muted)">
      <span style="display:inline-flex;align-items:center;gap:3px"><span style="width:6px;height:6px;border-radius:50%;background:#16a34a;display:inline-block"></span>Concluído</span>
      <span style="display:inline-flex;align-items:center;gap:3px"><span style="width:6px;height:6px;border-radius:50%;background:#ca8a04;display:inline-block"></span>Em andamento</span>
      <span style="display:inline-flex;align-items:center;gap:3px"><span style="width:6px;height:6px;border-radius:50%;background:#dc2626;display:inline-block"></span>Atrasado</span>
      <span style="display:inline-flex;align-items:center;gap:3px"><span style="width:6px;height:6px;border-radius:50%;background:#94a3b8;display:inline-block"></span>Planejado</span>
    </div>
  </div>`);
  dealLegEl.querySelector('#dgnPrev').addEventListener('click',()=>{view.dealGanttOffset=(view.dealGanttOffset||0)-1;render();});
  dealLegEl.querySelector('#dgnNext').addEventListener('click',()=>{view.dealGanttOffset=(view.dealGanttOffset||0)+1;render();});
  dealLegEl.querySelector('#dgnReset').addEventListener('click',()=>{view.dealGanttOffset=0;render();});
  wrap.appendChild(dealLegEl);
  const tb=el('<div class="bhub-card overflow-x-auto"></div>');
  let h=`<table style="border-collapse:collapse;min-width:100%;font-size:.72rem"><thead><tr>
    <th style="text-align:left;padding:.5rem .75rem;font-size:.68rem;color:var(--bhub-muted);background:#f8fafc;position:sticky;left:0;z-index:2;min-width:185px;border-bottom:2px solid var(--bhub-border)">Área / Sub-área</th>
    ${months.map(m=>{const iT=m.mk===todMk;return `<th style="text-align:center;padding:.4rem .2rem;font-size:.68rem;min-width:90px;background:${iT?'#eef2ff':'#f8fafc'};color:${iT?'#3730a3':'var(--bhub-muted)'};border-bottom:2px solid var(--bhub-border)">M+${m.mk-sdMk+1}<br><span style="font-weight:400">${m.label}</span>${iT?'<br><span style="font-size:.58rem;color:#6366f1">hoje</span>':''}</th>`;}).join('')}
  </tr></thead><tbody>`;
  areas.forEach(area=>{
    h+=`<tr style="background:#f1f5f9"><td colspan="${months.length+1}" style="padding:.35rem .75rem;font-weight:700;font-size:.72rem;color:var(--bhub-navy);position:sticky;left:0;background:#f1f5f9;border-top:1px solid var(--bhub-border)">${escapeHtml(area)}</td></tr>`;
    Object.keys(byArea[area]).sort().forEach(bloco=>{
      const bt=byArea[area][bloco];
      h+=`<tr><td style="padding:.3rem .75rem .3rem 1.3rem;position:sticky;left:0;background:white;border-right:1px solid var(--bhub-border);font-size:.72rem;cursor:pointer" class="gn-bloco-lbl" data-gnid="${escapeHtml(company.id)}" data-gnbloco="${escapeHtml(bloco)}" title="Ver todas as tarefas deste bloco"><span>${escapeHtml(bloco)}</span> <span style="font-size:.6rem;color:#a5b4fc">▾</span></td>${months.map(m=>{
        const st=_blocoMonthStatus(bt,m.mk,today);
        const inM=bt.filter(t=>t._f&&t._f.dataPrevista&&_monthKey(t._f.dataPrevista)===m.mk);
        if(!window._gnPop) window._gnPop={};
        const key=`${company.id}_${bloco}_${m.mk}`;
        window._gnPop[key]={bloco,month:m.label,tasks:inM};
        const t2=m.mk===todMk?'today-gantt':'';
        if(!st) return `<td class="gantt-cell gantt-empty ${t2}" data-gn="${key}">—</td>`;
        const cfg={done:{c:'gantt-done',bg:'#16a34a',lbl:'Concluído'},track:{c:'gantt-track',bg:'#ca8a04',lbl:'Em andamento'},late:{c:'gantt-late',bg:'#dc2626',lbl:'Atrasado'},'late-prior':{c:'gantt-late',bg:'#dc2626',lbl:'Atrasado ⚠️'},plan:{c:'gantt-plan',bg:'#94a3b8',lbl:'Planejado'}}[st];
        if(!cfg) return `<td class="gantt-cell gantt-empty ${t2}" data-gn="${key}">—</td>`;
        return `<td class="gantt-cell ${cfg.c} ${t2}" data-gn="${key}" title="${cfg.lbl}"><span class="gantt-dot" style="background:${cfg.bg}"></span><span class="gantt-lbl">${cfg.lbl}</span></td>`;
      }).join('')}</tr>`;
    });
  });
  h+='</tbody></table>';
  tb.innerHTML=h;
  tb.querySelectorAll('[data-gn]').forEach(td=>td.addEventListener('click',e=>_showGanttPopover(e,td.dataset.gn)));
  tb.querySelectorAll('.gn-bloco-lbl').forEach(td=>td.addEventListener('click',e=>{e.stopPropagation();_showBlocoDetail(e,td.dataset.gnid,td.dataset.gnbloco);}));
  wrap.appendChild(tb);
  return wrap;
}

/* ===== Gantt portfolio (aba Acompanhamento → Gantt de Integração) ===== */
function renderGanttIntegracao(){
  if(!canAdmin()) return el('<div class="bhub-card p-6 text-sm text-gray-500">Acesso restrito a administradores.</div>');
  const today=new Date(); today.setHours(0,0,0);
  const todMk=_monthKey(today);
  const ORDER={late:0,track:1,plan:2,done:3,'':4};
  const AREA_ORDER=['Financeiro','P&C','Marketing & Comunicação','Comercial','PMI / M&A','CExp','System Integration / TI / Digital Workplace','Operações','Tech','Treinamentos para colaboradores'];

  const allDealsData=state.companies.map(c=>{
    const deal=state.deals[c.id];
    if(!deal) return null;
    const tw=(deal.tasks||[]).filter(t=>t.bloco).map(t=>({...t,_f:computeTaskFields(t,c)}));
    if(!tw.length) return null;
    const byArea={};
    tw.forEach(t=>{
      const a=t.area||'Sem área',b=t.bloco;
      if(!byArea[a]) byArea[a]={};
      if(!byArea[a][b]) byArea[a][b]=[];
      byArea[a][b].push(t);
    });
    return {c,byArea};
  }).filter(Boolean);

  if(!allDealsData.length) return el('<div class="bhub-card p-10 text-center text-gray-400 text-sm">Nenhum deal com sub-áreas. Execute o SQL <code>populate_blocos.sql</code> no Supabase primeiro.</div>');
  if(!view.ganttExpanded) view.ganttExpanded={};
  if(view.ganttDealFilter===undefined) view.ganttDealFilter='';
  if(view.ganttMonthOffset===undefined) view.ganttMonthOffset=0;
  if(view.ganttAreaFilter===undefined) view.ganttAreaFilter='';
  if(view.ganttActiveMonth===undefined) view.ganttActiveMonth=null;
  allDealsData.forEach(d=>{if(view.ganttExpanded[d.c.id]===undefined) view.ganttExpanded[d.c.id]=true;});

  // KPIs sobre todos os deals
  const dealMeta=allDealsData.map(({c,byArea})=>{
    const allBlocos=Object.values(byArea).flatMap(a=>Object.values(a));
    const sts=allBlocos.map(bt=>_blocoMonthStatus(bt,todMk,today)).filter(Boolean);
    const worst=sts.sort((a,b)=>(ORDER[a]||4)-(ORDER[b]||4))[0]||'';
    const allT=Object.values(byArea).flatMap(a=>Object.values(a).flat());
    const pct=allT.length?Math.round(allT.filter(t=>t._f&&t._f.status==='done').length/allT.length*100):0;
    return {id:c.id,worst,pct};
  });
  const total=dealMeta.length;
  const lateN=dealMeta.filter(d=>d.worst==='late').length;
  const doneN=dealMeta.filter(d=>d.pct===100).length;
  const onTrackN=total-lateN-doneN;

  const dealsData=view.ganttDealFilter?allDealsData.filter(d=>d.c.id===view.ganttDealFilter):allDealsData;

  // Smart month window: when a specific deal is selected, start from its sign date
  let months;
  if(view.ganttDealFilter && dealsData.length){
    const sd=parseDate(dealsData[0].c.signDate);
    const sdMk=sd?_monthKey(sd):todMk-2;
    const allT=Object.values(dealsData[0].byArea).flatMap(a=>Object.values(a).flat());
    const maxMk=allT.length?Math.max(...allT.map(t=>t._f&&t._f.dataPrevista?_monthKey(t._f.dataPrevista):sdMk)):sdMk+7;
    months=_ganttMonths(sdMk, Math.max(maxMk-sdMk+2, 8));
  } else {
    months=_ganttMonths(todMk-2+(view.ganttMonthOffset||0), 8);
  }

  // Per-month bloco activity counts for filter chips
  const chipCounts={};
  months.forEach(m=>{
    let n=0;
    dealsData.forEach(({byArea})=>Object.values(byArea).forEach(bMap=>Object.values(bMap).forEach(bt=>{
      if(bt.some(t=>{
        if(!t._f||!t._f.dataPrevista) return false;
        const tMk=_monthKey(t._f.dataPrevista);
        if(tMk===m.mk) return true;
        if(tMk<m.mk&&t._f.status!=='done') return true;
        return false;
      })) n++;
    })));
    chipCounts[m.mk]=n;
  });
  // Ensure active month is still in range; reset if not
  if(view.ganttActiveMonth!==null && !months.some(m=>m.mk===view.ganttActiveMonth)) view.ganttActiveMonth=null;

  // All unique areas across visible deals (for filter dropdown)
  const allAreas=[...new Set(dealsData.flatMap(d=>Object.keys(d.byArea)))].sort((a,b)=>{
    const ai=AREA_ORDER.indexOf(a),bi=AREA_ORDER.indexOf(b);
    if(ai>=0&&bi>=0) return ai-bi; if(ai>=0) return -1; if(bi>=0) return 1;
    return a.localeCompare(b,'pt');
  });

  const wrap=el('<div class="space-y-3"></div>');

  // Proposal B: compact single-bar with inline KPI badges
  const _S='flex-shrink:0';
  const _SEP=`<span style="width:1px;height:14px;background:var(--bhub-border);${_S};margin:0 1px"></span>`;
  const _cs=(id,active,val,opts,xstyle='')=>`<select id="${id}" style="appearance:none;font-size:.69rem;padding:.13rem .5rem .13rem .4rem;border-radius:20px;border:0.5px solid ${active?'#6366f1':'var(--bhub-border)'};background:${active?'#eef2ff':'#f9fafb'};color:${active?'#3730a3':'var(--bhub-muted)'};font-weight:${active?'700':'400'};cursor:pointer;${_S}${xstyle?';'+xstyle:''}">${opts}</select>`;
  const leg=el(`<div class="bhub-card" style="padding:0;overflow:hidden">
    <div style="display:flex;align-items:center;gap:5px;padding:.32rem .65rem;background:#f8fafc;border-bottom:1px solid var(--bhub-border);flex-wrap:nowrap;overflow-x:auto">
      <span style="font-size:.72rem;font-weight:700;color:var(--bhub-navy);white-space:nowrap;${_S}">Gantt · Integrações</span>
      ${_SEP}
      <span style="font-size:.66rem;padding:.08rem .42rem;border-radius:12px;background:#eef2ff;color:#3730a3;border:0.5px solid #c7d2fe;white-space:nowrap;${_S}">${total} ativos</span>
      <span style="font-size:.66rem;padding:.08rem .42rem;border-radius:12px;background:#dcfce7;color:#15803d;border:0.5px solid #bbf7d0;white-space:nowrap;${_S}">${doneN} concluídas</span>
      <span style="font-size:.66rem;padding:.08rem .42rem;border-radius:12px;background:#fef9c3;color:#a16207;border:0.5px solid #fde047;white-space:nowrap;${_S}">${onTrackN} no prazo</span>
      <span style="font-size:.66rem;padding:.08rem .42rem;border-radius:12px;${lateN>0?'background:#fee2e2;color:#dc2626;border:0.5px solid #fca5a5':'background:#f1f5f9;color:var(--bhub-muted);border:0.5px solid var(--bhub-border)'};white-space:nowrap;${_S}">${lateN} em atraso</span>
      <div style="flex:1;min-width:.25rem"></div>
      ${_cs('gnDealFilter',!!view.ganttDealFilter,view.ganttDealFilter,`<option value="">Todos (${total})</option>${allDealsData.map(d=>`<option value="${escapeHtml(d.c.id)}" ${view.ganttDealFilter===d.c.id?'selected':''}>${escapeHtml(d.c.name)}</option>`).join('')}`,'max-width:145px')}
      ${_cs('gnAreaFilter',!!view.ganttAreaFilter,view.ganttAreaFilter,`<option value="">Todas as áreas</option>${allAreas.map(a=>`<option value="${escapeHtml(a)}" ${view.ganttAreaFilter===a?'selected':''}>${escapeHtml(a)}</option>`).join('')}`,'max-width:130px')}
      ${_SEP}
      ${!view.ganttDealFilter?`
        <button id="gnPrevMonths" style="font-size:.72rem;padding:.1rem .32rem;border:0.5px solid var(--bhub-border);border-radius:5px;background:#f9fafb;cursor:pointer;color:var(--bhub-muted);line-height:1.4">‹</button>
        <button id="gnResetMonths" style="font-size:.65rem;padding:.1rem .35rem;border:0.5px solid ${view.ganttMonthOffset?'#6366f1':'var(--bhub-border)'};background:${view.ganttMonthOffset?'#eef2ff':'#f9fafb'};cursor:pointer;color:${view.ganttMonthOffset?'#3730a3':'var(--bhub-muted)'};border-radius:5px;line-height:1.4;min-width:40px;text-align:center">Hoje</button>
        <button id="gnNextMonths" style="font-size:.72rem;padding:.1rem .32rem;border:0.5px solid var(--bhub-border);border-radius:5px;background:#f9fafb;cursor:pointer;color:var(--bhub-muted);line-height:1.4">›</button>
        <span style="width:1px;height:14px;background:var(--bhub-border);flex-shrink:0;margin:0 1px"></span>
      `:`<span style="font-size:.62rem;color:#6366f1;font-style:italic;white-space:nowrap;flex-shrink:0">Timeline auto</span><span style="width:1px;height:14px;background:var(--bhub-border);flex-shrink:0;margin:0 1px"></span>`}
      <button id="gnExpandAll" title="Expandir tudo" style="padding:.1rem .28rem;border:0.5px solid var(--bhub-border);border-radius:5px;background:#f9fafb;cursor:pointer;display:flex;align-items:center;color:var(--bhub-muted)"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1" y="1" width="12" height="3" rx=".8"/><rect x="1" y="5.5" width="12" height="3" rx=".8"/><rect x="1" y="10" width="12" height="3" rx=".8"/></svg></button>
      <button id="gnCollapseAll" title="Recolher tudo" style="padding:.1rem .28rem;border:0.5px solid var(--bhub-border);border-radius:5px;background:#f9fafb;cursor:pointer;display:flex;align-items:center;color:var(--bhub-muted)"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1" y="1" width="12" height="3" rx=".8"/><line x1="1" y1="7" x2="13" y2="7"/><line x1="1" y1="10" x2="13" y2="10"/><line x1="1" y1="13" x2="13" y2="13"/></svg></button>
    </div>
    <div style="padding:.28rem .65rem;display:flex;gap:.28rem;align-items:center;background:white;border-top:1px solid #f1f5f9;flex-wrap:nowrap;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none">
      <button id="gnChipAll" style="font-size:.63rem;padding:.12rem .48rem;border-radius:20px;border:0.5px solid ${!view.ganttActiveMonth?'#6366f1':'#e2e8f0'};background:${!view.ganttActiveMonth?'#eef2ff':'#f9fafb'};color:${!view.ganttActiveMonth?'#3730a3':'#94a3b8'};font-weight:${!view.ganttActiveMonth?'700':'400'};cursor:pointer;white-space:nowrap;flex-shrink:0;line-height:1.5">Todos</button>
      <span style="width:1px;height:13px;background:#e2e8f0;flex-shrink:0;margin:0 .05rem"></span>
      ${months.map(m=>{const isAct=view.ganttActiveMonth===m.mk;const isTod=m.mk===todMk;const cnt=chipCounts[m.mk]||0;return `<button id="gnChip_${m.mk}" style="font-size:.63rem;padding:.12rem .45rem;border-radius:20px;border:0.5px solid ${isAct?'#6366f1':isTod?'#c7d2fe':'#e2e8f0'};background:${isAct?'#eef2ff':isTod?'#f5f3ff':'#f9fafb'};color:${isAct?'#3730a3':isTod?'#4f46e5':'#94a3b8'};font-weight:${isAct?'700':isTod?'600':'400'};cursor:pointer;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:3px;line-height:1.5">${m.label}${isTod?'<span style="font-size:.55rem;color:#6366f1;line-height:1">◉</span>':''}<span style="font-size:.57rem;background:${isAct?'#c7d2fe':'#e2e8f0'};color:${isAct?'#3730a3':'#64748b'};border-radius:8px;padding:0 .3rem;line-height:1.5;font-weight:500">${cnt}</span></button>`;}).join('')}
    </div>
    ${(()=>{if(!view.ganttActiveMonth)return '';const am=months.find(m=>m.mk===view.ganttActiveMonth);const totalBlocos=dealsData.reduce((s,{byArea})=>s+Object.values(byArea).reduce((a,bMap)=>a+Object.keys(bMap).length,0),0);const activeCnt=chipCounts[view.ganttActiveMonth]||0;return `<div style="padding:.22rem .65rem;background:#f0f4ff;border-top:1px solid #c7d2fe;font-size:.63rem;color:#4f46e5;font-weight:500">${activeCnt} de ${totalBlocos} sub-áreas com entrega em ${am?am.label:''}</div>`;})()}
  </div>`);
  wrap.appendChild(leg);

  if(!dealsData.length){
    wrap.appendChild(el('<div class="bhub-card p-8 text-center text-gray-400 text-sm">Nenhum deal corresponde ao filtro.</div>'));
    setTimeout(()=>{const f=wrap.querySelector('#gnDealFilter');if(f)f.addEventListener('change',()=>{view.ganttDealFilter=f.value;render();});},0);
    return wrap;
  }

  const tb=el('<div class="bhub-card overflow-x-auto"></div>');
  let h=`<table style="border-collapse:collapse;min-width:100%;font-size:.72rem" id="gnPortTable"><thead><tr>
    <th style="text-align:left;padding:.5rem .75rem;font-size:.68rem;color:var(--bhub-muted);background:#f8fafc;position:sticky;left:0;z-index:3;min-width:220px;border-bottom:2px solid var(--bhub-border)">Deal / Área / Sub-área</th>
    <th style="text-align:center;padding:.4rem .2rem;font-size:.68rem;min-width:52px;background:#f8fafc;color:var(--bhub-muted);border-bottom:2px solid var(--bhub-border)">%</th>
    ${months.map(m=>{const iT=m.mk===todMk;const isAct=view.ganttActiveMonth===m.mk;const bg=isAct?'#dbeafe':iT?'#eef2ff':'#f8fafc';const clr=isAct?'#1d4ed8':iT?'#3730a3':'var(--bhub-muted)';const bdr=isAct?'2px solid #3b82f6':iT?'2px solid #a5b4fc':'2px solid var(--bhub-border)';return `<th style="text-align:center;padding:.4rem .2rem;font-size:.68rem;min-width:95px;background:${bg};color:${clr};border-bottom:${bdr}">${m.label}${iT?'<br><span style="font-size:.6rem;color:#6366f1;font-weight:400">hoje</span>':''}</th>`;}).join('')}
  </tr></thead><tbody>`;

  dealsData.forEach(({c,byArea})=>{
    const exp=view.ganttExpanded[c.id];
    const sd=parseDate(c.signDate);
    const sdLbl=sd?'Ass: '+fmtDate(sd):'';
    const allT=Object.values(byArea).flatMap(a=>Object.values(a).flat());
    const pct=allT.length?Math.round(allT.filter(t=>t._f&&t._f.status==='done').length/allT.length*100):0;
    const pctColor=pct===100?'#15803d':pct>=50?'#a16207':'#dc2626';
    h+=`<tr style="background:#eef2ff;cursor:pointer" class="gn-deal-row" data-gndeal="${escapeHtml(c.id)}">
      <td style="padding:.4rem .75rem;font-weight:700;font-size:.75rem;color:#3730a3;position:sticky;left:0;background:#eef2ff;border-top:2px solid #c7d2fe">
        ${exp?'▾':'▸'} ${escapeHtml(c.name)} <span style="font-weight:400;font-size:.65rem;color:#6366f1;margin-left:.3rem">${sdLbl}</span>
      </td>
      <td style="text-align:center;font-weight:700;font-size:.75rem;color:${pctColor};border-top:2px solid #c7d2fe;background:#eef2ff">${pct}%</td>
      ${months.map(m=>{
        const allT=Object.values(byArea).flatMap(a=>Object.values(a).flat());
        const upTo=allT.filter(t=>t._f&&t._f.dataPrevista&&_monthKey(t._f.dataPrevista)<=m.mk);
        if(!upTo.length) return _ganttCell('',m.mk===todMk);
        if(m.mk<=todMk){
          const inM=upTo.filter(t=>_monthKey(t._f.dataPrevista)===m.mk);
          // Mês atual: tarefas em andamento este mês têm prioridade sobre atrasos acumulados do passado
          if(m.mk===todMk && inM.some(t=>t._f.status==='ontrack')) return _ganttCell('track',true);
          // Alinha com _blocoMonthStatus: late se status==='late' OU se mês de vencimento é passado e não concluído
          const hasLate=upTo.some(t=>{const tMk=_monthKey(t._f.dataPrevista);return t._f.status==='late'||(tMk<todMk&&t._f.status!=='done');});
          if(hasLate) return _ganttCell('late',m.mk===todMk);
          if(upTo.every(t=>t._f.status==='done')) return _ganttCell('done',m.mk===todMk);
          if(upTo.some(t=>t._f.status==='done'||t._f.status==='ontrack')) return _ganttCell('track',m.mk===todMk);
          return _ganttCell('plan',m.mk===todMk);
        } else {
          // Futuro: só olha tarefas que vencem APÓS hoje – não carrega atraso do passado
          const fwd=upTo.filter(t=>_monthKey(t._f.dataPrevista)>todMk);
          if(!fwd.length) return _ganttCell('',false);
          if(fwd.every(t=>t._f.status==='done')) return _ganttCell('done',false);
          if(fwd.some(t=>t._f.status==='late'||(_monthKey(t._f.dataPrevista)<todMk&&t._f.status!=='done'))) return _ganttCell('late',false);
          if(fwd.some(t=>t._f.status==='done'||t._f.status==='ontrack')) return _ganttCell('track',false);
          return _ganttCell('plan',false);
        }
      }).join('')}
    </tr>`;
    if(exp){
      const areas=AREA_ORDER.filter(a=>byArea[a]).concat(Object.keys(byArea).filter(a=>!AREA_ORDER.includes(a)));
      const visAreas=view.ganttAreaFilter?areas.filter(a=>a===view.ganttAreaFilter):areas;
      visAreas.forEach(area=>{
        const allBlocosInArea=Object.keys(byArea[area]).sort();
        const visBlocos=view.ganttActiveMonth
          ?allBlocosInArea.filter(bloco=>byArea[area][bloco].some(t=>{
              if(!t._f||!t._f.dataPrevista) return false;
              const tMk=_monthKey(t._f.dataPrevista);
              if(tMk===view.ganttActiveMonth) return true;
              if(tMk<view.ganttActiveMonth&&t._f.status!=='done') return true; // atrasadas de meses anteriores
              return false;
            }))
          :allBlocosInArea;
        if(!visBlocos.length) return;
        h+=`<tr style="background:#f1f5f9"><td colspan="${months.length+2}" style="padding:.35rem .75rem .35rem 1.5rem;font-weight:700;font-size:.72rem;color:var(--bhub-navy);position:sticky;left:0;background:#f1f5f9;border-top:1px solid var(--bhub-border)">${escapeHtml(area)}</td></tr>`;
        visBlocos.forEach(bloco=>{
          const bt=byArea[area][bloco];
          h+=`<tr><td style="padding:.3rem .75rem .3rem 1.8rem;position:sticky;left:0;background:white;border-right:1px solid var(--bhub-border);font-size:.72rem;cursor:pointer;text-decoration-color:#c7d2fe" class="gn-bloco-lbl" data-gnid="${escapeHtml(c.id)}" data-gnbloco="${escapeHtml(bloco)}" title="Ver todas as tarefas deste bloco"><span style="color:inherit">${escapeHtml(bloco)}</span> <span style="font-size:.6rem;color:#a5b4fc">▾</span></td><td style="background:white"></td>${months.map(m=>{
            const st=_blocoMonthStatus(bt,m.mk,today);
            const inM=bt.filter(t=>t._f&&t._f.dataPrevista&&_monthKey(t._f.dataPrevista)===m.mk);
            const overdueT=bt.filter(t=>t._f&&t._f.dataPrevista&&_monthKey(t._f.dataPrevista)<m.mk&&t._f.status==='late');
            // isOverdue: há herança de meses anteriores e este mês NÃO tem tarefas próprias atrasadas
            const isOverdue=overdueT.length>0&&!inM.some(t=>t._f&&t._f.status==='late');
            const popTasks=inM.length?inM:overdueT;
            if(!window._gnPop) window._gnPop={};
            const key=`${c.id}_${bloco}_${m.mk}`;
            window._gnPop[key]={bloco,month:m.label,tasks:popTasks,isOverdue};
            const t2=m.mk===todMk?'today-gantt':'';
            if(!st) return `<td class="gantt-cell gantt-empty ${t2}" data-gn="${key}">—</td>`;
            const cfg={done:{c:'gantt-done',bg:'#16a34a',lbl:'Concluído'},track:{c:'gantt-track',bg:'#ca8a04',lbl:'Em andamento'},late:{c:'gantt-late',bg:'#dc2626',lbl:'Atrasado'},'late-prior':{c:'gantt-late',bg:'#dc2626',lbl:'Atrasado ⚠️'},plan:{c:'gantt-plan',bg:'#94a3b8',lbl:'Planejado'}}[st];
            return `<td class="gantt-cell ${cfg.c} ${t2}" data-gn="${key}" title="${cfg.lbl}"><span class="gantt-dot" style="background:${cfg.bg}"></span><span class="gantt-lbl">${cfg.lbl}</span></td>`;
          }).join('')}</tr>`;
        });
      });
    }
  });
  h+='</tbody></table>';
  tb.innerHTML=h;
  tb.querySelectorAll('[data-gn]').forEach(td=>td.addEventListener('click',e=>_showGanttPopover(e,td.dataset.gn)));
  wrap.appendChild(tb);

  setTimeout(()=>{
    wrap.querySelectorAll('.gn-deal-row').forEach(row=>row.addEventListener('click',()=>{view.ganttExpanded[row.dataset.gndeal]=!view.ganttExpanded[row.dataset.gndeal];render();}));
    const expB=wrap.querySelector('#gnExpandAll');
    const colB=wrap.querySelector('#gnCollapseAll');
    const flt=wrap.querySelector('#gnDealFilter');
    const prevB=wrap.querySelector('#gnPrevMonths');
    const nextB=wrap.querySelector('#gnNextMonths');
    const resetB=wrap.querySelector('#gnResetMonths');
    if(expB) expB.addEventListener('click',()=>{dealsData.forEach(d=>view.ganttExpanded[d.c.id]=true);render();});
    if(colB) colB.addEventListener('click',()=>{dealsData.forEach(d=>view.ganttExpanded[d.c.id]=false);render();});
    if(flt) flt.addEventListener('change',()=>{view.ganttDealFilter=flt.value;view.ganttMonthOffset=0;view.ganttActiveMonth=null;render();});
    const aFlt=wrap.querySelector('#gnAreaFilter');
    if(aFlt) aFlt.addEventListener('change',()=>{view.ganttAreaFilter=aFlt.value;render();});
    if(prevB) prevB.addEventListener('click',()=>{view.ganttMonthOffset=(view.ganttMonthOffset||0)-3;view.ganttActiveMonth=null;render();});
    if(nextB) nextB.addEventListener('click',()=>{view.ganttMonthOffset=(view.ganttMonthOffset||0)+3;view.ganttActiveMonth=null;render();});
    if(resetB) resetB.addEventListener('click',()=>{view.ganttMonthOffset=0;view.ganttActiveMonth=null;render();});
    // Month chip filters
    const chipAll=wrap.querySelector('#gnChipAll');
    if(chipAll) chipAll.addEventListener('click',()=>{view.ganttActiveMonth=null;render();});
    wrap.querySelectorAll('[id^="gnChip_"]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const mk=parseInt(btn.id.replace('gnChip_',''));
        view.ganttActiveMonth=view.ganttActiveMonth===mk?null:mk;
        render();
      });
    });
    wrap.querySelectorAll('.gn-bloco-lbl').forEach(td=>td.addEventListener('click',e=>{e.stopPropagation();_showBlocoDetail(e,td.dataset.gnid,td.dataset.gnbloco);}));
  },0);
  return wrap;
}

function renderShell(){
  const wrap = el(`<div class="app-shell"></div>`);
  wrap.appendChild(renderSidebar());

  const mainArea = el(`<div class="main-area"></div>`);
  mainArea.appendChild(renderTopbar());

  const content = el(`<main class="content-area"></main>`);
  // Guard: se estiver em modo Tech e tentar acessar aba exclusiva do PMI, redireciona
  if(isTech && ['template'].includes(view.tab)){
    view.tab = 'empresas';
  }
  if(view.tab==='hoje') content.appendChild(renderHoje());
  else if(view.tab==='dashboard') content.appendChild(isTech ? renderTechDashboard() : renderDashboard());
  else if(view.tab==='executiva') content.appendChild(renderExecutiva());
  else if(view.tab==='empresas') content.appendChild(renderEmpresas());
  else if(view.tab==='raid') content.appendChild(renderRaidPortfolio());
  else if(view.tab==='gestao' && canViewAcompanhamento()) content.appendChild(renderGestao());
  else if(view.tab==='lider' && isLider()) content.appendChild(renderLiderPanel());
  else if(view.tab==='tech_tarefas') content.appendChild(renderTechTarefas());
  else if(view.tab==='template') content.appendChild(renderTemplate());
  else if(view.tab==='deal') content.appendChild(renderDeal());
  else if(view.tab==='usuarios') content.appendChild(renderUsuarios());
  mainArea.appendChild(content);

  wrap.appendChild(mainArea);

  // Indicador global "salvando…"
  if(!document.getElementById('save-indicator')){
    const ind = el(`<div id="save-indicator">salvando…</div>`);
    document.body.appendChild(ind);
    if(_savingOps>0) ind.classList.add('show');
  }
  return wrap;
}

/* ---------- Dashboard ---------- */
function aggregate(){
  const deals = state.companies.map(c=>{
    const tasks = (state.deals[c.id]?.tasks||[]).map(t=>({...t, _f: computeTaskFields(t,c)})).sort(sortByRef);
    const total = tasks.length;
    const done = tasks.filter(t=>t._f.status==='done').length;
    const ontrack = tasks.filter(t=>t._f.status==='ontrack').length;
    const late = tasks.filter(t=>t._f.status==='late').length;
    const noowner = tasks.filter(t=>!t.owner).length;
    const blocked = tasks.filter(t=>t.bloqueio==='Sim').length;
    const pct = total? Math.round(done/total*100) : 0;
    return {company:c, tasks, total, done, ontrack, late, noowner, blocked, pct};
  });
  return deals;
}
function _recomputeDealAgg(d, tasks){
  const total = tasks.length;
  const done = tasks.filter(t=>t._f.status==='done').length;
  const ontrack = tasks.filter(t=>t._f.status==='ontrack').length;
  const late = tasks.filter(t=>t._f.status==='late').length;
  const noowner = tasks.filter(t=>!t.owner).length;
  const blocked = tasks.filter(t=>t.bloqueio==='Sim').length;
  const pct = total? Math.round(done/total*100) : 0;
  return {...d, tasks, total, done, ontrack, late, noowner, blocked, pct};
}
function applyDashFilters(data){
  const f = view.dashFilters || {deals:[],areas:[],owners:[]};
  const dealSet  = f.deals  && f.deals.length  ? new Set(f.deals)  : null;
  const areaSet  = f.areas  && f.areas.length  ? new Set(f.areas)  : null;
  const ownerSet = f.owners && f.owners.length ? new Set(f.owners) : null;
  let out = data;
  if(dealSet) out = out.filter(d => dealSet.has(d.company.id));
  if(areaSet || ownerSet){
    out = out.map(d => {
      const tasks = d.tasks.filter(t =>
        (!areaSet  || areaSet.has(t.area)) &&
        (!ownerSet || ownerSet.has(t.owner))
      );
      return _recomputeDealAgg(d, tasks);
    });
  }
  return out;
}
function dashFiltersActive(){
  const f = view.dashFilters || {};
  return (f.deals?.length||0) + (f.areas?.length||0) + (f.owners?.length||0);
}

        +'<td class="text-center">'+(blockCount>0?'<span class="raid-blk-badge" data-raid-expand="'+r.id+'" style="background:#fee2e2;color:#991b1b;padding:.1rem .45rem;border-radius:9999px;font-weight:700;font-size:.75rem;cursor:pointer;user-select:none" title="Ver tarefas impactadas">'+blockCount+' ▾</span>':'<span class="text-gray-400 text-xs">0</span>')+'</td>'
        +(canEdit()?'<td><button class="btn btn-secondary" data-raid-edit="'+r.id+'">✎</button></td>':'');
      tbody.appendChild(tr);
      // Expand row for blocked tasks
      const colCount = canEdit() ? 11 : 10;
      const expandDiv = document.createElement('div');
      expandDiv.innerHTML = '<table><tbody>'+getBlockedTasksHtml(r.id, colCount)+'</tbody></table>';
      const expandTr = expandDiv.querySelector('tr.raid-expand-row');
      if(expandTr) tbody.appendChild(expandTr);
    });
    node.querySelectorAll('[data-raid-edit]').forEach(b=>b.onclick=()=>openRaidModal(null, b.dataset.raidEdit));
    // Bloqueios expand badges (RAID portfolio table)
    node.querySelectorAll('.raid-blk-badge[data-raid-expand]').forEach(badge=>{
      badge.addEventListener('click', e=>{
        e.stopPropagation();
        const raidId = badge.dataset.raidExpand;
        const row = node.querySelector('#expand-'+raidId);
        if(!row) return;
        const open = row.style.display !== 'none';
        row.style.display = open ? 'none' : '';
        badge.textContent = badge.textContent.replace(/[▾▴]/,'') + (open ? ' ▾' : ' ▴');
      });
    });
  }

  node.querySelectorAll('[data-rf]').forEach(b=>b.addEventListener('click',()=>{ view.raidPortfolioFilter=b.dataset.rf; render(); }));
  // Deal filter pill buttons
  node.querySelectorAll('[data-deal-filter]').forEach(b=>b.addEventListener('click',()=>{
    const id = b.dataset.dealFilter;
    const cur = view.raidDealFilter || [];
    view.raidDealFilter = cur.includes(id) ? cur.filter(x=>x!==id) : [...cur, id];
    render();
  }));
  const clearDealFilter = node.querySelector('#clearDealFilter');
  if(clearDealFilter) clearDealFilter.addEventListener('click',()=>{ view.raidDealFilter=[]; render(); });
  const addBtn = node.querySelector('#addRaidGlobal');
  if(addBtn) addBtn.onclick = ()=>openRaidModal(null);
  node.querySelectorAll('[data-summary]').forEach(b=>b.addEventListener('click',()=>{ view.tab='deal'; view.dealId=b.dataset.summary; render(); }));
  node.querySelectorAll('[data-area]').forEach(b=>b.addEventListener('click',()=>{ view.tab='dashboard'; view.dashFilters={...view.dashFilters||{},areas:[b.dataset.area]}; render(); }));
  node.querySelectorAll('[data-owner]').forEach(b=>b.addEventListener('click',()=>{ view.tab='dashboard'; view.dashFilters={...view.dashFilters||{},owners:[b.dataset.owner]}; render(); }));
  return node;
}

function dealLink(id, name){ return id ? '<span class="deal-link" data-summary="'+id+'">'+escapeHtml(name)+'</span>' : escapeHtml(name||''); }
function areaLink(a){
  if(!a) return '';
  const gatilho = AREA_TRIGGERS[a];
  const tip = gatilho ? ` title="Gatilho: ${escapeHtml(gatilho)}"` : '';
  const badge = gatilho ? `<span class="g-tip" data-tip="Gatilho: ${escapeHtml(gatilho)}" style="display:inline-block;margin-left:.3rem;font-size:.6rem;padding:.05rem .35rem;border-radius:9999px;background:#ede9fe;color:#5b21b6;font-weight:700;vertical-align:middle;cursor:default">G</span>` : '';
  return `<span class="deal-link" data-area="${escapeHtml(a)}"${tip}>${escapeHtml(a)}</span>${badge}`;
}
function ownerLink(o){ return o ? '<span class="deal-link" data-owner="'+escapeHtml(o)+'">'+escapeHtml(o)+'</span>' : ''; }
function dealRow6(r, col5, col6){ return '<tr><td>'+dealLink(r.dealId,r.deal)+'</td><td>'+areaLink(r.area)+'</td><td>'+escapeHtml(r.task||'')+'</td><td>'+ownerLink(r.owner)+'</td><td>'+col5+'</td><td class="text-center">'+col6+'</td></tr>'; }
function dealRow5desc(r){ return '<tr><td>'+dealLink(r.dealId,r.deal)+'</td><td>'+areaLink(r.area)+'</td><td>'+escapeHtml(r.task||'')+'</td><td>'+ownerLink(r.owner)+'</td><td>'+escapeHtml(r.desc||'')+'</td></tr>'; }
function dealRowLate(r){ return '<tr><td>'+dealLink(r.dealId,r.deal)+'</td><td>'+areaLink(r.area)+'</td><td>'+ownerLink(r.owner)+'</td><td>'+escapeHtml(r.task||'')+'</td><td class="text-right text-red-700 font-semibold">'+r.dias+'</td></tr>'; }
function dashExpandTable(id, rows, headers, rowFn){
  var thead = '<thead><tr>'+headers.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead>';
  var visible = rows.slice(0,10).map(rowFn).join('');
  var html = '<div class="scroll-x"><table class="w-full text-xs">'+thead+'<tbody>'+visible+'</tbody></table></div>';
  if(rows.length > 10){
    var extra = rows.slice(10).map(rowFn).join('');
    html += '<button class="btn btn-secondary" style="margin-top:.5rem;font-size:.72rem;width:100%" id="more-'+id+'">Ver todos ('+rows.length+') ▾</button>';
    html += '<div id="extra-'+id+'" style="display:none"><div class="scroll-x"><table class="w-full text-xs">'+thead+'<tbody>'+extra+'</tbody></table></div></div>';
  }
  return html;
}

function getBlockedTasksHtml(raidId, colspan){
  const tasks = Object.entries(state.deals).flatMap(([cid, d])=>
    (d.tasks||[]).filter(t=>t.bloqueio==='Sim' && t.raidId===raidId)
      .map(t=>({...t, deal: state.companies.find(x=>x.id===cid)?.name||cid, dealId: cid}))
  );
  const inner = tasks.length
    ? `<div style="padding:.5rem 1rem .75rem">
        <div style="font-size:.68rem;font-weight:700;color:#991b1b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem">
          Tarefas impactadas (${tasks.length})
        </div>
        <div class="scroll-x">
          <table class="w-full text-xs" style="background:#fff;border-radius:6px;overflow:hidden;border:1px solid #fecaca">
            <thead><tr style="background:#fee2e2">
              <th style="padding:.3rem .7rem;text-align:left">DEAL</th>
              <th style="padding:.3rem .7rem;text-align:left">ÁREA</th>
              <th style="padding:.3rem .7rem;text-align:left">TAREFA</th>
              <th style="padding:.3rem .7rem;text-align:left">OWNER</th>
            </tr></thead>
            <tbody>${tasks.map(t=>`<tr style="border-top:1px solid #fecaca">
              <td style="padding:.35rem .7rem">${dealLink(t.dealId, t.deal)}</td>
              <td style="padding:.35rem .7rem">${areaLink(t.area)}</td>
              <td style="padding:.35rem .7rem">${escapeHtml(t.task||'')}</td>
              <td style="padding:.35rem .7rem">${ownerLink(t.owner)}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>`
    : `<div style="padding:.5rem 1rem;font-size:.75rem;color:#9ca3af">Nenhuma tarefa bloqueada encontrada.</div>`;
  return `<tr class="raid-expand-row" id="expand-${raidId}" style="display:none">
    <td colspan="${colspan}" style="padding:0;background:#fef2f2;border-bottom:2px solid #fecaca">${inner}</td>
  </tr>`;
}

function renderDashboard(){
  const rawData = aggregate();
  const data = applyDashFilters(rawData);
  const total = data.reduce((s,d)=>s+d.total,0);
  const done = data.reduce((s,d)=>s+d.done,0);
  const ontrack = data.reduce((s,d)=>s+d.ontrack,0);
  const late = data.reduce((s,d)=>s+d.late,0);
  const noowner = data.reduce((s,d)=>s+d.noowner,0);
  const blocked = data.reduce((s,d)=>s+d.blocked,0);
  // % Integração Média PONDERADA por tarefas (mais justo que media simples entre deals).
  // Antes: cada deal pesava igual (1 deal de 5 tasks = 1 deal de 220 tasks).
  // Agora: deals grandes pesam proporcionalmente mais no progresso geral do portfolio.
  const avgPct = total > 0 ? Math.round(done / total * 100) : 0;

  // Listas pra popular os selects de filtro
  const allDeals = state.companies.map(c=>({id:c.id, name:c.name})).sort((a,b)=>a.name.localeCompare(b.name));
  const allAreasD = sortAreaNames(Array.from(new Set([...state.template.map(t=>t.area), ...Object.values(state.deals).flatMap(d=>d.tasks.map(t=>t.area))].filter(Boolean))));
  const allOwnersD = Array.from(new Set(Object.values(state.deals).flatMap(d=>d.tasks.map(t=>t.owner)).filter(Boolean))).sort();
  const f = view.dashFilters || {deals:[],areas:[],owners:[]};

  // Portfolio RAID / Synergies / Health aggregates
  const allRaid = state.raid.map(r => {
    const firstDealId = r.dealIds[0];
    const dealName = firstDealId ? (state.companies.find(c=>c.id===firstDealId)?.name||'') : '';
    return {...r, deal: dealName, dealId: firstDealId||null};
  });
  const openRaid = allRaid.filter(r=>r.status!=='closed');
  // Top 10 RAIDs abertos por nº de bloqueios na mesma área/deal
  const topPortfolioRisks = openRaid.map(r => {
    const allDealTasks = (r.dealIds||[]).flatMap(did => state.deals[did]?.tasks||[]);
    const blockCount = allDealTasks.filter(t => t.bloqueio==='Sim' && t.raidId===r.id).length;
    return {...r, blockCount};
  }).sort((a,b) => b.blockCount - a.blockCount || sevRank(b.severity) - sevRank(a.severity)).slice(0,10);
  const allSyns = state.companies.flatMap(c => (state.deals[c.id]?.synergies||[]));
  const synPlan = allSyns.reduce((s,x)=>s+(Number(x.plannedValue)||0),0);
  const synReal = allSyns.reduce((s,x)=>s+(Number(x.realizedValue)||0),0);
  const synPct = synPlan>0 ? Math.round(synReal/synPlan*100) : 0;

  // Vencimentos em <=10 d.u.
  const today = new Date(); today.setHours(0,0,0,0);
  const due10 = [];
  data.forEach(d => d.tasks.forEach(t=>{
    if(t._f.status==='ontrack' && t._f.dataPrevista){
      const diff = businessDaysBetween(today, t._f.dataPrevista);
      if(diff!==null && diff>=0 && diff<=10){
        due10.push({dealId:d.company.id, deal:d.company.name, owner:t.owner, task:t.task, area:t.area, due:t._f.dataPrevista, diff});
      }
    }
  }));
  due10.sort((a,b)=>a.diff-b.diff);

  // Bloqueios ativos
  const blocks = [];
  data.forEach(d => d.tasks.forEach(t=>{
    if(t.bloqueio==='Sim') blocks.push({dealId:d.company.id, deal:d.company.name, area:t.area, task:t.task, owner:t.owner, desc:t.bloqueioDescricao});
  }));

  // Dedo-duro: mais atrasadas
  const top = [];
  data.forEach(d => d.tasks.forEach(t=>{
    if(t._f.status==='late' && t._f.diasAtraso){
      top.push({dealId:d.company.id, deal:d.company.name, area:t.area, owner:t.owner, task:t.task, dias:t._f.diasAtraso});
    }

    if(ts.every(t=>t._f.status==='done')) return 'done';
    if(ts.some(t=>t._f.status==='late')) return 'late';
    if(ts.some(t=>t._f.status==='ontrack')) return 'ontrack';

              ...Object.values(state.deals).flatMap(d=>d.tasks.map(t=>t.area))
            ].filter(Boolean)));
            if(!execAreas.length) execAreas.push(...Object.keys(AREA_TRIGGERS));

              const gatilho = AREA_TRIGGERS[area];

            });
            return rows.length
              ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:.5rem">${rows.join('')}</div>`
              : `<p style="font-size:.8rem;color:var(--bhub-muted)">Nenhuma área com gatilho configurado ainda.</p>`;
          })()}
          <p style="font-size:.7rem;color:var(--bhub-muted);margin-top:.75rem">💡 O badge <span style="display:inline-block;font-size:.6rem;padding:.05rem .35rem;border-radius:9999px;background:#ede9fe;color:#5b21b6;font-weight:700">G</span> ao lado de cada área indica o gatilho responsável. Passe o mouse para ver o nome.</p>
        </div>
      </section>

  `);
  node.querySelectorAll('[data-deal]').forEach(td=>td.addEventListener('click',()=>{ view.tab='deal'; view.dealId=td.dataset.deal; render(); }));
  const imp = node.querySelector('#impx');
  if(imp) imp.addEventListener('change', e => { if(e.target.files[0]) importXlsx(e.target.files[0]); });
  node.querySelector('#expx').addEventListener('click', exportXlsx);

  // Filtros do dashboard:
  //  - 'change' agenda aplicação em 1.2s (debounce — permite Ctrl/Cmd-click sem interromper)
  //  - 'blur' aplica IMEDIATAMENTE (quando o user clica fora pra confirmar)
  function readSel(id){ return Array.from(node.querySelector(id).selectedOptions).map(o=>o.value); }
  let _filterTimer;
  function applyFiltersNow(){
    clearTimeout(_filterTimer);
    const next = { deals: readSel('#fltDeals'), areas: readSel('#fltAreas'), owners: readSel('#fltOwners') };
    const cur  = view.dashFilters || {deals:[],areas:[],owners:[]};
    const same = (a,b)=>a.length===b.length && a.every(v=>b.includes(v));
    if(same(next.deals, cur.deals||[]) && same(next.areas, cur.areas||[]) && same(next.owners, cur.owners||[])) return;
    view.dashFilters = next;
    render();
  }
  function scheduleApply(){ clearTimeout(_filterTimer); _filterTimer = setTimeout(applyFiltersNow, 1200); }
  ['#fltDeals','#fltAreas','#fltOwners'].forEach(id=>{
    const sel = node.querySelector(id);
    sel.addEventListener('change', scheduleApply);
    sel.addEventListener('blur', applyFiltersNow);
  });
  const fltClear = node.querySelector('#fltClear');
  if(fltClear) fltClear.addEventListener('click', ()=>{ view.dashFilters = {deals:[],areas:[],owners:[]}; render(); });

  // Chips de filtros ativos: click no chip remove aquele filtro específico
  node.querySelectorAll('[data-chip-deal]').forEach(chip=>{
    chip.addEventListener('click',()=>{
      const id = chip.dataset.chipDeal;
      view.dashFilters.deals = (view.dashFilters.deals||[]).filter(x=>x!==id);
      render();
    });
  });
  node.querySelectorAll('[data-chip-area]').forEach(chip=>{
    chip.addEventListener('click',()=>{
      const a = chip.dataset.chipArea;
      view.dashFilters.areas = (view.dashFilters.areas||[]).filter(x=>x!==a);
      render();
    });
  });
  node.querySelectorAll('[data-chip-owner]').forEach(chip=>{
    chip.addEventListener('click',()=>{
      const o = chip.dataset.chipOwner;
      view.dashFilters.owners = (view.dashFilters.owners||[]).filter(x=>x!==o);
      render();
    });
  });

  // Botão comparar deals
  node.querySelector('#cmpBtn').addEventListener('click', ()=>openCompareDealsPicker());

  // Toggle card Gatilhos por Área
  const triggersHeader = node.querySelector('#triggersHeader');
  if(triggersHeader) triggersHeader.addEventListener('click', ()=>{ view.triggersCardOpen = !view.triggersCardOpen; render(); });

  // Bloqueios expand badges (dashboard Top 10)
  node.querySelectorAll('.raid-blk-badge[data-raid-expand]').forEach(badge=>{
    badge.addEventListener('click', e=>{
      e.stopPropagation();
      const raidId = badge.dataset.raidExpand;
      const row = node.querySelector('#expand-'+raidId);
      if(!row) return;
      const open = row.style.display !== 'none';
      row.style.display = open ? 'none' : '';
      badge.textContent = badge.textContent.replace(/[▾▴]/,'') + (open ? ' ▾' : ' ▴');
    });
  });

  // KPI cards → navegação por atalho
  node.querySelectorAll('[data-kpi-nav]').forEach(card => {
    card.addEventListener('click', ()=>{
      const nav    = card.dataset.kpiNav;
      const filter = card.dataset.kpiFilter || null;
      view.tab = nav;
      view.empresasStatusFilter = null;

      if(nav === 'deal'){
        // Abre visão "Todos os deals" com pill de status pré-ativo
        view.dealId               = '__all__';
        view.dealTab              = 'tarefas';
        view.dealTaskStatusFilter = filter || 'all';
        view.dealTaskAreaFilter   = '';
        view.dealTaskOwnerFilter  = '';
      } else {
        // empresas ou outras abas
        view.dealId = null;
        view.dealTaskStatusFilter = null;
        if(card.dataset.kpiSort){
          view.empresasSortCol = card.dataset.kpiSort;
          view.empresasSortDir = 'desc';
        }
        view.empresasStatusFilter = filter;
      }
      render();
    });
  });

  // Render charts after mount
  setTimeout(()=>{
    if(!window.Chart) return;
    // Burndown: para cada dia das últimas 12 semanas, contar tarefas não-done (planejadas) e realizadas (acumulado done por data real)
    const burnCanvas = node.querySelector('#burndown');
    if(burnCanvas){
      const today = new Date(); today.setHours(0,0,0,0);
      const start = new Date(today); start.setDate(start.getDate()-84);
      const labels = [];
      const ideal = [];
      const real = [];
      const allTasks = data.flatMap(d=>d.tasks.map(t=>({...t, company:d.company})));
      const totalTasks = allTasks.length;
      const totalDoneSoFar = allTasks.filter(t=>t._f.dataReal).length;
      for(let d=new Date(start); d<=today; d.setDate(d.getDate()+7)){
        const day = new Date(d);
        labels.push(`${String(day.getDate()).padStart(2,'0')}/${String(day.getMonth()+1).padStart(2,'0')}`);
        const concluidasAteData = allTasks.filter(t=>{
          const dr = t._f.dataReal; return dr && dr<=day;
        }).length;
        real.push(totalTasks - concluidasAteData);
        // ideal: linear ate hoje a partir do totalTasks
        const progress = (day - start) / (today - start || 1);
        ideal.push(Math.max(0, Math.round(totalTasks*(1-progress))));
      }
      new Chart(burnCanvas.getContext('2d'),{
        type:'line',
        data:{
          labels,
          datasets:[
            {label:'Restantes (real)', data:real, borderColor:'#0171E4', backgroundColor:'rgba(1,113,228,.1)', tension:.3, fill:true, pointRadius:2},
            {label:'Ideal', data:ideal, borderColor:'#94a3b8', borderDash:[6,4], pointRadius:0, fill:false}
          ]
        },
        options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true, ticks:{precision:0, stepSize:1000}}}}
      });
    }
    // Sinergia gauge (doughnut)
    const gaugeCanvas = node.querySelector('#synGauge');
    if(gaugeCanvas && (synPlan > 0 || synReal > 0)){
      const remaining = Math.max(0, synPlan - synReal);
      // If synReal > synPlan (over-achieved), show full realized + 0 remaining
      const realized = synPlan > 0 ? Math.min(synReal, synPlan) : synReal;
      const rem = synPlan > 0 ? Math.max(0, synPlan - synReal) : 0;
      new Chart(gaugeCanvas.getContext('2d'),{
        type:'doughnut',
        data:{
          labels:['Realizado','A capturar'],
          datasets:[{data: rem > 0 ? [realized, rem] : [realized, realized*0.001||1], backgroundColor:['#0171E4','#e6e3d9'], borderWidth:0}]
        },
        options:{responsive:true, maintainAspectRatio:false, cutout:'72%', plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>c.label+': '+fmtBRL(c.raw||0)}}}}
      });
    }
    // Botões "Ver todos" dos widgets
    [['more-due10','extra-due10'],['more-blocks','extra-blocks'],['more-top','extra-top']].forEach(([btnId,extraId])=>{
      const btn = node.querySelector('#'+btnId);
      const extra = node.querySelector('#'+extraId);
      if(btn && extra){
        btn.addEventListener('click', ()=>{
          const open = extra.style.display !== 'none';
          extra.style.display = open ? 'none' : '';
          btn.textContent = open ? btn.textContent.replace('▴','▾') : btn.textContent.replace('▾','▴');
        });
      }
    });
  },0);
  return node;
}

function renderDashboardRagMatrix(data){
  if(!data.length) return '<div class="text-xs text-gray-500">Sem deals.</div>';
  const currentWeek = currentIsoWeek();
  // Mesma fonte de áreas da Visão Executiva — apenas áreas com dados reais
  const allAreas = Array.from(new Set([
    ...state.template.map(t=>t.area),
    ...Object.values(state.deals).flatMap(d=>d.tasks.map(t=>t.area))
  ].filter(Boolean)));
  function lastRagFor(dealId, area){
    const arr = (state.deals[dealId]?.health||[]).filter(h=>h.area===area).sort((a,b)=>b.weekIso.localeCompare(a.weekIso));
    return arr[0]?.rag || 'na';
  }
  return `<div class="scroll-x"><table class="w-full text-xs">
    <thead><tr>
      <th class="text-left sticky-col">ÁREA</th>
      ${data.map(d=>`<th class="text-center whitespace-nowrap" style="max-width:80px"><div class="truncate deal-link" data-summary="${d.company.id}" title="Ver resumo executivo">${escapeHtml(d.company.name)}</div></th>`).join('')}
    </tr></thead>
    <tbody>${allAreas.map(a=>`<tr>
      <td class="font-medium whitespace-nowrap sticky-col"><span class="deal-link" data-area="${escapeHtml(a)}">${escapeHtml(a)}</span></td>
      ${data.map(d=>{
        const rag = lastRagFor(d.company.id, a);
        return `<td class="text-center"><span class="rag rag-${rag}" style="font-size:.6rem;padding:.1rem .4rem"><span class="rag-dot"></span>${rag==='g'?'G':rag==='a'?'A':rag==='r'?'R':'—'}</span></td>`;
      }).join('')}
    </tr>`).join('')}</tbody>
  </table></div>`;
}

            <label class="flex items-center gap-2 px-3 py-2 cursor-pointer border-b hover:bg-gray-50" style="border-color:var(--bhub-border)">

              <span class="text-sm">${escapeHtml(d.company.name)}</span>
            </label>
          `).join('')}
        </div>
        <div class="flex gap-2 justify-end p-5 border-t" style="border-color:var(--bhub-border)">
          <button id="cancelPdfDealModal" class="btn btn-secondary">Cancelar</button>
          <button id="confirmPdfDealModal" class="btn btn-primary">Confirmar</button>
        </div>
      </div>
    </div>
  `);
  function upCount(){
    const n = [...modal.querySelectorAll('.pdf-deal-chk:checked')].length;
    modal.querySelector('#pdfSelCount').textContent = `${n} de ${deals.length} selecionados`;
  }
  modal.querySelector('#closePdfDealModal').onclick = ()=>modal.remove();
  modal.querySelector('#cancelPdfDealModal').onclick = ()=>modal.remove();
  modal.querySelector('#pdfSelAll').onclick   = ()=>{ modal.querySelectorAll('.pdf-deal-chk').forEach(c=>c.checked=true);  upCount(); };
  modal.querySelector('#pdfSelNone').onclick  = ()=>{ modal.querySelectorAll('.pdf-deal-chk').forEach(c=>c.checked=false); upCount(); };
  modal.querySelectorAll('.pdf-deal-chk').forEach(c=>c.addEventListener('change',upCount));

    view.execPdfDeals = sel.length === deals.length ? null : sel;
