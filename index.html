/* ===== Realtime: re-render quando outro usuário/tab altera dados ===== */
let _realtimeCh = null;
let _realtimeDebounce = null;
let _realtimeIndicator = null;
function showRealtimePulse(label){
  if(!_realtimeIndicator){
    _realtimeIndicator = document.createElement('div');
    _realtimeIndicator.id = 'realtime-pulse';
    _realtimeIndicator.style.cssText = 'position:fixed;bottom:50px;right:20px;background:#0171E4;color:white;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.15)';
    document.body.appendChild(_realtimeIndicator);
  }
  _realtimeIndicator.textContent = '↻ ' + (label||'atualizado');
  _realtimeIndicator.style.opacity = '1';
  clearTimeout(_realtimeIndicator._t);
  _realtimeIndicator._t = setTimeout(()=>{ _realtimeIndicator.style.opacity = '0'; }, 1500);
}
function startRealtime(){
  if(_realtimeCh) return;
  // Não dispara reload por mudanças causadas localmente (já temos render)
  // mas é melhor sempre rodar reloadState para garantir consistência cross-tab/usuário.
  const tables = ['tasks','companies','raid_items','raid_deal_links','synergies','health_entries','template_tasks','comments','attachments','task_dependencies'];
  _realtimeCh = supa.channel('pmi-app');
  tables.forEach(t=>{
    _realtimeCh.on('postgres_changes', { event:'*', schema:'public', table:t }, (payload)=>{
      // Se estamos no meio de uma operação de salvar, ignora (já temos UI atualizada)
      if(_savingOps > 0) return;
      const label = `${t} ${payload.eventType||''}`.trim();
      clearTimeout(_realtimeDebounce);
      _realtimeDebounce = setTimeout(async ()=>{
        try{
          await reloadState();
          // Re-render preservando o panel atual se houver modal aberto
          const hadOpenTaskModal = document.querySelector('[data-modal="task"]');
          render();
          if(hadOpenTaskModal){
            // O modal foi removido pelo render; uma re-abertura seria possível mas exigiria persistir o id.
          }
          showRealtimePulse(label);
        }catch(e){ console.error('realtime reload:', e); }
      }, 600);
    });
  });
  _realtimeCh.subscribe((status)=>{
    if(status === 'SUBSCRIBED') console.log('[realtime] conectado');
  });
}
function stopRealtime(){
  if(_realtimeCh){ supa.removeChannel(_realtimeCh); _realtimeCh = null; }
}

// Detecta erros do Supabase Auth no fragmento da URL (#error=...&error_code=...).
// Acontece quando o usuario clica em magic link expirado ou ja usado.
// Retorna { code, friendly } ou null. Sempre limpa o hash da URL.
let _authBanner = null;
function detectAuthErrorFragment(){
  const hash = location.hash || '';
  if(!hash.startsWith('#') || !hash.includes('error')) return null;
  const params = new URLSearchParams(hash.slice(1));
  const error = params.get('error');
  if(!error) return null;
  const code = params.get('error_code') || error;
  const desc = params.get('error_description') || '';
  // Limpa o fragmento da URL pra nao ficar feio nem reprocessar em reloads.
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  // Mapeia mensagens conhecidas pra texto amigavel em pt-BR.
  let friendly = decodeURIComponent(desc.replace(/\+/g, ' ')) || code;
  if(code === 'otp_expired') friendly = 'Esse link de login expirou ou ja foi usado. Faca login com seu e-mail e senha abaixo.';
  else if(error === 'access_denied') friendly = 'Acesso negado. Faca login com seu e-mail e senha abaixo.';
  return { code, friendly };
}

// Helper: corre uma Promise com timeout. Se estourar, rejeita com erro claro.
function withTimeout(promise, ms, label){
  return new Promise((resolve, reject) => {
    const t = setTimeout(()=> reject(new Error(`[timeout] ${label} (${ms}ms)`)), ms);
    promise.then(v => { clearTimeout(t); resolve(v); },
                 e => { clearTimeout(t); reject(e); });
  });
}

// Tela de fallback caso o boot falhe (em vez de ficar eternamente no esqueleto).
function renderBootError(err){
  const root = document.getElementById('app');
  if(!root) return;
  const msg = (err && err.message) ? err.message : String(err||'erro desconhecido');
  root.innerHTML = `
    <div class="min-h-screen flex items-center justify-center p-6" style="background:linear-gradient(135deg,#0F1727 0%,#1a2438 60%,#0171E4 140%)">
      <div class="bg-white rounded-3xl p-8 w-full max-w-md text-center" style="box-shadow:0 24px 60px rgba(15,23,39,.35)">
        <div class="text-3xl mb-2">⚠️</div>
        <div class="font-display text-lg font-semibold" style="color:var(--bhub-navy)">Não conseguimos carregar seus dados</div>
        <p class="text-sm mt-2" style="color:var(--bhub-muted)">Algo travou ao falar com o servidor. Detalhe técnico abaixo. Tenta entrar de novo — se persistir, fale com o time.</p>
        <pre class="text-xs text-left bg-gray-50 rounded p-2 mt-4 overflow-auto" style="color:#7b1f1f;max-height:8em">${msg.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</pre>
        <div class="mt-5 flex gap-2 justify-center">
          <button class="btn btn-secondary" onclick="location.reload()">Recarregar</button>
          <button class="btn btn-primary" onclick="(async()=>{try{await supa.auth.signOut();}catch(e){}location.reload();})()">Fazer login novamente</button>
        </div>
      </div>
    </div>`;
}

(async () => {
  // Detecta erro vindo de magic link expirado (antes de qualquer outra coisa)
  _authBanner = detectAuthErrorFragment();
  renderBootSkeleton();
  // Boot defensivo: se loadSession ou reloadState travar/falhar, o site NÃO fica eternamente
  // no esqueleto — cai pra tela de login (se a sessão for null) ou pra renderBootError.
  try {
    await withTimeout(loadSession(), 8000, 'loadSession');
    if(session){
      try {
        await withTimeout(reloadState(), 20000, 'reloadState');
        startRealtime();
      } catch(stateErr){
        console.error('[boot] reloadState falhou:', stateErr);
        renderBootError(stateErr);
        return;
      }
    }
    render();
  } catch(err){
    console.error('[boot] loadSession falhou:', err);
    session = null;
    try { render(); } catch(renderErr){
      console.error('[boot] render também falhou:', renderErr);
      renderBootError(renderErr);
    }
  }
  // Re-render quando a sessão muda (token refresh, signOut em outra aba, etc.)
  // IMPORTANTE: usamos a `sess` que vem no callback — NAO chamamos getSession()
  // ou loadSession() aqui, pra evitar deadlock do lock interno do supabase-js.
  function openPasswordResetModal(){
    // Remove modal anterior se existir
    document.querySelector('#pwdResetOverlay')?.remove();
    const m = el(`
      <div id="pwdResetOverlay" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:linear-gradient(135deg,#0F1727 0%,#1a2438 60%,#0171E4 140%)">
        <div style="background:#fff;border-radius:1.5rem;padding:2.5rem;width:100%;max-width:22rem;box-shadow:0 24px 60px rgba(15,23,39,.35)">
          <div style="text-align:center;margin-bottom:1.5rem">
            <img src="bhub-logo.png" alt="BHub" style="height:48px;width:auto;border-radius:8px;margin:0 auto 1rem" />
            <div style="font-size:1.1rem;font-weight:700;color:var(--bhub-navy);font-family:'Roboto',sans-serif">Redefinir senha</div>
            <div style="font-size:.8rem;color:var(--bhub-muted);margin-top:.25rem">Digite e confirme sua nova senha.</div>
          </div>
          <div class="space-y-3">
            <div>
              <label style="font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--bhub-muted)">Nova senha</label>
              <div style="position:relative;margin-top:.25rem">
                <input id="newPwd" type="password" placeholder="Mínimo 6 caracteres" minlength="6" style="padding-right:2.8rem;width:100%" />
                <button type="button" id="toggleNewPwd" tabindex="-1" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--bhub-muted);line-height:1;padding:.2rem">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div>
              <label style="font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--bhub-muted)">Confirmar senha</label>
              <input id="confirmPwd" type="password" placeholder="Repita a senha" minlength="6" style="margin-top:.25rem;width:100%" />
            </div>
            <div id="pwdResetErr" class="text-xs rounded-lg p-2 hidden" style="color:#991b1b;background:#fee2e2"></div>
            <div id="pwdResetOk" class="text-xs rounded-lg p-2 hidden" style="color:#166534;background:#dcfce7"></div>
            <button id="savePwd" class="btn btn-primary w-full justify-center" style="margin-top:.5rem">Salvar nova senha →</button>
          </div>
        </div>
      </div>
    `);
    document.body.appendChild(m);

    // Toggle mostrar/ocultar nova senha
    m.querySelector('#toggleNewPwd').addEventListener('click', ()=>{
      const inp = m.querySelector('#newPwd');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    });

    m.querySelector('#savePwd').addEventListener('click', async ()=>{
      const pwd = m.querySelector('#newPwd').value;
      const confirm = m.querySelector('#confirmPwd').value;
      const errEl = m.querySelector('#pwdResetErr');
      const okEl = m.querySelector('#pwdResetOk');
      errEl.classList.add('hidden');
      okEl.classList.add('hidden');

      if(pwd.length < 6){
        errEl.textContent = 'A senha deve ter no mínimo 6 caracteres.';
        errEl.classList.remove('hidden'); return;
      }
      if(pwd !== confirm){
        errEl.textContent = 'As senhas não conferem.';
        errEl.classList.remove('hidden'); return;
      }
      const btn = m.querySelector('#savePwd');
      btn.disabled = true; btn.textContent = 'Salvando…';
      try{
        const { error } = await supa.auth.updateUser({ password: pwd });
        if(error) throw error;
        okEl.textContent = 'Senha redefinida com sucesso! Redirecionando…';
        okEl.classList.remove('hidden');
        setTimeout(()=>{ m.remove(); render(); }, 1800);
      }catch(err){
        errEl.textContent = 'Erro ao salvar: ' + (err.message || err);
        errEl.classList.remove('hidden');
        btn.disabled = false; btn.textContent = 'Salvar nova senha →';
      }
    });

    // Permitir submeter com Enter
    [m.querySelector('#newPwd'), m.querySelector('#confirmPwd')].forEach(inp=>{
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter') m.querySelector('#savePwd').click(); });
    });

    // Foca no campo de nova senha
    setTimeout(()=>m.querySelector('#newPwd').focus(), 100);
  }

  supa.auth.onAuthStateChange(async (event, sess)=>{
    if(event === 'SIGNED_OUT'){
      session = null; state = defaultState(); stopRealtime(); render();
      return;
    }
    if(event === 'PASSWORD_RECOVERY'){
      // Usuário chegou pelo link de reset de senha — mostrar modal para definir nova senha
      openPasswordResetModal();
      return;
    }
    if(event === 'TOKEN_REFRESHED' || event === 'SIGNED_IN' || event === 'INITIAL_SESSION'){
      // Se ja temos session local com o mesmo user, nao re-aplica (evita flash + duplo fetch de profile).
      if(session && sess && session.id === sess.user?.id) return;
      await applySession(sess);
      if(session && !_realtimeCh) startRealtime();
      // Nao recarrega state aqui: login() ja fez reloadState no fluxo normal.
      // Se a sessao chegou por outro caminho (ex.: outra aba), forca render pra sair do login.
      try { render(); } catch(_){}
    }
  });
})();
</script>
</body>
</html>
